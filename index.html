n to stay at home with children.","Attitudes towards gender roles have changed dramatically in recent decades."],"syn":"roles of men and women"},{"w":"start a family","pos":"cụm động từ","ipa":"/ˌstɑːt ə ˈfæməli/","vi":"lập gia đình, sinh con","use":"cụm cố định; wait / decide + to start a family","ex":["Many couples now wait until their thirties to start a family.","The high cost of housing discourages young people from starting a family."],"syn":"have children"},{"w":"intergenerational","pos":"tính từ","ipa":"/ˌɪntədʒenəˈreɪʃənl/","vi":"giữa các thế hệ","use":"đứng trước danh từ; intergenerational living / activities","ex":["Intergenerational living can benefit both grandparents and grandchildren.","Community centres can organise intergenerational activities for young and old."],"syn":"involving different age groups"},{"w":"demographic shift","pos":"cụm danh từ","ipa":"/ˌdeməˌɡræfɪk ˈʃɪft/","vi":"biến đổi cơ cấu dân số","use":"đếm được; a demographic shift towards + N","ex":["This demographic shift will leave fewer workers to support each retiree.","Governments must plan for the demographic shift towards an older society."],"syn":"population change"},{"w":"social cohesion","pos":"cụm danh từ","ipa":"/ˌsəʊʃl kəʊˈhiːʒn/","vi":"sự gắn kết xã hội","use":"không đếm được; build / strengthen / weaken + social cohesion","ex":["Shared public spaces help build social cohesion in diverse neighbourhoods.","Growing inequality can weaken social cohesion and trust between groups."],"syn":"unity"},{"w":"put a strain on","pos":"cụm động từ","ipa":"/ˌpʊt ə ˈstreɪn ɒn/","vi":"gây áp lực lên","use":"put a strain on + services / budgets / relationships","ex":["An ageing population will put a strain on public healthcare services.","Caring for elderly parents can put a strain on a marriage."],"syn":"put pressure on"},{"w":"fend for themselves","pos":"cụm động từ","ipa":"/ˌfend fə ðəmˈselvz/","vi":"tự xoay xở","use":"fend for oneself; be left to + fend for themselves","ex":["Many older people living alone are left to fend for themselves.","Parents should teach teenagers to fend for themselves before leaving home."],"syn":"cope alone"},{"w":"marginalised","pos":"tính từ","ipa":"/ˈmɑːdʒɪnəlaɪzd/","vi":"bị gạt ra lề xã hội","use":"marginalised groups / communities (Mỹ: marginalized)","ex":["Older people without internet access can feel marginalised in a digital society.","Governments should give marginalised groups a stronger voice in decision-making."],"syn":"excluded"},{"w":"put off","pos":"cụm động từ","ipa":"/ˌpʊt ˈɒf/","vi":"trì hoãn","use":"put off + V-ing / N (= delay); put off having children","ex":["Many couples put off having children because of financial insecurity.","Young people are putting off marriage until they have stable jobs."],"syn":"delay"},{"w":"sense of belonging","pos":"cụm danh từ","ipa":"/ˌsens əv bɪˈlɒŋɪŋ/","vi":"cảm giác được thuộc về","use":"không đếm được; a strong sense of belonging (to + nhóm)","ex":["Community activities give older people a strong sense of belonging.","A sense of belonging is essential for teenagers' mental well-being."],"syn":"feeling of being accepted"},{"w":"contribute to society","pos":"cụm động từ","ipa":"/kənˌtrɪbjuːt tə səˈsaɪəti/","vi":"đóng góp cho xã hội","use":"contribute to society + through / by + V-ing","ex":["Retired people can still contribute to society through volunteering.","Immigrants contribute to society by filling gaps in the labour market."],"syn":"give back"},{"w":"shrinking workforce","pos":"cụm danh từ","ipa":"/ˌʃrɪŋkɪŋ ˈwɜːkfɔːs/","vi":"lực lượng lao động thu hẹp","use":"đếm được; cope with + a shrinking workforce","ex":["A shrinking workforce means that fewer people pay taxes to fund pensions.","Automation may help countries cope with a shrinking workforce."],"syn":"fewer workers"},{"w":"nurture","pos":"động từ","ipa":"/ˈnɜːtʃə/","vi":"nuôi dưỡng, vun đắp","use":"động từ + tân ngữ; nurture + talent / curiosity / a child","ex":["Parents should nurture their children's curiosity rather than pressure them.","Teachers play an important role in nurturing young people's talents."],"syn":"develop"},{"w":"dependent on","pos":"cụm tính từ","ipa":"/dɪˈpendənt ɒn/","vi":"phụ thuộc vào","use":"be (financially) dependent on + sb / sth","ex":["Many elderly people are financially dependent on their adult children.","Young adults remain dependent on their parents for longer than before."],"syn":"reliant on"}]},{"id":"v10","en":"Culture, Tourism & Globalisation","vi":"Văn hóa, du lịch và toàn cầu hóa","desc":"Từ vựng về du lịch, bản sắc văn hóa và tác động của toàn cầu hóa.","words":[{"w":"tourist attraction","pos":"cụm danh từ","ipa":"/ˈtʊərɪst əˌtrækʃn/","vi":"điểm thu hút du khách","use":"danh từ đếm được; a major / popular + tourist attraction","ex":["Ha Long Bay is the most popular tourist attraction in northern Vietnam.","The old palace has become a major tourist attraction since it reopened."],"syn":"place of interest"},{"w":"tourism industry","pos":"cụm danh từ","ipa":"/ˈtʊərɪzəm ˌɪndəstri/","vi":"ngành du lịch","use":"danh từ; the tourism industry + creates jobs / depends on","ex":["The tourism industry creates thousands of jobs in coastal towns.","Many small islands depend almost entirely on the tourism industry."],"syn":"travel sector"},{"w":"local culture","pos":"cụm danh từ","ipa":"/ˌləʊkl ˈkʌltʃə/","vi":"văn hóa địa phương","use":"danh từ không đếm được; experience / respect + local culture","ex":["Staying with a host family lets travellers experience the local culture directly.","Visitors should learn a little about the local culture before they arrive."],"syn":"regional way of life"},{"w":"tradition","pos":"danh từ","ipa":"/trəˈdɪʃn/","vi":"truyền thống","use":"danh từ đếm được; follow / keep + a tradition; a long tradition of + N","ex":["Giving lucky money at Tet is a tradition that children love.","Korea has a long tradition of respecting older family members."],"syn":"custom"},{"w":"destination","pos":"danh từ","ipa":"/ˌdestɪˈneɪʃn/","vi":"điểm đến","use":"danh từ đếm được; a popular / holiday + destination","ex":["Da Nang has become a popular destination for Korean families.","Cheap flights have turned many small cities into holiday destinations."],"syn":"place to visit"},{"w":"attract visitors","pos":"cụm động từ","ipa":"/əˌtrækt ˈvɪzɪtəz/","vi":"thu hút khách tham quan","use":"động từ + tân ngữ; attract + visitors / tourists + to + nơi chốn","ex":["Music festivals attract visitors from all over the country every summer.","The museum attracted more visitors after it offered free entry on Sundays."],"syn":"draw tourists"},{"w":"souvenir","pos":"danh từ","ipa":"/ˌsuːvəˈnɪə/","vi":"quà lưu niệm","use":"danh từ đếm được; buy a souvenir; a souvenir shop","ex":["Most tourists buy a small souvenir to remember their trip.","Many souvenirs sold near famous sites are actually made overseas."],"syn":"keepsake"},{"w":"go sightseeing","pos":"cụm động từ","ipa":"/ɡəʊ ˈsaɪtsiːɪŋ/","vi":"đi tham quan","use":"cụm động từ không tân ngữ; go sightseeing + in + thành phố","ex":["On my first day in Seoul, I decided to go sightseeing around the old palaces.","Some people prefer to relax on the beach rather than go sightseeing."],"syn":"visit the sights"},{"w":"cultural heritage","pos":"cụm danh từ","ipa":"/ˈkʌltʃərəl ˈherɪtɪdʒ/","vi":"di sản văn hóa","use":"danh từ không đếm được; protect / preserve + cultural heritage","ex":["Old temples and folk songs are an important part of our cultural heritage.","Governments should spend more money to protect their cultural heritage."],"syn":"cultural legacy"},{"w":"preserve","pos":"động từ","ipa":"/prɪˈzɜːv/","vi":"bảo tồn, gìn giữ","use":"động từ + tân ngữ; preserve + traditions / historic buildings","ex":["Local communities work hard to preserve their traditional crafts.","The old quarter has been carefully preserved for future generations."],"syn":"protect"},{"w":"custom","pos":"danh từ","ipa":"/ˈkʌstəm/","vi":"phong tục","use":"danh từ đếm được; local customs; it is the custom to + V","ex":["Visitors should respect local customs, such as removing shoes indoors.","In Vietnam, it is a custom to visit relatives during the Lunar New Year."],"syn":"practice"},{"w":"historic site","pos":"cụm danh từ","ipa":"/hɪˌstɒrɪk ˈsaɪt/","vi":"di tích lịch sử","use":"danh từ đếm được; visit / restore + a historic site","ex":["Hue has many historic sites from the time of the Nguyen dynasty.","Too many visitors can damage fragile historic sites over time."],"syn":"heritage site"},{"w":"traditional festival","pos":"cụm danh từ","ipa":"/trəˌdɪʃənl ˈfestɪvl/","vi":"lễ hội truyền thống","use":"danh từ đếm được; celebrate / hold + a traditional festival","ex":["The Mid-Autumn Festival is a traditional festival loved by children.","Traditional festivals help young people feel connected to their roots."],"syn":"customary celebration"},{"w":"pass down","pos":"cụm động từ","ipa":"/ˌpɑːs ˈdaʊn/","vi":"truyền lại (cho thế hệ sau)","use":"cụm động từ tách được; pass down + skills/stories + to + the next generation","ex":["Grandparents pass down family recipes to their grandchildren.","These folk songs have been passed down from generation to generation."],"syn":"hand down"},{"w":"cultural identity","pos":"cụm danh từ","ipa":"/ˈkʌltʃərəl aɪˈdentəti/","vi":"bản sắc văn hóa","use":"danh từ; lose / maintain + cultural identity; a strong sense of cultural identity","ex":["Language is one of the most important parts of cultural identity.","Some critics fear that small nations may lose their cultural identity."],"syn":"cultural character"},{"w":"ethnic minority","pos":"cụm danh từ","ipa":"/ˌeθnɪk maɪˈnɒrəti/","vi":"dân tộc thiểu số","use":"danh từ đếm được; ethnic minority + groups / communities","ex":["Sapa is home to several ethnic minority groups with their own languages.","Tourism can bring income to ethnic minority communities in remote areas."],"syn":"minority group"},{"w":"authentic","pos":"tính từ","ipa":"/ɔːˈθentɪk/","vi":"chân thực, đích thực","use":"tính từ; an authentic + experience / dish / atmosphere","ex":["Many travellers want an authentic experience rather than a hotel buffet.","This small restaurant serves authentic food from central Vietnam."],"syn":"genuine"},{"w":"unique","pos":"tính từ","ipa":"/juˈniːk/","vi":"độc đáo, độc nhất","use":"tính từ; unique + to + nơi chốn; a unique + culture / style","ex":["Each region has a unique style of cooking and local dress.","This kind of water puppet show is unique to northern Vietnam."],"syn":"one of a kind"},{"w":"broaden your horizons","pos":"cụm động từ","ipa":"/ˌbrɔːdn jɔː həˈraɪznz/","vi":"mở rộng tầm hiểu biết","use":"thành ngữ; travel / study abroad + to broaden your horizons","ex":["Travelling alone can broaden your horizons in ways that textbooks cannot.","Learning a second language is a practical way to broaden your horizons."],"syn":"widen your experience"},{"w":"cultural exchange","pos":"cụm danh từ","ipa":"/ˈkʌltʃərəl ɪksˈtʃeɪndʒ/","vi":"giao lưu văn hóa","use":"danh từ; promote / encourage + cultural exchange; a cultural exchange programme","ex":["Student exchange programmes are a simple form of cultural exchange.","Cultural exchange between Korea and Vietnam has grown rapidly in recent years."],"syn":"sharing of cultures"},{"w":"globalisation","pos":"danh từ","ipa":"/ˌɡləʊbəlaɪˈzeɪʃn/","vi":"toàn cầu hóa","use":"danh từ không đếm được; the effects / impact + of globalisation","ex":["Globalisation has made foreign products cheaper and easier to buy.","Some people believe globalisation threatens traditional ways of life."],"syn":"global integration"},{"w":"multinational company","pos":"cụm danh từ","ipa":"/ˌmʌltiˈnæʃnəl ˈkʌmpəni/","vi":"công ty đa quốc gia","use":"danh từ đếm được; large multinational companies + invest in / operate in","ex":["Several multinational companies have built factories near Hanoi.","A multinational company can move production to wherever labour is cheapest."],"syn":"international corporation"},{"w":"global brand","pos":"cụm danh từ","ipa":"/ˌɡləʊbl ˈbrænd/","vi":"thương hiệu toàn cầu","use":"danh từ đếm được; global brands + dominate / replace + local shops","ex":["Global brands now dominate the main shopping streets of most big cities.","Young people often see a global brand as a symbol of status."],"syn":"international brand"},{"w":"international trade","pos":"cụm danh từ","ipa":"/ˌɪntəˌnæʃnəl ˈtreɪd/","vi":"thương mại quốc tế","use":"danh từ không đếm được; growth in / barriers to + international trade","ex":["International trade allows countries to buy goods they cannot produce.","Lower shipping costs have encouraged a huge growth in international trade."],"syn":"global commerce"},{"w":"integrate into","pos":"cụm động từ","ipa":"/ˈɪntɪɡreɪt ˈɪntuː/","vi":"hòa nhập vào","use":"động từ + into; integrate into + society / the community","ex":["Many migrants find it hard to integrate into a new society at first.","Language classes help foreign workers integrate into the local community."],"syn":"fit into"},{"w":"adapt to","pos":"cụm động từ","ipa":"/əˈdæpt tuː/","vi":"thích nghi với","use":"adapt to + N/V-ing; adapt to + a new culture / environment","ex":["It took me several months to adapt to life in Korea.","International students must adapt to new teaching styles quickly."],"syn":"adjust to"},{"w":"language barrier","pos":"cụm danh từ","ipa":"/ˈlæŋɡwɪdʒ ˌbæriə/","vi":"rào cản ngôn ngữ","use":"danh từ đếm được; overcome / break down + the language barrier","ex":["The language barrier is often the biggest problem for new immigrants.","Translation apps have helped tourists overcome the language barrier."],"syn":"communication problem"},{"w":"culture shock","pos":"cụm danh từ","ipa":"/ˈkʌltʃə ʃɒk/","vi":"sốc văn hóa","use":"danh từ không đếm được; experience / suffer from + culture shock","ex":["Many students experience culture shock during their first year abroad.","Culture shock usually fades once people build a new social network."],"syn":"disorientation abroad"},{"w":"mass tourism","pos":"cụm danh từ","ipa":"/ˌmæs ˈtʊərɪzəm/","vi":"du lịch đại trà","use":"danh từ không đếm được; the negative effects of + mass tourism","ex":["Mass tourism has turned some quiet fishing villages into crowded resorts.","Cities like Venice now limit cruise ships to reduce mass tourism."],"syn":"large-scale tourism"},{"w":"ecotourism","pos":"danh từ","ipa":"/ˈiːkəʊtʊərɪzəm/","vi":"du lịch sinh thái","use":"danh từ không đếm được; promote / develop + ecotourism","ex":["Ecotourism can fund the protection of national parks and wildlife.","The province plans to develop ecotourism in its mountain forests."],"syn":"green tourism"},{"w":"boost the local economy","pos":"cụm động từ","ipa":"/ˌbuːst ðə ˌləʊkl ɪˈkɒnəmi/","vi":"thúc đẩy kinh tế địa phương","use":"động từ + tân ngữ; tourism / investment + boosts the local economy","ex":["Hosting international events can boost the local economy for several years.","Small family hotels boost the local economy more than large foreign chains."],"syn":"help local businesses"},{"w":"generate revenue","pos":"cụm động từ","ipa":"/ˌdʒenəreɪt ˈrevənjuː/","vi":"tạo ra doanh thu","use":"động từ + tân ngữ; generate revenue + for + the government / city","ex":["Entrance fees generate revenue that can be used to repair old buildings.","Tourism generated revenue of over 20 billion dollars for the country last year."],"syn":"earn money"},{"w":"overcrowding","pos":"danh từ","ipa":"/ˌəʊvəˈkraʊdɪŋ/","vi":"tình trạng quá tải","use":"danh từ không đếm được; lead to / cause + overcrowding","ex":["Overcrowding at popular beaches spoils the experience for everyone.","Some cities set daily visitor limits to prevent overcrowding."],"syn":"congestion"},{"w":"commercialise","pos":"động từ","ipa":"/kəˈmɜːʃəlaɪz/","vi":"thương mại hóa","use":"thường dùng bị động; become / be + commercialised","ex":["Many traditional festivals have become heavily commercialised in recent decades.","Critics argue that companies commercialise sacred places for quick profit."],"syn":"turn into a business"},{"w":"erode","pos":"động từ","ipa":"/ɪˈrəʊd/","vi":"làm xói mòn, mai một","use":"động từ + tân ngữ; erode + traditional values / local identity","ex":["Western media may slowly erode traditional values among teenagers.","Local dialects are being eroded as young people move to big cities."],"syn":"weaken"},{"w":"infrastructure","pos":"danh từ","ipa":"/ˈɪnfrəstrʌktʃə/","vi":"cơ sở hạ tầng","use":"danh từ không đếm được; invest in / improve + infrastructure","ex":["Tourism encourages governments to invest in roads, airports and other infrastructure.","Poor infrastructure prevents many remote areas from attracting tourists."],"syn":"public facilities"},{"w":"hospitality sector","pos":"cụm danh từ","ipa":"/ˌhɒspɪˈtæləti ˌsektə/","vi":"ngành dịch vụ lưu trú, nhà hàng","use":"danh từ; work in / jobs in + the hospitality sector","ex":["Many young people find their first job in the hospitality sector.","The hospitality sector lost millions of jobs during the pandemic."],"syn":"hotel and restaurant industry"},{"w":"put pressure on","pos":"cụm động từ","ipa":"/ˌpʊt ˈpreʃər ɒn/","vi":"gây áp lực lên","use":"put (enormous) pressure on + resources / services","ex":["Large numbers of tourists put pressure on local water supplies.","Rapid growth has put pressure on public transport in the city centre."],"syn":"strain"},{"w":"distinctive","pos":"tính từ","ipa":"/dɪˈstɪŋktɪv/","vi":"đặc trưng, riêng biệt","use":"tính từ; a distinctive + style / character / flavour","ex":["Hoi An is famous for its distinctive yellow houses and lanterns.","Global chains may cause cities to lose their distinctive character."],"syn":"characteristic"},{"w":"promote mutual understanding","pos":"cụm động từ","ipa":"/prəˌməʊt ˌmjuːtʃuəl ˌʌndəˈstændɪŋ/","vi":"thúc đẩy sự hiểu biết lẫn nhau","use":"động từ + tân ngữ; promote mutual understanding + between + nations","ex":["International travel can promote mutual understanding between different nations.","Exchange programmes promote mutual understanding among young people from many countries."],"syn":"help people understand each other"}]},{"id":"v11","en":"Science, Research & Engineering","vi":"Khoa học, nghiên cứu và kỹ thuật","desc":"Từ vựng về nghiên cứu khoa học, thí nghiệm, vật liệu và phát triển công nghệ.","words":[{"w":"conduct experiments","pos":"cụm động từ","ipa":"/kənˌdʌkt ɪkˈsperɪmənts/","vi":"tiến hành thí nghiệm","use":"động từ + tân ngữ; conduct experiments + on + mẫu/đối tượng","ex":["Our team conducts experiments on steel samples at very high temperatures.","Scientists must conduct experiments carefully to get reliable results."],"syn":"carry out tests"},{"w":"scientific research","pos":"cụm danh từ","ipa":"/ˌsaɪənˌtɪfɪk rɪˈsɜːtʃ/","vi":"nghiên cứu khoa học","use":"danh từ không đếm được; carry out / fund + scientific research","ex":["Scientific research has helped doctors find treatments for many diseases.","The government should spend more on scientific research and education."],"syn":"scientific study"},{"w":"researcher","pos":"danh từ","ipa":"/rɪˈsɜːtʃə/","vi":"nhà nghiên cứu","use":"danh từ đếm được; a researcher + at / in + viện/lĩnh vực","ex":["I work as a researcher in a materials science laboratory in Korea.","Young researchers often find it difficult to get permanent positions."],"syn":"scientist"},{"w":"laboratory","pos":"danh từ","ipa":"/ləˈbɒrətri/","vi":"phòng thí nghiệm","use":"danh từ đếm được; in the laboratory; laboratory + tests / equipment","ex":["The new laboratory has modern equipment for testing metals.","Most of the samples were analysed in the laboratory overnight."],"syn":"lab"},{"w":"discovery","pos":"danh từ","ipa":"/dɪˈskʌvəri/","vi":"phát hiện, khám phá","use":"danh từ đếm được; make a discovery; a major / scientific discovery","ex":["The discovery of penicillin in 1928 changed modern medicine forever.","Many important discoveries were made by accident in the laboratory."],"syn":"finding"},{"w":"invention","pos":"danh từ","ipa":"/ɪnˈvenʃn/","vi":"phát minh","use":"danh từ đếm được; the invention of + N; a useful invention","ex":["The invention of the internet transformed the way people work.","In my opinion, the smartphone is the most useful invention of this century."],"syn":"innovation"},{"w":"technological advances","pos":"cụm danh từ","ipa":"/ˌteknəˈlɒdʒɪkl ədˈvɑːnsɪz/","vi":"tiến bộ công nghệ","use":"danh từ số nhiều; recent / rapid + technological advances + in + lĩnh vực","ex":["Technological advances have made solar panels much cheaper than before.","Rapid technological advances in medicine have increased life expectancy."],"syn":"progress in technology"},{"w":"data","pos":"danh từ","ipa":"/ˈdeɪtə/","vi":"dữ liệu","use":"danh từ không đếm được (hoặc số nhiều); collect / analyse + data","ex":["We collected data from more than two hundred published papers.","The data show a clear link between temperature and strength."],"syn":"information"},{"w":"carry out research","pos":"cụm động từ","ipa":"/ˌkæri aʊt rɪˈsɜːtʃ/","vi":"thực hiện nghiên cứu","use":"carry out research + into / on + chủ đề","ex":["Universities carry out research into new energy sources.","She is carrying out research on heat-resistant alloys for power plants."],"syn":"do research"},{"w":"hypothesis","pos":"danh từ","ipa":"/haɪˈpɒθəsɪs/","vi":"giả thuyết","use":"danh từ đếm được (số nhiều: hypotheses); test / support + a hypothesis","ex":["The experiment was designed to test a simple hypothesis about grain size.","The results did not support the original hypothesis."],"syn":"theory"},{"w":"findings","pos":"danh từ","ipa":"/ˈfaɪndɪŋz/","vi":"kết quả nghiên cứu","use":"danh từ số nhiều; the findings + show / suggest + that","ex":["The findings suggest that small particles make the steel much stronger.","Researchers usually publish their findings in international journals."],"syn":"results"},{"w":"analyse","pos":"động từ","ipa":"/ˈænəlaɪz/","vi":"phân tích","use":"động từ + tân ngữ; analyse + data / samples / results","ex":["We analyse each sample under an electron microscope.","The results were analysed using simple statistical methods."],"syn":"examine"},{"w":"accurate","pos":"tính từ","ipa":"/ˈækjərət/","vi":"chính xác","use":"tính từ; accurate + measurements / data / results","ex":["Accurate measurements are essential in any engineering project.","Computer models are becoming more accurate every year."],"syn":"precise"},{"w":"reliable","pos":"tính từ","ipa":"/rɪˈlaɪəbl/","vi":"đáng tin cậy","use":"tính từ; reliable + results / sources / evidence","ex":["Scientists repeat tests several times to make sure the results are reliable.","Students should use reliable sources rather than random websites."],"syn":"trustworthy"},{"w":"evidence","pos":"danh từ","ipa":"/ˈevɪdəns/","vi":"bằng chứng","use":"danh từ không đếm được; strong / clear + evidence + that / of","ex":["There is strong evidence that air pollution harms children's lungs.","The study provides clear evidence of a link between diet and health."],"syn":"proof"},{"w":"mechanical properties","pos":"cụm danh từ","ipa":"/məˌkænɪkl ˈprɒpətiz/","vi":"tính chất cơ học","use":"danh từ số nhiều; improve / measure + the mechanical properties + of + vật liệu","ex":["Adding nickel can improve the mechanical properties of steel.","We measured the mechanical properties of each alloy at room temperature."],"syn":"strength characteristics"},{"w":"durable","pos":"tính từ","ipa":"/ˈdjʊərəbl/","vi":"bền, lâu hỏng","use":"tính từ; durable + materials / products; more durable than","ex":["Engineers are developing more durable materials for bridges and roads.","Products that are durable create less waste over their lifetime."],"syn":"long-lasting"},{"w":"material","pos":"danh từ","ipa":"/məˈtɪəriəl/","vi":"vật liệu","use":"danh từ đếm được; new / lightweight / raw + materials","ex":["Lightweight materials such as aluminium help cars use much less fuel.","The company is testing a new material that can survive extreme heat."],"syn":"substance"},{"w":"prototype","pos":"danh từ","ipa":"/ˈprəʊtətaɪp/","vi":"nguyên mẫu","use":"danh từ đếm được; build / test + a prototype","ex":["The team built a prototype of the engine in only six months.","Several prototypes failed before the final design was approved."],"syn":"early model"},{"w":"design","pos":"động từ","ipa":"/dɪˈzaɪn/","vi":"thiết kế","use":"động từ + tân ngữ; be designed to + V","ex":["Engineers design bridges that can survive strong earthquakes.","This alloy was designed to work at temperatures above 700 degrees."],"syn":"create"},{"w":"develop new technologies","pos":"cụm động từ","ipa":"/dɪˌveləp njuː tekˈnɒlədʒiz/","vi":"phát triển công nghệ mới","use":"động từ + tân ngữ; develop new technologies + to + V","ex":["Companies must develop new technologies to stay competitive.","Governments should help firms develop new technologies that reduce emissions."],"syn":"create new technology"},{"w":"innovation","pos":"danh từ","ipa":"/ˌɪnəˈveɪʃn/","vi":"sự đổi mới, sáng tạo","use":"danh từ; encourage / drive + innovation; technological innovation","ex":["Tax incentives can encourage innovation in small companies.","Korea's economic growth has depended heavily on technological innovation for decades."],"syn":"new ideas"},{"w":"breakthrough","pos":"danh từ","ipa":"/ˈbreɪkθruː/","vi":"bước đột phá","use":"danh từ đếm được; a major breakthrough + in + lĩnh vực","ex":["Scientists have made a major breakthrough in battery technology.","The breakthrough came after ten years of careful experiments."],"syn":"major advance"},{"w":"cutting-edge","pos":"tính từ","ipa":"/ˌkʌtɪŋ ˈedʒ/","vi":"tiên tiến nhất","use":"tính từ đứng trước danh từ; cutting-edge + technology / research","ex":["The institute uses cutting-edge equipment to study new alloys.","Cutting-edge research often requires expensive machines and skilled staff."],"syn":"state-of-the-art"},{"w":"research funding","pos":"cụm danh từ","ipa":"/rɪˈsɜːtʃ ˌfʌndɪŋ/","vi":"kinh phí nghiên cứu","use":"danh từ không đếm được; apply for / cut / increase + research funding","ex":["Many scientists spend weeks every year applying for research funding.","Cuts in research funding may slow down medical progress."],"syn":"research grants"},{"w":"allocate","pos":"động từ","ipa":"/ˈæləkeɪt/","vi":"phân bổ","use":"động từ + tân ngữ; allocate + money / resources + to + N","ex":["The government allocates a large budget to space exploration.","More money should be allocated to research on renewable energy."],"syn":"assign"},{"w":"peer review","pos":"cụm danh từ","ipa":"/ˌpɪə rɪˈvjuː/","vi":"bình duyệt (đánh giá đồng cấp)","use":"danh từ không đếm được; go through / pass + peer review","ex":["Every paper must go through peer review before it is published.","Peer review helps journals reject studies with weak methods."],"syn":"expert evaluation"},{"w":"publish","pos":"động từ","ipa":"/ˈpʌblɪʃ/","vi":"công bố, xuất bản","use":"động từ + tân ngữ; publish + results / a paper + in + a journal","ex":["Our group published three papers in international journals last year.","The results will be published once the review process is complete."],"syn":"release"},{"w":"collaborate with","pos":"cụm động từ","ipa":"/kəˈlæbəreɪt wɪð/","vi":"hợp tác với","use":"collaborate with + người/tổ chức + on + dự án","ex":["Our lab collaborates with a steel company on new heat-resistant alloys.","Scientists from many countries collaborated with each other during the pandemic."],"syn":"work together with"},{"w":"apply theory to practice","pos":"cụm động từ","ipa":"/əˌplaɪ ˈθɪəri tə ˈpræktɪs/","vi":"áp dụng lý thuyết vào thực tiễn","use":"động từ + tân ngữ; learn to apply theory to practice","ex":["Engineering students need internships to apply theory to practice.","Good teachers show learners how to apply theory to practice."],"syn":"use knowledge in real life"},{"w":"withstand","pos":"động từ","ipa":"/wɪðˈstænd/","vi":"chịu được","use":"động từ + tân ngữ; withstand + high temperatures / heavy loads","ex":["Turbine blades must withstand extremely high temperatures for many years.","The new building is designed to withstand strong typhoons."],"syn":"resist"},{"w":"heat-resistant","pos":"tính từ","ipa":"/ˌhiːt rɪˈzɪstənt/","vi":"chịu nhiệt","use":"tính từ ghép; heat-resistant + steel / alloys / materials","ex":["Power plants need heat-resistant steel for their pipes and boilers.","Heat-resistant materials are also used in kitchen equipment."],"syn":"able to resist heat"},{"w":"test the performance of","pos":"cụm động từ","ipa":"/ˌtest ðə pəˈfɔːməns əv/","vi":"kiểm tra hiệu năng của","use":"động từ + tân ngữ; test the performance of + vật liệu/thiết bị","ex":["We test the performance of each alloy at 650 degrees Celsius.","Engineers tested the performance of the battery in freezing conditions."],"syn":"evaluate"},{"w":"trial and error","pos":"cụm danh từ","ipa":"/ˌtraɪəl ənd ˈerə/","vi":"thử và sai","use":"danh từ không đếm được; by / through + trial and error","ex":["Early engineers improved their designs mainly by trial and error.","Machine learning can reduce the trial and error needed to design new alloys."],"syn":"experimentation"},{"w":"breakdown","pos":"danh từ","ipa":"/ˈbreɪkdaʊn/","vi":"sự hỏng hóc; sự phân tích chi tiết","use":"danh từ đếm được; a breakdown + of + N; a mechanical breakdown","ex":["Regular checks can prevent a sudden breakdown of factory machines.","The report gives a detailed breakdown of research spending by sector."],"syn":"failure"},{"w":"variable","pos":"danh từ","ipa":"/ˈveəriəbl/","vi":"biến số","use":"danh từ đếm được; control / change + one variable at a time","ex":["In a fair test, scientists change only one variable at a time.","Temperature was the most important variable in our experiment."],"syn":"factor"},{"w":"sample size","pos":"cụm danh từ","ipa":"/ˈsɑːmpl saɪz/","vi":"cỡ mẫu","use":"danh từ; a small / large + sample size","ex":["The study was criticised because its sample size was too small.","A larger sample size usually makes the conclusions more reliable."],"syn":"number of samples"},{"w":"draw conclusions","pos":"cụm động từ","ipa":"/ˌdrɔː kənˈkluːʒnz/","vi":"rút ra kết luận","use":"draw conclusions + from + data/results; draw firm conclusions","ex":["It is too early to draw conclusions from such limited data.","Researchers should only draw conclusions after repeating the test five times."],"syn":"conclude"},{"w":"ethical concerns","pos":"cụm danh từ","ipa":"/ˌeθɪkl kənˈsɜːnz/","vi":"lo ngại về đạo đức","use":"danh từ số nhiều; raise + ethical concerns + about + N","ex":["Animal testing raises serious ethical concerns for many people.","Genetic engineering has led to ethical concerns about designer babies."],"syn":"moral issues"},{"w":"practical applications","pos":"cụm danh từ","ipa":"/ˌpræktɪkl ˌæplɪˈkeɪʃnz/","vi":"ứng dụng thực tế","use":"danh từ số nhiều; have practical applications + in + lĩnh vực","ex":["Some basic research has no obvious practical applications at first.","This new coating has practical applications in the aircraft industry."],"syn":"real-world uses"}]},{"id":"v12","en":"Describing Data (Task 1)","vi":"Mô tả số liệu cho Task 1","desc":"Từ vựng mô tả xu hướng, tỉ lệ, so sánh, quy trình và bản đồ trong Writing Task 1.","words":[{"w":"rise sharply","pos":"cụm động từ","ipa":"/ˌraɪz ˈʃɑːpli/","vi":"tăng mạnh","use":"rise + sharply + to/by + số liệu; danh từ: a sharp rise in + N","ex":["The number of car owners began to rise sharply after 2005, reaching 6 million.","Coffee prices are expected to rise sharply by almost 40% between 2025 and 2030."],"syn":"increase dramatically"},{"w":"increase steadily","pos":"cụm động từ","ipa":"/ɪnˌkriːs ˈstedɪli/","vi":"tăng đều đặn","use":"increase + steadily + from X to Y; a steady increase in + N","ex":["Internet users increased steadily from 20% in 2000 to 75% in 2020.","Spending on healthcare increased steadily throughout the 15-year period."],"syn":"grow gradually"},{"w":"decline gradually","pos":"cụm động từ","ipa":"/dɪˌklaɪn ˈɡrædʒuəli/","vi":"giảm dần","use":"decline + gradually + to + số liệu; a gradual decline in + N","ex":["Coal consumption declined gradually to 15 million tonnes by 2015.","The birth rate in Korea declined gradually over the following thirty years."],"syn":"fall slowly"},{"w":"fluctuate","pos":"động từ","ipa":"/ˈflʌktʃueɪt/","vi":"dao động, lên xuống","use":"fluctuate + between X and Y / around + số liệu","ex":["Oil prices fluctuated between 60 and 80 dollars a barrel in 2019.","Visitor numbers fluctuated around 2,000 per month before rising in summer."],"syn":"go up and down"},{"w":"remain stable","pos":"cụm động từ","ipa":"/rɪˌmeɪn ˈsteɪbl/","vi":"giữ ổn định","use":"remain stable + at + số liệu; remain + stable/unchanged","ex":["The unemployment rate remained stable at about 4% from 2012 to 2016.","Rice production remained stable for a decade, at roughly 40 million tonnes."],"syn":"stay the same"},{"w":"plateau","pos":"động từ","ipa":"/ˈplætəʊ/","vi":"chững lại, đi ngang","use":"plateau + at + số liệu; cũng là danh từ: reach a plateau","ex":["Sales of smartphones plateaued at around 1.4 billion units after 2016.","Car exports grew quickly until 2008 and then plateaued at 3 million."],"syn":"level off"},{"w":"reach a peak","pos":"cụm động từ","ipa":"/ˌriːtʃ ə ˈpiːk/","vi":"đạt mức cao nhất","use":"reach a peak + of + số liệu + in + năm","ex":["Tourist arrivals reached a peak of 18 million in 2019.","Electricity demand reaches a peak in July, at about 90 gigawatts."],"syn":"hit the highest point"},{"w":"hit a low","pos":"cụm động từ","ipa":"/ˌhɪt ə ˈləʊ/","vi":"chạm mức thấp nhất","use":"hit a low + of + số liệu + in + năm","ex":["Ticket sales hit a low of 500,000 in 2020 because of the pandemic.","Water levels in the dam hit a low in August before recovering."],"syn":"fall to the lowest point"},{"w":"the majority of","pos":"cụm danh từ","ipa":"/ðə məˈdʒɒrəti əv/","vi":"phần lớn","use":"the majority of + N số nhiều + V số nhiều; the vast majority of","ex":["The majority of students in 2020 travelled to school by bus.","In 1990, the vast majority of energy came from coal, at 70%."],"syn":"most"},{"w":"a third","pos":"cụm danh từ","ipa":"/ə ˈθɜːd/","vi":"một phần ba","use":"a third / two thirds + of + N; tương đương ~33%","ex":["Around a third of all household waste was recycled in 2015.","Two thirds of the budget was spent on staff, compared with a third on equipment."],"syn":"33 per cent"},{"w":"account for","pos":"cụm động từ","ipa":"/əˈkaʊnt fɔː/","vi":"chiếm (tỉ lệ)","use":"chủ ngữ + account for + X% + of + N","ex":["Rice accounted for 45% of total farm exports in 2010.","Online shopping now accounts for nearly a quarter of all retail sales."],"syn":"make up"},{"w":"proportion","pos":"danh từ","ipa":"/prəˈpɔːʃn/","vi":"tỉ lệ","use":"the proportion of + N + who/that; a large / small proportion","ex":["The proportion of elderly people rose from 8% to 15% between 2000 and 2020.","Only a small proportion of workers, about 5%, cycled to the office."],"syn":"share"},{"w":"percentage","pos":"danh từ","ipa":"/pəˈsentɪdʒ/","vi":"phần trăm, tỉ lệ phần trăm","use":"the percentage of + N; a high / low percentage","ex":["The percentage of households with a computer doubled from 30% to 60%.","Japan had the highest percentage of people over 65, at 28%."],"syn":"rate"},{"w":"twice as many as","pos":"cụm tính từ","ipa":"/ˌtwaɪs əz ˈmeni əz/","vi":"gấp đôi (số lượng)","use":"dùng với N đếm được; twice as many + N + as; với không đếm được: twice as much","ex":["In 2015, there were 4 million cars, twice as many as in 1995.","Germany exported 30,000 tractors, almost twice as many as France did."],"syn":"double the number of"},{"w":"in contrast","pos":"cụm giới từ","ipa":"/ɪn ˈkɒntrɑːst/","vi":"ngược lại","use":"đầu câu + dấu phẩy; in contrast to/with + N","ex":["Sales in Asia grew by 20%. In contrast, European sales fell slightly.","In contrast to men, women spent twice as long on housework in 2010."],"syn":"on the other hand"},{"w":"compared with","pos":"cụm giới từ","ipa":"/kəmˈpeəd wɪð/","vi":"so với","use":"compared with/to + N; đặt ở đầu hoặc cuối mệnh đề","ex":["Compared with 2000, the number of tourists in 2020 was three times higher.","Hanoi received 120 mm of rain in May, compared with only 20 mm in January."],"syn":"in comparison with"},{"w":"slightly higher than","pos":"cụm tính từ","ipa":"/ˌslaɪtli ˈhaɪə ðən/","vi":"cao hơn một chút so với","use":"slightly / significantly + higher/lower + than + N","ex":["The figure for women was slightly higher than that for men, at 52%.","In 2020, rents in Busan were slightly higher than those in Daegu."],"syn":"a little above"},{"w":"the largest share","pos":"cụm danh từ","ipa":"/ðə ˌlɑːdʒɪst ˈʃeə/","vi":"phần lớn nhất (tỉ trọng)","use":"have / account for + the largest share + of + N","ex":["Transport had the largest share of energy use, at 38% in 2020.","Smartphones accounted for the largest share of electronics sales."],"syn":"the biggest proportion"},{"w":"over the period","pos":"cụm giới từ","ipa":"/ˌəʊvə ðə ˈpɪəriəd/","vi":"trong suốt giai đoạn","use":"over the period + shown / from X to Y; thường dùng trong tổng quan","ex":["Over the period shown, the population of the city almost doubled.","Water use in farming fell by 10% over the period from 1990 to 2010."],"syn":"during the timeframe"},{"w":"overall","pos":"trạng từ","ipa":"/ˌəʊvərˈɔːl/","vi":"nhìn chung, tổng quan","use":"Overall, + mệnh đề tổng quan (đặt đầu đoạn overview)","ex":["Overall, the number of students studying abroad rose between 2005 and 2020.","Overall, wind power grew the fastest, while coal use fell by half."],"syn":"in general"},{"w":"respectively","pos":"trạng từ","ipa":"/rɪˈspektɪvli/","vi":"lần lượt, tương ứng","use":"A and B + V + X and Y, respectively (đặt cuối câu)","ex":["Japan and Korea spent 3% and 4.5% of GDP on research, respectively.","The figures for 2000 and 2020 were 12 million and 19 million respectively."],"syn":"in that order"},{"w":"approximately","pos":"trạng từ","ipa":"/əˈprɒksɪmətli/","vi":"xấp xỉ, khoảng","use":"approximately + số liệu; thay bằng about / around / roughly","ex":["Approximately 60% of the electricity came from gas in 2015.","The project cost approximately 2 billion dollars over five years."],"syn":"about"},{"w":"figure","pos":"danh từ","ipa":"/ˈfɪɡə/","vi":"con số, số liệu","use":"the figure for + N/năm + was/stood at + số liệu","ex":["The figure for Vietnam stood at 8 million visitors in 2016.","By 2020, the figure had risen to 18 million, more than double."],"syn":"number"},{"w":"double","pos":"động từ","ipa":"/ˈdʌbl/","vi":"tăng gấp đôi","use":"nội động từ; double + from X to Y; triple = tăng gấp ba","ex":["The number of online shoppers doubled from 5 million to 10 million.","Average house prices doubled between 2005 and 2015 in the capital."],"syn":"increase twofold"},{"w":"a dramatic increase","pos":"cụm danh từ","ipa":"/ə drəˌmætɪk ˈɪnkriːs/","vi":"sự tăng đột biến","use":"there was a dramatic increase + in + N; see / experience + a dramatic increase","ex":["There was a dramatic increase in solar power, from 2% to 15% by 2020.","The 1990s saw a dramatic increase in the number of mobile phone users."],"syn":"a sharp rise"},{"w":"a slight drop","pos":"cụm danh từ","ipa":"/ə ˌslaɪt ˈdrɒp/","vi":"sự giảm nhẹ","use":"there was a slight drop + in + N; a slight drop + to + số liệu","ex":["There was a slight drop in exports in 2009, to 41 billion dollars.","After a slight drop in 2012, sales recovered and reached 3 million units."],"syn":"a small decrease"},{"w":"by the end of","pos":"cụm giới từ","ipa":"/baɪ ði ˈend əv/","vi":"tính đến cuối","use":"by the end of + giai đoạn + thì hoàn thành (had + V3)","ex":["By the end of the period, the figure had fallen to just 5%.","By the end of 2020, almost every household had access to the internet."],"syn":"by the close of"},{"w":"the following decade","pos":"cụm danh từ","ipa":"/ðə ˌfɒləʊɪŋ ˈdekeɪd/","vi":"thập kỷ tiếp theo","use":"in / over + the following decade / year / five years","ex":["Car ownership remained low until 1990 but tripled in the following decade.","Over the following decade, the share of renewable energy rose to 25%."],"syn":"the next ten years"},{"w":"is heated","pos":"cụm động từ","ipa":"/ɪz ˈhiːtɪd/","vi":"được làm nóng","use":"bị động hiện tại; is heated + to + nhiệt độ + in + thiết bị","ex":["In the next stage, the mixture is heated to 1,500°C in a furnace.","The water is heated by solar panels before it is stored in a tank."],"syn":"is warmed"},{"w":"is transported","pos":"cụm động từ","ipa":"/ɪz trænˈspɔːtɪd/","vi":"được vận chuyển","use":"bị động; is transported + to + nơi + by + phương tiện","ex":["The finished glass is transported to shops by lorry.","After drying, the coffee is transported to factories for roasting."],"syn":"is delivered"},{"w":"is collected","pos":"cụm động từ","ipa":"/ɪz kəˈlektɪd/","vi":"được thu gom","use":"bị động; is collected + from + nơi + and then + V3","ex":["Rainwater is collected from roofs and stored in an underground tank.","First, used plastic is collected from households once a week."],"syn":"is gathered"},{"w":"is mixed with","pos":"cụm động từ","ipa":"/ɪz ˈmɪkst wɪð/","vi":"được trộn với","use":"bị động; A is mixed with B + to form / to produce + N","ex":["The clay is mixed with water to form a thick paste.","At stage three, the crushed rock is mixed with sand and cement."],"syn":"is combined with"},{"w":"the final stage","pos":"cụm danh từ","ipa":"/ðə ˌfaɪnl ˈsteɪdʒ/","vi":"giai đoạn cuối cùng","use":"in the final stage, + mệnh đề bị động; the process consists of + số + stages","ex":["In the final stage, the bricks are packed and delivered to customers.","The final stage of the 8-step process involves testing each product."],"syn":"the last step"},{"w":"was replaced by","pos":"cụm động từ","ipa":"/wəz rɪˈpleɪst baɪ/","vi":"được thay thế bằng","use":"bị động quá khứ; A was replaced by B (mô tả bản đồ)","ex":["By 2010, the old market was replaced by a modern shopping centre.","The farmland to the east was replaced by a housing estate in 2005."],"syn":"gave way to"},{"w":"was converted into","pos":"cụm động từ","ipa":"/wəz kənˈvɜːtɪd ˈɪntuː/","vi":"được chuyển đổi thành","use":"bị động; A was converted into B (công năng thay đổi)","ex":["The old factory was converted into an art gallery in 2015.","Between 1990 and 2020, the railway line was converted into a cycle path."],"syn":"was turned into"},{"w":"was demolished","pos":"cụm động từ","ipa":"/wəz dɪˈmɒlɪʃt/","vi":"bị phá bỏ","use":"bị động; was demolished + to make way for + N","ex":["The fire station was demolished in 2008 and a car park was built.","An old cinema near the river was demolished in 1998 to build flats."],"syn":"was knocked down"},{"w":"was extended","pos":"cụm động từ","ipa":"/wəz ɪkˈstendɪd/","vi":"được mở rộng, kéo dài","use":"bị động; was extended + to + nơi / by + độ dài","ex":["The main road was extended to the new airport by 2015.","The school was extended to include a sports hall and a library."],"syn":"was enlarged"},{"w":"make way for","pos":"cụm động từ","ipa":"/ˌmeɪk ˈweɪ fɔː/","vi":"nhường chỗ cho","use":"to make way for + N (thường sau was demolished / was cleared)","ex":["The forest was cleared in 2000 to make way for a golf course.","Several shops were knocked down to make way for a wider road."],"syn":"clear space for"},{"w":"to the north of","pos":"cụm giới từ","ipa":"/tə ðə ˈnɔːθ əv/","vi":"ở phía bắc của","use":"to the north / south / east / west + of + địa điểm","ex":["A new hospital was built to the north of the town centre in 2012.","To the north of the lake, the woodland remained unchanged."],"syn":"north of"},{"w":"undergo significant changes","pos":"cụm động từ","ipa":"/ˌʌndəˈɡəʊ sɪɡˌnɪfɪkənt ˈtʃeɪndʒɪz/","vi":"trải qua những thay đổi lớn","use":"chủ ngữ (địa điểm) + undergo/underwent + significant changes + between","ex":["The village underwent significant changes between 1995 and 2020.","According to the plan, the harbour will undergo significant changes by 2030."],"syn":"change considerably"}]}];
const GUNITS=[{"n":1,"en":"Present tenses","vi":"Các thì hiện tại","ielts":"Dùng trong Speaking Part 1 khi nói về thói quen, công việc, việc học, và trong Writing Task 2 khi nêu sự thật chung hoặc thay đổi từ quá khứ đến nay.","points":[{"h":"Hiện tại đơn: thói quen và sự thật","body":"Dùng hiện tại đơn (present simple) cho thói quen, việc lặp lại và sự thật chung. Với chủ ngữ ngôi thứ ba số ít (he, she, it, the chart...) phải thêm -s/-es vào động từ.","ex":["Most students in my city take the bus to school.","The chart shows the number of visitors to three museums."]},{"h":"Hiện tại tiếp diễn: đang xảy ra, tạm thời","body":"Dùng am/is/are + V-ing cho việc đang xảy ra lúc nói hoặc quanh thời điểm hiện tại, và cho xu hướng đang thay đổi.","ex":["I'm preparing for the IELTS exam at the moment.","More and more people are working from home these days."]},{"h":"Hiện tại hoàn thành: từ quá khứ đến nay","body":"Dùng have/has + V3 cho hành động bắt đầu trong quá khứ và còn liên quan đến hiện tại, khi không nói thời điểm cụ thể. Hay đi với since, for, already, yet, ever, recently.","ex":["The government has built three new hospitals since 2020.","Have you ever studied abroad?"]},{"h":"Hiện tại hoàn thành tiếp diễn: nhấn mạnh quá trình","body":"Dùng have/has been + V-ing để nhấn mạnh một hoạt động kéo dài liên tục đến bây giờ (và có thể vẫn tiếp tục).","ex":["I have been learning English for five years.","Air pollution has been getting worse in recent years."]},{"h":"Since và for","body":"Since + mốc thời gian (since 2019, since I was a child); for + khoảng thời gian (for three years, for a long time). Cả hai thường đi với thì hiện tại hoàn thành, không dùng hiện tại đơn.","ex":["She has worked at the hospital since 2018.","We have lived in this flat for six years."]}],"mistakes":[{"wrong":"She go to work by motorbike every day.","right":"She goes to work by motorbike every day.","why":"Chủ ngữ ngôi thứ ba số ít nên động từ phải thêm -es."},{"wrong":"I live in Hanoi since 2018.","right":"I have lived in Hanoi since 2018.","why":"Since + mốc thời gian đến hiện tại phải dùng thì hiện tại hoàn thành."},{"wrong":"I am study English now.","right":"I am studying English now.","why":"Thì hiện tại tiếp diễn cần be + V-ing, không dùng be + động từ nguyên mẫu."}],"quiz":[{"t":"mcq","q":"My sister ___ in a bank in Ho Chi Minh City.","o":["work","works","working","is work"],"a":1,"why":"Chủ ngữ 'my sister' là ngôi thứ ba số ít, nói về công việc thường xuyên nên dùng 'works'."},{"t":"fill","q":"The sun ___ (rise) in the east.","a":["rises"],"why":"Sự thật hiển nhiên dùng hiện tại đơn; chủ ngữ số ít nên thêm -s."},{"t":"mcq","q":"Look! The students ___ outside the library.","o":["are protesting","protest","protests","has protested"],"a":0,"why":"'Look!' cho thấy việc đang xảy ra ngay lúc nói nên dùng hiện tại tiếp diễn."},{"t":"mcq","q":"How often ___ you use public transport?","o":["are","does","do","have"],"a":2,"why":"Câu hỏi về thói quen ở hiện tại đơn với chủ ngữ 'you' dùng trợ động từ 'do'."},{"t":"fill","q":"I ___ (not/understand) this question. Can you explain it?","a":["don't understand","do not understand"],"why":"'Understand' là động từ trạng thái, dùng hiện tại đơn dạng phủ định 'don't understand'."},{"t":"mcq","q":"I ___ in this company for three years, and I still enjoy it.","o":["work","am working","worked","have worked"],"a":3,"why":"'For three years' tính đến nay nên dùng hiện tại hoàn thành 'have worked'."},{"t":"mcq","q":"Have you ever ___ a presentation in English?","o":["gave","given","give","giving"],"a":1,"why":"Sau 'have' trong thì hiện tại hoàn thành dùng quá khứ phân từ (V3) 'given'."},{"t":"fill","q":"The number of cars in Hanoi ___ (increase) dramatically since 2010.","a":["has increased","'s increased","has been increasing"],"why":"'Since 2010' chỉ khoảng thời gian từ quá khứ đến nay nên dùng hiện tại hoàn thành; 'the number' là số ít nên dùng 'has'."},{"t":"mcq","q":"At the moment, my city ___ a new metro line.","o":["builds","has built","build","is building"],"a":3,"why":"'At the moment' cho thấy việc đang diễn ra nên dùng hiện tại tiếp diễn."},{"t":"mcq","q":"Which sentence is correct?","o":["I know the answer.","I am knowing the answer.","I knowing the answer.","I am know the answer."],"a":0,"why":"'Know' là động từ trạng thái nên không dùng ở dạng tiếp diễn."},{"t":"fill","q":"She looks tired because she ___ (study) since 6 a.m.","a":["has been studying","'s been studying","has studied","'s studied"],"why":"Hoạt động kéo dài liên tục và để lại kết quả hiện tại (trông mệt) nên dùng hiện tại hoàn thành tiếp diễn."},{"t":"mcq","q":"The graph ___ the percentage of households with internet access between 2000 and 2020.","o":["showing","show","shows","is show"],"a":2,"why":"Mô tả biểu đồ dùng hiện tại đơn; 'the graph' là số ít nên dùng 'shows'."},{"t":"mcq","q":"Students in Vietnam usually ___ a national exam at the end of high school.","o":["are taking","takes","have taken","take"],"a":3,"why":"'Usually' chỉ việc lặp lại theo quy luật nên dùng hiện tại đơn; chủ ngữ số nhiều nên dùng 'take'."},{"t":"fill","q":"How long have you ___ (know) your best friend?","a":["known"],"why":"Sau 'have' trong thì hiện tại hoàn thành dùng V3; 'know' là động từ trạng thái nên không dùng 'been knowing'."},{"t":"mcq","q":"Unemployment ___ since the new factory opened last year.","o":["falls","is falling","has fallen","fell"],"a":2,"why":"'Since + mốc thời gian' đòi hỏi thì hiện tại hoàn thành."},{"t":"fill","q":"Researchers ___ (work) on this vaccine for over ten years, and they still haven't finished.","a":["have been working","'ve been working","have worked","'ve worked"],"why":"Hoạt động kéo dài từ quá khứ đến nay và chưa xong nên dùng hiện tại hoàn thành (tiếp diễn là tự nhiên nhất)."}]},{"n":2,"en":"Continuous tenses","vi":"Các thì tiếp diễn","ielts":"Giúp mô tả xu hướng đang thay đổi trong Writing Task 2 và kể lại bối cảnh câu chuyện trong Speaking Part 2.","points":[{"h":"Cấu trúc chung: be + V-ing","body":"Các thì tiếp diễn (continuous tenses) đều dùng be + V-ing để nói về hành động đang diễn ra, chưa kết thúc tại một thời điểm nào đó.","ex":["I am writing my essay now.","They were discussing the budget when I arrived."]},{"h":"Tạm thời và lâu dài","body":"Dùng tiếp diễn cho tình huống tạm thời; dùng thì đơn cho tình huống lâu dài, thường xuyên.","ex":["I live in Da Nang, but I'm staying with my aunt in Hanoi this month.","She usually works in the office, but this week she's working from home."]},{"h":"Động từ trạng thái (stative verbs)","body":"Các động từ chỉ suy nghĩ, cảm xúc, sở hữu, giác quan như know, believe, understand, own, belong, need, prefer, seem, contain thường không dùng ở dạng tiếp diễn.","ex":["Many people believe that technology makes life easier.","This report contains important data."]},{"h":"Động từ có hai nghĩa","body":"Một số động từ như think, have, see, taste dùng được tiếp diễn khi chỉ hành động, nhưng không dùng khi chỉ trạng thái (think = cho rằng, have = sở hữu).","ex":["I think online learning is useful.","I'm thinking about changing my job."]},{"h":"Quá khứ tiếp diễn: bối cảnh câu chuyện","body":"Dùng was/were + V-ing cho hành động dài đang diễn ra, và quá khứ đơn cho hành động ngắn xen vào (thường với when/while).","ex":["While I was studying, my phone rang.","It was raining heavily when we left the office."]}],"mistakes":[{"wrong":"I am knowing many people in this city.","right":"I know many people in this city.","why":"'Know' là động từ trạng thái nên không dùng dạng tiếp diễn."},{"wrong":"While I studied, my phone was ringing.","right":"While I was studying, my phone rang.","why":"Hành động dài làm bối cảnh dùng quá khứ tiếp diễn, hành động ngắn xen vào dùng quá khứ đơn."},{"wrong":"Nowadays, the population of big cities grow quickly.","right":"Nowadays, the population of big cities is growing quickly.","why":"Xu hướng đang thay đổi ở hiện tại nên dùng hiện tại tiếp diễn, và 'the population' là số ít."}],"quiz":[{"t":"mcq","q":"Please be quiet. The teacher ___ an important announcement.","o":["makes","is making","make","made"],"a":1,"why":"Việc đang diễn ra ngay lúc nói nên dùng hiện tại tiếp diễn."},{"t":"fill","q":"Right now, Lan ___ (prepare) for her IELTS speaking test.","a":["is preparing","'s preparing"],"why":"'Right now' chỉ việc đang xảy ra nên dùng is + V-ing."},{"t":"mcq","q":"I ___ what you mean.","o":["understand","am understanding","understanding","am understand"],"a":0,"why":"'Understand' là động từ trạng thái nên dùng hiện tại đơn."},{"t":"mcq","q":"This laptop ___ to my brother, not to me.","o":["is belonging","belong","belonging","belongs"],"a":3,"why":"'Belong' chỉ sở hữu, là động từ trạng thái; chủ ngữ số ít nên dùng 'belongs'."},{"t":"fill","q":"At 8 p.m. yesterday, I ___ (watch) a documentary about climate change.","a":["was watching"],"why":"Hành động đang diễn ra tại một thời điểm cụ thể trong quá khứ nên dùng quá khứ tiếp diễn."},{"t":"mcq","q":"At the moment, I ___ about applying for a master's degree in Australia.","o":["am thinking","think","thinks","have think"],"a":0,"why":"'Think about' ở đây là hoạt động đang cân nhắc (không phải ý kiến) nên dùng tiếp diễn."},{"t":"mcq","q":"The researchers ___ the data when the computer suddenly crashed.","o":["analysed","analyse","were analysing","have analysed"],"a":2,"why":"Hành động dài đang diễn ra thì bị hành động ngắn (máy tính hỏng) cắt ngang nên dùng quá khứ tiếp diễn."},{"t":"fill","q":"My father usually drives to work, but this week he ___ (take) the bus because his car is broken.","a":["is taking","'s taking"],"why":"'This week' chỉ tình huống tạm thời, khác thói quen thường ngày, nên dùng hiện tại tiếp diễn."},{"t":"mcq","q":"Which sentence is correct?","o":["We are having a big house near the river.","We having a big house near the river.","We has a big house near the river.","We have a big house near the river."],"a":3,"why":"'Have' mang nghĩa sở hữu là động từ trạng thái nên không dùng tiếp diễn."},{"t":"fill","q":"This soup ___ (taste) delicious. What did you put in it?","a":["tastes"],"why":"'Taste' ở đây mô tả đặc điểm (có vị) nên là động từ trạng thái, dùng hiện tại đơn."},{"t":"mcq","q":"Global temperatures ___ at the moment, and scientists are worried.","o":["rise","rises","are rising","have rise"],"a":2,"why":"'At the moment' và xu hướng đang thay đổi nên dùng hiện tại tiếp diễn; chủ ngữ số nhiều dùng 'are'."},{"t":"mcq","q":"She ___ tired today. Maybe she didn't sleep well.","o":["is seeming","seems","seem","seeming"],"a":1,"why":"'Seem' là động từ trạng thái nên dùng hiện tại đơn 'seems'."},{"t":"fill","q":"I ___ (wait) for the bus for 40 minutes, and it still hasn't come.","a":["have been waiting","'ve been waiting","have waited","'ve waited"],"why":"Hành động kéo dài liên tục đến bây giờ, nhấn mạnh thời gian nên dùng hiện tại hoàn thành tiếp diễn."},{"t":"mcq","q":"I ___ home when it started to rain heavily.","o":["was walking","have walked","am walking","walk"],"a":0,"why":"Hành động dài đang diễn ra trong quá khứ thì trời mưa xen vào nên dùng quá khứ tiếp diễn."},{"t":"mcq","q":"The company ___ more staff because demand is increasing.","o":["is needing","need","needing","needs"],"a":3,"why":"'Need' là động từ trạng thái nên dùng hiện tại đơn; chủ ngữ số ít nên dùng 'needs'."},{"t":"fill","q":"The doctor can't see you now; she ___ (have) a meeting with a patient's family.","a":["is having","'s having"],"why":"'Have a meeting' là hoạt động (không phải sở hữu) đang diễn ra nên dùng hiện tại tiếp diễn."}]},{"n":3,"en":"Past tenses","vi":"Các thì quá khứ","ielts":"Rất quan trọng trong Speaking Part 2 khi kể chuyện quá khứ và trong Writing Task 1 khi mô tả số liệu của những năm đã qua.","points":[{"h":"Quá khứ đơn: việc đã kết thúc","body":"Dùng quá khứ đơn (past simple) cho hành động đã xong tại một thời điểm xác định trong quá khứ (yesterday, in 2015, two years ago).","ex":["In 2010, about 30% of households owned a computer.","I graduated from university two years ago."]},{"h":"Quá khứ tiếp diễn: bối cảnh","body":"Dùng was/were + V-ing cho hành động đang diễn ra trong quá khứ, thường bị một hành động ngắn hơn cắt ngang.","ex":["I was living in Hue when I first met her.","While I was preparing dinner, the power went off."]},{"h":"Quá khứ hoàn thành: việc xảy ra trước","body":"Dùng had + V3 cho hành động xảy ra trước một hành động hoặc mốc khác trong quá khứ; hay đi với by the time, before, already.","ex":["When I got to the station, the train had already left.","By 2015, the city had built two new bridges."]},{"h":"Used to và would: thói quen cũ","body":"Used to + V nói về thói quen hoặc trạng thái trong quá khứ nay không còn. Would + V cũng dùng cho hành động lặp lại trong quá khứ, nhưng không dùng cho trạng thái (be, have, live...).","ex":["I used to walk to school when I was a child.","My grandmother would tell us stories every evening."]},{"h":"Quá khứ đơn hay hiện tại hoàn thành?","body":"Có thời điểm cụ thể đã kết thúc thì dùng quá khứ đơn; không nói thời điểm hoặc còn liên quan đến hiện tại thì dùng hiện tại hoàn thành.","ex":["I visited Singapore in 2019.","I have visited Singapore twice."]}],"mistakes":[{"wrong":"I have finished university in 2021.","right":"I finished university in 2021.","why":"Có thời điểm cụ thể trong quá khứ (in 2021) nên dùng quá khứ đơn."},{"wrong":"Yesterday I go to the library to study.","right":"Yesterday I went to the library to study.","why":"'Yesterday' chỉ quá khứ nên động từ phải chia quá khứ đơn."},{"wrong":"I use to play football every weekend when I was young.","right":"I used to play football every weekend when I was young.","why":"Trong câu khẳng định phải viết 'used to', có -d."}],"quiz":[{"t":"mcq","q":"Last year, our school ___ a new science lab.","o":["opens","opened","has opened","is opening"],"a":1,"why":"'Last year' là thời điểm đã kết thúc nên dùng quá khứ đơn."},{"t":"fill","q":"I ___ (buy) my first smartphone in 2015.","a":["bought"],"why":"'In 2015' là mốc quá khứ cụ thể; 'buy' là động từ bất quy tắc, quá khứ là 'bought'."},{"t":"mcq","q":"___ you go to the conference last week?","o":["Did","Do","Were","Have"],"a":0,"why":"Câu hỏi quá khứ đơn với động từ thường dùng trợ động từ 'Did'."},{"t":"fill","q":"We ___ (not/have) internet at home when I was a child.","a":["didn't have","did not have"],"why":"Phủ định quá khứ đơn: didn't + động từ nguyên mẫu."},{"t":"mcq","q":"I ___ to music when my teacher called me.","o":["listen","am listening","was listening","have listened"],"a":2,"why":"Hành động đang diễn ra thì bị cuộc gọi cắt ngang nên dùng quá khứ tiếp diễn."},{"t":"mcq","q":"When we arrived at the cinema, the film ___.","o":["already starts","has already started","had already started","is already starting"],"a":2,"why":"Phim bắt đầu trước khi chúng tôi đến (cả hai đều trong quá khứ) nên dùng quá khứ hoàn thành."},{"t":"mcq","q":"My grandfather ___ smoke, but he stopped ten years ago.","o":["used to","use to","was used to","would used to"],"a":0,"why":"Thói quen trong quá khứ nay không còn dùng 'used to + V'."},{"t":"fill","q":"In 1990, only 10% of people in the country ___ (own) a car.","a":["owned"],"why":"Số liệu của một năm đã qua dùng quá khứ đơn."},{"t":"mcq","q":"I ___ my keys, so I couldn't get into the house.","o":["lose","had lost","have lost","was losing"],"a":1,"why":"Việc mất chìa khóa xảy ra trước việc không vào được nhà (quá khứ) nên dùng quá khứ hoàn thành."},{"t":"mcq","q":"Which sentence is correct?","o":["I have seen him yesterday.","I see him yesterday.","I had saw him yesterday.","I saw him yesterday."],"a":3,"why":"'Yesterday' là thời điểm cụ thể nên dùng quá khứ đơn, không dùng hiện tại hoàn thành."},{"t":"fill","q":"While she ___ (drive) to work, she heard the news on the radio.","a":["was driving"],"why":"Sau 'while' là hành động dài đang diễn ra nên dùng quá khứ tiếp diễn."},{"t":"mcq","q":"Between 2000 and 2010, the price of rice ___ by 40%.","o":["has risen","rises","had rise","rose"],"a":3,"why":"Khoảng thời gian đã kết thúc hoàn toàn trong quá khứ nên dùng quá khứ đơn."},{"t":"mcq","q":"When I was a student, I ___ in the library every evening.","o":["would study","would studied","was used to study","use to study"],"a":0,"why":"'Would + V nguyên mẫu' diễn tả hành động lặp lại trong quá khứ."},{"t":"fill","q":"By the time the report was published, the company ___ (close) two of its factories.","a":["had closed","'d closed"],"why":"'By the time' + mốc quá khứ: việc đóng cửa nhà máy xảy ra trước nên dùng quá khứ hoàn thành."},{"t":"mcq","q":"I ___ a lot of time on social media, but now I hardly use it.","o":["am used to spend","have spent","spend","used to spend"],"a":3,"why":"Thói quen trong quá khứ đã thay đổi so với hiện tại nên dùng 'used to'."},{"t":"fill","q":"I didn't recognise the city because it ___ (change) so much since my last visit.","a":["had changed","'d changed"],"why":"Sự thay đổi xảy ra trước thời điểm 'didn't recognise' trong quá khứ nên dùng quá khứ hoàn thành."}]},{"n":4,"en":"Future 1 (will, be going to, present continuous for future)","vi":"Tương lai 1 (will, be going to, hiện tại tiếp diễn chỉ tương lai)","ielts":"Dùng trong Speaking Part 1 và 3 khi nói về kế hoạch, dự đoán, và trong Writing Task 2 khi dự đoán xu hướng tương lai.","points":[{"h":"Will: quyết định tức thời, lời hứa","body":"Dùng will + V cho quyết định đưa ra ngay lúc nói, lời hứa, lời đề nghị giúp đỡ.","ex":["OK, I'll take the bus then.","I'll help you with your homework after class."]},{"h":"Will: dự đoán theo ý kiến","body":"Dùng will cho dự đoán dựa trên suy nghĩ, niềm tin cá nhân; hay đi với I think, probably, I'm sure, perhaps.","ex":["I think robots will replace many jobs in the future.","Cities will probably become more crowded."]},{"h":"Be going to: kế hoạch đã định","body":"Dùng be going to + V cho dự định hoặc kế hoạch đã quyết định từ trước khi nói.","ex":["I'm going to take the IELTS test in December.","The council is going to build a new park."]},{"h":"Be going to: dự đoán có bằng chứng","body":"Dùng be going to khi dự đoán dựa trên dấu hiệu nhìn thấy ở hiện tại.","ex":["Look at those dark clouds. It's going to rain.","The company is losing money every month; it's going to close."]},{"h":"Hiện tại tiếp diễn và hiện tại đơn chỉ tương lai","body":"Hiện tại tiếp diễn dùng cho lịch hẹn cá nhân đã sắp xếp (có thời gian, người, địa điểm); hiện tại đơn dùng cho lịch trình cố định như tàu xe, lịch học. Sau when, if, as soon as, before cũng dùng hiện tại đơn, không dùng will.","ex":["I'm meeting my tutor at 3 p.m. tomorrow.","The train leaves at 7.15 tomorrow morning."]}],"mistakes":[{"wrong":"When I will finish university, I will look for a job.","right":"When I finish university, I will look for a job.","why":"Sau 'when' trong mệnh đề thời gian chỉ tương lai dùng hiện tại đơn."},{"wrong":"I will to study abroad next year.","right":"I will study abroad next year.","why":"Sau 'will' dùng động từ nguyên mẫu không có 'to'."},{"wrong":"Tomorrow I meet my professor at 10 a.m.","right":"Tomorrow I'm meeting my professor at 10 a.m.","why":"Lịch hẹn cá nhân đã sắp xếp thường dùng hiện tại tiếp diễn."}],"quiz":[{"t":"mcq","q":"A: The phone is ringing. B: OK, I ___ it.","o":["answer","am answering","answered","'ll answer"],"a":3,"why":"Quyết định đưa ra ngay lúc nói nên dùng 'will'."},{"t":"fill","q":"I promise I ___ (send) you the report tonight.","a":["will send","'ll send"],"why":"Lời hứa dùng will + V nguyên mẫu."},{"t":"mcq","q":"I ___ to take the IELTS test next month. I've already registered.","o":["am going","will","go","going"],"a":0,"why":"Kế hoạch đã quyết định từ trước (đã đăng ký) nên dùng 'be going to'."},{"t":"mcq","q":"Look at that car! It ___ into the wall!","o":["will crash","crashes","is going to crash","crash"],"a":2,"why":"Dự đoán dựa trên bằng chứng nhìn thấy ngay trước mắt nên dùng 'be going to'."},{"t":"fill","q":"I think electric cars ___ (become) cheaper in the next ten years.","a":["will become","'ll become","are going to become"],"why":"Dự đoán theo ý kiến cá nhân (I think) thường dùng 'will'."},{"t":"mcq","q":"We ___ our manager at 2 p.m. tomorrow — it's in my calendar.","o":["meet","will meeting","met","are meeting"],"a":3,"why":"Cuộc hẹn đã được sắp xếp với thời gian cụ thể nên dùng hiện tại tiếp diễn."},{"t":"mcq","q":"The next train to Hai Phong ___ at 9.30, so we need to hurry.","o":["leaves","is leave","will leaving","leaving"],"a":0,"why":"Lịch trình cố định của tàu xe dùng hiện tại đơn."},{"t":"fill","q":"If the government ___ (invest) in public transport, traffic will improve.","a":["invests"],"why":"Mệnh đề 'if' nói về tương lai dùng hiện tại đơn; 'the government' số ít nên thêm -s."},{"t":"mcq","q":"A: I don't have a pen. B: Don't worry. I ___ you mine.","o":["lend","am lending","'ll lend","lent"],"a":2,"why":"Lời đề nghị giúp đỡ nghĩ ra ngay lúc nói dùng 'will'."},{"t":"mcq","q":"Which sentence describes a fixed arrangement?","o":["I'll probably visit my parents.","I think I'll visit my parents.","Maybe I visit my parents.","I'm visiting my parents on Saturday."],"a":3,"why":"Hiện tại tiếp diễn kèm thời gian cụ thể diễn tả việc đã sắp xếp chắc chắn."},{"t":"fill","q":"She has bought all the materials. She ___ (paint) her room this weekend.","a":["is going to paint","'s going to paint","is painting","'s painting"],"why":"Đã mua vật liệu tức là kế hoạch đã định trước nên dùng 'be going to' (hoặc hiện tại tiếp diễn)."},{"t":"mcq","q":"I'll call you as soon as I ___ the results.","o":["will get","get","am going to get","got"],"a":1,"why":"Sau 'as soon as' nói về tương lai dùng hiện tại đơn, không dùng will."},{"t":"mcq","q":"According to experts, the population of the city ___ 15 million by 2040.","o":["reaches","is reaching","will reach","reached"],"a":2,"why":"Dự đoán dài hạn của chuyên gia dùng 'will'."},{"t":"fill","q":"Don't worry about the presentation. I'm sure you ___ (do) well.","a":["will do","'ll do"],"why":"'I'm sure' + dự đoán theo niềm tin cá nhân dùng 'will'."},{"t":"mcq","q":"Unemployment has risen for six months in a row. Experts say it ___ even higher next year.","o":["goes","is going to go","went","has gone"],"a":1,"why":"Dự đoán dựa trên số liệu hiện có (bằng chứng) nên dùng 'be going to'."},{"t":"fill","q":"The meeting will start after everyone ___ (arrive).","a":["arrives","has arrived"],"why":"Sau 'after' trong mệnh đề thời gian chỉ tương lai dùng hiện tại đơn (hoặc hiện tại hoàn thành); 'everyone' là số ít."}]},{"n":5,"en":"Future 2 (future continuous, future perfect, be about to, be due to)","vi":"Tương lai 2 (tương lai tiếp diễn, tương lai hoàn thành, be about to, be due to)","ielts":"Giúp đạt điểm Grammatical Range khi dự đoán chính xác trong Writing Task 2 và mô tả số liệu dự báo (projections) trong Writing Task 1.","points":[{"h":"Tương lai tiếp diễn: will be + V-ing","body":"Diễn tả hành động sẽ đang diễn ra tại một thời điểm cụ thể trong tương lai. Cũng dùng để hỏi kế hoạch của người khác một cách lịch sự.","ex":["This time next year, I will be studying in Melbourne.","At 9 a.m. tomorrow, we'll be taking the exam."]},{"h":"Tương lai hoàn thành: will have + V3","body":"Diễn tả hành động sẽ hoàn thành trước một mốc trong tương lai, thường đi với 'by' (by 2030, by the end of the year, by the time...).","ex":["By 2030, the city will have built five new metro lines.","By the end of this month, I will have finished my thesis."]},{"h":"Tương lai hoàn thành tiếp diễn","body":"Will have been + V-ing nhấn mạnh độ dài của một hoạt động tính đến một mốc tương lai.","ex":["By next June, I will have been working here for ten years.","By 2028, she will have been teaching for two decades."]},{"h":"Be about to: sắp xảy ra ngay","body":"Be about to + V diễn tả việc sắp xảy ra trong vài giây, vài phút tới; dạng quá khứ 'was about to' nghĩa là 'định làm thì...'.","ex":["Hurry up! The lecture is about to start.","I was about to leave when she called."]},{"h":"Be due to: theo lịch dự kiến","body":"Be due to + V diễn tả việc được lên lịch hoặc dự kiến chính thức; hay dùng trong tin tức, báo cáo.","ex":["The new airport is due to open in 2027.","The report is due to be published next week."]}],"mistakes":[{"wrong":"By the time you arrive, we will finish dinner.","right":"By the time you arrive, we will have finished dinner.","why":"Hành động hoàn tất trước một mốc tương lai nên dùng will have + V3."},{"wrong":"The train is about to leaving.","right":"The train is about to leave.","why":"Sau 'be about to' dùng động từ nguyên mẫu."},{"wrong":"This time tomorrow, I will fly to London.","right":"This time tomorrow, I will be flying to London.","why":"Hành động đang diễn ra tại một thời điểm cụ thể trong tương lai dùng tương lai tiếp diễn."}],"quiz":[{"t":"mcq","q":"Don't call me at 8 tonight. I ___ my favourite TV show.","o":["will watch","will be watching","watch","will have watched"],"a":1,"why":"Việc sẽ đang diễn ra đúng lúc 8 giờ tối nên dùng tương lai tiếp diễn."},{"t":"fill","q":"Please sit down quickly — the exam is just ___ to begin.","a":["about"],"why":"'Be about to' diễn tả việc sắp xảy ra ngay lập tức."},{"t":"mcq","q":"By the end of this year, the company ___ 200 new employees.","o":["will hire","will have hired","hires","will be hiring"],"a":1,"why":"'By the end of this year' là mốc tương lai, việc tuyển xong trước mốc đó nên dùng tương lai hoàn thành."},{"t":"mcq","q":"The new bridge is ___ open next spring.","o":["due to","about to","going","due"],"a":0,"why":"Lịch dự kiến chính thức dùng 'be due to + V'; 'about to' chỉ việc xảy ra ngay, không hợp với 'next spring'."},{"t":"fill","q":"This time next week, I ___ (lie) on a beach in Nha Trang.","a":["will be lying","'ll be lying"],"why":"Hành động sẽ đang diễn ra tại thời điểm cụ thể trong tương lai dùng will be + V-ing."},{"t":"mcq","q":"I was ___ go to bed when I heard a strange noise.","o":["going","about","about to","will"],"a":2,"why":"'Was about to' nghĩa là định làm gì ngay lúc đó thì có việc khác xảy ra."},{"t":"mcq","q":"By the time we get to the stadium, the match ___.","o":["will start","starts","is starting","will have started"],"a":3,"why":"Trận đấu bắt đầu trước khi chúng ta đến (mốc tương lai) nên dùng tương lai hoàn thành."},{"t":"fill","q":"By 2035, the government ___ (plant) 10 million trees.","a":["will have planted","'ll have planted"],"why":"'By 2035' là mốc tương lai, việc trồng cây hoàn thành trước mốc đó nên dùng will have + V3."},{"t":"mcq","q":"The report is due ___ on Friday.","o":["to publish","to be published","publishing","be published"],"a":1,"why":"Bản báo cáo được xuất bản (bị động) nên dùng 'due to be published'."},{"t":"mcq","q":"By next month, Minh ___ for the company for five years.","o":["will work","is working","will have been working","works"],"a":2,"why":"Nhấn mạnh độ dài thời gian tính đến một mốc tương lai nên dùng tương lai hoàn thành tiếp diễn."},{"t":"fill","q":"Don't phone at 7 p.m.; we ___ (have) dinner then.","a":["will be having","'ll be having"],"why":"Việc sẽ đang diễn ra đúng lúc 7 giờ tối nên dùng tương lai tiếp diễn."},{"t":"mcq","q":"Which sentence is correct?","o":["The flight is due landing at 6 p.m.","The flight is due land at 6 p.m.","The flight due to land at 6 p.m.","The flight is due to land at 6 p.m."],"a":3,"why":"Cấu trúc đúng là 'be due to + V nguyên mẫu', không được thiếu 'is' hay 'to'."},{"t":"mcq","q":"___ you be using the projector this afternoon? I'd like to borrow it.","o":["Will","Are","Do","Have"],"a":0,"why":"Hỏi lịch sự về kế hoạch của người khác dùng tương lai tiếp diễn 'Will you be + V-ing'."},{"t":"fill","q":"By the end of the course, students ___ (learn) over 2,000 new words.","a":["will have learned","will have learnt","'ll have learned","'ll have learnt"],"why":"Hoàn thành trước mốc 'the end of the course' trong tương lai nên dùng tương lai hoàn thành."},{"t":"mcq","q":"Experts predict that by 2050 the global population ___ nearly 10 billion.","o":["will have reached","has reached","reaches","is reaching"],"a":0,"why":"'By 2050' là mốc tương lai nên dùng tương lai hoàn thành 'will have reached'."},{"t":"fill","q":"By the time she retires, she ___ (teach) at this school for 35 years.","a":["will have been teaching","will have taught","'ll have been teaching","'ll have taught"],"why":"Khoảng thời gian 35 năm tính đến mốc nghỉ hưu trong tương lai dùng tương lai hoàn thành (tiếp diễn)."}]},{"n":6,"en":"Word order & punctuation","vi":"Trật tự từ và dấu câu","ielts":"Ảnh hưởng trực tiếp đến tiêu chí Grammatical Range and Accuracy trong Writing, vì lỗi trật tự từ và dấu phẩy là lỗi giám khảo dễ thấy nhất.","points":[{"h":"Trật tự cơ bản S – V – O","body":"Câu tiếng Anh theo thứ tự Chủ ngữ – Động từ – Tân ngữ; trạng từ chỉ nơi chốn thường đứng trước trạng từ chỉ thời gian. Không chen trạng từ vào giữa động từ và tân ngữ.","ex":["Many students use smartphones in class every day.","I met my tutor at the library yesterday."]},{"h":"Vị trí trạng từ tần suất","body":"Always, usually, often, never... đứng trước động từ thường, nhưng đứng sau động từ 'be' và sau trợ động từ.","ex":["She always submits her essays on time.","Public transport is often crowded in the morning."]},{"h":"Câu hỏi gián tiếp","body":"Trong câu hỏi gián tiếp (Could you tell me..., I don't know..., I wonder...), phần sau từ để hỏi giữ trật tự câu khẳng định: không đảo động từ lên trước chủ ngữ.","ex":["Could you tell me where the library is?","I don't know why prices have increased so quickly."]},{"h":"Thứ tự tính từ","body":"Khi có nhiều tính từ: ý kiến – kích thước – tuổi – màu sắc – nguồn gốc – chất liệu – danh từ.","ex":["They live in a beautiful old French house.","The city has built a large new concrete bridge."]},{"h":"Dấu câu cơ bản","body":"Dùng dấu phẩy sau từ nối đầu câu (However, ...) và sau mệnh đề phụ đứng đầu câu (Although..., ...). Không nối hai câu hoàn chỉnh chỉ bằng dấu phẩy (comma splice); dùng dấu chấm, dấu chấm phẩy hoặc liên từ.","ex":["Although the city is crowded, it offers many opportunities.","Prices rose sharply; however, demand remained high."]}],"mistakes":[{"wrong":"I like very much English.","right":"I like English very much.","why":"Không đặt trạng từ giữa động từ và tân ngữ."},{"wrong":"Can you tell me where is the station?","right":"Can you tell me where the station is?","why":"Câu hỏi gián tiếp giữ trật tự chủ ngữ trước động từ."},{"wrong":"Pollution is increasing, the government must act.","right":"Pollution is increasing, so the government must act.","why":"Không nối hai mệnh đề độc lập chỉ bằng dấu phẩy; cần thêm liên từ hoặc dùng dấu chấm."}],"quiz":[{"t":"mcq","q":"Choose the correct sentence.","o":["She speaks very well English.","She speaks English very well.","She very well speaks English.","Very well she speaks English."],"a":1,"why":"Tân ngữ 'English' phải đứng ngay sau động từ, trạng từ 'very well' đứng sau tân ngữ."},{"t":"fill","q":"I ___ (usually/go) to the gym after work.","a":["usually go"],"why":"Trạng từ tần suất đứng trước động từ thường."},{"t":"mcq","q":"Which sentence is correct?","o":["He is always late for class.","He always is late for class.","Always he is late for class.","He is late always for class."],"a":0,"why":"Trạng từ tần suất đứng sau động từ 'be'."},{"t":"mcq","q":"Do you know what time ___?","o":["does the lecture start","starts the lecture","the lecture starts","the lecture does start"],"a":2,"why":"Câu hỏi gián tiếp giữ trật tự khẳng định: chủ ngữ + động từ, không dùng 'does'."},{"t":"fill","q":"I have ___ (never/see) such a beautiful beach.","a":["never seen"],"why":"Trạng từ 'never' đứng sau trợ động từ 'have' và trước V3 'seen'."},{"t":"mcq","q":"Which order is the most natural?","o":["We stayed last summer in Da Lat.","We in Da Lat stayed last summer.","Last summer in Da Lat we stayed.","We stayed in Da Lat last summer."],"a":3,"why":"Thứ tự tự nhiên là Chủ ngữ – Động từ – Nơi chốn – Thời gian."},{"t":"mcq","q":"She bought ___.","o":["a red small Japanese car","a small red Japanese car","a Japanese small red car","a small Japanese red car"],"a":1,"why":"Thứ tự tính từ: kích thước (small) – màu sắc (red) – nguồn gốc (Japanese)."},{"t":"fill","q":"Could you tell me where the bus station ___ (be)?","a":["is"],"why":"Trong câu hỏi gián tiếp, động từ đứng sau chủ ngữ ở cuối câu."},{"t":"mcq","q":"Which sentence is punctuated correctly?","o":["However, the results were disappointing.","However the results were disappointing.","However; the results were disappointing.","However the results, were disappointing."],"a":0,"why":"Từ nối 'However' đứng đầu câu cần một dấu phẩy ngay sau nó."},{"t":"mcq","q":"Which sentence is punctuated correctly?","o":["Many people moved to the city, they wanted better jobs.","Many people moved to the city because, they wanted better jobs.","Many people moved to the city because they wanted better jobs.","Many people moved to the city. Because they wanted better jobs."],"a":2,"why":"Dùng 'because' nối hai mệnh đề, không có dấu phẩy sau 'because' và không tách mệnh đề 'because' thành câu riêng."},{"t":"fill","q":"I wonder why the price of petrol ___ (rise) so much recently.","a":["has risen","'s risen","has been rising","rose"],"why":"Câu hỏi gián tiếp giữ trật tự chủ ngữ + động từ; 'recently' đi với hiện tại hoàn thành."},{"t":"mcq","q":"Not only ___ the environment, but it also saves money.","o":["recycling protects","does recycling protect","recycling does protect","protects recycling"],"a":1,"why":"Khi 'Not only' đứng đầu câu phải đảo ngữ: trợ động từ + chủ ngữ + động từ."},{"t":"mcq","q":"Choose the correct sentence.","o":["Although the city is crowded it, has many parks.","Although, the city is crowded it has many parks.","Although the city is crowded. It has many parks.","Although the city is crowded, it has many parks."],"a":3,"why":"Mệnh đề 'Although...' đứng đầu câu được ngăn với mệnh đề chính bằng một dấu phẩy."},{"t":"fill","q":"The project faced many problems; ___, it was completed on time.","a":["however
