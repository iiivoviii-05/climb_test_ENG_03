what":"Kiểm tra nhận định có khớp với QUAN ĐIỂM hoặc tuyên bố của TÁC GIẢ không: YES nếu tác giả đồng ý, NO nếu tác giả nghĩ ngược lại, NOT GIVEN nếu không biết tác giả nghĩ gì về điểm đó.","steps":["Nhận biết dạng: đề hỏi 'views/claims of the writer'; bài thường mang tính nghị luận, có ý kiến cá nhân.","Gạch chân từ khóa và từ thể hiện thái độ trong nhận định: should, a mistake, beneficial, overestimated, too…","Tìm vị trí theo thứ tự bài đọc; đáp án đi theo thứ tự giống dạng TFNG.","Tìm câu thể hiện ý kiến tác giả: I believe, in my view, arguably, unfortunately, it is clear that, however…","Tách ý kiến tác giả khỏi ý kiến người khác được trích dẫn (some experts claim…, critics argue…).","Thái độ trùng → YES; ngược lại → NO; tác giả không bày tỏ quan điểm về điểm đó → NOT GIVEN."],"traps":["Lấy ý kiến của nhà nghiên cứu được trích làm ý kiến tác giả; tác giả có thể trích ra rồi phản bác.","Bỏ qua mức độ thái độ: tác giả 'hơi nghi ngờ' khác với 'hoàn toàn phản đối'.","Nhầm NO với NOT GIVEN: NO = tác giả nói ngược lại; NOT GIVEN = tác giả không nêu quan điểm.","Trả lời theo ý kiến của chính mình hoặc kiến thức ngoài bài thay vì theo tác giả."],"example":{"text":"Some planners argue that wider roads reduce traffic, but in my view this belief has repeatedly been proven wrong.","q":"The writer agrees that building wider roads reduces traffic.","a":"NO","why":"Tác giả nêu ý kiến của 'some planners' rồi phản bác bằng 'in my view… proven wrong', nên quan điểm tác giả ngược với nhận định."},"time":"Như TFNG: khoảng 1 phút/câu, làm theo thứ tự; đọc chậm ở chỗ có but/however vì thái độ hay đổi ở đó."},{"id":"headings","en":"Matching Headings","vi":"Chọn tiêu đề cho đoạn","what":"Chọn tiêu đề (i, ii, iii…) phù hợp với Ý CHÍNH của từng đoạn. Số tiêu đề luôn nhiều hơn số đoạn, nên sẽ có tiêu đề thừa.","steps":["Nếu đề có ví dụ, gạch bỏ ngay tiêu đề đã dùng trong ví dụ và bỏ qua đoạn ví dụ đó.","Đọc lướt danh sách tiêu đề, gạch chân ý chính của từng tiêu đề (causes, effects, a solution, a comparison…).","Đọc câu đầu và câu cuối của đoạn, rồi lướt phần giữa để nắm ý chung của cả đoạn.","Tự tóm đoạn trong 3–5 từ bằng lời của mình, rồi so với danh sách tiêu đề.","Chọn tiêu đề bao trùm cả đoạn; nếu phân vân giữa 2 tiêu đề, ghi cả hai và quay lại sau.","Đáp án KHÔNG theo thứ tự tiêu đề: làm đoạn dễ trước, gạch bỏ tiêu đề đã dùng chắc chắn.","Kiểm tra cuối: mỗi tiêu đề chỉ dùng một lần, các đoạn còn lại khớp với các tiêu đề còn lại."],"traps":["Chọn tiêu đề chỉ khớp một chi tiết hoặc ví dụ trong đoạn, không phải ý chính của cả đoạn.","Chọn vì thấy từ trùng với bài: tiêu đề đúng thường được paraphrase, tiêu đề lặp từ hay là bẫy.","Chỉ đọc câu đầu: ý chính có thể nằm sau 'However' ở giữa đoạn hoặc ở câu cuối.","Hai tiêu đề gần nghĩa (ví dụ 'causes of…' và 'effects of…'): phải đọc kỹ để chọn đúng hướng."],"example":{"text":"Paragraph C: Early cars were expensive and often broke down. However, once mass production began, prices fell sharply and cars became available to ordinary families.","q":"Choose the best heading for Paragraph C: i) The dangers of early cars  ii) How cars became affordable  iii) The first car factories","a":"ii","why":"Ý chính nằm sau 'However': giá giảm, gia đình bình thường mua được = 'became affordable'. (i) chỉ khớp chi tiết 'broke down'; (iii) dính từ 'mass production' nhưng không phải ý chính."},"time":"Thường làm trước trong passage vì giúp hiểu bố cục bài; khoảng 1–1,5 phút/đoạn, đoạn khó thì đánh dấu để quay lại."},{"id":"paragraph","en":"Which paragraph contains… (Matching Information)","vi":"Tìm đoạn chứa thông tin","what":"Cho các mô tả thông tin (a reason, an example, a comparison…); tìm đoạn (A, B, C…) có chứa thông tin đó. Đây là tìm CHI TIẾT, không phải ý chính của đoạn.","steps":["Đọc instruction: nếu có 'NB You may use any letter more than once' thì một đoạn có thể là đáp án của nhiều câu.","Gạch chân loại thông tin cần tìm (a description, a reference to, an explanation, a date…) và nội dung chính.","Đoán dấu hiệu sẽ gặp: 'a comparison' → unlike, more than; 'an example' → for instance, such as; số liệu → con số.","Làm sau các câu theo thứ tự khác của passage, khi đã đọc và nhớ sơ nội dung từng đoạn.","Đọc từng đoạn một và đối chiếu với TẤT CẢ câu hỏi cùng lúc, thay vì đọc lại cả bài cho từng câu.","Câu có tên riêng/số liệu thì scan làm trước; câu trừu tượng để sau.","Đáp án KHÔNG theo thứ tự bài; có đoạn không được dùng, nên đừng cố chia đều đáp án cho các đoạn."],"traps":["Tìm ý chính như dạng headings, trong khi thông tin cần tìm thường chỉ là một câu nhỏ trong đoạn.","Bỏ qua loại thông tin: đề hỏi 'a prediction' mà đoạn chỉ mô tả hiện tại thì không phải đáp án.","Nghĩ mỗi đoạn chỉ dùng một lần, hoặc mọi đoạn đều phải được dùng.","Tốn quá nhiều thời gian dò cả bài cho một câu; nên đánh dấu rồi quay lại sau."],"example":{"text":"Paragraph D: By 2040, engineers expect that most new buildings in the region will generate their own electricity from solar panels.","q":"Which paragraph contains a prediction about future energy use in buildings?","a":"D","why":"'expect that… by 2040… will generate' là một dự đoán (prediction); 'their own electricity' ứng với 'energy use'."},"time":"Thường khó và tốn thời gian nhất; để sau cùng trong passage, khi đã quen nội dung các đoạn."},{"id":"features","en":"Matching Features","vi":"Nối thông tin với nhân vật / đặc điểm","what":"Nối các nhận định hoặc thông tin với một danh sách lựa chọn (thường là tên nhà nghiên cứu, mốc thời gian, địa điểm, loại sản phẩm…).","steps":["Đọc instruction: có thể có 'NB You may use any letter more than once', và có lựa chọn không được dùng.","Scan bài, khoanh tròn MỌI chỗ xuất hiện các tên/lựa chọn trong danh sách (kể cả chỉ có họ hoặc 'the team').","Một tên có thể xuất hiện ở nhiều đoạn; đánh dấu đủ tất cả vị trí trước khi trả lời.","Đọc từng nhận định, gạch chân ý chính để biết cần tìm phát hiện/ý kiến nào.","Câu hỏi KHÔNG theo thứ tự bài: đọc phần nói về một tên, rồi so với cả danh sách nhận định cùng lúc.","Chọn khi nội dung khớp bằng paraphrase; kiểm tra lại người đó thật sự nói/phát hiện điều đó."],"traps":["Gán ý kiến cho tên đứng gần nhất, trong khi người đó đang trích hoặc phản bác ý kiến của người khác.","Bỏ sót lần nhắc thứ hai: tác giả có thể gọi lại bằng họ, 'he/she', 'the researchers' hoặc 'her team'.","Chọn vì từ trùng chứ không vì ý nghĩa; nhận định phải đúng là phát hiện/ý kiến của người đó.","Tưởng mỗi lựa chọn chỉ dùng một lần nên bỏ đáp án đúng vì 'đã dùng rồi'."],"example":{"text":"Dr Lin found that bees remember flower colours for days, whereas Professor Ortiz claimed that their memory lasts only a few hours.","q":"Which researcher suggested that bees have only a short-term memory for colour? A Dr Lin  B Professor Ortiz","a":"B","why":"'only a few hours' = trí nhớ ngắn hạn (short-term), và đây là ý của Ortiz; Lin nói ngược lại ('for days')."},"time":"Làm sau các câu theo thứ tự; dành 1–2 phút scan và khoanh tên trước, sau đó khoảng 1 phút/câu."},{"id":"endings","en":"Matching Sentence Endings","vi":"Nối phần đầu câu với phần kết","what":"Nối phần đầu câu (câu hỏi) với phần kết đúng trong danh sách (A, B, C…) để câu hoàn chỉnh đúng với nội dung bài. Số phần kết nhiều hơn số câu.","steps":["Đọc phần đầu câu, gạch chân từ khóa để định vị; các phần đầu câu thường theo thứ tự bài đọc.","Đọc lướt tất cả phần kết; danh sách này bị xáo trộn, KHÔNG theo thứ tự bài và có phần thừa.","Loại trước các phần kết không hợp ngữ pháp với phần đầu câu.","Tìm vị trí trong bài, đọc kỹ đoạn đó và tự nghĩ phần kết bằng lời của mình.","So ý của mình với các phần kết còn lại; chọn phần có ý giống bài dù dùng từ khác.","Đọc lại cả câu đã nối: phải đúng ngữ pháp VÀ đúng nội dung bài; gạch bỏ phần kết đã dùng."],"traps":["Chọn phần kết đúng ngữ pháp, nghe hợp lý ngoài đời nhưng bài không nói như vậy.","Phần kết có ý đúng trong bài nhưng nói về đối tượng khác, không phải đối tượng của phần đầu câu.","Phần kết lặp nguyên văn từ trong bài hay là bẫy; đáp án đúng thường được paraphrase.","Tưởng phần kết cũng theo thứ tự bài: chỉ phần đầu câu theo thứ tự, phần kết bị xáo trộn."],"example":{"text":"Because the river flooded every spring, farmers in the valley built their houses on raised wooden platforms.","q":"Farmers in the valley built raised houses… A because wood was cheap.  B to protect their homes from water.  C to keep animals away.","a":"B","why":"'flooded every spring' + 'raised platforms' cho thấy mục đích là tránh nước lũ = 'protect their homes from water'. A và C hợp ngữ pháp nhưng bài không nói."},"time":"Khoảng 1–1,5 phút/câu; làm theo thứ tự phần đầu câu, dùng ngữ pháp để loại nhanh lựa chọn."},{"id":"mcq","en":"Multiple Choice","vi":"Trắc nghiệm","what":"Chọn đáp án đúng (A, B, C hoặc D) để trả lời câu hỏi hoặc hoàn thành câu. Có dạng chọn HAI (hoặc BA) đáp án đúng từ một danh sách dài hơn.","steps":["Đọc instruction: chọn một chữ cái hay 'Choose TWO letters'; dạng chọn hai chiếm 2 số câu, mỗi chữ đúng 1 điểm.","Đọc phần câu hỏi (stem) trước, gạch chân từ khóa; chưa cần đọc kỹ các lựa chọn.","Tìm vị trí trong bài; câu hỏi đi theo thứ tự bài (câu hỏi về ý chính/mục đích cả bài thường ở cuối).","Đọc kỹ đoạn đó, hiểu ý trước, rồi mới đọc từng lựa chọn A–D.","Loại từng lựa chọn: sai thông tin, không được nhắc, hoặc đúng nhưng không trả lời câu hỏi.","Chọn lựa chọn paraphrase đúng ý bài, rồi đọc lại cùng stem để chắc chắn khớp."],"traps":["Chọn lựa chọn có nhiều từ y hệt bài nhất; đó thường là bẫy, đáp án đúng hay được viết lại bằng từ khác.","Lựa chọn đúng với bài nhưng không trả lời câu hỏi (hỏi nguyên nhân mà lựa chọn nói kết quả).","Lựa chọn quá mạnh hoặc quá chung (always, all, completely) trong khi bài chỉ nói 'often' hay 'some'.","Đọc kỹ cả 4 lựa chọn trước khi tìm vị trí trong bài, dễ bị rối và tốn thời gian."],"example":{"text":"The museum moved to a larger building in 1998, mainly because its collection had grown too big for the old site.","q":"Why did the museum move? A The old building was damaged.  B It needed more space for its objects.  C It wanted more visitors.  D The rent increased.","a":"B","why":"'collection had grown too big for the old site' = cần thêm chỗ cho hiện vật. A, C, D nghe hợp lý nhưng bài không nói."},"time":"Khoảng 1,5–2 phút/câu vì phải đọc kỹ; làm theo thứ tự, câu khó thì đoán tạm và đi tiếp."},{"id":"summary","en":"Summary Completion","vi":"Hoàn thành đoạn tóm tắt","what":"Điền vào chỗ trống trong đoạn tóm tắt một phần của bài, bằng từ lấy từ bài (from the passage) HOẶC bằng lựa chọn trong một hộp từ cho sẵn (from the box, ghi chữ cái A, B, C…).","steps":["Xác định kiểu: 'from the passage' → chép từ trong bài theo giới hạn từ; 'from the box/list' → ghi chữ cái trong hộp.","Đọc tiêu đề và câu đầu của tóm tắt để biết nó tóm tắt phần nào của bài (thường là một hoặc vài đoạn).","Với mỗi chỗ trống, đoán loại từ: danh từ/động từ/tính từ, số ít hay số nhiều, dựa vào từ đứng trước và sau.","Tìm phần bài tương ứng; trong phạm vi đó các chỗ trống thường theo thứ tự, nhưng không đảm bảo hoàn toàn.","Kiểu chép từ: chép đúng chính tả và đúng dạng từ trong bài, không vượt giới hạn từ.","Kiểu hộp từ: lựa chọn thường là từ đồng nghĩa, không giống chữ trong bài; hộp có nhiều lựa chọn thừa.","Đọc lại cả câu tóm tắt sau khi điền: phải đúng ngữ pháp và đúng ý bài."],"traps":["Kiểu hộp từ: chọn từ giống hệt chữ trong bài thay vì từ mang đúng nghĩa; đáp án hay là từ đồng nghĩa.","Kiểu hộp từ: viết cả từ ra phiếu khi đề yêu cầu ghi chữ cái (A, B, C…).","Kiểu chép từ: viết bằng từ của mình hoặc đổi dạng từ thay vì chép đúng từ trong bài.","Chỉ dựa vào ngữ pháp: hộp thường có 2–3 từ cùng loại từ, phải dựa vào ý nghĩa để chọn."],"example":{"text":"Unlike most snakes, this species gives birth to live young instead of laying eggs.","q":"Complete the summary using ONE WORD ONLY from the passage: This snake is unusual because it does not produce ______.","a":"eggs","why":"'instead of laying eggs' = không đẻ trứng. Sau 'produce' cần danh từ; chép đúng dạng số nhiều 'eggs' như trong bài."},"time":"Khoảng 1 phút/chỗ trống; xác định đúng phần bài được tóm tắt trước rồi làm liền một mạch."},{"id":"sentence","en":"Sentence / Note / Table / Form Completion","vi":"Điền từ vào câu / ghi chú / bảng / biểu mẫu","what":"Điền vào chỗ trống trong câu, ghi chú, bảng hoặc biểu mẫu bằng từ (hoặc số) lấy NGUYÊN VĂN từ bài đọc, không vượt giới hạn số từ.","steps":["Đọc kỹ giới hạn từ: 'ONE WORD ONLY', 'NO MORE THAN TWO WORDS AND/OR A NUMBER'… viết quá là sai cả câu.","Đoán loại từ cho mỗi chỗ trống: danh từ/tính từ/động từ, số ít hay số nhiều, hay một con số/năm.","Gạch chân từ khóa quanh chỗ trống; với bảng, đọc tiêu đề hàng và cột để biết cần loại thông tin gì.","Tìm vị trí trong bài; câu hỏi thường theo thứ tự bài (ghi chú/bảng hay tập trung vào một phần bài).","Xác định đúng từ cần điền và chép y như trong bài, không đổi dạng từ; số có thể viết bằng chữ số.","Kiểm tra: đúng chính tả, đúng số ít/số nhiều, câu hoàn chỉnh đúng ngữ pháp và đúng giới hạn từ."],"traps":["Viết quá số từ cho phép, ví dụ thêm 'the' hoặc tính từ thừa khi đề chỉ cho ONE WORD.","Sai chính tả hoặc thiếu/thừa 's' số nhiều: IELTS chấm sai nếu không đúng như trong bài.","Diễn đạt lại bằng từ của mình thay vì chép nguyên văn từ trong bài.","Điền lại từ đã có sẵn trong câu, hoặc điền từ không hợp ngữ pháp với chỗ trống."],"example":{"text":"The bridge, completed in 1932, was built mainly from local granite rather than imported steel.","q":"Complete the notes using NO MORE THAN TWO WORDS: Main building material: ______","a":"local granite","why":"'built mainly from' = 'main building material'. 'local granite' là 2 từ, đúng giới hạn; 'steel' là bẫy vì bài nói 'rather than'."},"time":"Dạng dễ ghi điểm; làm sớm, khoảng 1 phút/câu, kiểm tra chính tả ngay trước khi chuyển câu."},{"id":"flow","en":"Flow-chart & Diagram Label Completion","vi":"Điền sơ đồ quy trình / nhãn hình vẽ","what":"Điền từ vào các ô của sơ đồ quy trình (flow-chart) hoặc nhãn của hình vẽ (diagram) mô tả một quy trình, máy móc hay cấu tạo, bằng từ lấy từ bài.","steps":["Đọc giới hạn từ (ví dụ NO MORE THAN TWO WORDS) và nhìn tổng thể: quy trình/vật gì, bắt đầu và kết thúc ở đâu.","Với flow-chart: đi theo mũi tên từng bước, đoán loại từ cần điền (thường là danh từ hoặc động từ).","Với diagram: dùng các nhãn có sẵn làm mốc để tìm phần mô tả tương ứng trong bài.","Tìm đoạn mô tả quy trình/cấu tạo; thông tin thường tập trung trong một hoặc hai đoạn.","Theo dõi từ chỉ trình tự và vị trí: first, then, after, finally; above, below, inside, attached to.","Chép đúng từ trong bài; flow-chart thường theo thứ tự bài, còn nhãn diagram có thể không theo thứ tự."],"traps":["Bỏ qua mũi tên hoặc thứ tự bước, điền thông tin của bước trước/sau vào nhầm ô.","Đọc nhầm vị trí trên hình (trên/dưới, trong/ngoài) nên điền nhãn cho sai bộ phận.","Vượt giới hạn từ hoặc đổi dạng từ so với bài (ví dụ bài viết 'heat' mà ghi 'heating').","Đọc cả bài để tìm, trong khi thông tin thường nằm gọn trong một đoạn mô tả."],"example":{"text":"First, the tea leaves are spread out to dry. They are then rolled by machine, which breaks their cells and releases natural juices.","q":"Complete the flow-chart using ONE WORD ONLY: Leaves are dried → Leaves are ______ by machine → Juices are released","a":"rolled","why":"'then rolled by machine' khớp với bước thứ hai; sau 'are' cần động từ dạng V3 (bị động), chép đúng 'rolled' như trong bài."},"time":"Khá dễ khi tìm đúng đoạn mô tả; khoảng 1 phút/chỗ trống, xem kỹ hình trước khi đọc bài."},{"id":"short","en":"Short-answer Questions","vi":"Trả lời câu hỏi ngắn","what":"Trả lời các câu hỏi Wh- (What, Which, Who, When, How many…) về chi tiết trong bài bằng từ hoặc số lấy từ bài, không vượt giới hạn từ.","steps":["Đọc giới hạn từ, ví dụ 'NO MORE THAN THREE WORDS AND/OR A NUMBER'; không cần viết thành câu hoàn chỉnh.","Gạch chân từ để hỏi để biết loại đáp án: When → thời gian, How many → số, Who → người, Where → nơi chốn.","Gạch chân từ khóa (tên riêng, số, thuật ngữ) để scan vị trí; câu hỏi đi theo thứ tự bài đọc.","Đọc kỹ câu chứa thông tin; câu hỏi thường paraphrase lại câu trong bài.","Chép đúng từ trong bài, chỉ những từ trả lời trực tiếp câu hỏi, không chép thừa.","Kiểm tra chính tả, số ít/số nhiều và số từ trước khi ghi vào phiếu trả lời."],"traps":["Trả lời sai loại thông tin: hỏi 'How many' lại ghi tên, hỏi 'Which method' lại ghi kết quả.","Chép cả cụm dài vượt giới hạn từ, hoặc lặp lại những từ đã có trong câu hỏi.","Bài có nhiều con số gần nhau, chọn nhầm số không đúng điều kiện trong câu hỏi.","Sai chính tả từ chuyên môn khi chép; luôn so từng chữ với bài."],"example":{"text":"The survey, carried out in 2019, asked 450 farmers which crop they found most profitable; most chose rice.","q":"How many farmers took part in the survey? Write NO MORE THAN THREE WORDS AND/OR A NUMBER.","a":"450","why":"'asked 450 farmers' = số người tham gia khảo sát. 'How many' cần một con số; '2019' là năm nên là bẫy."},"time":"Dễ ghi điểm, khoảng 1 phút/câu; làm theo thứ tự, scan bằng tên riêng và con số."}];

bbies","vi":"Thời gian rảnh và sở thích","qs":["What do you like to do in your free time?","Do you have more free time now than you did a few years ago?","Is there a hobby you would like to try in the future?","Do you prefer spending your free time alone or with other people?","Did you have the same hobbies when you were a child?"]},{"id":"p1-sports","topic":"Sports & exercise","vi":"Thể thao và tập luyện","qs":["Do you do any kind of exercise?","What sports are popular in your country?","Did you play any sports at school?","Do you prefer watching sport or taking part in it?","What do you think stops people from exercising more?"]},{"id":"p1-tech","topic":"Technology & phones","vi":"Công nghệ và điện thoại","qs":["How often do you use your phone each day?","What do you mainly use your phone for?","Could you live without your phone for a week?","Is there any piece of technology you would like to buy?","Do you think you spend too much time looking at screens?"]},{"id":"p1-music","topic":"Music","vi":"Âm nhạc","qs":["What kind of music do you enjoy?","When do you usually listen to music?","Have your tastes in music changed as you've got older?","Have you ever learnt to play a musical instrument?","Do you prefer listening to music at home or going to live concerts?"]},{"id":"p1-travel","topic":"Travel & holidays","vi":"Du lịch và kỳ nghỉ","qs":["Do you enjoy travelling?","Where did you go on your last holiday?","Do you prefer travelling alone or with others?","What do you usually do to plan a trip?","Is there a place you have always wanted to visit?"]},{"id":"p1-friends","topic":"Friends","vi":"Bạn bè","qs":["Do you have many close friends?","How often do you see your friends?","What do you usually do together?","Is it easy for you to make new friends in a foreign country?","What qualities do you look for in a friend?"]},{"id":"p1-shopping","topic":"Shopping","vi":"Mua sắm","qs":["Do you enjoy going shopping?","Do you prefer shopping online or in shops?","What was the last thing you bought?","Are there any things you never buy online?","Is shopping in Korea different from shopping in Vietnam?"]},{"id":"p1-languages","topic":"Learning languages","vi":"Học ngoại ngữ","qs":["What languages can you speak?","Why are you learning English?","What is the hardest part of learning a new language for you?","How do you usually practise outside a classroom?","Would you like to learn another language in the future?"]}],"part2":[{"id":"p2-person","topic":"A person who helped you","vi":"Người đã giúp đỡ bạn","card":"Describe a person who has helped you to learn something.","bullets":["who this person is","what they helped you learn","how they helped you"],"last":"and explain how you felt about their help.","part3":["Who usually has a bigger influence on children: parents or teachers?","What makes someone a good teacher or mentor?","Do you think people learn more from their family or from school nowadays?","Will online learning ever replace face-to-face teaching completely?"]},{"id":"p2-object","topic":"A useful object or piece of technology","vi":"Một đồ vật hoặc thiết bị hữu ích","card":"Describe a useful object or piece of technology that you own.","bullets":["what it is","when and where you got it","how often you use it","what you use it for"],"last":"and explain why it is so useful to you.","part3":["What kinds of devices do people in your country use every day?","How has technology changed the way people communicate compared with the past?","What are the disadvantages of relying too much on technology?","What new technology do you think will change daily life most in the next twenty years?"]},{"id":"p2-place","topic":"A place you visited and liked","vi":"Một nơi bạn đã đến và yêu thích","card":"Describe a place you have visited that you really liked.","bullets":["where it is","when you went there","who you went with","what you did there"],"last":"and explain why you liked it so much.","part3":["What kinds of places do tourists like to visit in your country?","Do you think tourism brings more benefits or problems to local people?","How has the way people choose holiday destinations changed in recent years?","Should governments limit the number of tourists who visit popular places?"]},{"id":"p2-skill","topic":"A skill you learned","vi":"Một kỹ năng bạn đã học","card":"Describe a skill that you learned which took you a long time.","bullets":["what the skill is","when you started learning it","how you learned it"],"last":"and explain why it took you so long to learn.","part3":["What skills do young people need to learn these days?","Is it better to learn a skill from a teacher or by yourself?","Are practical skills more important than academic knowledge?","How might the skills that employers want change in the future?"]},{"id":"p2-busy","topic":"A time you were very busy","vi":"Một lần bạn rất bận rộn","card":"Describe a time when you were very busy.","bullets":["when it was","what you had to do","how you managed your time"],"last":"and explain how you felt during that period.","part3":["Why do people seem busier today than in the past?","What are some good ways to deal with stress at work?","Should companies be responsible for the work-life balance of their employees?","Do you think people will work fewer hours in the future?"]},{"id":"p2-book","topic":"A book or article you read","vi":"Một cuốn sách hoặc bài báo bạn đã đọc","card":"Describe a book or article you read that you found interesting.","bullets":["what it was about","when and where you read it","why you decided to read it"],"last":"and explain why you found it interesting.","part3":["Do people read as much as they used to?","What are the differences between reading on paper and reading on a screen?","How can parents encourage children to read more?","Do you think printed books will disappear in the future?"]},{"id":"p2-trip","topic":"A memorable trip","vi":"Một chuyến đi đáng nhớ","card":"Describe a trip you went on that you still remember well.","bullets":["where you went","who you went with","how you travelled","what happened during the trip"],"last":"and explain why this trip was so memorable.","part3":["Why do some people prefer to travel in a group rather than on their own?","How has travel changed compared with your parents' generation?","What are the advantages and disadvantages of travelling abroad when you are young?","How do you think people will travel fifty years from now?"]},{"id":"p2-goal","topic":"A goal you want to achieve","vi":"Một mục tiêu bạn muốn đạt được","card":"Describe a goal that you would like to achieve in the future.","bullets":["what the goal is","when you first had this goal","what you are doing to achieve it"],"last":"and explain why this goal is important to you.","part3":["Do young people in your country have different goals from older people?","Is it better to set small goals or big goals?","Why do some people give up on their goals?","Does society put too much pressure on young people to be successful?"]},{"id":"p2-problem","topic":"A time you solved a problem","vi":"Một lần bạn giải quyết vấn đề","card":"Describe a time when you solved a difficult problem.","bullets":["what the problem was","when it happened","how you solved it","whether anyone helped you"],"last":"and explain how you felt after solving it.","part3":["What kinds of problems do people often face at work?","Is it better to solve problems alone or with other people?","Do you think schools teach children enough about problem-solving?","Will artificial intelligence solve most of our problems in the future?"]},{"id":"p2-app","topic":"A website or app you use often","vi":"Một trang web hoặc ứng dụng bạn hay dùng","card":"Describe a website or app that you use often.","bullets":["what it is","how you found out about it","what you use it for"],"last":"and explain why you use it so often.","part3":["What kinds of apps are most popular among people of different ages?","Has the internet made people's lives easier or more complicated?","Should children's use of apps and websites be controlled by their parents?","How might the internet change people's jobs in the future?"]},{"id":"p2-festival","topic":"A festival or celebration","vi":"Một lễ hội hoặc dịp kỷ niệm","card":"Describe a festival or celebration that is important in your country.","bullets":["what it is called","when it takes place","what people do during it","how you usually celebrate it"],"last":"and explain why it is important to people in your country.","part3":["Why are traditional festivals important for a country?","How have the ways people celebrate festivals changed over time?","Do you think festivals have become too commercial?","Will young people continue to keep traditional festivals alive in the future?"]},{"id":"p2-advice","topic":"A piece of advice you received","vi":"Một lời khuyên bạn đã nhận được","card":"Describe a useful piece of advice that someone gave you.","bullets":["who gave you the advice","when you received it","what the advice was"],"last":"and explain how this advice helped you.","part3":["Who do young people usually ask for advice?","Is advice from older people always better than advice from friends?","Why do some people find it hard to accept advice?","Is it a good idea to take advice from the internet and social media?"]},{"id":"p2-conversation","topic":"An interesting conversation","vi":"Một cuộc trò chuyện thú vị","card":"Describe an interesting conversation you had with someone.","bullets":["who you talked to","when and where it happened","what you talked about"],"last":"and explain why you found the conversation interesting.","part3":["What topics do people in your country usually talk about with strangers?","Do you think people talk face to face less than they did in the past?","What makes someone a good listener?","How will online communication affect people's social skills in the future?"]},{"id":"p2-team","topic":"A time you worked in a team","vi":"Một lần bạn làm việc nhóm","card":"Describe a time when you worked with other people as part of a team.","bullets":["what the team had to do","who was in the team","what your role was","what the result was"],"last":"and explain how you felt about working in that team.","part3":["Why do many companies and research groups prefer teamwork?","What problems can happen when people work in teams?","Is a good leader more important than good team members?","Do you think people will work more remotely and less in teams in the future?"]}],"tips":{"p1":["Trả lời dài khoảng 2–4 câu: đừng chỉ nói Yes/No, nhưng cũng đừng nói quá dài như Part 3.","Dùng công thức đơn giản: câu trả lời trực tiếp + lý do + một ví dụ hoặc chi tiết cá nhân.","Không học thuộc câu trả lời mẫu: giám khảo nhận ra ngay và có thể hạ điểm. Hãy nói về cuộc sống thật của bạn ở Hàn Quốc và công việc nghiên cứu.","Chú ý thì của động từ theo câu hỏi: hỏi về quá khứ (as a child) thì dùng thì quá khứ, hỏi về tương lai thì dùng would/will/be going to.","Nếu không biết nhiều về chủ đề, cứ thành thật nói vậy rồi giải thích vì sao, ví dụ: I'm not really into sport, because..."],"p2":["Tận dụng 1 phút chuẩn bị: chỉ ghi từ khóa (không viết câu đầy đủ) cho từng gạch đầu dòng trên thẻ.","Đi theo thứ tự các gạch đầu dòng trên thẻ để bài nói có cấu trúc rõ ràng và không bị quên ý.","Dùng khung thời gian: bối cảnh/quá khứ (chuyện gì đã xảy ra) → hiện tại (bây giờ thế nào) → cảm xúc và ý nghĩa (phần and explain).","Dành nhiều thời gian cho dòng cuối and explain..., vì đây là phần thể hiện được từ vựng và khả năng giải thích tốt nhất.","Cố gắng nói đủ 2 phút: nếu hết ý, hãy thêm chi tiết về thời gian, địa điểm, con người, hoặc so sánh với một trải nghiệm khác.","Có thể chọn câu chuyện gần gũi (phòng thí nghiệm, cuộc sống ở Hàn Quốc) và hơi điều chỉnh cho hợp đề; điều quan trọng là nói trôi chảy, không phải câu chuyện phải hoàn toàn đúng sự thật."],"p3":["Trả lời theo cấu trúc: ý kiến + lý do + ví dụ + mặt trái/so sánh (However, on the other hand...).","Part 3 hỏi về xã hội và con người nói chung, nên dùng chủ ngữ như people, young people, many families thay vì chỉ nói về bản thân.","Dùng ngôn ngữ rào đón để nghe tự nhiên và học thuật hơn: I would say..., It seems to me that..., It probably depends on...","Với câu hỏi so sánh quá khứ và hiện tại, dùng cấu trúc used to / In the past... whereas nowadays... để thể hiện ngữ pháp đa dạng.","Với câu hỏi về tương lai, dùng will probably, might, I expect that... và đưa ra lý do vì sao bạn dự đoán như vậy.","Nếu chưa hiểu câu hỏi, hãy lịch sự đề nghị giám khảo nhắc lại hoặc giải thích (Could you rephrase that, please?); nếu cần thời gian suy nghĩ, dùng That's an interesting question... thay vì im lặng."],"phrases":[{"en":"To be honest, ...","vi":"Thành thật mà nói... – mở đầu câu trả lời một cách tự nhiên, nhất là khi nói điều bất ngờ.","part":"p1"},{"en":"I'd say that ...","vi":"Tôi cho rằng... – đưa ra câu trả lời nhẹ nhàng, không quá khẳng định.","part":"p1"},{"en":"It depends on ...","vi":"Còn tùy vào... – khi câu trả lời không phải lúc nào cũng giống nhau.","part":"p1"},{"en":"I'm not really into ..., but ...","vi":"Tôi không thích ... lắm, nhưng... – khi chủ đề không phải sở thích của bạn.","part":"p1"},{"en":"Back when I was in Vietnam, ...","vi":"Hồi tôi còn ở Việt Nam... – so sánh trải nghiệm trước và sau khi sang Hàn Quốc.","part":"p1"},{"en":"I'd like to talk about ...","vi":"Tôi muốn nói về... – câu mở đầu bài nói Part 2.","part":"p2"},{"en":"This happened about two years ago, when ...","vi":"Chuyện này xảy ra khoảng hai năm trước, khi... – đặt bối cảnh thời gian cho câu chuyện.","part":"p2"},{"en":"What I remember most is ...","vi":"Điều tôi nhớ nhất là... – nhấn mạnh chi tiết quan trọng trong câu chuyện.","part":"p2"},{"en":"Looking back, I realise that ...","vi":"Nhìn lại, tôi nhận ra rằng... – chuyển sang phần cảm xúc, ý nghĩa (and explain...).","part":"p2"},{"en":"The main reason why ... is that ...","vi":"Lý do chính khiến... là... – trả lời dòng and explain why trên thẻ.","part":"p2"},{"en":"That's an interesting question. Let me think ...","vi":"Câu hỏi thú vị đấy, để tôi nghĩ một chút... – câu lấp khoảng trống khi cần thời gian suy nghĩ.","part":"p3"},{"en":"One reason is that ...","vi":"Một lý do là... – đưa ra lý do cho ý kiến của bạn.","part":"p3"},{"en":"For instance, in my country, ...","vi":"Ví dụ, ở nước tôi... – minh họa ý kiến bằng ví dụ thực tế.","part":"p3"},{"en":"On the other hand, ...","vi":"Mặt khác... – chuyển sang ý trái ngược để câu trả lời cân bằng hơn.","part":"p3"},{"en":"In the past, ... whereas nowadays ...","vi":"Ngày xưa... trong khi ngày nay... – dùng cho câu hỏi so sánh quá khứ và hiện tại.","part":"p3"},{"en":"I expect that, in the future, ... will probably ...","vi":"Tôi nghĩ rằng trong tương lai... có lẽ sẽ... – dự đoán tương lai một cách thận trọng.","part":"p3"}]}};

let pending=0;
function callRaw(fn,args,quiet){
  pending++;
  /* đọc gói nội dung (getPack/getPacks) tự thử lại tối đa 2 lần khi lỗi mạng/máy chủ chậm; PIN sai hoặc không có file thì không thử lại */
  const tries=(fn==="getPack"||fn==="getPacks")?3:1;
  const once=()=>new Promise((res,rej)=>{
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](PIN,...args);
  });
  const run=async n=>{
    try{return await once()}
    catch(e){const m=(e&&e.message)||String(e);
      if(n<tries&&!/PIN_SAI|CHUA_DAT_PIN|Không tìm thấy|không hợp lệ|NO_KEY/.test(m)){await new Promise(r=>setTimeout(r,700*n));return run(n+1)}
      throw e}
  };
  return run(1).then(r=>{pending--;return r},e=>{pending--;const m=(e&&e.message)||String(e);
      if(m.includes("PIN_SAI"))showPin("PIN không đúng.");
      else if(m.includes("CHUA_DAT_PIN"))showPin("Chưa đặt PIN: vào Apps Script → Project Settings → Script Properties, thêm PIN.");
      else if(!quiet&&!m.includes("NO_KEY"))toast("Chưa lưu được: "+m.replace(/^Error:\s*/,""),true);
      throw e});
}

function drawLinks(){

    const seg=`M${x1} ${y1} C${x1} ${my} ${x2} ${my} ${x2} ${y2} `;

let S=null;
function stepper(phase){
  const learn=S.L.checkpoint||S.review?null:phase==="learn";
  if(learn===null)return `<div class="stepper"><div class="st on"><i>${phase==="result"?"✓":"01"}</i>${S.review?"Ôn tập":"Bài kiểm tra"}</div></div>`;
  return `<div class="stepper"><div class="st ${learn?"on":"done"}"><i>${learn?"01":"✓"}</i>Phần học</div><div class="ln ${learn?"":"on"}"></div><div class="st ${learn?"":"on"}"><i>02</i>Bài kiểm tra</div></div>`;
}
function studyFrame(phase,body){
  $("study").innerHTML=`<div class="study-top"><div class="in"><button class="quit" id="s-quit">${I.x.replace('viewBox','width="14" height="14" viewBox')} Thoát</button>${stepper(phase)}<span style="width:72px"></span></div></div><div class="study-body">${body}</div>`;
}
function startStudy(key,quizOnly,theory){
  const L=findLesson(key);
  if(!L)return toast("Không tìm thấy bài này.",true);
  if(L.kind==="vocab"&&!L.checkpoint&&!(L.words&&L.words.length))return toast("Chặng này chưa có từ (có thể chưa tải xong). Thử lại sau vài giây.",true);
  S={L,phase:"learn",xp:0,flipped:false,remember:{},seen:new Set()};S.level=L.kind==="grammar"?gLevel(L.unit.n):1;FX.reset();
  if(L.kind==="vocab"&&!L.checkpoint){S.queue=[...L.words];S.total=L.words.length;S.done=0;S.timeLeft=L.words.length*90;S.tick=setInterval(()=>{if(S&&S.phase==="learn"&&S.timeLeft>0){S.timeLeft--;const t=$("s-time");if(t)t.textContent=mmss(S.timeLeft)}},1000)}
  if(L.kind==="grammar"){S.slide=0;S.slides=[...L.unit.points.map(p=>({t:"point",p})),{t:"mist"}]}
  $("study").hidden=false;document.body.style.overflow="hidden";
  if(quizOnly||L.checkpoint||(S.level>1&&!theory))showIntro();else showLearn();
}
const mmss=s=>Math.floor(s/60)+":"+pad(s%60);
function hiWord(sent,w){const re=new RegExp("("+w.trim().split(/\s+/).map(t=>reEsc(esc(t))+"\\w*").join("\\s+")+")","i");return esc(sent).replace(re,"<mark>$1</mark>")}

function ridge(){return `<svg class="ridge" viewBox="0 0 300 120" preserveAspectRatio="none"><path d="M0 120 L70 60 L110 85 L170 25 L215 70 L250 50 L300 90 L300 120Z" fill="rgba(255,175,31,.9)"/><path d="M0 120 L90 80 L140 100 L200 55 L260 95 L300 80 L300 120Z" fill="rgba(255,255,255,.08)"/></svg>`}
function flipCard(){const f=$("flip");if(!f)return;S.flipped=!f.classList.contains("flipped");f.classList.toggle("flipped");if(S.flipped){$("j-again").disabled=false;$("j-ok").disabled=false;$("j-hint").textContent="Chọn mức độ ghi nhớ để sang thẻ tiếp theo."}}
function judge(ok){
  if(ok)FX.soft($("j-ok"));else FX.buzz(15);

function showIntro(){
  S.phase="intro";
  if(S.L.kind==="grammar"&&!S.xpLearned){S.xp+=10;S.xpLearned=true}
  const n=S.L.custom?customN():S.L.checkpoint?20:16;
  studyFrame("quiz",`<div class="intro-card"><span class="big-ok">${I.check}</span><div style="display:flex;flex-direction:column;gap:10px">
   <span class="tiny" style="font-weight:700;color:var(--bad)">${S.L.custom?"Ôn tập: "+esc(S.L.title):S.L.checkpoint?"Kiểm tra cuối chủ đề":(S.level>1?"Thử thách mức "+GLV[S.level-1]:"Phần học đã hoàn thành")}</span><div class="h1" style="font-size:clamp(28px,5vw,40px)">Bài kiểm tra ${S.L.kind==="grammar"?"ngữ pháp":"từ vựng"}</div>

   <div class="rule"><b>${S.level===3?"12 giây/câu chọn · 25 giây/câu gõ.":S.level===2?"15 giây/câu chọn · 25 giây/câu gõ.":"20 giây/câu chọn · 30 giây/câu điền."}</b> Hết giờ tính là sai.${S.level>1?" Nhiều câu phải gõ đáp án thay vì chọn.":""}</div>
   <div class="intro-stats"><div><b>${n}</b><span>câu hỏi</span></div>${S.L.custom?"":`<div><b>${S.level===3?90:80}%</b><span>yêu cầu tối thiểu</span></div>`}</div></div></div>
   <div style="display:flex;justify-content:center"><button class="btn primary" id="q-begin" data-autofocus>Làm bài kiểm tra ${I.arrow}</button></div>`);

/* --- tạo câu hỏi --- */
function vocabQuestions(words,pool,n){
  const canL=canSpeak();
  const types=["mean","word","cloze","listen","syn"];
  let list=[];let round=0;
  while(list.length<n){shuffle(words).forEach(w=>{if(list.length<n)list.push({w,t:types[(round+list.length)%types.length]})});round++}
  return shuffle(list).map((x,i)=>makeVQ(x.w,x.t,pool,canL,i));
}
function distract(w,pool,key,k=3){return shuffle(pool.filter(p=>p.w!==w.w&&p[key]&&p[key]!==w[key])).slice(0,k).map(p=>p[key])}
function clozeOf(w,sents){for(const s of sents){const re=new RegExp("\\b("+reEsc(w).replace(/\s+/g,"\\s+")+"(?:s|es|d|ed|ing)?)\\b","i");const m=s.match(re);if(m)return {before:s.slice(0,m.index),after:s.slice(m.index+m[0].length),ans:m[1]}}return null}
function makeVQ(w,t,pool,canL,i){
  const id=w.w;
  if(t==="syn"&&!w.syn)t="word";
  if(t==="listen"&&!canL)t="mean";
  if(t==="cloze"){const c=clozeOf(w.w,shuffle(w.ex||[]));if(c)return {id,ref:w,type:"fill",sent:true,html:`${esc(c.before)}<span class="gap"></span>${esc(c.after)}`,hint:`Gợi ý: ${w.vi}, bắt đầu bằng "${c.ans[0]}"`,answers:[c.ans,w.w],show:c.ans,why:`"${w.w}" nghĩa là "${w.vi}".`,time:30};t="word"}
  if(t==="mean"){const o=shuffle([w.vi,...distract(w,pool,"vi")]);return {id,ref:w,type:"mcq",html:`“${esc(w.w)}” có nghĩa là gì?`,opts:o,ans:o.indexOf(w.vi),why:`"${w.w}" nghĩa là "${w.vi}". Ví dụ: ${(w.ex||[])[0]||""}`,time:20}}
  if(t==="listen"){const o=shuffle([w.w,...distract(w,pool,"w")]);return {id,ref:w,type:"mcq",listen:w.w,html:`Nghe và chọn từ đúng`,opts:o,ans:o.indexOf(w.w),why:`Bạn vừa nghe "${w.w}" (${w.vi}).`,time:20}}
  if(t==="syn"){const o=shuffle([w.w,...distract(w,pool,"w")]);return {id,ref:w,type:"mcq",html:`Từ nào gần nghĩa nhất với “${esc(w.syn)}”?`,opts:o,ans:o.indexOf(w.w),why:`"${w.syn}" ≈ "${w.w}" (${w.vi}).`,time:20}}
  const o=shuffle([w.w,...distract(w,pool,"w")]);return {id,ref:w,type:"mcq",html:`Từ nào có nghĩa là “${esc(w.vi)}”?`,opts:o,ans:o.indexOf(w.w),why:`"${w.vi}" là "${w.w}". Ví dụ: ${(w.ex||[])[0]||""}`,time:20};
}
function grammarQuestions(u,idx,lv){
  lv=lv||1;
  const tm=lv===3?{m:12,f:25}:lv===2?{m:15,f:25}:{m:20,f:30};
  return (idx||u.quiz.map((_,i)=>i)).map(i=>{const q=u.quiz[i],id=`g${u.n}:${i}`,gap=/___/.test(q.q);
    if(q.t==="mcq"){
      const a=q.o[q.a];
      if(gap&&lv>1&&(lv===3||Math.random()<.5)&&a&&a.length<=40&&!/[()–—]|no article|nothing|^-+$/i.test(a))
        return {id,type:"fill",sent:true,html:esc(q.q).replace("___",'<span class="gap"></span>'),hint:"Gõ từ hoặc cụm còn thiếu",answers:[a],show:a,why:q.why,time:tm.f};
      const order=shuffle(q.o.map((o,j)=>j));return {id,type:"mcq",sent:gap,html:esc(q.q).replace("___",'<span class="gap"></span>'),opts:order.map(j=>q.o[j]),ans:order.indexOf(q.a),why:q.why,time:tm.m}}
    return {id,type:"fill",sent:true,html:esc(q.q).replace("___",'<span class="gap"></span>'),answers:q.a,show:q.a[0],why:q.why,time:tm.f}});
}
/* --- chạy bài kiểm tra --- */
function startQuiz(){
  const L=S.L;S.phase="quiz";
  if(S.review)S.qs=S.qs||[];
  else if(L.kind==="grammar")S.qs=shuffle(grammarQuestions(L.unit,null,S.level));
  else if(L.custom)S.qs=vocabQuestions(L.words,L.topic.words,customN());
  else S.qs=vocabQuestions(L.words,L.topic.words,L.checkpoint?20:16);
  S.qi=0;S.answers=[];S.firstOk={};
  showQ();
}
let qTimer=null;
function showQ(){
  const q=S.qs[S.qi];S.answered=false;
  const n=S.qs.length;
  studyFrame(S.review?"result":"quiz",`
   <div class="qhd"><div><div class="tiny">${S.review==="wl"?esc(S.wlTitle||"Xưởng từ"):S.review?"Ôn tập":"Bài kiểm tra "+(S.L.kind==="grammar"?"ngữ pháp":"từ vựng")} · Câu ${S.qi+1}/${n}${q.retry?" · làm lại câu sai":""}</div>

   ${q.listen?`<div><button class="btn primary" data-say="${esc(q.listen)}" id="q-listen">${I.sound} Nghe lại</button></div>`:""}
   ${q.type==="mcq"?`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-opt="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`
     :`<form class="fill" id="q-fill" autocomplete="off"><input class="inp" id="q-in" autocapitalize="off" spellcheck="false" placeholder="Gõ đáp án" aria-label="Đáp án"><button class="btn primary" id="q-sub" disabled>Kiểm tra</button></form>`}
   <div id="q-fb"></div>
   <div class="keys">${q.type==="mcq"?"<span><kbd>A</kbd>–<kbd>D</kbd> chọn đáp án</span>":"<span><kbd>Enter</kbd> kiểm tra</span>"}<span><kbd>Enter</kbd> câu tiếp theo</span></div>`);
  if(q.listen)setTimeout(()=>speak(q.listen),250);
  const inp=$("q-in");if(inp){inp.focus();inp.addEventListener("input",()=>{$("q-sub").disabled=!inp.value.trim()})}
  clearInterval(qTimer);const t0=Date.now(),T=q.time*1000;
  qTimer=setInterval(()=>{if(!S||S.answered){clearInterval(qTimer);return}const left=Math.max(0,T-(Date.now()-t0));const s=Math.ceil(left/1000);const el=$("qt");if(!el)return;el.textContent="0:"+pad(s);$("qbar").style.width=(left/T*100)+"%";$("qtime").classList.toggle("low",s<=7);if(left<=0){clearInterval(qTimer);answer(null)}},100);
}
function answer(given){
  const q=S.qs[S.qi];if(S.answered)return;S.answered=true;clearInterval(qTimer);
  let ok=false,near=false;
  if(given===null)ok=false;
  else if(q.type==="mcq")ok=given===q.ans;
  else{const a=norm(given);ok=q.answers.some(x=>norm(x)===a);if(!ok&&q.answers.some(x=>norm(x).length>=6&&lev(norm(x),a)<=1)){ok=true;near=true}}
  if(q.type==="mcq")document.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(i===q.ans)b.classList.add("right");else if(i===given)b.classList.add("wrong")});
  else{$("q-in").disabled=true;$("q-sub").disabled=true}
  S.answers.push({q,ok,given});
  if(!q.retry)S.firstOk[q.id]=(q.id in S.firstOk?S.firstOk[q.id]:true)&&ok;
  if(ok)S.xp+=q.retry?5:10;
  // ôn tập: câu sai quay lại cuối lượt, tối đa 2 lần nữa (từ khó luôn được luyện tới khi đúng)
  if(!ok&&S.review&&(q.retry||0)<2){S.qs.push({...q,retry:(q.retry||0)+1})}
  const right=q.type==="mcq"?q.opts[q.ans]:q.show;
  {const opts=document.querySelectorAll(".opt"),el=q.type==="mcq"?opts[given]:$("q-in");
   if(ok)FX.ok(el||$("q-fb"),"✓");else FX.bad(el||$("q-in"),q.type==="mcq"?opts[q.ans]:null)}
  $("q-fb").innerHTML=`<div class="fbk ${ok?"good":"bad"}"><span class="ic">${ok?I.check:I.x}</span><div><b>${ok?(near?"Gần đúng, chú ý chính tả: "+esc(right):"Chính xác."):given===null?"Hết giờ. Đáp án đúng: "+esc(right):"Chưa chính xác. Đáp án đúng: "+esc(right)}</b><span>${esc(q.why||"")}</span></div><button class="btn primary" id="q-next">${S.qi+1<S.qs.length?"Câu tiếp theo →":"Xem kết quả →"}</button></div>`;
  $("q-next").focus();
}
function nextQ(){S.qi++;if(S.qi>=S.qs.length)finishQuiz();else showQ()}
function finishQuiz(){
  S.phase="result";clearInterval(S.tick);
  const firsts=S.answers.filter(a=>!a.q.retry);
  const correct=firsts.filter(a=>a.ok).length,total=firsts.length,score=Math.round(correct/Math.max(1,total)*100);
  if(S.review)return finishReview(correct,total,score);
  if(S.L.custom)return finishCustom(correct,total,score);
  const L=S.L,lv=L.kind==="grammar"?(S.level||1):1,pk=lv>1?gKey(L.unit.n,lv):L.key,pass=score>=(lv===3?90:80),wasPassed=passed(pk),rk0=L.kind==="grammar"?gRank(L.unit.n):0,ov0=L.kind==="grammar"?gOverall():0;
  const wrongIds=firsts.filter(a=>!a.ok).map(a=>a.q.id);
  // mét do máy chủ tính từ số câu đúng / số thẻ nhớ; học lại chặng đã qua không cộng mét
  const payload={key:pk,pass,score,correct,answered:total,cards:S.cards||0,slides:!!S.xpLearned,wrong:L.kind==="grammar"&&lv===1?wrongIds:[],
    words:L.kind==="vocab"?(L.checkpoint?[]:L.words.map(w=>({word:w.w,meaning:`${w.vi} (${w.pos})`,example:w.ex[0],source:`${L.topic.en} ${L.no}`,remember:S.remember[w.w]!==false&&!wrongIds.includes(w.w)}))):[]};
  // cập nhật ngay trên máy
  const prev=progress[pk];progress[pk]={status:pass||wasPassed?"passed":"tried",best:Math.max(score,prev?prev.best:0),attempts:(prev?prev.attempts:0)+1,wrong:payload.wrong,updated:todayISO};
  save("saveLessonResult",payload).then(r=>{applyR(r);showEarned(r);if(!S)render()}).catch(earnFail);
  const C=2*Math.PI*74;
  const wrongs=firsts.filter(a=>!a.ok);
  const next=pass?(L.kind==="grammar"?nextGrammar():nextVocab()):null;
  studyFrame("result",`<div class="result">
    <div class="score-ring"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="74" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="85" cy="85" r="74" fill="none" stroke="${pass?"var(--ok)":"var(--bad)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-score/100)}" style="transition:stroke-dashoffset .8s"/></svg><div class="v num">${score}%</div></div>
    <span class="tiny" style="font-weight:700;color:${pass?"var(--ok)":"var(--bad)"}">${pass?"Đã qua chặng":"Chưa đạt "+(lv===3?90:80)+"%"}</span>
    <div class="h1">${pass?(wasPassed?"Ôn lại tốt":lv>1?"Vượt thử thách mức "+GLV[lv-1]:"Mở khóa chặng tiếp theo"):"Ôn lại rồi thử lần nữa"}</div>
    <p class="lead">Đúng ${correct}/${total} câu · ${earnedHTML()}${wasPassed?" (học lại chặng đã qua: ôn tốt nhưng không cộng mét)":""}${pass&&L.kind==="vocab"&&!L.checkpoint?" · các từ đã được thêm vào sổ Ôn tập":""}</p>
    ${wrongs.length?`<div class="wrongs"><div class="lbl" style="background:none;border:0;padding:0">Câu sai cần nhớ</div>${wrongs.map(a=>`<div><span style="color:var(--bad)">✗</span><span><b>${esc(a.q.type==="mcq"?a.q.opts[a.q.ans]:a.q.show)}</b> <span class="muted">${esc(a.q.why||"")}</span></span></div>`).join("")}</div>`:""}
    <div class="row" style="justify-content:center;gap:10px;width:100%">${pass?`<button class="btn" id="r-done">Về lộ trình</button>${next?`<button class="btn primary" data-start-next="${next.key}">Bài tiếp theo ${I.arrow}</button>`:""}`:`<button class="btn" id="r-relearn">Ôn lại phần học</button><button class="btn primary" id="r-retry">Làm lại bài kiểm tra</button>`}</div>
    ${fricBtn("lesson")}
  </div>`);
  FX.ring();
  if(L.kind==="grammar")rankCheck(L.unit.n,rk0,ov0);
  if(pass)FX.celebrate(score===100?1.4:1,score===100?`<span class="fl">💯</span>Tuyệt đối!`:(!wasPassed?`<span class="fl">⛰</span>Qua chặng`:""));
}
function quitStudy(force){
  if(!force&&S&&(S.phase==="quiz"||(S.phase==="learn"&&S.done>0))&&!confirm("Thoát bài học? Tiến trình bài này chưa được lưu."))return;
  clearInterval(qTimer);if(S)clearInterval(S.tick);S=null;try{speechSynthesis.cancel()}catch(e){}

$("study").addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("#s-quit"))return quitStudy(S&&S.phase==="result");
  if(t.closest("[data-say]"))return;
  if(t.closest("#flip"))return flipCard();
  if(t.closest("#j-again"))return judge(false);
  if(t.closest("#j-ok"))return judge(true);
  if(t.closest("#sl-prev")){S.slide=Math.max(0,S.slide-1);return showSlide()}
  if(t.closest("#sl-next")){if(S.slide<S.slides.length-1){S.slide++;return showSlide()}return showIntro()}
  if(t.closest("#q-begin"))return startQuiz();
  const o=t.closest("[data-opt]");if(o&&!S.answered)return answer(+o.dataset.opt);
  if(t.closest("#q-next"))return nextQ();
  if(t.closest("#r-done"))return quitStudy(true);
  if(t.closest("#r-retry")){S.xp=0;S.cards=0;return startQuiz()}

});

document.addEventListener("keydown",e=>{
  if(!S||$("study").hidden)return;

});

const VI=/[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i;
const VI_PLAIN=new Set(["tham","gia","chi","cho","nhanh","sinh","trong","khi","thanh","kinh","trinh","nghi","phi","vien","tranh","hoa","giao","ngoai","nhan","khach","xanh","quan","chinh","doanh","thanh"]);
function parseBulk(text){
  const out=[];
  text.split(/\n/).map(l=>l.replace(/\s+$/,"")).forEach(raw=>{
    const l=raw.trim();if(!l)return;
    if(/[A-Za-zÀ-ỹ]/.test(l)&&l===l.toUpperCase())return; // tiêu đề, dòng header
    let w="",m="";
    const seps=["\t"," – "," — "," - ",": "];
    if(VI.test(l)){const parts=l.split(/\s+/);let i=parts.findIndex(p=>VI.test(p));
      while(i>1&&VI_PLAIN.has(parts[i-1].toLowerCase()))i--;
      w=parts.slice(0,i).join(" ").replace(/\s*[-–—:=]+\s*$/,"");m=parts.slice(i).join(" ")}
    else if(seps.some(x=>l.includes(x))){const s=seps.find(x=>l.includes(x)),i=l.indexOf(s);w=l.slice(0,i);m=l.slice(i+s.length)}
    else if(l.includes(" = ")){const i=l.indexOf(" = ");w=l.slice(0,i);m="= "+l.slice(i+3)}
    else if(/\S {2,}\S/.test(l)){const i=l.search(/ {2,}/);w=l.slice(0,i);m=l.slice(i).trim()}
    else w=l;
    w=w.replace(/^[-•*\d.)\s]+/,"").replace(/\s*\((n|v|adj|adv)\)\s*$/i,"").trim();m=m.trim();
    const prev=out[out.length-1];
    if(prev&&!m&&!/[-–—:=\t]/.test(l)&&w.split(" ").length<=3&&/=\s*(\S+\s?){1,4}$/.test(prev.word)){prev.word+=" "+w;return}
    if(w&&w.length<=80)out.push({word:w,meaning:m});
  });
  return out;
}

function renderBulk(){
  const list=parseBulk($("b-text").value),have=new Set(vocab.map(v=>v.word.toLowerCase())),fresh=list.filter(x=>!have.has(x.word.toLowerCase()));
  $("b-add").disabled=!fresh.length;$("b-add").textContent=fresh.length?`Thêm ${fresh.length} từ vào sổ`:"Thêm vào sổ";
  $("b-preview").innerHTML=list.length?`<div class="tiny muted" style="margin-bottom:6px">Đọc được ${list.length} dòng${list.length-fresh.length?`, ${list.length-fresh.length} từ đã có`:""}. Kiểm tra cách tách trước khi thêm:</div><div class="wlist" style="border:1px solid var(--line);border-radius:12px;max-height:240px;overflow:auto">${list.slice(0,40).map(x=>`<div class="wrow" style="grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)"><div class="w">${esc(x.word)}</div><div class="m">${x.meaning?esc(x.meaning):'<span style="color:var(--bad)">chưa có nghĩa, sẽ không vào bài ôn</span>'}</div></div>`).join("")}</div>`:"";
}
function bulkAdd(){

function srsQ(v,pool,force){
  const w={w:v.word,vi:v.meaning,ex:v.example?[v.example]:[],syn:"",id:v.id};
  const P=pool.map(p=>({w:p.word,vi:p.meaning}));
  const t=force?force:v.box<=0?"mean":v.box<=1?(Math.random()<.5?"mean":"word"):v.box<=3?["word","cloze","type"][Math.floor(Math.random()*3)]:["cloze","type"][Math.floor(Math.random()*2)];
  let q;
  if(t==="type")q={id:v.id,ref:w,type:"fill",html:`Gõ từ tiếng Anh có nghĩa: “${esc(v.meaning)}”`,hint:`Bắt đầu bằng "${v.word[0]}", ${v.word.length} ký tự`,answers:[v.word],show:v.word,why:"",time:30};
  else q=makeVQ(w,t,P,false,0);
  q.id=v.id;return q;
}
function startReview(kind){
  if(kind==="grammar"){
    const gw=grammarWrong();if(!gw.length)return;
    const qs=shuffle(gw).slice(0,16).map(({u,i})=>grammarQuestions(u,[i])[0]);
    S={L:{key:"rv-g",kind:"grammar",checkpoint:true},review:"grammar",phase:"quiz",xp:0,qs};
  }else{
    const pool=vocab.filter(v=>v.meaning);if(pool.length<4)return toast("Cần ít nhất 4 từ có nghĩa trong sổ.",true);
    let list;
    if(kind==="hard"){list=hardWords().slice(0,10);if(!list.length)return toast("Không có từ khó nào. Tốt!")}
    else{const d=dueWords();list=[...shuffle(d.filter(isHard)),...shuffle(d.filter(v=>!isHard(v)))].slice(0,12);if(!list.length)return toast("Hôm nay không còn từ đến hạn.")}
    // từ khó: hỏi 2 lần, một câu nhận nghĩa và một câu tự gõ/điền từ; sai câu nào cũng tính là chưa nhớ
    const qs=[];list.forEach(v=>{if(isHard(v)){qs.push(srsQ(v,pool,Math.random()<.5?"mean":"word"));qs.push(srsQ(v,pool,v.example&&Math.random()<.5?"cloze":"type"))}else qs.push(srsQ(v,pool))});
    S={L:{key:"rv-v",kind:"vocab",checkpoint:true},review:kind==="hard"?"hard":"vocab",phase:"quiz",xp:0,qs:kind==="hard"?shuffle(qs):qs};
    S.qs=spreadPairs(qs);
  }
  $("study").hidden=false;document.body.style.overflow="hidden";
  S.qi=0;S.answers=[];S.firstOk={};showQ();
}
// tách hai câu của cùng một từ ra xa nhau để không nhìn câu trước đoán câu sau
function spreadPairs(qs){const out=shuffle(qs);for(let i=1;i<out.length;i++)if(out[i].id===out[i-1].id){const j=out.findIndex((q,k)=>k>i&&q.id!==out[i].id&&(k+1>=out.length||out[k+1].id!==out[i].id));if(j>0)[out[i],out[j]]=[out[j],out[i]]}return out}
function finishReview(correct,total,score){
  const done=r=>{applyR(r);showEarned(r)};
  let use=null;
  if(S.review==="wl"){finishWL(correct,total).then(done).catch(earnFail);ls.set(S.wlMode==="mat"?"ielts-matdrill-day":"ielts-wl-day",todayISO)}
  else if(S.review==="vocab"||S.review==="hard"){
    const results=Object.keys(S.firstOk).map(id=>({id,ok:S.firstOk[id]}));
    // từ đã quen (hộp 3+) và vừa nhớ đúng: mời tự viết một câu để biến "nhận ra" thành "dùng được"
    use=pickUsage(results.filter(r=>r.ok).map(r=>r.id));
    save("saveLesson",{kind:"review",results,correct,answered:total}).then(done).catch(earnFail);
  }else{
    // câu đã làm đúng thì bỏ khỏi danh sách sai của unit
    const fixed=new Set(Object.keys(S.firstOk).filter(id=>S.firstOk[id]));
    GUNITS.forEach(u=>{const k="g"+u.n,p=progress[k];if(p&&p.wrong&&p.wrong.some(id=>fixed.has(id))){p.wrong=p.wrong.filter(id=>!fixed.has(id));call("saveLessonResult",{key:k,fix:true,wrong:p.wrong}).catch(()=>{})}});
    save("saveLesson",{kind:"gwrong",results:[],correct,answered:total}).then(done).catch(earnFail);
  }
  const C=2*Math.PI*74,isV=S.review==="vocab"||S.review==="hard";
  studyFrame("result",`<div class="result"><div class="score-ring"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="74" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="85" cy="85" r="74" fill="none" stroke="var(--ok)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-score/100)}"/></svg><div class="v num">${score}%</div></div>
   <div class="h1">${S.review==="hard"?"Xong lượt ôn kỹ từ khó":"Xong lượt ôn"}</div><p class="lead">Đúng ngay lần đầu ${correct}/${total} câu · ${earnedHTML()}</p>${S.review==="hard"?`<p class="hint" style="margin:0">Ôn kỹ ngoài lịch chỉ cộng mét cho từ đã đến hạn. Từ sai lần này quay lại ngày mai; từ đúng giữ nguyên lịch ôn.</p>`:""}
   ${use?usageHTML(use):""}
   <div class="wrongs">${S.answers.filter(a=>!a.q.retry).map(a=>`<div ${isV?'style="grid-template-columns:auto 1fr auto"':""}><span style="color:${a.ok?"var(--ok)":"var(--bad)"}">${a.ok?"✓":"✗"}</span><span><b>${esc(a.q.type==="mcq"?a.q.opts[a.q.ans]:a.q.show)}</b> <span class="muted">${esc(a.q.ref?a.q.ref.vi:a.q.why||"")}</span>${isV&&!a.ok?` <span class="hardchip">thành từ khó · ôn lại ngày mai</span>`:""}</span>${isV?`<button class="edit" data-wedit="${esc(a.q.id)}" aria-label="Sửa từ">✎</button>`:""}</div>`).join("")}</div>
   <button class="btn primary" id="rv-done">Xong</button>${fricBtn("review")}</div>`);
  FX.ring();if(total&&correct===total)FX.celebrate(.9,`<span class="fl">✅</span>Ôn sạch hết`);
}

/* ================= Viết ================= */
function copiedFrom(prompt,text){
  // các đoạn ≥4 từ liền nhau chép nguyên từ đề
  const tok=s=>(s.toLowerCase().match(/[a-z0-9']+/g)||[]);
  const P=tok(prompt),A=tok(text);if(P.length<4||A.length<4)return {n:0,runs:[]};
  const grams=new Set();for(let i=0;i+4<=P.length;i++)grams.add(P.slice(i,i+4).join(" "));
  const cov=new Array(A.length).fill(false);
  for(let i=0;i+4<=A.length;i++)if(grams.has(A.slice(i,i+4).join(" ")))for(let j=i;j<i+4;j++)cov[j]=true;
  const runs=[];let s=-1;
  for(let i=0;i<=A.length;i++){if(i<A.length&&cov[i]){if(s<0)s=i}else if(s>=0){runs.push(A.slice(s,i).join(" "));s=-1}}
  return {n:cov.filter(Boolean).length,runs:runs.sort((a,b)=>b.length-a.length)};
}
function analyze(text,task,prompt){
  const T=TASKS[task];const t=text.trim();
  const wc=(t.match(/\S+/g)||[]).length;
  const paras=t.split(/\n+/).map(s=>s.trim()).filter(Boolean).length;
  const sents=t.split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>/[a-z]/i.test(s));
  const lower=" "+t.toLowerCase().replace(/[^a-z0-9'\s-]/g," ").replace(/\s+/g," ")+" ";
  const has=(w)=>(lower.match(new RegExp("\\b"+reEsc(w)+"\\b","g"))||[]).length;
  const out=[];
  if(!wc)return out;
  const cp=copiedFrom(prompt||"",t), own=wc-cp.n;
  // chép đề
  if(prompt&&prompt.trim().length>20){
    const lim=task==="intro"?6:10;
    out.push(cp.n>=lim||(cp.runs[0]&&cp.runs[0].split(" ").length>=8)?{s:task==="intro"?"bad":"warn",t:`Chép nguyên ${cp.n} từ từ đề bài`,d:`Phần chép từ đề không được tính điểm. Viết lại bằng từ của mày: "${cp.runs.slice(0,2).join('", "')}"`}:{s:"ok",t:"Không chép nguyên văn từ đề"});
  }
  // số từ
  if(task!=="intro"){
    const lenNote=cp.n>=10?` (không tính ${cp.n} từ chép đề: ${own})`:"";
    out.push(own<T.min?{s:"bad",t:`${wc} từ${lenNote}, thiếu so với ${T.min}`,d:"Bài thiếu số từ tối thiểu bị trừ điểm Trả lời đề. Từ chép nguyên văn từ đề không được tính."}:wc>T.max?{s:"warn",t:`${wc} từ, dài hơn cần thiết`,d:task==="task2"?"Mức tốt nhất là 260–300 từ. Viết dài hơn không được thêm điểm, mất thời gian soát lỗi và dễ lạc đề.":"Viết dài hơn không được thêm điểm, chỉ tăng nguy cơ sai."}:{s:"ok",t:`${wc} từ${lenNote}, đủ độ dài`});
  }else out.push(wc<25?{s:"warn",t:`${wc} từ, hơi ngắn`,d:"Mở bài nên có 2 câu: paraphrase đề và nêu quan điểm/hướng trả lời."}:{s:"ok",t:`${wc} từ`});
  // gạch đầu dòng
  if(/^\s*([-•*–]|\d+[.)])\s+/m.test(t))out.push({s:"bad",t:"Có gạch đầu dòng hoặc đánh số",d:"Bài viết IELTS phải là văn liền mạch. Gạch đầu dòng bị trừ điểm."});
  // đoạn
  const [pa,pb]=T.paras;
  out.push(paras>=pa&&paras<=pb?{s:"ok",t:`${paras} đoạn`}:{s:paras<=1&&pa>1?"bad":"warn",t:`${paras} đoạn, nên là ${pa===pb?pa:pa+"–"+pb}`,d:task==="task2"?"Mở bài, 2 thân bài (có thể 3), kết bài. Không chia đoạn thì Mạch lạc tối đa band 5.":task==="task1"?"Mở bài, tổng quan, 1–2 đoạn chi tiết.":"Bài này chỉ viết 1 đoạn."});
  // câu và độ chính xác
  const lens=sents.map(s=>(s.match(/\S+/g)||[]).length), avg=lens.length?Math.round(wc/lens.length):0, long=lens.filter(n=>n>35).length;
  const sub=sents.filter(s=>/\b(because|although|though|which|who|whom|whose|that|if|when|while|whereas|since|unless|so that)\b/i.test(s)).length;
  out.push(long?{s:"warn",t:`${long} câu quá dài (trên 35 từ)`,d:"Câu dài dễ sai. Ưu tiên câu đúng hơn câu phức: band 7 cần nhiều câu không có lỗi."}:
    sub===0&&sents.length>=4?{s:"warn",t:`${sents.length} câu, chưa có câu phức nào`,d:"Viết tự nhiên với because, although, which, if là đủ. Đúng quan trọng hơn khó."}:
    {s:"ok",t:`${sents.length} câu, trung bình ${avg} từ/câu, ${sub} câu có mệnh đề phụ`});
  // từ nối
  const found=LINKERS.map(l=>({l,n:has(l)})).filter(x=>x.n);
  const over=found.filter(x=>x.n>=3);
  const starts=sents.filter(s=>LINKERS.some(l=>s.toLowerCase().startsWith(l+" ")||s.toLowerCase().startsWith(l+","))).length;
  if(sents.length>=6&&starts/sents.length>.6)out.push({s:"warn",t:`${starts}/${sents.length} câu mở đầu bằng từ nối`,d:"Từ nối ở đầu gần như mọi câu là kiểu nối máy móc, Mạch lạc bị giữ ở band 6. Bỏ bớt, để ý tưởng tự nối."});
  else if(over.length)out.push({s:"warn",t:`Lặp từ nối: ${over.map(x=>`"${x.l}" ${x.n} lần`).join(", ")}`,d:"Dùng từ nối đơn giản và chỉ khi cần. Đổi hoặc bỏ bớt."});
  else if(found.length<2&&sents.length>=5)out.push({s:"warn",t:"Gần như không có từ nối",d:"Thêm vài từ nối đơn giản ở chỗ chuyển ý: however, for example, as a result."});
  else out.push({s:"ok",t:found.length?`Từ nối hợp lý: ${found.slice(0,5).map(x=>x.l).join(", ")}`:"Từ nối hợp lý"});
  // câu mẫu học thuộc, idiom, từ "sang" dễ dùng sai
  const tpl=["this essay will","in this day and age","it is undeniable that","every coin has two sides","double-edged sword","in a nutshell","last but not least","it goes without saying","kill two birds","tip of the iceberg","hotly debated","a hot topic","since time immemorial"].filter(w=>has(w));
  if(tpl.length)out.push({s:"warn",t:`Câu mẫu hoặc thành ngữ: ${tpl.map(x=>`"${x}"`).join(", ")}`,d:"Giám khảo không tính điểm cho câu học thuộc, idiom không hợp văn viết học thuật. Viết thẳng vào ý."});
  const fancy=["elucidate","plethora","paradigm","dichotomy","myriad","ubiquitous","salient","posit","proliferation","quintessential","juxtapose"].filter(w=>has(w)||has(w+"s"));
  if(fancy.length)out.push({s:"warn",t:`Từ "sang" dễ dùng sai: ${fancy.join(", ")}`,d:"Chỉ dùng khi chắc chắn 100% nghĩa. Từ đơn giản mà đúng được điểm cao hơn từ khó mà sai."});
  // lặp từ (bỏ qua từ khóa trong đề)
  const pw=new Set((prompt||"").toLowerCase().match(/[a-z]+/g)||[]);
  const cnt={};(t.toLowerCase().match(/[a-z]+(?:-[a-z]+)*/g)||[]).forEach(w=>{if(w.length>3&&!STOP.has(w)&&!pw.has(w)&&!pw.has(w.replace(/s$/,"")))cnt[w]=(cnt[w]||0)+1});
  const rep=Object.entries(cnt).filter(([,n])=>n>=(task==="paragraph"?4:5)).sort((a,b)=>b[1]-a[1]).slice(0,4);
  if(rep.length)out.push({s:"warn",t:`Lặp nhiều: ${rep.map(([w,n])=>`${w} (${n})`).join(", ")}`,d:"Lặp từ khóa của đề là bình thường. Chỉ đổi sang từ đồng nghĩa khi chắc chắn 100%, hoặc dùng it, this, they."});
  // văn nói
  const inf=[];
  const ctr=(t.match(/\b\w+(n't|'re|'ve|'ll|'m|'d)\b|\b(it|that|there|what)'s\b/gi)||[]);if(ctr.length)inf.push(`viết tắt (${[...new Set(ctr.map(x=>x.toLowerCase()))].slice(0,3).join(", ")})`);
  [["a lot of","many / much / a large number of"],["lots of","many / much"],["kids","children"],["stuff","things"],["gonna","going to"],["etc","bỏ, nêu ví dụ cụ thể"]].forEach(([w,s])=>{if(has(w))inf.push(`"${w}" → ${s}`)});
  const very=has("very");if(very>=3)inf.push(`"very" ${very} lần`);
  out.push(inf.length?{s:"warn",t:"Có cách viết văn nói",d:inf.join("; ")}:{s:"ok",t:"Văn phong học thuật"});
  // theo dạng bài
  if(task==="task1"){
    if(!/\b(overall|in general|it is clear that|it can be seen that)\b/i.test(t))out.push({s:"bad",t:"Chưa có câu tổng quan",d:"Không có Overview thì Trả lời đề tối đa band 5. Nêu 1–2 xu hướng chính, mở bằng Overall."});
    const nums=(t.match(/\d+(?:[.,]\d+)?\s?%?/g)||[]).length;
    if(nums<4)out.push({s:"bad",t:`Chỉ có ${nums} số liệu`,d:"Task 1 phải dẫn số liệu cụ thể từ biểu đồ để chứng minh các điểm nổi bật."});
    if(/\b(i think|i believe|in my opinion|because of)\b/i.test(t))out.push({s:"warn",t:"Có ý kiến hoặc giải thích ngoài số liệu",d:"Task 1 chỉ mô tả dữ liệu, không nêu ý kiến hay đoán nguyên nhân."});
  }
  if(task==="task2"||task==="intro"){
    if(!/\b(i (strongly |partly |completely |fully )?(believe|think|agree|disagree|would argue|feel)|in my (opinion|view)|from my perspective|i am convinced|this essay (agrees|disagrees|argues))\b/i.test(t))out.push({s:"warn",t:"Chưa thấy câu nêu quan điểm",d:"Quan điểm không rõ thì Trả lời đề tối đa band 5. Nêu ngay ở mở bài và giữ nhất quán đến kết bài."});
  }
  if(task==="task2"&&!/\b(in conclusion|to conclude|to sum up|in summary|overall,)\b/i.test(t))out.push({s:"warn",t:"Chưa có kết bài rõ",d:"Mở kết bài bằng In conclusion và nhắc lại quan điểm."});
  return out;
}

/* ================= FX: phản hồi tức thì khi đúng/sai, chuỗi đúng liên tiếp, ăn mừng, chuỗi ngày học =================
   Nguyên tắc: phản hồi ngay (<100 ms), ngắn (<0,6 s), không chặn thao tác; âm thanh tự tổng hợp (không tải file);
   tôn trọng "giảm chuyển động" của hệ điều hành; tắt được âm thanh/rung trong cài đặt (bấm vào ô độ cao). */
const FX=(()=>{
  const RM=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
  const on=k=>ls.get("ielts-fx-"+k,"1")==="1";
  let ac=null,combo=0;
  function actx(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(ac.state==="suspended")ac.resume().catch(()=>{});return ac}
  function tone(f,t0,d,type,vol){const a=actx();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03)}
  const SND={
    ok:()=>{tone(880,0,.11);tone(1318.5,.07,.2)},
    soft:()=>tone(1046.5,0,.09,"sine",.05),
    bad:()=>{tone(233,0,.16,"triangle",.13);tone(174.6,.09,.24,"triangle",.11)},
    combo:()=>[0,1,2,3].forEach(i=>tone(784*Math.pow(1.189,i),i*.06,.14,"sine",.08)),
    win:()=>[523.3,659.3,784,1046.5,1318.5].forEach((f,i)=>tone(f,i*.085,.32,"sine",.08))
  };
  const sound=k=>{if(on("sound"))try{SND[k]()}catch(e){}};
  const buzz=p=>{if(on("vibe")&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
  function anim(el,c){if(!el||RM())return;el.classList.remove(c);void el.offsetWidth;el.classList.add(c);el.addEventListener("animationend",()=>el.classList.remove(c),{once:true})}
  function float(el,text,good){
    if(!el||RM())return;const r=el.getBoundingClientRect();if(!r.width)return;
    const f=document.createElement("div");f.className="fx-float "+(good?"g":"b");f.textContent=text;
    f.style.left=Math.min(innerWidth-40,Math.max(40,r.left+r.width/2))+"px";f.style.top=Math.max(60,r.top)+"px";
    document.body.appendChild(f);setTimeout(()=>f.remove(),1100);
  }
  function banner(html){
    const b=document.createElement("div");b.className="fx-banner";b.innerHTML=html;document.body.appendChild(b);
    setTimeout(()=>b.classList.add("out"),1300);setTimeout(()=>b.remove(),1800);
  }
  const COMBO={3:"3 câu đúng liên tiếp",5:"5 câu liền, đang vào guồng",8:"8 câu liền!",10:"10 câu liền, quá đỉnh",15:"15 câu liền — không ai cản nổi",20:"20 câu liền!"};
  function ok(el,xpText){
    combo++;anim(el,"fx-pop");if(xpText)float(el,xpText,true);
    if(COMBO[combo]){sound("combo");buzz([12,40,12]);banner(`<span class="fl">🔥</span>${COMBO[combo]}`)}else{sound("ok");buzz(12)}
  }
  function bad(el,rightEl){combo=0;anim(el,"fx-shake");if(rightEl)anim(rightEl,"fx-glow");sound("bad");buzz([30,50,30])}
  function soft(el){anim(el,"fx-pop");sound("soft");buzz(8)}
  function reset(){combo=0}
  // pháo giấy: canvas tự vẽ, ~1,8 giây, tự dọn
  function confetti(power){
    if(RM())return;power=power||1;
    const c=document.createElement("canvas");c.className="fx-confetti";const dpr=Math.min(2,devicePixelRatio||1);
    c.width=innerWidth*dpr;c.height=innerHeight*dpr;document.body.appendChild(c);const x=c.getContext("2d");x.scale(dpr,dpr);
    const css=getComputedStyle(document.documentElement),cols=["--sun","--ok","--night-2","--bad","--sky"].map(v=>css.getPropertyValue(v).trim()||"#ffaf1f");
    const N=Math.round(110*power),P=[];

      P.push({x:side?innerWidth+10:-10,y:innerHeight*(.55+Math.random()*.25),vx:(side?-1:1)*(4+Math.random()*9),vy:-(9+Math.random()*10),r:Math.random()*Math.PI,vr:(Math.random()-.5)*.35,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[i%cols.length]})}
    const t0=performance.now();
    (function step(t){const k=(t-t0)/1800;x.clearRect(0,0,innerWidth,innerHeight);
      P.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.globalAlpha=Math.max(0,1-k*k);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));x.restore()});
      if(k<1)requestAnimationFrame(step);else c.remove()})(t0);
  }
  function celebrate(power,msg){confetti(power);sound("win");buzz([20,60,20,60,40]);if(msg)banner(msg)}
  // đếm số tăng dần cho điểm/XP
  function countUp(el,to,ms,fmtFn){if(!el)return;fmtFn=fmtFn||(v=>String(Math.round(v)));if(RM()){el.textContent=fmtFn(to);return}
    const t0=performance.now();ms=ms||700;(function step(t){const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=fmtFn(to*e);if(k<1)requestAnimationFrame(step)})(t0)}
  // vòng điểm: vẽ từ 0 lên điểm thật
  function ring(){const c=document.querySelector(".score-ring circle:nth-of-type(2)");if(!c||RM())return;const full=c.getAttribute("stroke-dasharray"),to=c.getAttribute("stroke-dashoffset");if(!full||to==null)return;
    c.style.transition="none";c.style.strokeDashoffset=full;void c.getBoundingClientRect();c.style.transition="stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)";requestAnimationFrame(()=>{c.style.strokeDashoffset=to})}
  return {ok,bad,soft,reset,confetti,celebrate,countUp,ring,float,banner,sound,buzz,on};
})();

/* ---------- chuỗi ngày học (ngày có XP liên tiếp) ---------- */
function streakDays(){
  const days=new Set(xpLog.filter(x=>x.xp>0).map(x=>x.date));let d=todayISO,n=0;
  if(!days.has(d))d=addISO(d,-1);
  while(days.has(d)){n++;d=addISO(d,-1)}
  return {n,today:days.has(todayISO)};
}

/* ---------- đáp án ---------- */
function parseKey(t){const out=[];String(t||"").split(/\n/).forEach(l=>{const m=l.trim().match(/^(?:q(?:uestion)?\s*)?(\d{1,2})\s*[.):\-–]?\s+(.+)$/i);if(m)out.push({n:+m[1],alts:m[2].split(/\s*(?:\/|\bOR\b|;)\s*/i).map(s=>s.trim()).filter(Boolean)})});return out}
const TFMAP={T:"TRUE",F:"FALSE",NG:"NOT GIVEN","NOT-GIVEN":"NOT GIVEN",NOTGIVEN:"NOT GIVEN",Y:"YES",N:"NO"};
function normAns(s){const x=String(s||"").trim().replace(/\s+/g," ").replace(/[’‘]/g,"'").replace(/^[\s"“']+|[\s.,;:!?"”']+$/g,"").toUpperCase();return TFMAP[x]||x}
function ansMatch(given,alts){const g=normAns(given);if(!g)return false;return alts.some(a=>{if(normAns(a)===g)return true;return g===normAns(a.replace(/\([^)]*\)/g," "))||g===normAns(a.replace(/[()]/g,""))})}
function ansType(alts){const A=alts.map(normAns);if(A.every(x=>["TRUE","FALSE","NOT GIVEN"].includes(x)))return "tf";if(A.every(x=>["YES","NO","NOT GIVEN"].includes(x)))return "yn";if(A.every(x=>/^[A-L]$/.test(x)))return "letter";if(A.every(x=>/^[IVX]+$/.test(x)))return "roman";return "text"}
const BAND40=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[0,2.5]];
const band40=raw=>BAND40.find(([m])=>raw>=m)[1];

/* ---------- bài tự dán → gói ---------- */
function customToPack(r){
  let ai={};try{ai=r.pack?JSON.parse(r.pack):{}}catch(e){}
  if(ai.paras&&ai.groups)return {...ai,id:r.id,title:r.title||ai.title,source:r.source,custom:true,r};
  const raw=r.passage.replace(/\r/g,"");const parts=(raw.split(/\n\s*\n/).length>1?raw.split(/\n\s*\n/):raw.split(/\n/)).map(x=>x.trim()).filter(Boolean);
  const paras=parts.map(p=>{const m=p.match(/^([A-J])[\.\):]?\s+([\s\S]*)$/);return m?{l:m[1],t:m[2].replace(/\s+/g," ")}:{l:"",t:p.replace(/\s+/g," ")}});
  const key=parseKey(r.key),answers={};key.forEach(k=>answers[k.n]=k.alts);
  const ns=key.map(k=>k.n);
  const groups=ns.length?[{type:"custom",from:Math.min(...ns),to:Math.max(...ns),instr:"",stem:"",options:[],items:key.map(k=>({n:k.n,q:""}))}]:[];
  return {id:r.id,title:r.title,source:r.source,custom:true,r,paras,groups,answers,expl:ai.expl||{},vocab:ai.vocab||[],questionsText:r.questions||""};
}

let RD=null;
function openReading(id,opt){
  opt=opt||{};

  const cr=readings.find(r=>r.id===id);
  if(cr){
    const go=r=>showReading(customToPack(r),opt);
    if(rCache[id])return go(rCache[id]);
    toast("Đang mở bài…");return call("getReading",id).then(r=>{rCache[id]=r;go(r)}).catch(()=>{});
  }
  if(!PACKS[id])toast("Đang mở bài…");
  loadPack(id).then(p=>showReading(p,opt)).catch(e=>toast("Không mở được bài này. "+String((e&&e.message)||e).replace(/^Error:\s*/,"").slice(0,90),true));
}
function startTypePractice(type){
  const pool=(typePool()[type]||[]);if(!pool.length)return toast("Chưa có nhóm câu nào thuộc dạng này.",true);
  const fresh=pool.filter(g=>!rstats.groupsDone.includes(g.rid+":"+g.g));
  const pick=(fresh.length?fresh:pool)[Math.floor(Math.random()*(fresh.length?fresh:pool).length)];

  // Chế độ Thi (chỉ khi làm cả bài): bấm giờ đếm ngược, không mẹo, không dịch, Listening không tua; điểm lưu riêng.

  RD={p:pack,mode,gsel,only,answers:{},start:Date.now(),pane:"pass",result:null,attemptId:null,analysis:{},open:{},hl:null,showLoc:false,vi:false,note,intro:mode==="type",exam,eid:newEid(),earn:null,marks:[...(hlMap[pack.id]||[])]};

    if(RD.exam){const left=examLimit()-s;el.textContent=(left<0?"-":"")+mmss(Math.abs(left));el.classList.toggle("late",left<=60);if(left<=0&&!RD.autoSent){RD.autoSent=true;toast("Hết giờ thi, đã nộp bài.");gradeReading()}return}
    el.textContent=mmss(s);el.classList.toggle("late",s>(RD.mode==="full"?1200:600))},1000);

const rNums=()=>{const out=[];RD.gsel.forEach(i=>{const g=RD.p.groups[i];for(let n=g.from;n<=g.to;n++)if(!RD.only||RD.only.has(n))out.push(n)});return out};

/* ---------- đoạn văn: tô từ đã lưu, vị trí đáp án ---------- */
// tô từ: từ đã lưu (vàng) và chỗ mày tự tô (đậm, nền xanh) trong cùng một lượt thay thế
function markAll(html,words,marks){
  const all=[...new Set([...words,...marks])].filter(w=>w.length>1).sort((a,b)=>b.length-a.length);if(!all.length)return html;
  const W=new Set(words.map(w=>w.toLowerCase().replace(/\s+/g," "))),M=new Set(marks.map(w=>w.toLowerCase().replace(/\s+/g," ")));
  const re=new RegExp("("+all.map(w=>reEsc(esc(w)).replace(/\s+/g,"\\s+")).join("|")+")","gi");
  return html.replace(re,m=>{const k=m.toLowerCase().replace(/\s+/g," ").replace(/&amp;/g,"&").replace(/&#39;/g,"'").replace(/&quot;/g,'"');const cls=[W.has(k)?"rw":"",M.has(k)?"uhl":""].filter(Boolean).join(" ")||"rw";return `<mark class="${cls}"${M.has(k)?` data-uhl="${m}"`:""}>${m}</mark>`});
}
function markWords(html,words){if(!words.length)return html;const re=new RegExp("("+words.map(w=>reEsc(esc(w)).replace(/\s+/g,"\\s+")).join("|")+")","gi");return html.replace(re,'<mark class="rw">$1</mark>')}
function locate(t,q){if(!q)return -1;let i=t.indexOf(q);if(i>=0)return i;i=t.toLowerCase().indexOf(q.toLowerCase());if(i>=0)return i;const qq=q.replace(/[“”"]/g,'"').replace(/[‘’]/g,"'");return t.replace(/[“”"]/g,'"').replace(/[‘’]/g,"'").indexOf(qq)}
function passageHTML(){
  const p=RD.p,words=rWordsOf(p.id).map(v=>v.word).filter(w=>w.length>1).sort((a,b)=>b.length-a.length);
  const marks={};
  if(RD.result&&(RD.showLoc||RD.hl!=null)){
    const ns=RD.hl!=null?[RD.hl]:rNums();
    ns.forEach(n=>{const e=(p.expl||{})[n];if(!e||!e.quote)return;p.paras.forEach((pa,pi)=>{if(marks[n])return;const i=locate(pa.t,e.quote);if(i>=0)marks[n]={pi,s:i,e:i+e.quote.length}})});
  }
  const vi=RD.vi&&p.vi&&p.vi.length;
  return p.paras.map((pa,pi)=>{
    if(pa.h)return `<h4 class="rh">${esc(pa.t)}</h4>`;
    const ms=Object.entries(marks).filter(([,m])=>m.pi===pi).sort((a,b)=>a[1].s-b[1].s);
    let html="",pos=0;
    const mk=RD.marks||[];
    ms.forEach(([n,m])=>{if(m.s<pos)return;html+=markAll(esc(pa.t.slice(pos,m.s)),words,mk)+`<mark class="qhl ${RD.hl==n?"on":""}" id="qhl-${n}"><sup>${n}</sup>${markAll(esc(pa.t.slice(m.s,m.e)),words,mk)}</mark>`;pos=m.e});
    html+=markAll(esc(pa.t.slice(pos)),words,mk);
    const tr=vi?(p.vi.find(x=>x.l===pa.l&&pa.l)||null):null;
    return `<p>${pa.l&&!pa.cont?`<b class="plbl">${pa.l}</b>`:""}${html}</p>${tr?`<p class="vi-tr">${esc(tr.t)}</p>`:""}`;
  }).join("");
}

/* ---------- câu hỏi + ô trả lời ---------- */
function letterOpts(g){
  if(g.options&&g.options.length)return g.options.map(o=>o.k);
  if(g.type==="paragraph")return [...new Set(RD.p.paras.filter(x=>x.l).map(x=>x.l))];
  return ["A","B","C","D"];
}
function itemCtrl(g,n,item){
  const v=RD.answers[n]||"",dis=RD.result?"disabled":"";
  const btns=(list,lab)=>`<span class="aopts">${list.map(o=>`<button type="button" class="aopt ${normAns(v)===normAns(o)?"on":""}" data-ans="${n}" data-val="${esc(o)}" ${dis}>${esc(lab?lab(o):o)}</button>`).join("")}</span>`;
  if(g.type==="tfng")return btns(["TRUE","FALSE","NOT GIVEN"],o=>o==="NOT GIVEN"?"NG":o);
  if(g.type==="ynng")return btns(["YES","NO","NOT GIVEN"],o=>o==="NOT GIVEN"?"NG":o);
  if(g.type==="mcq"&&item&&item.opts&&item.opts.length)return `<span class="mopts">${item.opts.map(o=>`<button type="button" class="mopt ${normAns(v)===normAns(o.k)?"on":""}" data-ans="${n}" data-val="${esc(o.k)}" ${dis}><b>${esc(o.k)}</b><span>${esc(o.t)}</span></button>`).join("")}</span>`;
  if(["headings","features","endings","paragraph"].includes(g.type)||(g.options&&g.options.length))return btns(letterOpts(g));
  if(g.type==="custom"){const t=ansType(RD.p.answers[n]||[""]);if(t==="tf")return btns(["TRUE","FALSE","NOT GIVEN"],o=>o==="NOT GIVEN"?"NG":o);if(t==="yn")return btns(["YES","NO","NOT GIVEN"],o=>o==="NOT GIVEN"?"NG":o);if(t==="letter")return btns(["A","B","C","D","E","F","G","H"].slice(0,Math.max(4,...(RD.p.answers[n]||[]).map(a=>normAns(a).charCodeAt(0)-64))));}

function resultLine(n){

      <p>${esc(e.why)}</p>${e.trap?`<p class="trap">⚠ ${esc(e.trap)}</p>`:""}${e.quote?`<blockquote>${e.p?`<b>${esc(e.p)}</b> `:""}“${esc(e.quote)}”</blockquote>`:""}</div>`:""}

function stemHTML(g,gi){

function groupHTML(gi){

     <span style="display:flex;gap:8px;align-items:center"><span class="timer num" id="rd-time">${res?"xong":RD.exam?mmss(examLimit()):"0:00"}</span>${!res&&RD.mode==="full"?`<button class="btn sm modebtn" data-rexam aria-pressed="${RD.exam}" title="Đổi chế độ Học / Thi">${RD.exam?"Thi":"Học"}</button>`:""}${p.custom&&!RD.exam?`<button class="btn sm" data-redit>Sửa</button>`:""}</span></div>
    <div class="rd-tabs"><div class="seg">${[["pass",isL()?"Bài nghe":"Bài đọc"],["q",`Câu hỏi (${nums.length})`],["note","Từ & ghi chú"]].map(([k,n])=>`<button data-rpane="${k}" aria-pressed="${RD.pane===k}">${n}</button>`).join("")}</div></div></div>
   <div class="rd" data-pane="${RD.pane}">

    <article class="rd-pass card" id="rd-pass">${isL()?listenPaneHTML():`<div class="rp-hd"><span class="hint">${RD.exam&&!res?`Chế độ Thi: ${Math.round(examLimit()/60)} phút, không mẹo, không bản dịch · điểm lưu riêng`:(RD.mode==="full"?"Mục tiêu 20 phút":"Mục tiêu "+Math.max(4,Math.round(nums.length*1.4))+" phút")+" · bôi đen từ để tô, tra nghĩa, lưu"}${p.src&&p.src.keySource==="ai"?" · đáp án do AI giải (có dẫn chứng)":""}</span><span style="display:flex;gap:10px">${(RD.marks||[]).length?`<button class="linkbtn" data-hlclear>Bỏ tô (${RD.marks.length})</button>`:""}${p.vi&&p.vi.length&&!(RD.exam&&!res)?`<button class="linkbtn" data-rvi>${RD.vi?"Ẩn bản dịch":"Bản dịch"}</button>`:""}</span></div><h3 class="rtitle">${esc(p.title)}</h3>${passageHTML()}`}</article>

        ${p.groups.length?RD.gsel.map(groupHTML).join(""):`<p class="hint">Bài này chưa có đáp án nên không tự chấm được. Bấm "Sửa" để dán đáp án.</p>`}
