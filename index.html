const TOPICS=[{"id":"v01","en":"Education & Learning","vi":"Giáo dục và học tập","desc":"Từ vựng về trường học, cách dạy và học, và cơ hội tiếp cận giáo dục.","words":[{"w":"curriculum","pos":"danh từ","ipa":"/kəˈrɪkjələm/","vi":"chương trình giảng dạy","use":"đếm được (số nhiều: curricula); design / reform + the curriculum","ex":["Many schools now include coding in their curriculum.","Critics argue that the national curriculum leaves little room for creativity."],"syn":"syllabus"},{"w":"tuition fees","pos":"cụm danh từ","ipa":"/tjuˈɪʃn fiːz/","vi":"học phí","use":"danh từ số nhiều; pay / raise / abolish + tuition fees","ex":["Many students take part-time jobs to pay their tuition fees.","Some argue that governments should abolish tuition fees for all universities."],"syn":"school fees"},{"w":"academic performance","pos":"cụm danh từ","ipa":"/ˌækəˈdemɪk pəˈfɔːməns/","vi":"kết quả học tập","use":"không đếm được; improve / affect + academic performance","ex":["Lack of sleep can seriously affect a child's academic performance.","Regular reading at home tends to improve academic performance."],"syn":"school results"},{"w":"compulsory","pos":"tính từ","ipa":"/kəmˈpʌlsəri/","vi":"bắt buộc","use":"tính từ; compulsory + subject/education; be compulsory for + N","ex":["In many countries, education is compulsory until the age of sixteen.","Physical education should remain a compulsory subject in secondary schools."],"syn":"mandatory"},{"w":"higher education","pos":"cụm danh từ","ipa":"/ˌhaɪər ˌedʒuˈkeɪʃn/","vi":"giáo dục đại học","use":"không đếm được; go into / have access to + higher education","ex":["More young people than ever before now go into higher education.","Governments should make higher education affordable for students from poor families."],"syn":"university education"},{"w":"acquire knowledge","pos":"cụm động từ","ipa":"/əˌkwaɪə ˈnɒlɪdʒ/","vi":"tiếp thu kiến thức","use":"động từ + tân ngữ; acquire knowledge of/about + N","ex":["Children acquire knowledge more quickly when lessons are interactive.","The internet allows learners to acquire knowledge outside the classroom."],"syn":"gain knowledge"},{"w":"drop out of","pos":"cụm động từ","ipa":"/ˌdrɒp ˈaʊt əv/","vi":"bỏ học giữa chừng","use":"drop out of + school/university; danh từ: a dropout","ex":["Financial problems force many students to drop out of university.","Teenagers who drop out of school often struggle to find stable jobs."],"syn":"leave school early"},{"w":"qualification","pos":"danh từ","ipa":"/ˌkwɒlɪfɪˈkeɪʃn/","vi":"bằng cấp, chứng chỉ","use":"đếm được; gain / obtain + a qualification in + N","ex":["Employers increasingly expect applicants to hold a university qualification.","She gained a teaching qualification before moving abroad to work."],"syn":"certificate"},{"w":"early childhood education","pos":"cụm danh từ","ipa":"/ˌɜːli ˈtʃaɪldhʊd ˌedʒuˈkeɪʃn/","vi":"giáo dục mầm non","use":"không đếm được; invest in / expand + early childhood education","ex":["Investing in early childhood education brings long-term benefits for society.","Children who receive early childhood education usually adapt to school more easily."],"syn":"preschool education"},{"w":"vocational training","pos":"cụm danh từ","ipa":"/vəʊˈkeɪʃənl ˈtreɪnɪŋ/","vi":"đào tạo nghề","use":"không đếm được; provide / receive + vocational training","ex":["Vocational training prepares young people for practical jobs such as plumbing.","Not every student needs a degree; some benefit more from vocational training."],"syn":"job training"},{"w":"literacy","pos":"danh từ","ipa":"/ˈlɪtərəsi/","vi":"khả năng đọc viết","use":"không đếm được; the literacy rate; improve + literacy","ex":["The literacy rate in rural areas has risen sharply in recent decades.","Reading to children every night helps to improve their literacy."],"syn":"reading and writing skills"},{"w":"lifelong learning","pos":"cụm danh từ","ipa":"/ˌlaɪflɒŋ ˈlɜːnɪŋ/","vi":"học tập suốt đời","use":"không đếm được; promote / encourage + lifelong learning","ex":["In a fast-changing job market, lifelong learning has become essential.","Universities should offer evening courses to promote lifelong learning among adults."],"syn":"continuing education"},{"w":"distance learning","pos":"cụm danh từ","ipa":"/ˌdɪstəns ˈlɜːnɪŋ/","vi":"học từ xa","use":"không đếm được; a distance learning course/programme","ex":["Distance learning allows working adults to study without leaving their jobs.","She completed her master's degree through a distance learning programme."],"syn":"remote study"},{"w":"critical thinking","pos":"cụm danh từ","ipa":"/ˌkrɪtɪkl ˈθɪŋkɪŋ/","vi":"tư duy phản biện","use":"không đếm được; develop / encourage + critical thinking (skills)","ex":["Group debates are an effective way to develop critical thinking.","Employers value graduates with strong critical thinking skills."],"syn":"analytical thinking"},{"w":"enrol in","pos":"cụm động từ","ipa":"/ɪnˈrəʊl ɪn/","vi":"đăng ký học, nhập học","use":"Anh-Anh: enrol/enrolled; enrol in + a course/programme","ex":["More adults are choosing to enrol in part-time university courses.","Last year, over two thousand students enrolled in the engineering programme."],"syn":"sign up for"},{"w":"extracurricular activities","pos":"cụm danh từ","ipa":"/ˌekstrəkəˈrɪkjələr ækˈtɪvətiz/","vi":"hoạt động ngoại khóa","use":"số nhiều; take part in + extracurricular activities","ex":["Taking part in extracurricular activities helps students build confidence.","Schools with limited budgets often cut funding for extracurricular activities first."],"syn":"after-school activities"},{"w":"rote learning","pos":"cụm danh từ","ipa":"/ˌrəʊt ˈlɜːnɪŋ/","vi":"học vẹt","use":"không đếm được; rely on + rote learning","ex":["Education systems that rely on rote learning rarely encourage creativity.","Rote learning may help students pass exams but not understand concepts."],"syn":"memorisation"},{"w":"well-rounded","pos":"tính từ","ipa":"/ˌwel ˈraʊndɪd/","vi":"phát triển toàn diện","use":"tính từ; a well-rounded + education/individual","ex":["Sport and music are vital parts of a well-rounded education.","Universities aim to produce well-rounded graduates, not just good test-takers."],"syn":"all-round"},{"w":"keep up with","pos":"cụm động từ","ipa":"/ˌkiːp ˈʌp wɪð/","vi":"theo kịp","use":"keep up with + N (classmates / workload / changes)","ex":["Some students find it hard to keep up with the heavy workload.","Teachers must keep up with new teaching methods and technologies."],"syn":"stay level with"},{"w":"motivate","pos":"động từ","ipa":"/ˈməʊtɪveɪt/","vi":"tạo động lực","use":"motivate sb to do sth; danh từ: motivation","ex":["Good teachers know how to motivate even the weakest students.","Rewards alone cannot motivate children to learn in the long term."],"syn":"encourage"},{"w":"discipline","pos":"danh từ","ipa":"/ˈdɪsəplɪn/","vi":"kỷ luật","use":"không đếm được; maintain / enforce + discipline","ex":["Strict discipline in classrooms does not always lead to better learning.","Teachers today find it harder to maintain discipline than in the past."],"syn":"order"},{"w":"standardised tests","pos":"cụm danh từ","ipa":"/ˌstændədaɪzd ˈtests/","vi":"bài kiểm tra chuẩn hóa","use":"đếm được; take / prepare for + standardised tests","ex":["Standardised tests cannot fully measure a student's creativity or teamwork skills.","Many schools spend too much time preparing pupils for standardised tests."],"syn":"national exams"},{"w":"student-centred approach","pos":"cụm danh từ","ipa":"/ˌstjuːdnt ˌsentəd əˈprəʊtʃ/","vi":"cách dạy lấy người học làm trung tâm","use":"đếm được; adopt / take + a student-centred approach","ex":["A student-centred approach encourages learners to ask questions and explore ideas.","Many Asian schools are slowly adopting a more student-centred approach."],"syn":"learner-focused teaching"},{"w":"fall behind","pos":"cụm động từ","ipa":"/ˌfɔːl bɪˈhaɪnd/","vi":"bị tụt lại phía sau","use":"fall behind + sb; fall behind in + môn học","ex":["Children who miss school frequently tend to fall behind their classmates.","Without extra support, pupils from poor families may fall behind in maths."],"syn":"lag behind"},{"w":"access to education","pos":"cụm danh từ","ipa":"/ˌækses tu ˌedʒuˈkeɪʃn/","vi":"cơ hội tiếp cận giáo dục","use":"không đếm được; have / provide / limit + access to education","ex":["Every child should have equal access to education, regardless of family income.","In remote villages, access to education is still very limited."],"syn":"educational opportunities"},{"w":"practical skills","pos":"cụm danh từ","ipa":"/ˌpræktɪkl ˈskɪlz/","vi":"kỹ năng thực tế","use":"số nhiều; develop / gain + practical skills","ex":["Internships allow students to gain practical skills that employers actually need.","Schools should teach practical skills such as cooking and managing money."],"syn":"real-world skills"},{"w":"scholarship","pos":"danh từ","ipa":"/ˈskɒləʃɪp/","vi":"học bổng","use":"đếm được; win / be awarded + a scholarship to do sth","ex":["He won a full scholarship to study engineering in Korea.","Scholarships give talented students from poor backgrounds a real chance."],"syn":"grant"},{"w":"pursue a degree","pos":"cụm động từ","ipa":"/pəˌsjuː ə dɪˈɡriː/","vi":"theo học lấy bằng","use":"pursue a degree in + ngành; pursue + a career/goal","ex":["Many international students come to Korea to pursue a degree in engineering.","Working adults increasingly pursue a degree part-time while keeping their jobs."],"syn":"study for a degree"},{"w":"hands-on","pos":"tính từ","ipa":"/ˌhændz ˈɒn/","vi":"thực hành trực tiếp","use":"tính từ đứng trước N; hands-on + experience/learning","ex":["Laboratory work gives science students valuable hands-on experience.","Young children learn best through hands-on activities rather than lectures."],"syn":"practical"},{"w":"theoretical knowledge","pos":"cụm danh từ","ipa":"/ˌθɪəˈretɪkl ˈnɒlɪdʒ/","vi":"kiến thức lý thuyết","use":"không đếm được; theoretical knowledge + vs practical skills","ex":["University courses often focus on theoretical knowledge rather than practical skills.","Theoretical knowledge alone is not enough to succeed in most careers."],"syn":"academic knowledge"},{"w":"graduate","pos":"động từ","ipa":"/ˈɡrædʒueɪt/","vi":"tốt nghiệp","use":"nội động từ; graduate from + trường; graduate in + ngành","ex":["Thousands of students graduate each year without finding suitable jobs.","After she graduated from university, she worked as a research assistant."],"syn":"finish university"},{"w":"assess","pos":"động từ","ipa":"/əˈses/","vi":"đánh giá","use":"động từ + tân ngữ; assess + students/progress; N: assessment","ex":["Teachers should assess students through projects as well as written exams.","It is difficult to assess creativity using a single final test."],"syn":"evaluate"},{"w":"peer pressure","pos":"cụm danh từ","ipa":"/ˈpɪə ˌpreʃə/","vi":"áp lực từ bạn bè","use":"không đếm được; give in to / resist + peer pressure","ex":["Teenagers often give in to peer pressure to fit in with friends.","Peer pressure can also have positive effects, such as encouraging hard work."],"syn":"influence from friends"},{"w":"mixed-ability classes","pos":"cụm danh từ","ipa":"/ˌmɪkst əˈbɪləti ˈklɑːsɪz/","vi":"lớp học nhiều trình độ","use":"số nhiều; teach / study in + mixed-ability classes","ex":["Weaker pupils often benefit from studying in mixed-ability classes.","Teaching mixed-ability classes requires careful planning and a lot of patience."],"syn":"mixed-level classes"},{"w":"cognitive development","pos":"cụm danh từ","ipa":"/ˌkɒɡnətɪv dɪˈveləpmənt/","vi":"phát triển nhận thức","use":"không đếm được; promote / support + cognitive development","ex":["Puzzles and building games can support a child's cognitive development.","Early exposure to language plays a key role in cognitive development."],"syn":"mental development"},{"w":"foster","pos":"động từ","ipa":"/ˈfɒstə/","vi":"nuôi dưỡng, thúc đẩy","use":"động từ + tân ngữ; foster + creativity/independence","ex":["Group projects foster teamwork and communication among students.","Schools should foster curiosity instead of simply preparing children for exams."],"syn":"promote"},{"w":"bridge the gap","pos":"cụm động từ","ipa":"/ˌbrɪdʒ ðə ˈɡæp/","vi":"thu hẹp khoảng cách","use":"bridge the gap between A and B","ex":["Free tutoring programmes help bridge the gap between rich and poor students.","Internships bridge the gap between university study and the workplace."],"syn":"narrow the gap"},{"w":"home-schooling","pos":"danh từ","ipa":"/ˌhəʊm ˈskuːlɪŋ/","vi":"học tại nhà","use":"không đếm được; choose / opt for + home-schooling","ex":["Some parents choose home-schooling because they distrust the state system.","Critics argue that home-schooling limits children's social development."],"syn":"home education"},{"w":"brain drain","pos":"cụm danh từ","ipa":"/ˈbreɪn dreɪn/","vi":"chảy máu chất xám","use":"số ít; suffer from / reverse + a brain drain","ex":["Many developing countries suffer from a brain drain of talented graduates.","Offering better research funding could help reverse the brain drain."],"syn":"talent loss"},{"w":"cater to","pos":"cụm động từ","ipa":"/ˈkeɪtə tuː/","vi":"đáp ứng nhu cầu","use":"cater to/for + needs/learners (Anh-Anh hay dùng cater for)","ex":["Teachers must cater to students with very different learning styles.","The new curriculum fails to cater to the needs of gifted children."],"syn":"meet the needs of"}]},{"id":"v02","en":"Environment & Climate","vi":"Môi trường và khí hậu","desc":"Từ vựng về ô nhiễm, biến đổi khí hậu và các giải pháp bảo vệ môi trường.","words":[{"w":"pollution","pos":"danh từ","ipa":"/pəˈluːʃn/","vi":"sự ô nhiễm","use":"không đếm được; air/water/noise + pollution; reduce + pollution","ex":["Air pollution in large cities causes serious breathing problems.","Stricter laws are needed to reduce pollution from factories."],"syn":"contamination"},{"w":"climate change","pos":"cụm danh từ","ipa":"/ˈklaɪmət tʃeɪndʒ/","vi":"biến đổi khí hậu","use":"không đếm được; combat + climate change; the effects of + N","ex":["Climate change is one of the greatest challenges facing humanity today.","Poor countries often suffer most from the effects of climate change."],"syn":"climate crisis"},{"w":"global warming","pos":"cụm danh từ","ipa":"/ˌɡləʊbl ˈwɔːmɪŋ/","vi":"sự nóng lên toàn cầu","use":"không đếm được; contribute to / slow down + global warming","ex":["Burning coal is a major contributor to global warming.","Planting trees is one simple way to slow down global warming."],"syn":"rising global temperatures"},{"w":"greenhouse gases","pos":"cụm danh từ","ipa":"/ˌɡriːnhaʊs ˈɡæsɪz/","vi":"khí nhà kính","use":"số nhiều; emit / release + greenhouse gases","ex":["Cars and factories release large amounts of greenhouse gases every year.","Cattle farming is a surprisingly large source of greenhouse gases."],"syn":"heat-trapping gases"},{"w":"renewable energy","pos":"cụm danh từ","ipa":"/rɪˌnjuːəbl ˈenədʒi/","vi":"năng lượng tái tạo","use":"không đếm được; invest in / switch to + renewable energy","ex":["Governments should invest more heavily in renewable energy such as solar power.","Renewable energy now supplies a growing share of the world's electricity."],"syn":"clean energy"},{"w":"recycle","pos":"động từ","ipa":"/ˌriːˈsaɪkl/","vi":"tái chế","use":"động từ + tân ngữ; recycle + plastic/paper/waste","ex":["Households should be required to recycle paper, glass and plastic.","Only a small proportion of plastic waste is actually recycled."],"syn":"reuse"},{"w":"protect the environment","pos":"cụm động từ","ipa":"/prəˌtekt ði ɪnˈvaɪrənmənt/","vi":"bảo vệ môi trường","use":"take steps to + protect the environment","ex":["Individuals and governments must work together to protect the environment.","Using public transport is a simple way to protect the environment."],"syn":"save the planet"},{"w":"natural resources","pos":"cụm danh từ","ipa":"/ˌnætʃrəl rɪˈzɔːsɪz/","vi":"tài nguyên thiên nhiên","use":"số nhiều; exploit / conserve + natural resources","ex":["Rapid industrial growth is using up natural resources at an alarming rate.","Countries rich in natural resources do not always become wealthy."],"syn":"raw materials"},{"w":"carbon emissions","pos":"cụm danh từ","ipa":"/ˌkɑːbən iˈmɪʃnz/","vi":"lượng khí thải carbon","use":"số nhiều; reduce / cut + carbon emissions","ex":["Many governments have promised to cut carbon emissions by half within decades.","Aviation is responsible for a significant share of global carbon emissions."],"syn":"CO2 output"},{"w":"fossil fuels","pos":"cụm danh từ","ipa":"/ˌfɒsl ˈfjuːəlz/","vi":"nhiên liệu hóa thạch","use":"số nhiều; burn / depend on + fossil fuels","ex":["Burning fossil fuels is the main cause of rising carbon dioxide levels.","Many developing nations still depend heavily on fossil fuels for electricity."],"syn":"coal, oil and gas"},{"w":"deforestation","pos":"danh từ","ipa":"/ˌdiːˌfɒrɪˈsteɪʃn/","vi":"nạn phá rừng","use":"không đếm được; large-scale deforestation; lead to + N","ex":["Deforestation in the Amazon threatens thousands of plant and animal species.","Large-scale deforestation also increases the risk of floods and landslides."],"syn":"forest clearance"},{"w":"endangered species","pos":"cụm danh từ","ipa":"/ɪnˌdeɪndʒəd ˈspiːʃiːz/","vi":"loài có nguy cơ tuyệt chủng","use":"species: số ít = số nhiều; protect + endangered species","ex":["Zoos can play an important role in protecting endangered species.","Tigers and elephants are well-known examples of endangered species."],"syn":"threatened animals"},{"w":"single-use plastics","pos":"cụm danh từ","ipa":"/ˌsɪŋɡl juːs ˈplæstɪks/","vi":"đồ nhựa dùng một lần","use":"số nhiều; ban / reduce + single-use plastics","ex":["Several countries have banned single-use plastics such as straws and bags.","Supermarkets should reduce their use of single-use plastics in packaging."],"syn":"disposable plastics"},{"w":"cut down on","pos":"cụm động từ","ipa":"/ˌkʌt ˈdaʊn ɒn/","vi":"cắt giảm","use":"cut down on + N/V-ing (energy use, meat, driving)","ex":["People can cut down on energy use by switching off unused lights.","Cutting down on meat consumption would reduce agricultural emissions."],"syn":"reduce"},{"w":"sustainable","pos":"tính từ","ipa":"/səˈsteɪnəbl/","vi":"bền vững","use":"tính từ; sustainable + development/growth/practices","ex":["Sustainable development meets present needs without harming future generations.","Farmers are being encouraged to adopt more sustainable methods of production."],"syn":"green"},{"w":"public transport","pos":"cụm danh từ","ipa":"/ˌpʌblɪk ˈtrænspɔːt/","vi":"giao thông công cộng","use":"không đếm được; use / invest in + public transport","ex":["Cheaper public transport would encourage commuters to leave their cars at home.","Seoul is often praised for its efficient and affordable public transport."],"syn":"mass transit"},{"w":"air quality","pos":"cụm danh từ","ipa":"/ˈeə ˌkwɒləti/","vi":"chất lượng không khí","use":"không đếm được; poor / improve + air quality","ex":["Poor air quality is linked to asthma and heart disease.","Banning old diesel vehicles has noticeably improved air quality in the city."],"syn":"cleanliness of the air"},{"w":"carbon footprint","pos":"cụm danh từ","ipa":"/ˌkɑːbən ˈfʊtprɪnt/","vi":"dấu chân carbon","use":"đếm được; reduce / measure + your carbon footprint","ex":["Flying less is one of the best ways to reduce your carbon footprint.","Companies are now expected to report the carbon footprint of their products."],"syn":"personal emissions"},{"w":"extreme weather events","pos":"cụm danh từ","ipa":"/ɪkˌstriːm ˈweðər ɪˌvents/","vi":"hiện tượng thời tiết cực đoan","use":"số nhiều; extreme weather events + such as floods/heatwaves","ex":["Extreme weather events such as floods and heatwaves are becoming more frequent.","Farmers in Vietnam have suffered heavy losses from extreme weather events."],"syn":"natural disasters"},{"w":"rising sea levels","pos":"cụm danh từ","ipa":"/ˌraɪzɪŋ ˈsiː ˌlevlz/","vi":"mực nước biển dâng","use":"số nhiều; threaten / be threatened by + rising sea levels","ex":["Rising sea levels threaten low-lying coastal cities around the world.","The Mekong Delta is one of the regions most threatened by rising sea levels."],"syn":"higher ocean levels"},{"w":"biodiversity","pos":"danh từ","ipa":"/ˌbaɪəʊdaɪˈvɜːsəti/","vi":"đa dạng sinh học","use":"không đếm được; protect / a loss of + biodiversity","ex":["Coral reefs support a remarkable level of biodiversity in tropical seas.","Intensive farming has led to a dramatic loss of biodiversity."],"syn":"variety of life"},{"w":"habitat loss","pos":"cụm danh từ","ipa":"/ˈhæbɪtæt lɒs/","vi":"mất môi trường sống","use":"không đếm được; cause / lead to + habitat loss","ex":["Habitat loss is the main reason many animal species are disappearing.","Urban expansion has caused severe habitat loss for local wildlife."],"syn":"destruction of habitats"},{"w":"landfill","pos":"danh từ","ipa":"/ˈlændfɪl/","vi":"bãi chôn lấp rác","use":"đếm được/không đếm được; end up in / send to + landfill","ex":["Most household waste still ends up in landfill rather than being recycled.","New landfill sites are difficult to find in densely populated countries."],"syn":"rubbish dump"},{"w":"conserve","pos":"động từ","ipa":"/kənˈsɜːv/","vi":"bảo tồn, tiết kiệm","use":"động từ + tân ngữ; conserve + water/energy/wildlife","ex":["Residents were asked to conserve water during the long dry season.","National parks were created to conserve rare plants and wildlife."],"syn":"save"},{"w":"switch to","pos":"cụm động từ","ipa":"/ˈswɪtʃ tə/","vi":"chuyển sang","use":"switch (from A) to B; switch to + electric cars/solar power","ex":["More drivers are expected to switch to electric cars within a decade.","Factories that switch to solar power can cut their energy bills."],"syn":"change to"},{"w":"environmentally friendly","pos":"cụm tính từ","ipa":"/ɪnˌvaɪrənˌmentəli ˈfrendli/","vi":"thân thiện với môi trường","use":"cụm tính từ; environmentally friendly + products/alternatives","ex":["Consumers are increasingly willing to pay more for environmentally friendly products.","Cycling is a cheap and environmentally friendly way to travel."],"syn":"eco-friendly"},{"w":"environmental regulations","pos":"cụm danh từ","ipa":"/ɪnˌvaɪrənˌmentl ˌreɡjuˈleɪʃnz/","vi":"quy định về môi trường","use":"số nhiều; enforce / tighten + environmental regulations","ex":["Stricter environmental regulations would force factories to reduce their waste.","Some companies move production abroad to avoid strict environmental regulations."],"syn":"green laws"},{"w":"phase out","pos":"cụm động từ","ipa":"/ˌfeɪz ˈaʊt/","vi":"loại bỏ dần","use":"phase out + N / phase + N + out; phase out coal by + năm","ex":["Many countries plan to phase out coal power by 2040.","Petrol cars will be gradually phased out over the next two decades."],"syn":"gradually remove"},{"w":"irreversible","pos":"tính từ","ipa":"/ˌɪrɪˈvɜːsəbl/","vi":"không thể đảo ngược","use":"tính từ; irreversible + damage/effects/harm","ex":["Scientists warn that some climate damage may already be irreversible.","Overfishing can cause irreversible harm to marine life in the region."],"syn":"permanent"},{"w":"ecosystem","pos":"danh từ","ipa":"/ˈiːkəʊsɪstəm/","vi":"hệ sinh thái","use":"đếm được; fragile / marine + ecosystem; damage + ecosystems","ex":["Plastic waste is damaging fragile marine ecosystems across the Pacific.","Wetlands are among the most productive ecosystems on the planet."],"syn":"natural environment"},{"w":"drought","pos":"danh từ","ipa":"/draʊt/","vi":"hạn hán","use":"đếm được/không đếm được; severe / prolonged + drought","ex":["Prolonged drought has destroyed crops across large parts of Africa.","Water shortages become critical when a severe drought hits the region."],"syn":"dry spell"},{"w":"tackle","pos":"động từ","ipa":"/ˈtækl/","vi":"giải quyết, đối phó","use":"động từ + tân ngữ; tackle + a problem/issue/climate change","ex":["International cooperation is essential to tackle climate change effectively.","Local councils are introducing new measures to tackle air pollution."],"syn":"deal with"},{"w":"mitigate","pos":"động từ","ipa":"/ˈmɪtɪɡeɪt/","vi":"giảm nhẹ","use":"động từ + tân ngữ; mitigate + the effects/impact of + N","ex":["Planting mangroves can help mitigate the impact of coastal flooding.","Governments must act quickly to mitigate the effects of global heating."],"syn":"lessen"},{"w":"take action","pos":"cụm động từ","ipa":"/ˌteɪk ˈækʃn/","vi":"hành động","use":"take action on/against + N; take urgent action","ex":["It is time for world leaders to take action on climate change.","Ordinary citizens can also take action by changing their daily habits."],"syn":"act"},{"w":"offset","pos":"động từ","ipa":"/ˌɒfˈset/","vi":"bù đắp","use":"động từ + tân ngữ (offset-offset-offset); offset + emissions","ex":["Some airlines let passengers offset their emissions by funding tree planting.","Planting forests alone cannot offset the damage caused by heavy industry."],"syn":"compensate for"},{"w":"depletion","pos":"danh từ","ipa":"/dɪˈpliːʃn/","vi":"sự cạn kiệt","use":"không đếm được; ozone / resource + depletion; the depletion of + N","ex":["The rapid depletion of groundwater is a serious problem in many regions.","International agreements have slowed ozone depletion since the late 1980s."],"syn":"running out"},{"w":"raise awareness","pos":"cụm động từ","ipa":"/ˌreɪz əˈweənəs/","vi":"nâng cao nhận thức","use":"raise awareness of/about + N","ex":["Television campaigns can raise awareness of the dangers of plastic waste.","Schools should raise awareness about recycling from an early age."],"syn":"inform the public"},{"w":"carbon neutral","pos":"cụm tính từ","ipa":"/ˌkɑːbən ˈnjuːtrəl/","vi":"trung hòa carbon","use":"become / go + carbon neutral by + năm","ex":["South Korea aims to become carbon neutral by 2050.","The university wants all its buildings to be carbon neutral within ten years."],"syn":"net-zero"},{"w":"contaminate","pos":"động từ","ipa":"/kənˈtæmɪneɪt/","vi":"làm nhiễm bẩn","use":"động từ + tân ngữ; be contaminated with + N","ex":["Chemicals from factories can contaminate rivers and local drinking water.","Large areas of farmland were contaminated with heavy metals."],"syn":"pollute"},{"w":"adapt to","pos":"cụm động từ","ipa":"/əˈdæpt tə/","vi":"thích nghi với","use":"adapt to + N/V-ing; adapt to + climate change/new conditions","ex":["Coastal communities must adapt to more frequent storms and flooding.","Scientists are developing rice varieties that can adapt to hotter, drier conditions."],"syn":"adjust to"}]},{"id":"v03","en":"Technology & Media","vi":"Công nghệ và truyền thông","desc":"Từ vựng về thiết bị số, mạng xã hội, truyền thông và tác động của công nghệ.","words":[{"w":"device","pos":"danh từ","ipa":"/dɪˈvaɪs/","vi":"thiết bị","use":"đếm được; electronic / mobile + device(s)","ex":["Most teenagers now own at least one electronic device.","Mobile devices allow people to work from almost anywhere."],"syn":"gadget"},{"w":"social media","pos":"cụm danh từ","ipa":"/ˌsəʊʃl ˈmiːdiə/","vi":"mạng xã hội","use":"không đếm được; on social media; use / spend time on + social media","ex":["Young people spend several hours a day on social media.","Social media has changed the way politicians communicate with voters."],"syn":"social networks"},{"w":"screen time","pos":"cụm danh từ","ipa":"/ˈskriːn taɪm/","vi":"thời gian dùng màn hình","use":"không đếm được; limit / reduce + screen time","ex":["Parents should limit their children's screen time, especially before bed.","Excessive screen time has been linked to poor sleep and eye strain."],"syn":"time on devices"},{"w":"advertising","pos":"danh từ","ipa":"/ˈædvətaɪzɪŋ/","vi":"quảng cáo","use":"không đếm được; online / targeted + advertising","ex":["Advertising aimed at young children should be strictly controlled.","Online advertising now earns more money than television advertising."],"syn":"marketing"},{"w":"technological advances","pos":"cụm danh từ","ipa":"/ˌteknəˌlɒdʒɪkl ədˈvɑːnsɪz/","vi":"những tiến bộ công nghệ","use":"số nhiều; recent / rapid + technological advances in + N","ex":["Recent technological advances have transformed the way we shop.","Technological advances in medicine have greatly increased life expectancy."],"syn":"new technology"},{"w":"communicate","pos":"động từ","ipa":"/kəˈmjuːnɪkeɪt/","vi":"giao tiếp, liên lạc","use":"communicate with + sb; communicate + ideas/information","ex":["Video calls allow families to communicate with relatives living abroad.","Engineers must be able to communicate complex ideas clearly."],"syn":"talk"},{"w":"keep in touch with","pos":"cụm động từ","ipa":"/ˌkiːp ɪn ˈtʌtʃ wɪð/","vi":"giữ liên lạc với","use":"keep in touch with + sb; = stay in touch with","ex":["Messaging apps make it easy to keep in touch with old friends.","Many migrant workers keep in touch with their families through video calls."],"syn":"stay in contact with"},{"w":"convenient","pos":"tính từ","ipa":"/kənˈviːniənt/","vi":"tiện lợi","use":"tính từ; convenient for sb; it is convenient to do sth","ex":["Online banking is far more convenient than visiting a branch.","Smartphones make it convenient to pay bills at any time."],"syn":"handy"},{"w":"artificial intelligence","pos":"cụm danh từ","ipa":"/ˌɑːtɪˌfɪʃl ɪnˈtelɪdʒəns/","vi":"trí tuệ nhân tạo","use":"không đếm được (AI); develop / use + artificial intelligence","ex":["Artificial intelligence is already used to help doctors diagnose some diseases.","Many workers worry that artificial intelligence will take their jobs."],"syn":"AI"},{"w":"addicted to","pos":"cụm tính từ","ipa":"/əˈdɪktɪd tə/","vi":"nghiện","use":"be/become + addicted to + N/V-ing","ex":["Many teenagers are addicted to their phones and online games.","Some adults become addicted to checking social media every few minutes."],"syn":"hooked on"},{"w":"mass media","pos":"cụm danh từ","ipa":"/ˌmæs ˈmiːdiə/","vi":"truyền thông đại chúng","use":"the mass media + V; the influence of + the mass media","ex":["The mass media has a powerful influence on public opinion.","Young people's values are shaped partly by the mass media."],"syn":"the press"},{"w":"fake news","pos":"cụm danh từ","ipa":"/ˌfeɪk ˈnjuːz/","vi":"tin giả","use":"không đếm được; spread / recognise + fake news","ex":["Fake news can spread across the internet within a few hours.","Schools should teach students how to recognise fake news."],"syn":"false reports"},{"w":"go viral","pos":"cụm động từ","ipa":"/ˌɡəʊ ˈvaɪrəl/","vi":"lan truyền chóng mặt","use":"nội động từ; a video/post + goes viral","ex":["A single funny video can go viral and reach millions overnight.","Companies hope their advertisements will go viral on social platforms."],"syn":"spread quickly"},{"w":"invasion of privacy","pos":"cụm danh từ","ipa":"/ɪnˌveɪʒn əv ˈprɪvəsi/","vi":"xâm phạm quyền riêng tư","use":"đếm được; a serious / an unacceptable + invasion of privacy","ex":["Many people see constant online tracking as an invasion of privacy.","Installing cameras in classrooms could be a serious invasion of privacy."],"syn":"privacy violation"},{"w":"digital divide","pos":"cụm danh từ","ipa":"/ˌdɪdʒɪtl dɪˈvaɪd/","vi":"khoảng cách số","use":"số ít (the digital divide); narrow / widen + the digital divide","ex":["The digital divide leaves many elderly people unable to use online services.","Providing free internet in rural areas could narrow the digital divide."],"syn":"technology gap"},{"w":"rely on","pos":"cụm động từ","ipa":"/rɪˈlaɪ ɒn/","vi":"phụ thuộc vào","use":"rely on + N/sb; rely on sb to do sth","ex":["Many students now rely on search engines rather than printed books.","Modern businesses rely on cloud storage to protect important data."],"syn":"depend on"},{"w":"user-friendly","pos":"tính từ","ipa":"/ˌjuːzə ˈfrendli/","vi":"dễ sử dụng","use":"tính từ; a user-friendly + app/interface/website","ex":["The new banking app is user-friendly, even for older customers.","Designers aim to create user-friendly websites that load quickly."],"syn":"easy to use"},{"w":"cyberbullying","pos":"danh từ","ipa":"/ˈsaɪbəbʊliɪŋ/","vi":"bắt nạt trên mạng","use":"không đếm được; be a victim of / prevent + cyberbullying","ex":["Cyberbullying can cause serious anxiety and depression among teenagers.","Schools need clear policies to protect students from cyberbullying."],"syn":"online harassment"},{"w":"automation","pos":"danh từ","ipa":"/ˌɔːtəˈmeɪʃn/","vi":"tự động hóa","use":"không đếm được; the automation of + N; job losses due to + automation","ex":["Automation has replaced many repetitive jobs in car factories.","Workers need retraining to cope with the growing automation of industry."],"syn":"mechanisation"},{"w":"replace human workers","pos":"cụm động từ","ipa":"/rɪˌpleɪs ˌhjuːmən ˈwɜːkəz/","vi":"thay thế người lao động","use":"replace human workers in + ngành; bị động: be replaced by robots","ex":["Robots may replace human workers in many routine manufacturing jobs.","Self-service machines have started to replace human workers in supermarkets."],"syn":"take over people's jobs"},{"w":"sedentary lifestyle","pos":"cụm danh từ","ipa":"/ˌsedntri ˈlaɪfstaɪl/","vi":"lối sống ít vận động","use":"đếm được; lead / adopt + a sedentary lifestyle","ex":["Spending hours in front of screens encourages a sedentary lifestyle.","A sedentary lifestyle increases the risk of obesity and heart disease."],"syn":"inactive way of life"},{"w":"personal data","pos":"cụm danh từ","ipa":"/ˌpɜːsənl ˈdeɪtə/","vi":"dữ liệu cá nhân","use":"không đếm được; collect / protect / share + personal data","ex":["Tech companies collect huge amounts of personal data from their users.","Stronger laws are needed to protect personal data from hackers."],"syn":"private information"},{"w":"misleading","pos":"tính từ","ipa":"/ˌmɪsˈliːdɪŋ/","vi":"gây hiểu lầm","use":"tính từ; misleading + information/claims/headlines","ex":["Some advertisements make misleading claims about the health benefits of products.","Misleading headlines are often designed simply to attract more clicks."],"syn":"deceptive"},{"w":"spread misinformation","pos":"cụm động từ","ipa":"/ˌspred ˌmɪsɪnfəˈmeɪʃn/","vi":"lan truyền thông tin sai lệch","use":"spread misinformation about + N (misinformation: không đếm được)","ex":["Some users deliberately spread misinformation about vaccines online.","Platforms are criticised for allowing automated accounts to spread misinformation."],"syn":"share false information"},{"w":"breakthrough","pos":"danh từ","ipa":"/ˈbreɪkθruː/","vi":"bước đột phá","use":"đếm được; make / achieve + a breakthrough in + N","ex":["Scientists have made a major breakthrough in battery technology.","The smartphone was a breakthrough that changed daily life completely."],"syn":"major advance"},{"w":"obsolete","pos":"tính từ","ipa":"/ˈɒbsəliːt/","vi":"lỗi thời","use":"tính từ; become / be made + obsolete","ex":["Many traditional jobs may become obsolete within the next twenty years.","Fax machines are now almost completely obsolete in most offices."],"syn":"outdated"},{"w":"censorship","pos":"danh từ","ipa":"/ˈsensəʃɪp/","vi":"sự kiểm duyệt","use":"không đếm được; internet / government + censorship","ex":["Internet censorship prevents citizens from accessing independent news sources.","Some people believe a degree of censorship is necessary to protect children."],"syn":"control of information"},{"w":"stay up to date with","pos":"cụm động từ","ipa":"/ˌsteɪ ˌʌp tə ˈdeɪt wɪð/","vi":"cập nhật thông tin mới","use":"stay up to date with + news/developments/trends","ex":["Professionals take online courses to stay up to date with new trends.","Many people stay up to date with the news through mobile apps."],"syn":"keep informed about"},{"w":"target audience","pos":"cụm danh từ","ipa":"/ˌtɑːɡɪt ˈɔːdiəns/","vi":"đối tượng khán giả mục tiêu","use":"đếm được; reach / attract + a target audience","ex":["Social media helps companies reach their target audience at low cost.","The target audience for this programme is mainly young adults."],"syn":"intended viewers"},{"w":"remote working","pos":"cụm danh từ","ipa":"/rɪˌməʊt ˈwɜːkɪŋ/","vi":"làm việc từ xa","use":"không đếm được; the rise of / a shift to + remote working","ex":["Fast internet connections have made remote working possible for millions.","The pandemic caused a sudden shift to remote working around the world."],"syn":"working from home"},{"w":"cutting-edge","pos":"tính từ","ipa":"/ˌkʌtɪŋ ˈedʒ/","vi":"tiên tiến nhất","use":"tính từ đứng trước N; cutting-edge + technology/research","ex":["The laboratory is equipped with cutting-edge technology for materials testing.","Korea invests heavily in cutting-edge research on semiconductors and batteries."],"syn":"the most advanced"},{"w":"vulnerable to","pos":"cụm tính từ","ipa":"/ˈvʌlnərəbl tə/","vi":"dễ bị tổn hại bởi","use":"be + vulnerable to + N (attacks/scams)","ex":["Elderly users are particularly vulnerable to online scams and fraud.","Poorly protected computer systems are vulnerable to attacks by hackers."],"syn":"at risk from"},{"w":"manipulate","pos":"động từ","ipa":"/məˈnɪpjuleɪt/","vi":"thao túng","use":"động từ + tân ngữ; manipulate + public opinion/images/data","ex":["Political groups can use social media to manipulate public opinion.","Digital editing tools make it easy to manipulate photographs convincingly."],"syn":"control unfairly"},{"w":"surveillance","pos":"danh từ","ipa":"/səˈveɪləns/","vi":"sự giám sát","use":"không đếm được; under surveillance; surveillance cameras","ex":["Surveillance cameras help police to identify criminals more quickly.","Critics fear that mass surveillance threatens basic civil liberties."],"syn":"monitoring"},{"w":"face-to-face interaction","pos":"cụm danh từ","ipa":"/ˌfeɪs tə ˌfeɪs ˌɪntərˈækʃn/","vi":"giao tiếp trực tiếp","use":"không đếm được; replace / reduce + face-to-face interaction","ex":["Online chatting cannot fully replace face-to-face interaction between friends.","Children need regular face-to-face interaction to develop social skills."],"syn":"in-person contact"},{"w":"revolutionise","pos":"động từ","ipa":"/ˌrevəˈluːʃənaɪz/","vi":"cách mạng hóa","use":"động từ + tân ngữ; revolutionise + the way + S + V","ex":["The internet has revolutionised the way people access information.","Artificial intelligence could revolutionise healthcare in the coming decade."],"syn":"transform"},{"w":"streaming services","pos":"cụm danh từ","ipa":"/ˈstriːmɪŋ ˌsɜːvɪsɪz/","vi":"dịch vụ phát trực tuyến","use":"số nhiều; subscribe to + streaming services","ex":["Streaming services have led to a decline in cinema attendance.","Many families now subscribe to two or three streaming services."],"syn":"online video platforms"},{"w":"regulate","pos":"động từ","ipa":"/ˈreɡjuleɪt/","vi":"điều tiết, quản lý","use":"động từ + tân ngữ; regulate + tech companies/content","ex":["Governments are struggling to regulate powerful global technology companies.","Clear laws are needed to regulate the use of facial recognition."],"syn":"control"},{"w":"tech-savvy","pos":"tính từ","ipa":"/ˈtek ˌsævi/","vi":"thành thạo công nghệ","use":"tính từ; a tech-savvy + generation/user","ex":["Today's tech-savvy generation learns new apps almost instantly.","Older employees may feel left behind by their tech-savvy colleagues."],"syn":"good with technology"},{"w":"double-edged sword","pos":"cụm danh từ","ipa":"/ˌdʌbl ˌedʒd ˈsɔːd/","vi":"con dao hai lưỡi","use":"số ít; be + a double-edged sword (for sb)","ex":["Social media is a double-edged sword for young people.","For many workers, constant connectivity has proved a double-edged sword."],"syn":"mixed blessing"}]},{"id":"v04","en":"Health & Lifestyle","vi":"Sức khỏe và lối sống","desc":"Từ vựng về sức khỏe, dinh dưỡng, tập luyện và thói quen sống hằng ngày.","words":[{"w":"healthy lifestyle","pos":"cụm danh từ","ipa":"/ˌhelθi ˈlaɪfstaɪl/","vi":"lối sống lành mạnh","use":"đếm được; lead / maintain + a healthy lifestyle","ex":["Many young people find it hard to maintain a healthy lifestyle in big cities.","Schools should teach children the basics of a healthy lifestyle from an early age."],"syn":"healthy way of living"},{"w":"balanced diet","pos":"cụm danh từ","ipa":"/ˌbælənst ˈdaɪət/","vi":"chế độ ăn cân bằng","use":"đếm được; eat / follow + a balanced diet","ex":["A balanced diet provides the body with all the nutrients it needs.","Busy office workers often struggle to eat a balanced diet."],"syn":"healthy diet"},{"w":"physical activity","pos":"cụm danh từ","ipa":"/ˌfɪzɪkl ækˈtɪvəti/","vi":"hoạt động thể chất","use":"không đếm được; do / increase + physical activity","ex":["Children need at least one hour of physical activity every day.","A lack of physical activity is a major cause of weight gain."],"syn":"exercise"},{"w":"obesity","pos":"danh từ","ipa":"/əʊˈbiːsəti/","vi":"bệnh béo phì","use":"không đếm được; childhood obesity, the obesity rate","ex":["Childhood obesity has risen sharply in many developed countries over recent decades.","Governments must act quickly to reduce rates of obesity among teenagers."],"syn":"being overweight"},{"w":"exercise regularly","pos":"cụm động từ","ipa":"/ˈeksəsaɪz ˈreɡjələli/","vi":"tập thể dục đều đặn","use":"nội động từ + trạng từ; people who exercise regularly ...","ex":["People who exercise regularly tend to sleep better and feel less stressed.","Doctors advise older adults to exercise regularly to protect their joints."],"syn":"work out often"},{"w":"junk food","pos":"cụm danh từ","ipa":"/ˈdʒʌŋk fuːd/","vi":"đồ ăn vặt không lành mạnh","use":"không đếm được; eat / ban + junk food","ex":["Some schools have completely banned junk food from their canteens.","Advertising junk food to children should be strictly controlled by law."],"syn":"unhealthy food"},{"w":"sedentary","pos":"tính từ","ipa":"/ˈsedntri/","vi":"ít vận động","use":"đứng trước danh từ; a sedentary lifestyle / sedentary job","ex":["Office workers often have a sedentary lifestyle and rarely walk during the day.","Long hours of sedentary work can cause back and neck problems."],"syn":"inactive"},{"w":"mental health","pos":"cụm danh từ","ipa":"/ˌmentl ˈhelθ/","vi":"sức khỏe tinh thần","use":"không đếm được; improve / affect + mental health","ex":["Social media can have a negative effect on teenagers' mental health.","Employers are paying more attention to the mental health of their staff."],"syn":"psychological health"},{"w":"cut down on","pos":"cụm động từ","ipa":"/ˌkʌt ˈdaʊn ɒn/","vi":"cắt giảm","use":"+ danh từ/V-ing; cut down on sugar / salt / alcohol","ex":["Most people could improve their health simply by cutting down on sugar.","My doctor told me to cut down on coffee and salty food."],"syn":"reduce"},{"w":"stay in shape","pos":"cụm động từ","ipa":"/ˌsteɪ ɪn ˈʃeɪp/","vi":"giữ dáng, giữ sức khỏe","use":"nội động từ; stay / keep + in shape","ex":["Many students cycle to campus as an easy way to stay in shape.","It becomes harder to stay in shape as people get older."],"syn":"keep fit"},{"w":"nutritious","pos":"tính từ","ipa":"/njuˈtrɪʃəs/","vi":"bổ dưỡng","use":"nutritious food / meals; cheap and nutritious","ex":["School lunches should be both cheap and nutritious for every pupil.","Fresh vegetables are far more nutritious than most packaged snacks."],"syn":"healthy"},{"w":"well-being","pos":"danh từ","ipa":"/ˌwelˈbiːɪŋ/","vi":"sự khỏe mạnh, hạnh phúc","use":"không đếm được; physical / mental well-being","ex":["Regular contact with nature improves our physical and mental well-being.","A pleasant work environment is essential for the well-being of employees."],"syn":"health and happiness"},{"w":"chronic disease","pos":"cụm danh từ","ipa":"/ˌkrɒnɪk dɪˈziːz/","vi":"bệnh mãn tính","use":"đếm được; suffer from / prevent + chronic diseases","ex":["Poor diet is closely linked to chronic diseases such as diabetes.","Millions of elderly people live with at least one chronic disease."],"syn":"long-term illness"},{"w":"life expectancy","pos":"cụm danh từ","ipa":"/ˈlaɪf ɪkˌspektənsi/","vi":"tuổi thọ trung bình","use":"không đếm được; life r quick evening meals.","Processed foods often contain high levels of salt, sugar and fat."],"syn":"ready-made food"},{"w":"prone to","pos":"cụm tính từ","ipa":"/ˈprəʊn tə/","vi":"dễ mắc phải","use":"be prone to + N/V-ing; prone to injury / illness","ex":["Office workers are prone to back pain and eye strain.","Children who sleep badly are more prone to catching colds."],"syn":"likely to suffer from"},{"w":"boost the immune system","pos":"cụm động từ","ipa":"/ˌbuːst ði ɪˈmjuːn ˌsɪstəm/","vi":"tăng cường hệ miễn dịch","use":"động từ + tân ngữ; boost / strengthen + the immune system","ex":["Regular exercise and good sleep help boost the immune system.","Some people claim that vitamin C can boost the immune system."],"syn":"strengthen the body's defences"},{"w":"moderation","pos":"danh từ","ipa":"/ˌmɒdəˈreɪʃn/","vi":"sự điều độ","use":"không đếm được; thường dùng: in moderation","ex":["Sweets are not harmful if they are eaten in moderation.","Moderation is the key to enjoying food without damaging your health."],"syn":"not too much"},{"w":"take up","pos":"cụm động từ","ipa":"/ˌteɪk ˈʌp/","vi":"bắt đầu (môn thể thao, sở thích)","use":"+ N/V-ing; take up a sport / yoga / running","ex":["Many retirees take up swimming as a way to stay active.","Encouraging teenagers to take up a team sport builds discipline."],"syn":"start"},{"w":"pose a risk","pos":"cụm động từ","ipa":"/ˌpəʊz ə ˈrɪsk/","vi":"gây ra nguy cơ","use":"pose a (serious) risk to + N","ex":["Excessive screen time may pose a risk to children's eyesight.","Air pollution poses a serious risk to people with asthma."],"syn":"be dangerous to"},{"w":"addictive","pos":"tính từ","ipa":"/əˈdɪktɪv/","vi":"gây nghiện","use":"highly addictive; addictive substance / games","ex":["Nicotine is a highly addictive substance found in all cigarettes.","Some mobile games are deliberately designed to be addictive."],"syn":"habit-forming"},{"w":"unhealthy habits","pos":"cụm danh từ","ipa":"/ʌnˌhelθi ˈhæbɪts/","vi":"thói quen không làn ."],"syn":"availability of medical care"},{"w":"deteriorate","pos":"động từ","ipa":"/dɪˈtɪəriəreɪt/","vi":"xấu đi, suy giảm","use":"nội động từ; health / condition + deteriorates","ex":["Without treatment, the patient's condition may deteriorate quickly.","Her eyesight began to deteriorate after years of working at a screen."],"syn":"get worse"}]},{"id":"v05","en":"Work & Careers","vi":"Công việc và sự nghiệp","desc":"Từ vựng về việc làm, môi trường công sở, kỹ năng và phát triển sự nghiệp.","words":[{"w":"job satisfaction","pos":"cụm danh từ","ipa":"/ˈdʒɒb ˌsætɪsˈfækʃn/","vi":"sự hài lòng trong công việc","use":"không đếm được; high / low + job satisfaction","ex":["Job satisfaction often depends more on good colleagues than on salary.","Employees with high job satisfaction are less likely to quit."],"syn":"enjoyment of work"},{"w":"salary","pos":"danh từ","ipa":"/ˈsæləri/","vi":"lương","use":"đếm được; earn / offer + a high salary","ex":["Graduates in engineering usually earn a higher starting salary.","A good salary is not the only reason people choose a job."],"syn":"pay"},{"w":"career path","pos":"cụm danh từ","ipa":"/kəˈrɪə pɑːθ/","vi":"con đường sự nghiệp","use":"đếm được; choose / follow + a career path","ex":["Choosing a career path at eighteen is difficult for many students.","Her career path took her from the laboratory into management."],"syn":"career direction"},{"w":"work-life balance","pos":"cụm danh từ","ipa":"/ˌwɜːk ˌlaɪf ˈbæləns/","vi":"cân bằng công việc và cuộc sống","use":"không đếm được; achieve / maintain + a good work-life balance","ex":["Flexible hours help parents achieve a better work-life balance.","Young workers increasingly value work-life balance over high pay."],"syn":"balance between work and personal life"},{"w":"colleague","pos":"danh từ","ipa":"/ˈkɒliːɡ/","vi":"đồng nghiệp","use":"đếm được; work closely with + colleagues","ex":["I often discuss new ideas with my colleagues over lunch.","Good relationships with colleagues make stres "use":"đếm được; have a monopoly on / over + N","ex":["A single company should not have a monopoly on public transport.","Monopolies can charge high prices because consumers have no alternative."],"syn":"total control of a market"},{"w":"drive up prices","pos":"cụm động từ","ipa":"/ˌdraɪv ʌp ˈpraɪsɪz/","vi":"đẩy giá lên","use":"động từ + tân ngữ; drive up prices of / in + N","ex":["Foreign investors have driven up prices in the housing market.","Shortages of raw materials drive up prices for manufacturers."],"syn":"push up prices"},{"w":"labour shortage","pos":"cụm danh từ","ipa":"/ˈleɪbə ˌʃɔːtɪdʒ/","vi":"thiếu hụt lao động","use":"đếm được; face / ease + a labour shortage","ex":["Korea faces a growing labour shortage due to its ageing population.","Hiring foreign workers can help ease the labour shortage in farming."],"syn":"lack of workers"},{"w":"e-commerce","pos":"danh từ","ipa":"/ˌiː ˈkɒmɜːs/","vi":"thương mại điện tử","use":"không đếm được; the growth of e-commerce, e-commerce platforms","ex":["The rapid growth of e-commerce has hurt traditional shopping malls.","Small sellers can reach global customers through e-commerce platforms."],"syn":"online shopping"},{"w":"outsource","pos":"động từ","ipa":"/ˈaʊtsɔːs/","vi":"thuê ngoài","use":"động từ + tân ngữ; outsource production / jobs to + nơi","ex":["Many tech firms outsource customer service to other countries.","Outsourcing production can lower costs but damage product quality."],"syn":"contract out"}]},{"id":"v07","en":"Cities, Housing & Transport","vi":"Đô thị, nhà ở và giao thông","desc":"Từ vựng về cuộc sống đô thị, nhà ở, giao thông và quy hoạch thành phố.","words":[{"w":"public transport","pos":"cụm danh từ","ipa":"/ˌpʌblɪk ˈtrænspɔːt/","vi":"giao thông công cộng","use":"không đếm được; use / rely on / invest in + public transport","ex":["Many young people in Seoul use public transport instead of buying a car.","The government should invest more in public transport to reduce car use."],"syn":"mass transit"},{"w":"traffic congestion","pos":"cụm danh từ","ipa":"/ˈtræfɪk kənˌdʒestʃən/","vi":"ùn tắc giao thông","use":"không đếm được; ease / reduce / tackle + traffic congestion","ex":["Traffic congestion wastes millions of working hours in large cities every year.","Building more roads rarely solves traffic congestion in the long term."],"syn":"traffic jams"},{"w":"urban","pos":"tính từ","ipa":"/ˈɜːbən/","vi":"thuộc đô thị","use":"đứng trước danh từ; urban areas / urban life / urban planning","ex":["Urban areas usually offer better job opportunities than the countryside.","Urban life can be exciting, but it is often stressful and expensive."],"syn":"city"},{"w":"rural","pos":"tính từ","ipa":"/ˈrʊərəl/","vi":"thuộc nông thôn","use":"đứng trước danh từ; rural areas / rural communities","ex":["Young people are leaving rural areas to look for work in cities.","Improving internet access could make rural communities more attractive to families."],"syn":"country"},{"w":"commute","pos":"động từ","ipa":"/kəˈmjuːt/","vi":"đi làm hằng ngày","use":"nội động từ; commute to work / commute by train","ex":["Thousands of workers commute to the capital by train every morning.","People who commute long distances often have less time for their families."],"syn":"travel to work"},{"w":"affordable housing","pos":"cụm danh từ","ipa":"/əˌfɔːdəbl ˈhaʊzɪŋ/","vi":"nhà ở giá phải chăng","use":"không đếm được; build / provide + affordable housing; a lack of + N","ex":["There is a serious lack of affordable housing for young couples in big cities.","Local councils should build more affordable housing near public transport links."],"syn":"low-cost homes"},{"w":"pedestrian","pos":"danh từ","ipa":"/pəˈdestriən/","vi":"người đi bộ","use":"đếm được; pedestrian safety / pedestrian zone (dùng như tính từ)","ex":["Several streets in the old town are now open only to pedestrians.","Wider pavements would greatly improve pedestrian safety on busy roads."],"syn":"walker"},{"w":"rush hour","pos":"cụm danh từ","ipa":"/ˈrʌʃ aʊə/","vi":"giờ cao điểm","use":"không đếm được; during / at + rush hour; rush-hour traffic","ex":["Trains are extremely crowded during rush hour, especially in the morning.","Flexible working hours could help reduce traffic at rush hour."],"syn":"peak time"},{"w":"infrastructure","pos":"danh từ","ipa":"/ˈɪnfrəstrʌktʃə/","vi":"cơ sở hạ tầng","use":"không đếm được; invest in / improve + (transport) infrastructure","ex":["Rapid population growth has put great pressure on the city's infrastructure.","Developing countries need to invest heavily in transport infrastructure."],"syn":"basic facilities"},{"w":"overcrowded","pos":"tính từ","ipa":"/ˌəʊvəˈkraʊdɪd/","vi":"quá đông đúc","use":"tính từ; overcrowded cities / buses / housing","ex":["Many capital cities have become overcrowded, noisy and polluted.","Overcrowded buses make commuting an unpleasant experience for passengers."],"syn":"too crowded"},{"w":"cost of living","pos":"cụm danh từ","ipa":"/ˌkɒst əv ˈlɪvɪŋ/","vi":"chi phí sinh hoạt","use":"thường có 'the'; the rising / high + cost of living","ex":["The high cost of living in big cities forces many families to move away.","Wages have not kept up with the rising cost of living."],"syn":"living expenses"},{"w":"city dweller","pos":"cụm danh từ","ipa":"/ˈsɪti ˌdwelə/","vi":"cư dân thành phố","use":"đếm được, hay dùng số nhiều; city dwellers + tend to / often + V","ex":["Most city dwellers live in small apartments with little outdoor space.","City dwellers often depend on cafés and parks to meet friends."],"syn":"urban resident"},{"w":"private car","pos":"cụm danh từ","ipa":"/ˌpraɪvət ˈkɑː/","vi":"ô tô cá nhân","use":"đếm được; reliance on / own + a private car","ex":["Reliance on the private car leads to traffic jams and air pollution.","Fewer people would own a private car if buses were more reliable."],"syn":"personal vehicle"},{"w":"housing shortage","pos":"cụm danh từ","ipa":"/ˈhaʊzɪŋ ˌʃɔːtɪdʒ/","vi":"tình trạng thiếu nhà ở","use":"đếm được; a severe / y to work."],"syn":"outskirts"},{"w":"cycle lane","pos":"cụm danh từ","ipa":"/ˈsaɪkl leɪn/","vi":"làn đường xe đạp","use":"đếm được; build / add + cycle lanes; protected cycle lanes","ex":["Protected cycle lanes encourage more people to ride bicycles to work.","The council plans to add cycle lanes along all major roads."],"syn":"bike lane"},{"w":"exhaust fumes","pos":"cụm danh từ","ipa":"/ɪɡˈzɔːst fjuːmz/","vi":"khí thải xe cộ","use":"số nhiều; exhaust fumes from + vehicles; exposure to + exhaust fumes","ex":["Exhaust fumes from cars and buses are a major cause of breathing problems.","Children walking to school are exposed to high levels of exhaust fumes."],"syn":"vehicle emissions"},{"w":"urbanisation","pos":"danh từ","ipa":"/ˌɜːbənaɪˈzeɪʃn/","vi":"quá trình đô thị hóa","use":"không đếm được; rapid urbanisation (Mỹ: urbanization)","ex":["Rapid urbanisation has created huge challenges for housing and transport.","Urbanisation in Asia has lifted millions of people out of poverty."],"syn":"growth of cities"},{"w":"upgrade","pos":"động từ","ipa":"/ˌʌpˈɡreɪd/","vi":"nâng cấp","use":"động từ + tân ngữ; upgrade + roads / the rail network","ex":["The government plans to upgrade the rail network over the next decade.","Upgrading old bus fleets to electric models would cut pollution significantly."],"syn":"improve"},{"w":"accessible","pos":"tính từ","ipa":"/əkˈsesəbl/","vi":"dễ tiếp cận","use":"accessible to + người; accessible by + phương tiện","ex":["Public buildings should be fully accessible to people in wheelchairs.","New housing estates must be accessible by public transport."],"syn":"easy to reach"},{"w":"relocate","pos":"động từ","ipa":"/ˌriːləʊˈkeɪt/","vi":"di dời, chuyển đi","use":"relocate (sth) to / from + nơi; relocate offices / businesses","ex":["Several companies have relocated their offices from the capital to smaller cities.","Encouraging businesses to relocate could reduce pressure on overcrowded cities."],"syn":"move"},{"w":"within walking distance","pos":"cụm giới từ","ipa":"/wɪˌðɪn ˈwɔːkɪŋ ˌdɪstəns/","vi":"trong khoảng đi bộ được","use":"cụm giới từ; within walking distance of + nơi","ex":["Ideally, shops and schools should be within walking distance of every home.","I prefer to live within walking distance of a subway station."],"syn":"close by"},{"w":"pull down","pos":"cụm động từ","ipa":"/ˌpʊl ˈdaʊn/","vi":"phá dỡ (nhà cửa)","use":"pull down + tòa nhà (= demolish); hay dùng bị động","ex":["Many historic buildings were pulled down to make way for shopping centres.","Instead of pulling down old factories, cities can turn them into apartments."],"syn":"demolish"},{"w":"urban sprawl","pos":"cụm danh từ","ipa":"/ˌɜːbən ˈsprɔːl/","vi":"đô thị lan rộng tự phát","use":"không đếm được; limit / control + urban sprawl","ex":["Urban sprawl increases car dependence because homes are far from workplaces.","Strict planning laws can help limit urban sprawl and protect farmland."],"syn":"spread of cities"},{"w":"urban regeneration","pos":"cụm danh từ","ipa":"/ˌɜːbən rɪˌdʒenəˈreɪʃn/","vi":"tái thiết đô thị","use":"không đếm được; urban regeneration project / scheme","ex":["Urban regeneration has transformed the old port into a lively neighbourhood.","The project combines urban regeneration with new affordable homes for local people."],"syn":"city renewal"},{"w":"gentrification","pos":"danh từ","ipa":"/ˌdʒentrɪfɪˈkeɪʃn/","vi":"quá trình cải tạo đẩy giá khu phố","use":"không đếm được; gentrification pushes out + residents","ex":["Gentrification often pushes long-term residents out of their own neighbourhoods.","Critics argue that gentrification benefits investors more than local communities."],"syn":"neighbourhood upgrading"},{"w":"drive up","pos":"cụm động từ","ipa":"/ˌdraɪv ˈʌp/","vi":"đẩy (giá) lên","use":"drive up + prices / rents / costs","ex":["Foreign investment in property is driving up house prices in the capital.","Short-term holiday rentals drive up rents for local residents."],"syn":"push up"},{"w":"alleviate","pos":"động từ","ipa":"/əˈliːvieɪt/","vi":"làm giảm bớt","use":"động từ + tân ngữ; alleviate + congestion / overcrowding","ex":["Building a new metro line would alleviate congestion in the city centre.","Remote working may help alleviate overcrowding on morning trains."],"syn":"ease"},{"w":"densely populated","pos":"cụm tính từ","ipa":"/ˌdensli ˈpɒpjuleɪtɪd/","vi":"dân cư đông đúc","use":"cụm tính từ; a densely populated + city / area / country","ex":["Seoul is one of the most densely populated cities in the developed world.","Diseases can spread quickly in densely populated areas with poor sanitation."],"syn":"crowded"},{"w":"impose a congestion charge","pos":"cụm động từ","ipa":"/ɪmˌpəʊz ə kənˈdʒestʃən tʃɑːdʒ/","vi":"thu phí chống ùn tắc","use":"impose a congestion charge on + drivers / vehicles","ex":["London decided to impose a congestion charge on drivers entering the centre.","Imposing a congestion charge can reduce traffic and raise money for buses."],"syn":"charge drivers to enter"},{"w":"prioritise","pos":"động từ","ipa":"/praɪˈɒrətaɪz/","vi":"ưu tiên","use":"prioritise + A over B (Mỹ: prioritize)","ex":["Planners should prioritise pedestrians and cyclists over private cars.","The new mayor has promised to prioritise housing for low-income families."],"syn":"put first"},{"w":"sustainable transport","pos":"cụm danh từ","ipa":"/səˌsteɪnəbl ˈtrænspɔːt/","vi":"giao thông bền vững","use":"không đếm được; promote / invest in + sustainable transport","ex":["Electric buses and cycling schemes are key forms of sustainable transport.","Governments can promote sustainable transport by making train tickets cheaper."],"syn":"green transport"},{"w":"ease the pressure on","pos":"cụm động từ","ipa":"/ˌiːz ðə ˈpreʃər ɒn/","vi":"giảm áp lực lên","use":"ease the pressure on + roads / services / cities","ex":["A second airport would ease the pressure on the existing one.","Building homes in smaller towns could ease the pressure on big cities."],"syn":"relieve"},{"w":"get on the property ladder","pos":"cụm động từ","ipa":"/ɡet ˌɒn ðə ˈprɒpəti ˌlædə/","vi":"mua được căn nhà đầu tiên","use":"thành ngữ; first-time buyers + get on the property ladder","ex":["Many young adults cannot save enough money to get on the property ladder.","Government loans help first-time buyers get on the property ladder."],"syn":"buy a first home"},{"w":"homelessness","pos":"danh từ","ipa":"/ˈhəʊmləsnəs/","vi":"tình trạng vô gia cư","use":"không đếm được; tackle / reduce + homelessness","ex":["Rising rents are one of the main causes of homelessness in cities.","Charities and local governments must work together to tackle homelessness."],"syn":"sleeping rough"}]},{"id":"v08","en":"Crime, Law & Government","vi":"Tội phạm, pháp luật và chính phủ","desc":"Từ vựng về tội phạm, hình phạt, luật pháp và vai trò của chính phủ.","words":[{"w":"commit a crime","pos":"cụm động từ","ipa":"/kəˌmɪt ə ˈkraɪm/","vi":"phạm tội","use":"commit a crime / an offence; commit crimes against + N","ex":["Young people who commit a crime should be given a second chance.","Most people who committed a crime as teenagers never offend again."],"syn":"do something illegal"},{"w":"criminal","pos":"danh từ","ipa":"/ˈkrɪmɪnl/","vi":"kẻ phạm tội","use":"đếm được; cũng là tính từ: criminal behaviour / criminal activity","ex":["Some criminals return to prison within a year of being released.","Many people believe that criminals should pay compensation to their victims."],"syn":"lawbreaker"},{"w":"crime rate","pos":"cụm danh từ","ipa":"/ˈkraɪm reɪt/","vi":"tỷ lệ tội phạm","use":"đếm được; the crime rate + rises / falls; a high / low crime rate","ex":["The crime rate in my city has fallen steadily over the past decade.","Higher unemployment is often linked to a rising crime rate."],"syn":"level of crime"},{"w":"victim","pos":"danh từ","ipa":"/ˈvɪktɪm/","vi":"nạn nhân","use":"đếm được; victims of crime; compensation to + the victim","ex":["Victims of crime often suffer emotional problems for many years.","The court ordered him to pay compensation to the victim."],"syn":"person harmed"},{"w":"punishment","pos":"danh từ","ipa":"/ˈpʌnɪʃmənt/","vi":"hình phạt","use":"đếm được & không đếm được; harsh / severe + punishment for + tội","ex":["Many people believe that punishment alone does not reduce crime.","The punishment should always fit the seriousness of the crime."],"syn":"penalty"},{"w":"prison sentence","pos":"cụm danh từ","ipa":"/ˈprɪzn ˌsentəns/","vi":"án tù","use":"đếm được; receive / serve + a (five-year) prison sentence","ex":["He received a five-year prison sentence for armed robbery.","Long prison sentences may not stop people from reoffending."],"syn":"jail term"},{"w":"break the law","pos":"cụm động từ","ipa":"/ˌbreɪk ðə ˈlɔː/","vi":"vi phạm pháp luật","use":"cụm cố định; break the law (trái nghĩa: obey the law)","ex":["Teenagers sometimes break the law simply because their friends do.","Companies that break the law should face heavy fines."],"syn":"act illegally"},{"w":"law-abiding","pos":"tính từ","ipa":"/ˈlɔː əˌbaɪdɪŋ/","vi":"tuân thủ pháp luật","use":"đứng trước danh từ; law-abiding citizens / people","ex":["Most citizens are law-abiding people who simply want to live safely.","Strict surveillance can make even law-abiding citizens feel uncomfortable."],"syn":"honest"},{"w":"offender","pos":"danh từ","ipa":"/əˈfendə/","vi":"người phạm tội","use":"đếm được; young / first-time / repeat + offenders","ex":["First-time offenders should be given community work rather than prison.","Young offenders need education and support to change their behaviour."],"syn":"wrongdoer"},{"w":"deter","pos":"động từ","ipa":"/dɪˈtɜː/","vi":"răn đe, ngăn chặn","use":"deter + sb + from V-ing; deter crime / criminals","ex":["Heavy fines may deter drivers from speeding in residential areas.","There is little evidence that the death penalty deters violent crime."],"syn":"discourage"},{"w":"petty crime","pos":"cụm danh từ","ipa":"/ˌpeti ˈkraɪm/","vi":"tội nhẹ, tội vặt","use":"không đếm được; petty crime such as + shoplifting / theft","ex":["Petty crime such as shoplifting is common in poorer neighbourhoods.","Police in many cities no longer have time to investigate petty crime."],"syn":"minor offences"},{"w":"violent crime","pos":"cụm danh từ","ipa":"/ˌvaɪələnt ˈkraɪm/","vi":"tội phạm bạo lực","use":"không đếm được; violent crime + rises / falls","ex":["Violent crime has fallen in most developed countries since the 1990s.","Victims of violent crime need long-term psychological support."],"syn":"crimes of violence"},{"w":"law enforcement","pos":"cụm danh từ","ipa":"/ˈlɔː ɪnˌfɔːsmənt/","vi":"việc thực thi pháp luật","use":"không đếm được; law enforcement agencies / officers","ex":["Effective law enforcement depends on public trust in the police.","The government has increased spending on law enforcement this year."],"syn":"policing"},{"w":"rehabilitation","pos":"danh từ","ipa":"/ˌriːəˌbɪlɪˈteɪʃn/","vi":"sự cải tạo, phục hồi","use":"không đếm được; rehabilitation programmes for + prisoners","ex":["Rehabilitation programmes help prisoners find jobs after their release.","I believe prisons should focus on rehabilitation rather than punishment."],"syn":"reform"},{"w":"crack down on","pos":"cụm động từ","ipa":"/ˌkræk ˈdaʊn ɒn/","vi":"trấn áp mạnh tay","use":"crack down on + crime / fraud / drink-driving","ex":["The police are cracking down on drink-driving during the holiday season.","Authorities should crack down on online fraud targeting elderly people."],"syn":"take tough action against"},{"w":"end up in prison","pos":"cụm động từ","ipa":"/ˌend ˌʌp ɪn ˈprɪzn/","vi":"rốt cuộc phải vào tù","use":"end up in prison / in jail (chỉ kết cục xấu)","ex":["Many young men who leave school early end up in prison.","Without support, former prisoners often end up in prison again."],"syn":"be jailed"},{"w":"authorities","pos":"danh từ","ipa":"/ɔːˈθɒrətiz/","vi":"chính quyền, nhà chức trách","use":"thường 'the' + số nhiều; the local authorities; report to + the authorities","ex":["The local authorities have installed more street lights to prevent crime.","Citizens should report suspicious activity to the authorities immediately."],"syn":"officials"},{"w":"reoffend","pos":"động từ","ipa":"/ˌriːəˈfend/","vi":"tái phạm","use":"nội động từ; be less / more likely to reoffend","ex":["Prisoners who learn a trade are less likely to reoffend.","Around half of released prisoners reoffend within two years."],"syn":"commit another crime"},{"w":"legislation","pos":"danh từ","ipa":"/ˌledʒɪsˈleɪʃn/","vi":"luật pháp, bộ luật","use":"không đếm được; introduce / pass + legislation on + N","ex":["The government introduced new legislation to protect consumers online.","Stricter gun legislation has reduced violent crime in several countries."],"syn":"laws"},{"w":"pass a law","pos":"cụm động từ","ipa":"/ˌpɑːs ə ˈlɔː/","vi":"thông qua một đạo luật","use":"pass a law + banning / requiring + N","ex":["Parliament passed a law banning smoking in all public places.","Governments should pass a law requiring companies to publish salary data."],"syn":"make a law"},{"w":"taxpayers' money","pos":"cụm danh từ","ipa":"/ˈtækspeɪəz ˌmʌni/","vi":"tiền thuế của dân","use":"không đếm được; waste / spend + taxpayers' money on + N","ex":["Keeping prisoners in jail costs a great deal of taxpayers' money.","Politicians must not waste taxpayers' money on unnecessary projects."],"syn":"public money"},{"w":"community service","pos":"cụm danh từ","ipa":"/kəˌmjuːnəti ˈsɜːvɪs/","vi":"lao động công ích","use":"không đếm được; do / be sentenced to + community service","ex":["Minor offenders could do community service instead of going to prison.","Community service allows offenders to repay society for their crimes."],"syn":"unpaid public work"},{"w":"capital punishment","pos":"cụm danh từ","ipa":"/ˌkæpɪtl ˈpʌnɪʃmənt/","vi":"án tử hình","use":"không đếm được; abolish / support + capital punishment","ex":["Capital punishment remains a highly controversial issue in many countries.","Opponents of capital punishment argue that innocent people may be executed."],"syn":"the death penalty"},{"w":"juvenile crime","pos":"cụm danh từ","ipa":"/ˌdʒuːvənaɪl ˈkraɪm/","vi":"tội phạm vị thành niên","use":"không đếm được; prevent / reduce + juvenile crime","ex":["Juvenile crime is often linked to family problems and poor education.","After-school clubs can play a role in preventing juvenile crime."],"syn":"youth crime"},{"w":"surveillance","pos":"danh từ","ipa":"/səˈveɪləns/","vi":"sự giám sát","use":"không đếm được; under surveillance; surveillance cameras","ex":["Increased surveillance in public places may help police solve crimes faster.","Some people worry that constant surveillance threatens personal privacy."],"syn":"monitoring"},{"w":"corruption","pos":"danh từ","ipa":"/kəˈrʌpʃn/","vi":"tham nhũng","use":"không đếm được; fight / tackle + corruption","ex":["Corruption among officials undermines public trust in the government.","The new president has promised to fight corruption at every level."],"syn":"bribery"},{"w":"enforce","pos":"động từ","ipa":"/ɪnˈfɔːs/","vi":"thực thi (luật)","use":"động từ + tân ngữ; enforce + laws / rules / a ban","ex":["Laws are useless if the police do not enforce them properly.","Local councils are responsible for enforcing parking rules."],"syn":"apply"},{"w":"turn to crime","pos":"cụm động từ","ipa":"/ˌtɜːn tə ˈkraɪm/","vi":"sa vào con đường phạm tội","use":"turn to crime (vì nghèo, thất nghiệp...)","ex":["Some young people turn to crime because they see no other option.","Unemployed teenagers are more likely to turn to crime."],"syn":"start breaking the law"},{"w":"root causes","pos":"cụm danh từ","ipa":"/ˌruːt ˈkɔːzɪz/","vi":"nguyên nhân gốc rễ","use":"số nhiều; address / tackle + the root causes of + N","ex":["Governments must address the root causes of crime, such as poverty.","Prison does nothing to tackle the root causes of drug addiction."],"syn":"underlying reasons"},{"w":"be held accountable","pos":"cụm động từ","ipa":"/bi ˌheld əˈkaʊntəbl/","vi":"phải chịu trách nhiệm","use":"bị động; be held accountable for + N/V-ing","ex":["Politicians who misuse public money should be held accountable.","Parents must be held accountable for their children's behaviour online."],"syn":"be made responsible"},{"w":"harsh penalties","pos":"cụm danh từ","ipa":"/ˌhɑːʃ ˈpenəltiz/","vi":"hình phạt nghiêm khắc","use":"số nhiều; impose / face + harsh penalties for + N","ex":["Some argue that harsh penalties are the best way to deter crime.","Singapore is known for imposing harsh penalties for minor offences."],"syn":"tough punishments"},{"w":"civil liberties","pos":"cụm danh từ","ipa":"/ˌsɪvl ˈlɪbətiz/","vi":"quyền tự do công dân","use":"số nhiều; protect / threaten + civil liberties","ex":["Strict security measures must not come at the cost of civil liberties.","Human rights groups warn that the new law threatens civil liberties."],"syn":"basic freedoms"},{"w":"transparency","pos":"danh từ","ipa":"/trænsˈpærənsi/","vi":"sự minh bạch","use":"không đếm được; greater transparency in + N","ex":["Greater transparency in government spending would reduce corruption.","Citizens are demanding more transparency about how decisions are made."],"syn":"openness"},{"w":"regulate","pos":"động từ","ipa":"/ˈreɡjuleɪt/","vi":"quản lý, điều tiết","use":"động từ + tân ngữ; regulate + an industry / companies / prices","ex":["Governments should regulate social media companies more strictly.","It is difficult to regulate online gambling across national borders."],"syn":"control"},{"w":"intervene","pos":"động từ","ipa":"/ˌɪntəˈviːn/","vi":"can thiệp","use":"nội động từ; intervene in + N; the state intervenes","ex":["The state should intervene when children are at risk at home.","Some believe the government should not intervene in people's private lives."],"syn":"step in"},{"w":"criminal record","pos":"cụm danh từ","ipa":"/ˌkrɪmɪnl ˈrekɔːd/","vi":"tiền án","use":"đếm được; have / get + a criminal record","ex":["Having a criminal record makes it very hard to find a job.","Employers are allowed to ask whether applicants have a criminal record."],"syn":"past convictions"},{"w":"reintegrate into society","pos":"cụm động từ","ipa":"/ˌriːˈɪntɪɡreɪt ˌɪntə səˈsaɪəti/","vi":"tái hòa nhập xã hội","use":"(help sb) reintegrate into society","ex":["Education in prison helps inmates reintegrate into society after release.","Former prisoners often struggle to reintegrate into society without family support."],"syn":"return to normal life"},{"w":"serve a sentence","pos":"cụm động từ","ipa":"/ˌsɜːv ə ˈsentəns/","vi":"thụ án","use":"serve a sentence for + tội; serve a life sentence","ex":["He is currently serving a sentence for fraud.","Offenders who serve a sentence in an open prison can work outside."],"syn":"spend time in prison"},{"w":"lenient","pos":"tính từ","ipa":"/ˈliːniənt/","vi":"khoan hồng, nhẹ tay","use":"lenient with / towards + sb; a lenient sentence","ex":["Many victims feel that the courts are too lenient with young offenders.","A lenient sentence may send the wrong message to potential criminals."],"syn":"soft"},{"w":"rule of law","pos":"cụm danh từ","ipa":"/ˌruːl əv ˈlɔː/","vi":"pháp quyền","use":"luôn có 'the'; uphold / respect + the rule of law","ex":["A fair justice system is essential for maintaining the rule of law.","Foreign investors prefer countries where the rule of law is respected."],"syn":"legal order"}]},{"id":"v09","en":"Family, Society & Ageing","vi":"Gia đình, xã hội và già hóa dân số","desc":"Từ vựng về gia đình, các mối quan hệ xã hội và vấn đề già hóa dân số.","words":[{"w":"nuclear family","pos":"cụm danh từ","ipa":"/ˌnjuːkliə ˈfæməli/","vi":"gia đình hạt nhân","use":"đếm được; the nuclear family (chỉ bố mẹ và con cái)","ex":["The nuclear family has become the most common household type in Korea.","In a nuclear family, grandparents usually live separately from their grandchildren."],"syn":"small family"},{"w":"extended family","pos":"cụm danh từ","ipa":"/ɪkˌstendɪd urs allow working parents to spend more time with their children."],"syn":"employed parents"},{"w":"ageing population","pos":"cụm danh từ","ipa":"/ˌeɪdʒɪŋ ˌpɒpjuˈleɪʃn/","vi":"dân số già hóa","use":"đếm được; an ageing / a rapidly ageing + population","ex":["An ageing population puts enormous pressure on healthcare and pension systems.","Japan and Korea face the challenges of a rapidly ageing population."],"syn":"older population"},{"w":"life expectancy","pos":"cụm danh từ","ipa":"/ˈlaɪf ɪkˌspektənsi/","vi":"tuổi thọ trung bình","use":"không đếm được; life expectancy + rises / increases","ex":["Life expectancy has risen sharply thanks to better medicine and nutrition.","Women generally have a higher life expectancy than men."],"syn":"average lifespan"},{"w":"birth rate","pos":"cụm danh từ","ipa":"/ˈbɜːθ reɪt/","vi":"tỷ lệ sinh","use":"đếm được; a low / falling + birth rate","ex":["South Korea has one of the lowest birth rates in the world.","Housing costs are a major reason for the falling birth rate."],"syn":"fertility rate"},{"w":"pension","pos":"danh từ","ipa":"/ˈpenʃn/","vi":"lương hưu","use":"đếm được; live on / receive + a (state) pension","ex":["Many older people cannot live comfortably on a state pension alone.","Workers should start saving for their pension as early as possible."],"syn":"retirement income"},{"w":"retirement age","pos":"cụm danh từ","ipa":"/rɪˈtaɪəmənt eɪdʒ/","vi":"tuổi nghỉ hưu","use":"đếm được; raise / lower + the retirement age","ex":["Several countries have raised the retirement age to sixty-five or older.","Raising the retirement age could reduce pressure on public finances."],"syn":"age of retirement"},{"w":"care home","pos":"cụm danh từ","ipa":"/ˈkeə həʊm/","vi":"viện dưỡng lão","use":"đếm được; move (sb) into + a care home","ex":["Some families feel guilty about moving their parents into a care home.","Care homes need more trained staff to look after residents properly."],"syn":"nursing home"},{"w":"get on well with","pos":"cụm động từ","ipa":"/ɡet ˌɒn ˈwel wɪð/","vi":"hòa thuận với","use":"get on well with + sb (Anh-Anh) = get along with","ex":["I get on well with my grandparents because they are very open-minded.","Children who get on well with their siblings tend to be more confident."],"syn":"get along with"},{"w":"single-parent family","pos":"cụm danh từ","ipa":"/ˌsɪŋɡl ˌpeərənt ˈfæməli/","vi":"gia đình đơn thân","use":"đếm được; grow up in + a single-parent family","ex":["Children from a single-parent family may need extra financial support.","The number of single-parent families has increased over the last thirty years."],"syn":"one-parent household"},{"w":"role model","pos":"cụm danh từ","ipa":"/ˈrəʊl ˌmɒdl/","vi":"tấm gương","use":"đếm được; a positive role model for + sb","ex":["Parents are the most important role models for young children.","Celebrities should remember that they are role models for teenagers."],"syn":"good example"},{"w":"household chores","pos":"cụm danh từ","ipa":"/ˌhaʊshəʊld ˈtʃɔːz/","vi":"việc nhà","use":"số nhiều; do / share / help with + household chores","ex":["In many modern families, men and women share household chores equally.","Children should help with household chores to learn responsibility."],"syn":"housework"},{"w":"financially independent","pos":"cụm tính từ","ipa":"/faɪˌnænʃəli ˌɪndɪˈpendənt/","vi":"tự lập về tài chính","use":"become + financially independent (from + sb)","ex":["Young adults in Western countries usually become financially independent at eighteen.","Part-time jobs help students become financially independent from their parents."],"syn":"self-supporting"},{"w":"loneliness","pos":"danh từ","ipa":"/ˈləʊnlinəs/","vi":"sự cô đơn","use":"không đếm được; reduce / tackle + loneliness among + N","ex":["Loneliness among older people is a growing public health problem.","Regular visits from volunteers can reduce loneliness in care homes."],"syn":"feeling alone"},{"w":"burden","pos":"danh từ","ipa":"/ˈbɜːdn/","vi":"gánh nặng","use":"đếm được; a burden on / to + sb; a financial burden","ex":["Many older people worry about becoming a burden on their children.","Caring for a sick parent can be a heavy financial burden."],"syn":"heavy load"},{"w":"caregiver","pos":"danh từ","ipa":"/ˈkeəɡɪvə/","vi":"người chăm sóc","use":"đếm được; family / unpaid + caregivers (Anh-Anh: carer)","ex":["Family caregivers often give up their jobs to look after relatives.","The government should offer training and payments to unpaid caregivers."],"syn":"carer"},{"w":"upbringing","pos":"danh từ","ipa":"/ˈʌpbrɪŋɪŋ/","vi":"sự nuôi dạy, giáo dưỡng","use":"thường số ít; a strict / happy + upbringing","ex":["A strict upbringing does not always produce well-behaved children.","Her upbringing in a large family taught her to share and cooperate."],"syn":"the way someone is raised"},{"w":"pass down","pos":"cụm động từ","ipa":"/ˌpɑːs ˈdaʊn/","vi":"truyền lại (cho đời sau)","use":"pass down + traditions (to + sb); be passed down","ex":["Grandparents pass down family traditions and stories to younger generations.","Traditional skills are disappearing because they are no longer passed down."],"syn":"hand down"},{"w":"move out","pos":"cụm động từ","ipa":"/ˌmuːv ˈaʊt/","vi":"dọn ra ở riêng","use":"nội động từ; move out (of + parents' home)","ex":["In Korea, many young adults do not move out until they marry.","Because of high rents, many graduates cannot afford to move out of their parents' homes."],"syn":"leave home"},{"w":"family values","pos":"cụm danh từ","ipa":"/ˌfæməli ˈvæljuːz/","vi":"giá trị gia đình","use":"số nhiều; traditional / strong + family values","ex":["Some people believe that traditional family values are disappearing in modern society.","Strong family values encourage children to respect their elders."],"syn":"traditional beliefs"},{"w":"gender roles","pos":"cụm danh từ","ipa":"/ˈdʒendə rəʊlz/","vi":"vai trò giới","use":"số nhiều; traditional gender roles; challenge + gender roles","ex":["Traditional gender roles expected wome
