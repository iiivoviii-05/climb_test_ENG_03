<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Climb</title>
<meta name="theme-color" content="#151d47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Climb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap&subset=vietnamese">
<style>
/* Climbing the Rock: lộ trình như một tuyến leo núi. Mỗi bài là một mốc, XP là mét leo, các trại là cột mốc tiến độ. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#f7f9fb; --line:#e2e7ee; --line-2:#ccd5e0;
  --ink:#121c2b; --ink-2:#556274; --ink-3:#8f9bab;
  --night:#1b2554; --night-2:#27347a; --night-ink:#eef1ff; --night-dim:#aab3e6; --link:#27347a; --badge-line:transparent;
  --sun:#ffaf1f; --sun-soft:#fff2d6; --sun-ink:#5a3a00;
  --ok:#139f68; --ok-soft:#dcf5ea; --bad:#e2454b; --bad-soft:#fde8e8;
  --t1:#ffe1b3; --t2:#cdeedd; --t3:#d9e3ff; --t4:#ffd8d3; --t5:#e7dcff; --t6:#cfeef3;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --f:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:66px;
  --shadow:0 1px 2px rgba(18,28,43,.04),0 8px 24px -12px rgba(18,28,43,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1320; --surface:#161d2d; --sunk:#131a28; --line:#253047; --line-2:#334060;
  --ink:#e9eef7; --ink-2:#a5b1c4; --ink-3:#71809a;
  --night:#212c63; --night-2:#2d3a82; --night-ink:#eef1ff; --night-dim:#aab3e6; --link:#a9b8ff; --badge-line:#3d4a78;
  --sun:#ffb93a; --sun-soft:#3a2c10; --sun-ink:#ffe2a8;
  --ok:#3ccf8e; --ok-soft:#14352a; --bad:#ff7a7f; --bad-soft:#3b1d22;
  --t1:#4a3a1c; --t2:#1d3d31; --t3:#232f55; --t4:#4a2523; --t5:#33285a; --t6:#173e45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#161d2d; --sunk:#131a28; --line:#253047; --line-2:#334060;
  --ink:#e9eef7; --ink-2:#a5b1c4; --ink-3:#71809a;
  --night:#212c63; --night-2:#2d3a82; --night-ink:#eef1ff; --night-dim:#aab3e6; --link:#a9b8ff; --badge-line:#3d4a78;
  --sun:#ffb93a; --sun-soft:#3a2c10; --sun-ink:#ffe2a8;
  --ok:#3ccf8e; --ok-soft:#14352a; --bad:#ff7a7f; --bad-soft:#3b1d22;
  --t1:#4a3a1c; --t2:#1d3d31; --t3:#232f55; --t4:#4a2523; --t5:#33285a; --t6:#173e45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;min-height:100vh;min-height:100dvh;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--sun);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ===== Khung ===== */
.top{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1120px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em;font-size:17px;white-space:nowrap}
.brand svg{width:28px;height:28px}
.brand small{display:block;font-size:10.5px;font-weight:600;color:var(--ink-3);letter-spacing:.02em;margin-top:-3px}
.navtop{display:none;gap:4px;margin-left:auto}
.navtop button{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--ink-2);font-size:14.5px}
.navtop button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.alt{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.alt b{color:var(--ink);font-size:14px}
.alt .dot{width:24px;height:24px;border-radius:50%;background:var(--night);display:grid;place-items:center}
.alt .dot svg{width:14px;height:14px}
@media (min-width:900px){.navtop{display:flex}.alt{margin-left:12px}}
main{max-width:1120px;margin:0 auto;padding:20px 16px calc(var(--nav-h) + 36px + env(safe-area-inset-bottom))}
@media (min-width:900px){main{padding-bottom:64px}}
.view{display:flex;flex-direction:column;gap:22px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto}
nav.bottom button{border:0;background:none;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
nav.bottom svg{width:23px;height:23px}
nav.bottom button[aria-current="page"]{color:var(--ink)}
nav.bottom button[aria-current="page"] svg{color:var(--link)}
@media (min-width:900px){nav.bottom{display:none}}

/* ===== Chữ ===== */
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sun)}
.h1{font-size:clamp(30px,6vw,48px);line-height:1.05;font-weight:800;letter-spacing:-.035em;margin:6px 0 0;text-wrap:balance}
.h2{font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin:0}
.h3{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em}
.lead{color:var(--ink-2);margin:6px 0 0;max-width:62ch}
.muted{color:var(--ink-2)} .small{font-size:13px} .tiny{font-size:12px}
.hint{font-size:13px;color:var(--ink-2);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 200px;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

/* ===== Khối ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.pad0{padding:0;overflow:hidden}
.soft{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}

/* ===== Nút ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);font-weight:700;font-size:15px;color:var(--ink);text-decoration:none;white-space:nowrap;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--night);border-color:var(--night);color:var(--night-ink)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#2b1c00}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:13.5px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.42;cursor:default;transform:none}
.btn svg{width:18px;height:18px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:8px 16px;border-radius:10px;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--night);color:var(--night-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chip.sun{background:var(--sun-soft);border-color:transparent;color:var(--sun-ink)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .5s}
.bar.sun>i{background:var(--sun)}

/* ===== Form ===== */
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2);font-weight:600}
.fld input,.fld select,.fld textarea,.inp{font-size:16px;font-weight:400;color:var(--ink);background:var(--sunk);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}
.fld textarea{resize:vertical;line-height:1.65}
.fld :focus,.inp:focus{outline:none;border-color:var(--link)}

/* ===== Trang chủ ===== */
.hero{position:relative;overflow:hidden;border-radius:26px;background:var(--night);color:var(--night-ink);padding:26px 24px 0;min-height:320px;display:grid;grid-template-columns:1fr;box-shadow:var(--shadow)}
.hero .txt{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px;max-width:560px;min-width:0}
.hero .next .btn{white-space:normal;text-align:left;height:auto;min-height:48px;padding:10px 16px;max-width:100%}
.hero .lbl{font-size:13px;font-weight:600;color:var(--night-dim)}
.hero .alt-big{font-size:clamp(46px,10vw,76px);font-weight:800;letter-spacing:-.045em;line-height:.95}
.hero .alt-big span{font-size:.38em;letter-spacing:-.01em;color:var(--night-dim);margin-left:6px}
.hero .camp{font-weight:700;font-size:16px}
.hero .bar{background:rgba(255,255,255,.14);height:10px;width:100%;max-width:420px}
.hero .bar>i{background:var(--sun)}
.hero .next{margin-top:8px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hero svg.mtn{position:relative;z-index:1;width:100%;height:auto;display:block;margin-top:6px}
@media (min-width:900px){.hero{grid-template-columns:1fr 1.05fr;padding:36px 36px 0;min-height:360px}.hero svg.mtn{position:absolute;right:0;bottom:0;width:62%;margin:0}}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.cont{display:flex;flex-direction:column;gap:12px;position:relative}
.cont .kicker{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.cont .ttl{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.cont .meta{display:flex;gap:8px;flex-wrap:wrap}
.badge{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--ink);flex:none}
.todo{display:flex;flex-direction:column}
.task{display:flex;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);position:relative}
.task:first-child{border-top:0}
.task input{position:absolute;opacity:0;pointer-events:none}
label.task{cursor:pointer}
.tick{flex:none;width:28px;height:28px;border:2px solid var(--line-2);border-radius:9px;display:grid;place-items:center;color:transparent;background:var(--surface);transition:background .15s}
.tick svg{width:18px;height:18px}
.task.on .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.task.on .t-title{color:var(--ink-2)}
.task:has(input:focus-visible){outline:2.5px solid var(--sun);outline-offset:-4px}
.task .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.t-time{font-size:12px;color:var(--ink-3);font-weight:600}
.t-title{font-weight:700}
.t-how{font-size:13px;color:var(--ink-2)}
.note{width:100%;font-size:15px;padding:13px 18px;border:0;border-top:1px dashed var(--line);background:transparent;color:var(--ink)}
.note:focus{outline:none;background:var(--sunk)}

/* ===== Lộ trình ===== */
.path-layout{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
@media (min-width:900px){.path-layout{grid-template-columns:300px 1fr}}
.side{border-radius:var(--r-lg);overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
@media (min-width:900px){.side{position:sticky;top:84px;max-height:calc(100vh - 110px);max-height:calc(100dvh - 110px);display:flex;flex-direction:column}}
.side-hd{background:var(--night);color:var(--night-ink);padding:18px 18px 16px}
.side-hd .tiny{color:var(--night-dim);font-weight:600}
.side-hd .h2{color:var(--night-ink);font-size:20px}
.side-list{display:flex;gap:8px;padding:10px;overflow:auto}
@media (max-width:899px){.side-list{flex-direction:row;scroll-snap-type:x mandatory}.side-list .topic{flex:0 0 76%;scroll-snap-align:start}}
@media (min-width:900px){.side-list{flex-direction:column}}
.topic{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;padding:10px;border-radius:14px;border:1.5px solid transparent;background:none;width:100%}
.topic:hover{background:var(--sunk)}
.topic[aria-current="true"]{border-color:var(--link);background:var(--sunk)}
.topic .n{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:var(--ink)}
.topic .nm{font-weight:700;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topic .pg{font-size:12px;color:var(--ink-2);margin:2px 0 5px}
.topic .bar{height:5px}
.route-hd{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow)}
.route-hd .badge{width:60px;height:60px;font-size:13px;text-align:center;line-height:1.1}
.route-hd .grow{flex:1;min-width:200px}
.route{position:relative;display:flex;flex-direction:column;gap:30px;padding:26px 0 8px}
.route svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.stop{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:center}
@media (min-width:640px){.stop{grid-template-columns:110px minmax(0,560px);}.stop.r{grid-template-columns:minmax(0,560px) 110px;justify-content:end}.stop.r .node{order:2}}
.node{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;text-align:center;background:var(--surface);border:3px solid var(--line-2);position:relative;z-index:1;justify-self:center}
.node b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
.node small{display:block;font-size:10.5px;font-weight:700;color:var(--ink-3);margin-top:3px}
.node.done{background:var(--ok);border-color:var(--ok);color:#fff}
.node.done small{color:rgba(255,255,255,.85)}
.node.cur{border-color:var(--night);box-shadow:0 0 0 7px color-mix(in srgb,var(--sun) 35%,transparent)}
.node.cur small{color:var(--bad)}
.node.lock{color:var(--ink-3);background:var(--sunk)}
.node.camp{border-radius:22px;width:88px;height:88px;background:var(--night);border-color:var(--night);color:var(--night-ink)}
.node.camp small{color:var(--night-dim)}
.stop .box{min-width:0;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;box-shadow:var(--shadow);text-align:left;width:100%;display:flex;flex-direction:column;gap:4px;border-left:4px solid transparent}
.stop button.box{cursor:pointer}
.stop .box:hover{border-color:var(--line-2)}
.stop.cur .box{border-left-color:var(--sun)}
.stop.lock .box{background:var(--sunk);box-shadow:none}
.stop.lock .box .ttl{color:var(--ink-2)}
.stop .kick{font-size:11.5px;font-weight:700;color:var(--bad);letter-spacing:.01em}
.stop.done .kick{color:var(--ok)}
.stop.lock .kick{color:var(--ink-3)}
.stop .ttl{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.stop .desc{font-size:13.5px;color:var(--ink-2)}
.stop .more{font-size:13px;font-weight:700;margin-top:4px}
.weeks{display:flex;flex-direction:column;gap:12px}
.week>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px}
.week>summary::-webkit-details-marker{display:none}
.week .wn{width:50px;height:50px;border-radius:14px;background:var(--sunk);display:grid;place-items:center;font-weight:800;line-height:1;text-align:center;font-size:17px}
.week .wn small{display:block;font-size:10px;font-weight:600;color:var(--ink-3)}
.week.cur .wn{background:var(--sun);color:#2b1c00}
.week.cur .wn small{color:#5a3a00}
.week.full .wn{background:var(--ok);color:#fff}
.week.full .wn small{color:rgba(255,255,255,.85)}
.day{display:grid;grid-template-columns:62px minmax(0,1fr) minmax(0,1fr);gap:12px;padding:11px 16px;border-top:1px dashed var(--line);align-items:start;font-size:13.5px}
.day.is-today{background:var(--sun-soft)}
.day.missed{box-shadow:inset 3px 0 0 var(--bad)}
.dl{display:flex;flex-direction:column;font-weight:700}
.dl small{font-weight:500;color:var(--ink-2)}
.mini{display:flex;gap:9px;align-items:flex-start;cursor:pointer;min-width:0}
.mini input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--ok);flex:none}
.mini.done span{color:var(--ink-2);text-decoration:line-through}
.mini input:disabled+span{opacity:.55}
.dnote{grid-column:2/4;font-size:12.5px;color:var(--ink-2);font-style:italic}
@media (max-width:560px){.day{grid-template-columns:1fr}.dnote{grid-column:auto}}

/* ===== Hộp thoại ===== */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,15,30,.45);display:grid;place-items:center;padding:16px;animation:fade .15s ease-out}
.dlg{background:var(--surface);border-radius:24px;width:100%;max-width:620px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;padding:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:18px;animation:rise .2s ease-out}
.dlg-hd{display:flex;gap:16px;align-items:center}
.dlg-hd .badge{background:var(--night);color:var(--night-ink)}
.dlg-hd .grow{flex:1;min-width:0}
.x{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.stages{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.stage{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;background:var(--sunk)}
.stage.on{border-color:var(--night);background:var(--surface)}
.stage .sn{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line-2);display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface);flex:none}
.stage.done .sn{background:var(--ok);border-color:var(--ok);color:#fff}
.stage small{display:block;color:var(--ink-3);font-weight:600;font-size:11.5px}
.stage b{display:block;font-size:14.5px}
.stage span{font-size:12px;color:var(--ink-2)}
.arrow{color:var(--ink-3)}
@media (max-width:520px){.stages{grid-template-columns:1fr}.arrow{display:none}}
.dlg-ft{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(12px);opacity:0}}

/* ===== Màn học ===== */
.study{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;overflow:auto}
.study-top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.study-top .in{max-width:900px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.quit{border:1px solid var(--line);background:var(--surface);border-radius:12px;height:44px;padding:0 12px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;color:var(--ink-2)}
.stepper{display:flex;align-items:center;justify-content:center;gap:0;max-width:420px;margin:0 auto;width:100%}
.stepper .st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ink-3);flex:none}
.stepper .st i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;background:var(--sunk);border:1.5px solid var(--line-2)}
.stepper .st.on{color:var(--ink)}
.stepper .st.on i{background:var(--night);color:var(--night-ink);border-color:var(--night)}
.stepper .st.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.stepper .ln{flex:1;height:2px;background:var(--line-2);margin:0 8px 18px}
.stepper .ln.on{background:var(--night-2)}
.study-body{max-width:900px;width:100%;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;gap:16px;flex:1}
.timerbar{display:grid;grid-template-columns:auto auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.timerbar .lbl{font-size:12px;font-weight:700;color:var(--ink-2)}
.timerbar .t{font-size:20px;font-weight:800;letter-spacing:-.02em}
.timerbar .cnt{font-size:13px;color:var(--ink-2)}
.timerbar .cnt b{color:var(--ink)}
.timerbar .bar{height:6px}
.topic-lbl{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.flip{perspective:1600px;cursor:pointer;outline:none}
.flip .inner{position:relative;display:grid;min-height:380px;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
/* iPhone/Safari: mặt sau đôi khi "xuyên" qua mặt trước (chữ bị lật ngược). Ẩn hẳn mặt không nhìn thấy, đổi đúng lúc thẻ quay ngang. */
.flip .face.front{transform:rotateY(0deg) translateZ(1px);-webkit-transform:rotateY(0deg) translateZ(1px);transition:visibility 0s .22s}
.flip .face.back{visibility:hidden;transition:visibility 0s .22s}
.flip.flipped .face.back{visibility:visible}
.flip.flipped .face.front{visibility:hidden;transition:visibility 0s .22s}
.face{position:relative;grid-area:1/1;min-height:380px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:24px;display:flex;flex-direction:column;overflow:hidden}
.face.front{background:var(--night);color:var(--night-ink);align-items:center;justify-content:center;text-align:center;gap:16px}
.face.back{background:var(--surface);border:1px solid var(--line);transform:rotateY(180deg);gap:14px;justify-content:center}
.face .corner{position:absolute;top:20px;left:24px;font-size:12px;font-weight:700;color:var(--night-dim)}
.face.back .corner{color:var(--bad);position:static}
@media (max-width:560px){.face{padding:20px 18px}.face.front{padding-top:48px}}
.face .ridge{position:absolute;right:-1px;bottom:-1px;width:40%;height:auto;opacity:.9;pointer-events:none}
.word{font-size:clamp(34px,7.5vw,64px);font-weight:800;letter-spacing:-.04em;line-height:1.02;text-wrap:balance;position:relative;z-index:1}
.pos{border:1.5px solid rgba(255,255,255,.28);border-radius:999px;padding:4px 14px;font-size:12.5px;font-weight:700;color:var(--night-dim);position:relative;z-index:1}
.ipa{display:flex;gap:10px;align-items:center;font-size:17px;position:relative;z-index:1}
.say{border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:var(--night-ink);border-radius:12px;padding:7px 12px;font-weight:700;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.say svg{width:16px;height:16px}
.face.back .say{border-color:var(--line-2);background:var(--surface);color:var(--ink)}
.fliphint{font-size:12px;color:var(--night-dim);display:flex;gap:6px;align-items:center;position:relative;z-index:1}
.mean{font-size:clamp(28px,6vw,46px);font-weight:800;letter-spacing:-.035em;line-height:1.08;text-align:center;color:var(--ink)}
.usage{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:600;font-size:14.5px}
.usage .tag{flex:none;background:var(--night);color:var(--night-ink);font-size:10.5px;font-weight:800;border-radius:7px;padding:3px 7px;margin-top:2px}
.exs{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.exs{grid-template-columns:1fr 1fr}}
.ex{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:11px 12px;font-size:14.5px;background:var(--surface)}
.ex i{flex:none;width:24px;height:24px;border-radius:7px;background:var(--sunk);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:var(--ink-2)}
.ex mark{background:linear-gradient(transparent 58%,var(--sun-soft) 58%);color:inherit;font-weight:700}
.back-ft{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.judge .btn{min-height:54px;font-size:16px}
.keys{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.keys kbd{font-family:inherit;font-weight:700;border:1px solid var(--line-2);border-bottom-width:2.5px;border-radius:7px;padding:1px 7px;background:var(--surface);color:var(--ink);margin-right:4px}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:26px;display:flex;flex-direction:column;gap:14px;min-height:340px;box-shadow:var(--shadow)}
.slide .k{font-size:12.5px;font-weight:700;color:var(--bad)}
.slide h3{font-size:clamp(24px,4.5vw,34px);font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.12}
.slide p{margin:0;font-size:16px;line-height:1.65}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.dots i.on{background:var(--night);width:22px;border-radius:99px}
.mist{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:14px;background:var(--sunk);border:1px solid var(--line)}
.mist del{color:var(--bad);text-decoration-thickness:1.5px}
.mist ins{text-decoration:none;font-weight:700;color:var(--ok)}
.mist small{color:var(--ink-2)}
.intro-card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:26px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;box-shadow:var(--shadow)}
.intro-card .big-ok{width:64px;height:64px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff}
.intro-card .big-ok svg{width:30px;height:30px}
.intro-stats{display:flex;gap:28px;flex-wrap:wrap}
.intro-stats b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.intro-stats span{font-size:12.5px;color:var(--ink-2)}
.rule{background:var(--ok-soft);border-radius:12px;padding:9px 12px;font-size:13.5px;color:var(--ink)}
@media (max-width:560px){.intro-card{grid-template-columns:1fr}}
.qhd{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.qhd .tiny{font-weight:700;color:var(--ink-2)}
.qtime{text-align:center;min-width:110px}
.qtime b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.qtime.low b{color:var(--bad)}
.qtime .bar{height:6px;margin-top:6px}
.qtime.low .bar>i{background:var(--bad)}
.qtext{font-size:clamp(24px,4.6vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:4px 0 6px;text-wrap:balance}
.qtext.sent{font-size:clamp(20px,3.6vw,28px);font-weight:700;letter-spacing:-.02em}
.qtext .gap{display:inline-block;min-width:110px;border-bottom:3px solid var(--ink);margin:0 4px}
.opts{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;font-size:17px;font-weight:700;min-height:68px}
.opt .k{flex:none;width:36px;height:36px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--ink-2)}
.opt:hover:not(:disabled){border-color:var(--line-2)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fill{display:flex;gap:10px}
.fill .inp{font-size:19px;font-weight:600}
.fbk{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border-radius:18px;padding:14px 16px;animation:rise .18s ease-out}
.fbk.good{background:var(--ok-soft);border:1.5px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.fbk.bad{background:var(--bad-soft);border:1.5px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.fbk .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff}
.fbk.good .ic{background:var(--ok)} .fbk.bad .ic{background:var(--bad)}
.fbk .ic svg{width:20px;height:20px}
.fbk b{display:block;font-size:15.5px}
.fbk span{font-size:13.5px;color:var(--ink-2)}
@media (max-width:560px){.fbk{grid-template-columns:auto 1fr}.fbk .btn{grid-column:1/3}}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:12px 0}
.score-ring{width:170px;height:170px;position:relative}
.score-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-ring .v{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:800;letter-spacing:-.04em}
.result .h1{font-size:clamp(28px,5vw,40px)}
.wrongs{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.wrongs div{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}

/* ===== Ôn tập / sổ từ ===== */
.wlist{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .w{font-weight:700;overflow-wrap:anywhere}
.wrow .m{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.lv{display:flex;gap:3px}
.lv i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.lv i.on{background:var(--ok)}
.del{background:none;border:0;color:var(--ink-3);width:32px;height:32px;border-radius:9px;font-size:18px}
.del:hover{background:var(--bad-soft);color:var(--bad)}
.mastery{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line)}
.mastery i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
details.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-size:22px;color:var(--ink-3);font-weight:400}
details.fold[open]>summary::after{content:"–"}
details.fold[open]>summary{margin-bottom:12px}
.wsum{min-width:0;flex:1;overflow-wrap:anywhere;line-height:1.5}.wsum .tchip{white-space:normal;margin-right:6px}

/* ===== Viết ===== */
#w-ans{min-height:280px;line-height:1.75}
.target{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-2)}
.target .bar{flex:1}
.target b{font-size:18px;color:var(--ink)}
.timer{font-weight:800;font-size:18px}
.timer.late{color:var(--bad)}
.checks{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.checks li{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.checks li:first-child{border-top:0}
.checks .ic{font-weight:800;text-align:center}
.checks .ok .ic{color:var(--ok)} .checks .warn .ic{color:#d08700} .checks .bad .ic{color:var(--bad)}
.checks small{display:block;color:var(--ink-2);font-size:12.5px}
.fix{padding:11px 13px;border-left:3px solid var(--bad);background:var(--sunk);border-radius:0 12px 12px 0;font-size:14px;display:flex;flex-direction:column;gap:3px}
.fix del,.fix ins{align-self:flex-start}
.fix del{color:var(--bad);text-decoration-thickness:1.5px}
.fix ins{text-decoration:none;background:linear-gradient(transparent 55%,var(--ok-soft) 55%);font-weight:600}
.fix small{color:var(--ink-2)}
.rub{display:flex;flex-direction:column;gap:12px}
.rub table{width:100%;border-collapse:collapse;font-size:13.5px}
.rub td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.rub td:first-child{font-weight:800;width:40px;text-align:center;color:var(--link)}
.subm{border-top:1px solid var(--line)}
.subm:first-child{border-top:0}
.subm>summary{list-style:none;cursor:pointer;padding:13px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center}
.subm>summary::-webkit-details-marker{display:none}
.subm .ttl{font-weight:700;overflow-wrap:anywhere}
.subm .meta{font-size:12.5px;color:var(--ink-2);grid-column:1}
.bandpill{grid-row:1/3;grid-column:2;font-weight:800;font-size:18px;background:var(--night);color:var(--night-ink);border-radius:12px;padding:4px 11px}
.pend{grid-row:1/3;grid-column:2}
.s-body{padding:4px 16px 18px;display:flex;flex-direction:column;gap:14px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font-size:14.5px}
.lbl{font-size:12.5px;color:var(--ink-2);font-weight:700;margin-bottom:4px}
.score{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
.mark{width:96px;height:96px;border-radius:24px;background:var(--night);color:var(--night-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.mark b{font-size:40px;font-weight:800;letter-spacing:-.04em}
.mark small{font-size:11px;color:var(--night-dim);margin-top:4px;font-weight:600}
.crit{display:flex;flex-direction:column;gap:10px}
.crit .c{display:grid;grid-template-columns:44px 1fr 36px;gap:8px;align-items:center;font-size:13px}
.crit .c b{font-weight:700}
.crit .c .n{font-weight:800;text-align:right}
.crit .cm{grid-column:1/4;color:var(--ink-2);font-size:13px;margin-top:-4px}
.upg{display:flex;flex-wrap:wrap;gap:6px}
.upg span{border:1px solid var(--line);border-radius:9px;padding:3px 9px;font-size:13.5px}
@media (max-width:520px){.score{grid-template-columns:1fr}}

/* ===== Tiến độ ===== */
.kpis{display:grid;grid-template-columns:repeat(4,1fr)}
.kpi{padding:16px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi:first-child{border-left:0}
.kpi b{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.kpi span{font-size:12.5px;color:var(--ink-2)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}
.camps{display:flex;flex-direction:column-reverse;gap:0}
.campr{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:9px 0;position:relative}
.campr .pin{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line-2);background:var(--surface);z-index:1}
.campr.reached .pin{background:var(--ok);border-color:var(--ok)}
.campr.next .pin{border-color:var(--sun);box-shadow:0 0 0 5px var(--sun-soft)}
.campr::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--line)}
.campr b{font-weight:700}
.campr span{font-size:13px;color:var(--ink-2)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:var(--f);font-size:11px;fill:var(--ink-2)}
svg.chart .val{font-size:12px;font-weight:700;fill:var(--ink)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(5,auto);grid-template-columns:22px;grid-auto-columns:minmax(0,28px);gap:5px}
.heat span{font-size:11px;color:var(--ink-2);align-self:center}
.heat i{width:100%;aspect-ratio:1;border-radius:6px;background:var(--line);display:block}
.heat i.h1{background:var(--sun)} .heat i.h2{background:var(--ok)} .heat i.miss{background:var(--bad-soft);box-shadow:inset 0 0 0 1.5px var(--bad)}
.heat i.hol{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px)}
.heat i.today{box-shadow:inset 0 0 0 2.5px var(--link)}

/* ===== PIN, toast ===== */
.pinbox{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:40;padding:16px}
.pinbox form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.pinbox input{font-size:26px;text-align:center;letter-spacing:.4em;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--sunk)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:45;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.err{background:var(--bad);color:#fff}
@media (min-width:900px){.toast{bottom:28px}}
/* ===== Màn hẹp (iPhone SE, mini) ===== */
.brand{min-width:0}
.brand>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:430px){
  .top .in{gap:10px}
  .brand{font-size:15.5px}
  .brand small{display:none}
  .alt{padding:4px 10px 4px 5px;flex:none}
  .alt .campn{display:none}
}
@media (max-width:380px){
  main{padding-left:12px;padding-right:12px}
  .stop{grid-template-columns:70px minmax(0,1fr);gap:12px}
  .node{width:66px;height:66px;border-width:2.5px}
  .node.camp{width:66px;height:66px}
  .node b{font-size:20px}
  .stop .box{padding:13px 14px}
  .stop .ttl{font-size:17.5px}
  .card{padding:16px}
  .hero{padding:22px 18px 0}
  .opt{font-size:15.5px;padding:12px;min-height:60px}
  .qtime{min-width:84px}
  .timerbar{grid-template-columns:auto 1fr auto;gap:10px}
  .timerbar .lbl{display:none}
  .judge .btn{min-height:50px;font-size:15px}
  .keys{display:none}
  .quit{font-size:0;gap:0;padding:0;width:44px;justify-content:center}
  .quit svg{width:16px;height:16px}
  .study-top .in{gap:8px;grid-template-columns:44px 1fr 44px}
  .study-top .in>span{width:44px!important}
  .stepper .ln{margin:0 4px 18px}
  nav.bottom button{font-size:10.5px;white-space:nowrap}
}
/* ===== v7: Reading · Speaking ===== */
.grid3{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:860px){.grid3{grid-template-columns:repeat(3,1fr)}}
.rfilters{display:flex;gap:6px;overflow-x:auto;max-width:100%;min-width:0;scrollbar-width:none;padding:2px 0 4px;-webkit-overflow-scrolling:touch}
.rfilters::-webkit-scrollbar{display:none}
.rfilters .chip{white-space:nowrap}
@media (min-width:760px){.rfilters{flex-wrap:wrap;overflow:visible;margin:0;padding:0}}
.rkinds{display:flex;flex-wrap:wrap;gap:6px}
.rkinds .chip{max-width:100%;white-space:normal;text-align:left}
.linkbtn{border:0;background:none;padding:0;color:var(--link);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}

#rankfx::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--rank,#999),transparent);opacity:0;transition:opacity .6s}
#rankfx i{position:absolute;width:30px;height:30px;border:2px solid var(--rank,#999);opacity:0;transition:opacity .6s}
#rankfx i:nth-child(1){top:6px;left:6px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
#rankfx i:nth-child(2){top:6px;right:6px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
#rankfx i:nth-child(3){bottom:6px;left:6px;border-right:0;border-top:0;border-radius:0 0 0 10px}

body:not([data-rank="0"]):not([data-rank=""]) #rankfx::before{opacity:.9}
body:is([data-rank="2"],[data-rank="3"],[data-rank="4"],[data-rank="5"],[data-rank="6"],[data-rank="7"]) #rankfx i:nth-child(-n+2){opacity:.75}

@keyframes rkshim{from{opacity:.45}to{opacity:1}}

.rkchip{display:inline-flex;margin-right:2px}
