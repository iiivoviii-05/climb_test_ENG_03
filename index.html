","nevertheless","nonetheless"],"why":"Sau dấu chấm phẩy dùng trạng từ nối chỉ sự tương phản, theo sau là dấu phẩy."},{"t":"mcq","q":"Rarely ___ such a sharp fall in house prices.","o":["have we seen","we have seen","we seen have","have seen we"],"a":0,"why":"Trạng từ phủ định 'Rarely' đứng đầu câu đòi hỏi đảo ngữ: trợ động từ + chủ ngữ."},{"t":"fill","q":"The report, ___ was published last week, shows a rise in obesity.","a":["which"],"why":"Mệnh đề quan hệ không xác định (có dấu phẩy) dùng 'which', không dùng 'that'."}]},{"n":7,"en":"Subject/verb agreement","vi":"Sự hòa hợp giữa chủ ngữ và động từ","ielts":"Là lỗi phổ biến làm mất điểm Grammatical Accuracy trong Writing Task 1 (the number of..., the percentage of...) và Task 2.","points":[{"h":"Quy tắc cơ bản","body":"Chủ ngữ số ít đi với động từ số ít (thêm -s, is, has, was); chủ ngữ số nhiều đi với động từ số nhiều (are, have, were).","ex":["The student studies hard.","The students study hard."]},{"h":"Chủ ngữ dài: tìm danh từ chính","body":"Khi chủ ngữ là cụm dài, động từ chia theo danh từ chính đứng đầu cụm, không theo danh từ đứng gần động từ nhất.","ex":["The quality of public services is improving.","The houses on this street are very old."]},{"h":"The number of và A number of","body":"'The number of + danh từ số nhiều' đi với động từ số ít (nói về con số); 'A number of + danh từ số nhiều' (= một số) đi với động từ số nhiều.","ex":["The number of tourists has doubled.","A number of tourists have complained about the hotel."]},{"h":"Each, every, everyone và danh từ không đếm được","body":"Each, every, everyone, nobody, somebody và danh từ không đếm được (information, research, news, traffic) đi với động từ số ít.","ex":["Every student has a laptop.","The news is surprising."]},{"h":"V-ing làm chủ ngữ, there is/are, neither...nor","body":"Danh động từ (V-ing) làm chủ ngữ đi với động từ số ít. Sau 'there' động từ chia theo danh từ đứng sau. Với either...or / neither...nor, động từ chia theo danh từ gần nhất.","ex":["Learning languages takes time.","Neither the teacher nor the students were ready."]}],"mistakes":[{"wrong":"The number of cars have increased.","right":"The number of cars has increased.","why":"'The number of' là chủ ngữ số ít nên dùng 'has'."},{"wrong":"Everyone in my class like music.","right":"Everyone in my class likes music.","why":"'Everyone' luôn đi với động từ số ít."},{"wrong":"There is many problems in big cities.","right":"There are many problems in big cities.","why":"Sau 'there', động từ chia theo danh từ số nhiều 'problems'."}],"quiz":[{"t":"mcq","q":"My brother ___ in a hospital.","o":["work","works","working","are working"],"a":1,"why":"Chủ ngữ số ít 'my brother' nên động từ thêm -s."},{"t":"fill","q":"The students in my class ___ (be) very friendly.","a":["are","were"],"why":"Danh từ chính là 'students' (số nhiều) nên dùng 'are'."},{"t":"mcq","q":"The information you gave me ___ very useful.","o":["were","are","was","have been"],"a":2,"why":"'Information' là danh từ không đếm được nên đi với động từ số ít."},{"t":"mcq","q":"There ___ a lot of traffic in the city centre today.","o":["is","are","were","have"],"a":0,"why":"'Traffic' không đếm được nên dùng 'there is'."},{"t":"fill","q":"Everyone ___ (want) to live in a safe environment.","a":["wants"],"why":"'Everyone' đi với động từ số ít nên thêm -s."},{"t":"mcq","q":"The number of international students ___ risen steadily.","o":["have","are","were","has"],"a":3,"why":"'The number of' là chủ ngữ số ít nên dùng 'has'."},{"t":"mcq","q":"A number of employees ___ complained about the new policy.","o":["has","have","is","was"],"a":1,"why":"'A number of' nghĩa là 'một số' nên đi với động từ số nhiều."},{"t":"fill","q":"Doing regular exercise ___ (help) people reduce stress.","a":["helps"],"why":"Danh động từ (V-ing) làm chủ ngữ đi với động từ số ít."},{"t":"mcq","q":"The cost of houses in big cities ___ too high for young people.","o":["are","were","is","be"],"a":2,"why":"Danh từ chính là 'the cost' (số ít), không phải 'houses' hay 'cities'."},{"t":"mcq","q":"Neither the manager nor the employees ___ happy with the decision.","o":["was","is","were","has been"],"a":2,"why":"Với 'neither...nor', động từ chia theo danh từ gần nhất 'employees' (số nhiều) nên dùng 'were'."},{"t":"fill","q":"Each of the participants ___ (receive) a certificate at the end of every course.","a":["receives"],"why":"'Each of + danh từ số nhiều' vẫn đi với động từ số ít."},{"t":"mcq","q":"Mathematics ___ my favourite subject at school.","o":["were","are","have been","was"],"a":3,"why":"Tên môn học tận cùng bằng -s như 'mathematics' vẫn là danh từ số ít."},{"t":"mcq","q":"The majority of the research ___ carried out in Europe.","o":["were","was","are","have been"],"a":1,"why":"'Research' là danh từ không đếm được nên 'the majority of the research' đi với động từ số ít."},{"t":"fill","q":"The government's plans for the new airport ___ (be) criticised by local residents.","a":["are","were","have been"],"why":"Danh từ chính là 'plans' (số nhiều) nên động từ phải ở dạng số nhiều."},{"t":"mcq","q":"One of the main reasons for traffic jams ___ the rapid increase in private cars.","o":["is","are","were","be"],"a":0,"why":"Chủ ngữ là 'one' (số ít), không phải 'reasons' hay 'traffic jams'."},{"t":"fill","q":"Not only the teachers but also the principal ___ (support) the new timetable.","a":["supports","supported"],"why":"Với 'not only...but also', động từ chia theo danh từ gần nhất 'the principal' (số ít)."}]},{"n":8,"en":"Countable/uncountable nouns","vi":"Danh từ đếm được và không đếm được","ielts":"Quan trọng trong Writing Task 1 (the number of / the amount of) và Task 2 khi dùng các danh từ học thuật như information, research, evidence.","points":[{"h":"Đếm được và không đếm được","body":"Danh từ đếm được có dạng số ít và số nhiều, dùng được với a/an. Danh từ không đếm được không có số nhiều, không dùng a/an và đi với động từ số ít.","ex":["She has two books and a laptop.","Water is essential for all living things."]},{"h":"Danh từ không đếm được hay gặp trong IELTS","body":"Information, advice, research, evidence, equipment, furniture, traffic, accommodation, knowledge, homework, news, transport là danh từ không đếm được; không thêm -s.","ex":["The library provides useful information for students.","There is little evidence that the new policy works."]},{"h":"Từ chỉ số lượng","body":"Many, few, a few, fewer + danh từ đếm được số nhiều; much, little, a little, less + danh từ không đếm được; a lot of, some, any, plenty of dùng được cho cả hai.","ex":["How many hours do you study each day?","We don't have much time before the deadline."]},{"h":"Đơn vị đếm","body":"Muốn đếm danh từ không đếm được, dùng đơn vị: a piece of advice, a piece of equipment, an item of news, a litre of water, a cup of coffee.","ex":["She gave me a useful piece of advice.","The factory uses 500 litres of water every hour."]},{"h":"Danh từ mang hai nghĩa","body":"Một số danh từ vừa đếm được vừa không đếm được với nghĩa khác nhau: experience (kinh nghiệm – không đếm được; một trải nghiệm – đếm được), time, paper, work.","ex":["I don't have much work experience.","Studying abroad was an amazing experience."]}],"mistakes":[{"wrong":"I need some informations about the course.","right":"I need some information about the course.","why":"'Information' là danh từ không đếm được nên không thêm -s."},{"wrong":"There are less cars on the road at night.","right":"There are fewer cars on the road at night.","why":"'Cars' là danh từ đếm được số nhiều nên dùng 'fewer'."},{"wrong":"She gave me an advice.","right":"She gave me a piece of advice.","why":"'Advice' không đếm được nên không dùng 'an'; dùng 'a piece of' hoặc 'some'."}],"quiz":[{"t":"mcq","q":"Can you give me some ___ about choosing a university?","o":["advices","advice","an advice","advise"],"a":1,"why":"'Advice' là danh từ không đếm được, không thêm -s; 'advise' là động từ."},{"t":"fill","q":"How ___ students are there in your class?","a":["many"],"why":"'Students' là danh từ đếm được số nhiều nên dùng 'how many'."},{"t":"mcq","q":"We don't have ___ time before the exam.","o":["many","a few","much","few"],"a":2,"why":"'Time' (thời gian) không đếm được nên dùng 'much' trong câu phủ định."},{"t":"mcq","q":"The new office has modern ___.","o":["furniture","furnitures","a furniture","furnitures'"],"a":0,"why":"'Furniture' là danh từ không đếm được nên không thêm -s và không dùng 'a'."},{"t":"fill","q":"There isn't ___ evidence that this diet works.","a":["much","any","enough"],"why":"'Evidence' không đếm được nên dùng 'much' hoặc 'any' trong câu phủ định."},{"t":"mcq","q":"I bought ___ new equipment for the lab.","o":["a","an","some","many"],"a":2,"why":"'Equipment' không đếm được nên dùng 'some', không dùng 'a/an' hay 'many'."},{"t":"mcq","q":"There were ___ people at the meeting than we expected.","o":["less","little","much","fewer"],"a":3,"why":"'People' là danh từ đếm được số nhiều nên dạng so sánh dùng 'fewer'."},{"t":"fill","q":"She gave me a useful ___ of advice.","a":["piece","bit","word"],"why":"Dùng đơn vị 'a piece of' để đếm danh từ không đếm được 'advice'."},{"t":"mcq","q":"The traffic in Ho Chi Minh City ___ terrible in the rush hour.","o":["are","is","were","have"],"a":1,"why":"'Traffic' không đếm được nên đi với động từ số ít 'is'."},{"t":"mcq","q":"I have ___ friends in Hanoi, so I don't feel lonely there.","o":["a few","a little","few","much"],"a":0,"why":"'A few' dùng với danh từ đếm được và mang nghĩa tích cực (có một vài); 'few' mang nghĩa hầu như không có."},{"t":"fill","q":"Unfortunately, very ___ research has been done on this topic.","a":["little"],"why":"'Research' không đếm được; 'very little' nghĩa là rất ít, hợp với 'unfortunately'."},{"t":"mcq","q":"I have three years of work ___ in marketing.","o":["experiences","experience","an experience","experienced"],"a":1,"why":"'Experience' với nghĩa kinh nghiệm làm việc là danh từ không đếm được."},{"t":"mcq","q":"Travelling around Asia was ___ I will never forget.","o":["experience","experiences","the experiences","an experience"],"a":3,"why":"'Experience' với nghĩa một trải nghiệm cụ thể là danh từ đếm được nên cần 'an'."},{"t":"fill","q":"How ___ money do students spend on food each month?","a":["much"],"why":"'Money' là danh từ không đếm được nên dùng 'how much'."},{"t":"mcq","q":"The government has introduced ___ to reduce plastic waste.","o":["a new legislation","new legislations","new legislation","a new legislations"],"a":2,"why":"'Legislation' là danh từ không đếm được nên không dùng 'a' và không thêm -s."},{"t":"fill","q":"There has been a sharp rise in the ___ (number / amount) of waste produced by households.","a":["amount"],"why":"'Waste' là danh từ không đếm được nên dùng 'the amount of', không dùng 'the number of'."}]},{"n":9,"en":"Articles","vi":"Mạo từ (a, an, the)","ielts":"Mạo từ xuất hiện trong hầu hết các câu nên dùng đúng giúp tăng điểm Accuracy trong cả Writing và Speaking, đặc biệt các cụm 'the number of', 'the graph shows'.","points":[{"h":"A / an","body":"Dùng a/an với danh từ đếm được số ít khi nhắc đến lần đầu hoặc nói về nghề nghiệp. Chọn a/an theo âm chứ không theo chữ cái: an hour, an MBA, a university, a European country.","ex":["My father is an engineer.","She studies at a university in Hanoi."]},{"h":"The: đã xác định","body":"Dùng 'the' khi người nghe biết ta nói đến cái nào: đã nhắc đến trước đó, là duy nhất (the sun, the internet), hoặc với so sánh nhất và số thứ tự.","ex":["I bought a laptop. The laptop is very fast.","The internet has changed the way we learn."]},{"h":"Không dùng mạo từ khi nói chung","body":"Khi nói chung chung về danh từ số nhiều hoặc danh từ không đếm được, không dùng mạo từ (zero article).","ex":["Children need regular exercise.","Technology has improved education in many countries."]},{"h":"Mạo từ khi mô tả số liệu","body":"Trong Writing Task 1, các cụm như the number of, the proportion of, the percentage of, the amount of và 'the graph/chart/table' luôn dùng 'the'.","ex":["The chart shows the percentage of people who cycle to work.","The number of visitors fell in 2020."]},{"h":"Tên riêng và địa danh","body":"Hầu hết tên quốc gia, thành phố, châu lục không dùng 'the'. Dùng 'the' với tên nước có dạng số nhiều hoặc có chữ Republic/Kingdom/States, và với sông, biển, đại dương, dãy núi.","ex":["She moved from Vietnam to the United Kingdom.","The Mekong River flows into the South China Sea."]}],"mistakes":[{"wrong":"My mother is teacher.","right":"My mother is a teacher.","why":"Khi nói về nghề nghiệp với danh từ số ít phải dùng 'a/an'."},{"wrong":"The education is important for everyone.","right":"Education is important for everyone.","why":"Nói chung chung về danh từ không đếm được thì không dùng 'the'."},{"wrong":"Number of tourists increased in 2020.","right":"The number of tourists increased in 2020.","why":"Cụm 'the number of' luôn cần mạo từ 'the'."}],"quiz":[{"t":"mcq","q":"I'm studying to become ___ engineer.","o":["a","an","the","— (no article)"],"a":1,"why":"Nói về nghề nghiệp dùng a/an; 'engineer' bắt đầu bằng nguyên âm nên dùng 'an'."},{"t":"fill","q":"It takes about ___ hour to get to work by bus.","a":["an"],"why":"Chữ 'h' trong 'hour' câm, từ bắt đầu bằng âm nguyên âm nên dùng 'an'."},{"t":"mcq","q":"___ sun rises in the east.","o":["A","An","The","— (no article)"],"a":2,"why":"Mặt trời là duy nhất nên dùng 'the'."},{"t":"mcq","q":"Which phrase is correct?","o":["an useful website","a useful website","an university","a hour"],"a":1,"why":"'Useful' bắt đầu bằng âm /j/ (phụ âm) nên dùng 'a'; 'university' cũng dùng 'a', 'hour' dùng 'an'."},{"t":"fill","q":"I bought a new laptop last week, but ___ battery is already weak.","a":["the","its"],"why":"Pin của chiếc laptop đã nhắc đến là cái xác định nên dùng 'the' (hoặc 'its')."},{"t":"mcq","q":"___ is one of the biggest problems in modern cities.","o":["The pollution","A pollution","Pollutions","Pollution"],"a":3,"why":"'Pollution' là danh từ không đếm được, nói chung chung nên không dùng mạo từ."},{"t":"mcq","q":"Mount Everest is ___ highest mountain in the world.","o":["the","a","an","— (no article)"],"a":0,"why":"Trước so sánh nhất luôn dùng 'the'."},{"t":"fill","q":"The chart shows ___ percentage of households that recycle.","a":["the"],"why":"Cụm 'the percentage of' trong mô tả số liệu luôn dùng 'the'."},{"t":"mcq","q":"My cousin moved to ___ last year.","o":["the United States","United States","a United States","an United States"],"a":0,"why":"Tên nước có chữ 'States' (dạng số nhiều) cần 'the'."},{"t":"mcq","q":"___ smartphones have changed the way people communicate.","o":["The","A","An","— (no article)"],"a":3,"why":"Nói chung chung về danh từ số nhiều nên không dùng mạo từ."},{"t":"fill","q":"She plays ___ piano beautifully.","a":["the"],"why":"Trong tiếng Anh–Anh, chơi nhạc cụ dùng 'play the + tên nhạc cụ'."},{"t":"mcq","q":"In many countries, ___ elderly need more support from the government.","o":["an","— (no article)","the","a"],"a":2,"why":"'The + tính từ' (the elderly, the poor) chỉ cả một nhóm người."},{"t":"mcq","q":"___ Mekong River flows through six countries.","o":["The","A","— (no article)","An"],"a":0,"why":"Tên sông luôn dùng 'the'."},{"t":"fill","q":"This is ___ most interesting book I have ever read.","a":["the"],"why":"Trước so sánh nhất 'most interesting' dùng 'the'."},{"t":"mcq","q":"There has been ___ significant increase in the use of renewable energy.","o":["the","a","an","— (no article)"],"a":1,"why":"'Increase' là danh từ đếm được số ít, được nhắc đến lần đầu; 'significant' bắt đầu bằng phụ âm nên dùng 'a'."},{"t":"fill","q":"___ Philippines is made up of over 7,000 islands.","a":["The","the"],"why":"Tên nước có dạng số nhiều (the Philippines) cần 'the'."}]},{"n":10,"en":"Linking & signposting","vi":"Từ nối và từ dẫn dắt","ielts":"Quyết định tiêu chí Coherence and Cohesion trong Writing và Fluency and Coherence trong Speaking Part 3.","points":[{"h":"Bổ sung ý","body":"Dùng and, also, in addition, moreover, furthermore để thêm ý cùng chiều. In addition / Moreover thường đứng đầu câu, theo sau là dấu phẩy.","ex":["Cycling is cheap. In addition, it is good for your health.","Public transport reduces traffic; moreover, it cuts pollution."]},{"h":"Tương phản","body":"But, however, although, while, whereas nối với mệnh đề; despite / in spite of + danh từ hoặc V-ing. Không dùng although và but trong cùng một câu.","ex":["Although the course was expensive, it was worth it.","Despite the high cost, many people still buy cars."]},{"h":"Nguyên nhân – kết quả","body":"Because / as + mệnh đề; because of / due to + danh từ; so / therefore / as a result chỉ kết quả.","ex":["Due to heavy rain, the match was cancelled.","Car use increased; as a result, air quality got worse."]},{"h":"Ví dụ và giải thích","body":"For example / for instance đứng đầu câu hoặc giữa câu; such as + danh từ dùng để liệt kê ví dụ ngay trong câu; in other words dùng để giải thích lại.","ex":["Some sports, such as swimming, are good for people with back problems.","Many jobs are now automated. For example, most banks use machines to count money."]},{"h":"Dẫn dắt bài viết và bài nói","body":"Dùng Firstly, Secondly, Finally để sắp xếp ý; On the one hand... On the other hand để so sánh hai mặt; Overall để tóm tắt xu hướng chính trong Task 1; In conclusion để kết bài Task 2.","ex":["Overall, the number of visitors rose over the period.","On the one hand, cities offer more jobs. On the other hand, living costs are high."]}],"mistakes":[{"wrong":"Although it was raining, but we went out.","right":"Although it was raining, we went out.","why":"Không dùng 'although' và 'but' cùng lúc trong một câu."},{"wrong":"Despite it was expensive, I bought it.","right":"Despite the high price, I bought it.","why":"'Despite' đi với danh từ hoặc V-ing, không đi với mệnh đề."},{"wrong":"The city is crowded, however it is exciting.","right":"The city is crowded; however, it is exciting.","why":"'However' nối hai mệnh đề cần dấu chấm phẩy trước và dấu phẩy sau."}],"quiz":[{"t":"mcq","q":"I wanted to go out, ___ I had too much homework.","o":["because","but","so","and"],"a":1,"why":"Hai ý trái ngược nhau (muốn đi chơi – có nhiều bài tập) nên dùng 'but'."},{"t":"fill","q":"I was tired, ___ I went to bed early.","a":["so"],"why":"Mệnh đề sau là kết quả của mệnh đề trước nên dùng 'so'."},{"t":"mcq","q":"___ the weather was bad, the festival continued.","o":["Although","Despite","However","Because of"],"a":0,"why":"Theo sau là mệnh đề (the weather was bad) và ý tương phản nên dùng 'Although'."},{"t":"mcq","q":"Many students work part-time ___ they need money for tuition.","o":["so","because","however","despite"],"a":1,"why":"Mệnh đề sau là lý do nên dùng 'because'."},{"t":"fill","q":"The flight was delayed ___ of bad weather.","a":["because"],"why":"'Because of' + danh từ chỉ nguyên nhân."},{"t":"mcq","q":"___ the high cost, many families send their children to private schools.","o":["Although","Because","However","Despite"],"a":3,"why":"Theo sau là cụm danh từ (the high cost) và ý tương phản nên dùng 'Despite'."},{"t":"mcq","q":"Cycling is good for your health. ___, it does not cause pollution.","o":["In addition","However","For example","In contrast"],"a":0,"why":"Câu sau thêm một lợi ích cùng chiều nên dùng 'In addition'."},{"t":"fill","q":"Some fruits, ___ as oranges and lemons, contain a lot of vitamin C.","a":["such"],"why":"'Such as' dùng để đưa ví dụ ngay trong câu."},{"t":"mcq","q":"Car ownership has risen sharply. ___, traffic congestion has become a serious problem.","o":["Although","Despite","As a result","For instance"],"a":2,"why":"Câu sau là hậu quả của câu trước nên dùng 'As a result'."},{"t":"mcq","q":"In IELTS Writing Task 1, which phrase is best to begin the summary of the main trends?","o":["In conclusion","Overall","Firstly","For example"],"a":1,"why":"'Overall' là cách chuẩn để mở đầu phần tổng quan xu hướng chính trong Task 1."},{"t":"fill","q":"City life is exciting. ___, it can also be very stressful.","a":["However","however","Nevertheless","On the other hand","Nonetheless"],"why":"Câu sau nêu ý tương phản, đứng đầu câu và theo sau là dấu phẩy nên dùng 'However'."},{"t":"mcq","q":"Men spend more time on sport, ___ women spend more time on reading.","o":["whereas","despite","because","so that"],"a":0,"why":"'Whereas' dùng để so sánh hai sự việc đối lập trong cùng một câu."},{"t":"mcq","q":"___ being expensive, the new phone sold very well.","o":["Although","However","In spite of","Even though"],"a":2,"why":"Theo sau là V-ing (being) nên dùng 'In spite of'; 'Although' và 'Even though' cần mệnh đề."},{"t":"fill","q":"Many people move to cities. ___ example, Hanoi's population has grown rapidly.","a":["For","for"],"why":"'For example' dùng để đưa ra ví dụ minh họa cho câu trước."},{"t":"mcq","q":"Which sentence is correct?","o":["Although the plan was good, but it failed.","The plan was good, however it failed.","Despite the plan was good, it failed.","The plan was good; however, it failed."],"a":3,"why":"'However' nối hai mệnh đề cần dấu chấm phẩy trước và dấu phẩy sau; các câu khác sai cấu trúc."},{"t":"fill","q":"The factory closed ___ to a lack of funding.","a":["due","owing"],"why":"'Due to' + danh từ chỉ nguyên nhân, thường dùng trong văn viết trang trọng."}]},{"n":11,"en":"Comparatives","vi":"So sánh","ielts":"Ngữ pháp so sánh giúp bạn mô tả và so sánh số liệu trong biểu đồ ở Writing Task 1, và so sánh hai quan điểm hoặc hai lựa chọn trong Task 2.","points":[{"h":"Tính từ ngắn và tính từ dài","body":"Tính từ ngắn (1 âm tiết, hoặc 2 âm tiết tận cùng bằng -y) thêm -er + than. Tính từ dài (2–3 âm tiết trở lên) dùng more + tính từ + than. Không bao giờ dùng cả hai cùng lúc.","ex":["Cities are usually noisier than villages.","Online courses are more flexible than traditional classes."]},{"h":"Dạng bất quy tắc","body":"Một số tính từ có dạng riêng: good → better → best, bad → worse → worst, far → further → furthest, little → less → least, much/many → more → most.","ex":["The exam results this year were better than last year.","Air pollution is worse in winter than in summer."]},{"h":"So sánh nhất (superlatives)","body":"Dùng the + -est (tính từ ngắn) hoặc the most + tính từ (tính từ dài). Thường đi với in + nơi chốn/nhóm, hoặc of + số lượng.","ex":["Tokyo is the largest city in the world by population.","Cost was the most important factor for students in the survey."]},{"h":"So sánh bằng: as … as","body":"as + tính từ + as nghĩa là 'bằng'; not as … as nghĩa là 'không bằng'. Có thể nói 'gấp đôi, gấp ba' bằng twice / three times as … as.","ex":["Women's salaries are not as high as men's in many industries.","Car ownership was twice as high in 2020 as in 1990."]},{"h":"Mức độ so sánh khi mô tả số liệu","body":"Thêm slightly, a little (hơi) hoặc much, far, significantly (hơn nhiều) trước dạng so sánh; không dùng very. Cấu trúc the + so sánh hơn …, the + so sánh hơn … nghĩa là 'càng … càng …'.","ex":["Spending on health was slightly higher than spending on education.","The more people use public transport, the cleaner the air becomes."]}],"mistakes":[{"wrong":"Living in the city is more easier than living in the countryside.","right":"Living in the city is easier than living in the countryside.","why":"Không dùng more cùng với đuôi -er."},{"wrong":"The number of students in 2020 was higher than 2010.","right":"The number of students in 2020 was higher than in 2010.","why":"Phải so sánh hai thứ cùng loại (số liệu năm 2020 với số liệu năm 2010), nên cần thêm 'in'."},{"wrong":"My opinion is as same as my teacher's.","right":"My opinion is the same as my teacher's.","why":"Cấu trúc đúng là 'the same as', không phải 'as same as'."}],"quiz":[{"t":"mcq","q":"Bicycles are ___ than cars for short journeys in the city.","o":["fast","faster","more fast","fastest"],"a":1,"why":"'Fast' là tính từ ngắn nên so sánh hơn là 'faster'."},{"t":"fill","q":"Online shopping is ___ (convenient) than going to a shopping centre.","a":["more convenient"],"why":"'Convenient' là tính từ dài nên dùng 'more convenient'."},{"t":"mcq","q":"Health was ___ important issue for voters in the survey.","o":["the most","most","the more","more"],"a":0,"why":"So sánh nhất của tính từ dài cần 'the most'."},{"t":"fill","q":"Air quality in the capital is ___ (bad) now than it was ten years ago.","a":["worse"],"why":"'Bad' là bất quy tắc: bad → worse → worst."},{"t":"mcq","q":"The new library is not ___ the old one.","o":["as big than","as bigger as","as big as","so big than"],"a":2,"why":"So sánh bằng dùng 'as + tính từ nguyên dạng + as'."},{"t":"mcq","q":"Of all the countries in the chart, Canada had the ___ unemployment rate.","o":["more low","lower","lowest","more lower"],"a":2,"why":"'Of all the countries' cho thấy so sánh nhất: the lowest."},{"t":"fill","q":"This year's exam was ___ (difficult) of all the tests I have taken.","a":["the most difficult"],"why":"So sánh nhất của tính từ dài: the most difficult."},{"t":"mcq","q":"My opinion on homework is ___ my teacher's.","o":["as same as","same as","the same with","the same as"],"a":3,"why":"Cụm cố định là 'the same as'."},{"t":"mcq","q":"Spending on transport was ___ higher than spending on clothing, at 30% compared with 10%.","o":["much","very","more","most"],"a":0,"why":"Dùng much/far để nhấn mạnh so sánh hơn; không dùng 'very higher'."},{"t":"fill","q":"In 2015, the price of electricity was three times ___ (high) it was in 1995.","a":["as high as"],"why":"Nói 'gấp ba lần' dùng three times as + tính từ + as."},{"t":"mcq","q":"The ___ people exercise, the healthier they tend to be.","o":["much","more","most","many"],"a":1,"why":"Cấu trúc 'càng … càng …': the more …, the + so sánh hơn …"},{"t":"mcq","q":"The percentage of graduates who found jobs was higher in 2019 than ___ 2009.","o":["at","that","it","in"],"a":3,"why":"Cần 'in 2009' để so sánh đúng hai mốc thời gian tương đương."},{"t":"fill","q":"The number of male students was slightly ___ (great) than that of female students.","a":["greater"],"why":"'Great' là tính từ ngắn: greater; 'slightly' chỉ mức chênh lệch nhỏ."},{"t":"mcq","q":"Which sentence is correct?","o":["Rents in London are higher than those in Manchester.","Rents in London are higher than Manchester.","Rents in London are higher than that in Manchester.","Rents in London are more high than in Manchester."],"a":0,"why":"'Rents' là số nhiều nên dùng 'those' để thay thế và so sánh đúng hai thứ cùng loại."},{"t":"mcq","q":"Twice ___ tourists visited the museum in August as in January.","o":["as much","more","as many","many as"],"a":2,"why":"'Tourists' là danh từ đếm được số nhiều nên dùng 'as many … as'."},{"t":"fill","q":"The cleaner the energy we use, ___ (little) damage we do to the planet.","a":["the less"],"why":"Cấu trúc 'the + so sánh hơn …, the + so sánh hơn …'; little → less."}]},{"n":12,"en":"Modals 1","vi":"Động từ khiếm khuyết 1: khả năng, nghĩa vụ, lời khuyên","ielts":"Các động từ khiếm khuyết như should, must, have to giúp bạn đưa ra giải pháp và lời khuyên trong Writing Task 2, và nói về khả năng trong Speaking.","points":[{"h":"Khả năng (ability)","body":"Dùng can (hiện tại), could (khả năng chung trong quá khứ) và be able to (cho các thì khác, ví dụ will be able to).","ex":["Many young people can use several apps at the same time.","In the future, robots will be able to do many household jobs."]},{"h":"Nghĩa vụ: must và have to","body":"Must thường thể hiện ý kiến của người nói rằng điều gì đó rất cần thiết; have to thường nói về quy định từ bên ngoài. Quá khứ của cả hai là had to.","ex":["Students have to wear a uniform at most Vietnamese schools.","Governments must act quickly to reduce pollution."]},{"h":"mustn't và don't have to","body":"Mustn't nghĩa là 'cấm, không được phép'. Don't have to nghĩa là 'không cần, không bắt buộc'. Hai cấu trúc này khác nghĩa hoàn toàn.","ex":["Drivers mustn't use their phones while driving.","Employees don't have to work at weekends."]},{"h":"Lời khuyên: should và ought to","body":"Should / ought to dùng để khuyên hoặc đề xuất giải pháp; shouldn't để khuyên không nên. Rất hữu ích trong bài Task 2 dạng giải pháp.","ex":["Governments should invest more in public transport.","Parents ought to limit their children's screen time."]},{"h":"Quy tắc ngữ pháp chung","body":"Sau can, could, must, should luôn là động từ nguyên mẫu không 'to' (bare infinitive) và không chia theo chủ ngữ. Riêng have to và ought to thì có 'to'.","ex":["The government should invest in education.","Local authorities can provide free sports facilities."]}],"mistakes":[{"wrong":"Students must to study hard to pass the exam.","right":"Students must study hard to pass the exam.","why":"Sau must không dùng 'to'."},{"wrong":"The government should invests in education.","right":"The government should invest in education.","why":"Sau động từ khiếm khuyết, động từ giữ nguyên mẫu, không thêm -s."},{"wrong":"At university, students mustn't wear a uniform, so they can choose their clothes.","right":"At university, students don't have to wear a uniform, so they can choose their clothes.","why":"Mustn't là 'bị cấm'; ở đây ý là 'không bắt buộc' nên dùng don't have to."}],"quiz":[{"t":"mcq","q":"Many children ___ use a smartphone before they can read.","o":["can","cans","can to","are can"],"a":0,"why":"Can không thêm -s và không đi với 'to'."},{"t":"fill","q":"Young people ___ (should / not) spend too much time online.","a":["shouldn't","should not"],"why":"Lời khuyên phủ định dùng shouldn't + động từ nguyên mẫu."},{"t":"mcq","q":"In many countries, drivers ___ wear a seat belt. It is the law.","o":["should","have to","don't have to","could"],"a":1,"why":"Quy định bắt buộc từ luật pháp dùng have to."},{"t":"mcq","q":"You ___ bring your own laptop; the university provides computers in the library.","o":["mustn't","can't","don't have to","haven't to"],"a":2,"why":"Ý là 'không cần mang', không phải 'bị cấm', nên dùng don't have to."},{"t":"fill","q":"Fifty years ago, most people ___ (can / not) afford to travel abroad.","a":["couldn't","could not"],"why":"Khả năng chung trong quá khứ ở dạng phủ định là couldn't."},{"t":"mcq","q":"Students ___ use their phones during the exam. It is strictly forbidden.","o":["don't have to","needn't","shouldn't to","mustn't"],"a":3,"why":"'Strictly forbidden' nghĩa là bị cấm, nên dùng mustn't."},{"t":"mcq","q":"When my father was young, he ___ walk five kilometres to school every day.","o":["must","has to","had to","musted"],"a":2,"why":"Must không có dạng quá khứ; nghĩa vụ trong quá khứ dùng had to."},{"t":"fill","q":"In the future, people will ___ (able) to work from anywhere.","a":["be able"],"why":"Sau will không dùng can, nên dùng will be able to."},{"t":"mcq","q":"If you want to improve your writing, you ___ read more academic articles.","o":["should to","must to","ought","ought to"],"a":3,"why":"Ought luôn đi với 'to'; should và must thì không có 'to'."},{"t":"mcq","q":"Which sentence gives ADVICE, not a rule?","o":["Visitors must show their passports at the entrance.","Passengers have to buy a ticket before boarding.","Smoking is not allowed in the building.","People should drink more water in hot weather."],"a":3,"why":"Should dùng để khuyên; các câu còn lại là quy định."},{"t":"fill","q":"Employees ___ (not / have to) wear a suit on Fridays; casual clothes are fine.","a":["don't have to","do not have to"],"why":"Không bắt buộc thì dùng don't have to."},{"t":"mcq","q":"Although the exam was difficult, most students ___ finish it on time.","o":["were able to","are able","can","must"],"a":0,"why":"Nói về việc đã làm được trong một lần cụ thể ở quá khứ, dùng was/were able to."},{"t":"fill","q":"Last year, all staff ___ (have) to complete a safety course.","a":["had"],"why":"Nghĩa vụ trong quá khứ: had to."},{"t":"mcq","q":"It is a legal requirement: all new buildings ___ meet strict energy standards.","o":["might","can","must","ought"],"a":2,"why":"'Legal requirement' là nghĩa vụ bắt buộc nên dùng must; ought thiếu 'to'."},{"t":"fill","q":"In the past, women in some countries ___ (not / be able) to vote.","a":["were not able","weren't able"],"why":"Quá khứ của be able to ở dạng phủ định với chủ ngữ số nhiều là were not able to."},{"t":"mcq","q":"Which sentence is correct?","o":["People shouldn't to drive in city centres.","The government ought to reduce taxes on electric cars.","Students must to pay attention to deadlines.","We should to protect endangered species."],"a":1,"why":"Chỉ ought cần 'to'; shouldn't, must, should không đi với 'to'."}]},{"n":13,"en":"Modals 2","vi":"Động từ khiếm khuyết 2: suy đoán và nói thận trọng","ielts":"Dùng may, might, could để nói thận trọng (hedging) giúp lập luận Task 2 mang tính học thuật hơn và tránh khẳng định quá mạnh.","points":[{"h":"Suy đoán ở hiện tại: must và can't","body":"Must + V khi bạn gần như chắc chắn điều gì đó đúng; can't + V khi bạn gần như chắc chắn điều đó sai, dựa trên bằng chứng.","ex":["She works 60 hours a week, so she must be exhausted.","That figure can't be right because it is higher than the total."]},{"h":"Khả năng: may, might, could","body":"May / might / could + V diễn tả điều có thể xảy ra nhưng không chắc chắn (khoảng 50%). Dạng phủ định thường dùng may not / might not.","ex":["Higher taxes on fuel may reduce traffic in city centres.","Online learning could become the main form of education."]},{"h":"Suy đoán về quá khứ","body":"Dùng must have / might have / may have / can't have + V3 (past participle) để đoán về việc đã xảy ra.","ex":["The fall in sales must have been caused by the new competitor.","Ancient people might have used this tool for hunting."]},{"h":"Tiếc nuối và chỉ trích: should have","body":"Should have + V3 nghĩa là 'lẽ ra nên làm nhưng đã không làm'; shouldn't have + V3 là 'lẽ ra không nên làm nhưng đã làm'.","ex":["The city should have built more parks before the population grew.","The company shouldn't have ignored the warnings."]},{"h":"Nói thận trọng (hedging) trong văn học thuật","body":"Ngoài may/might, có thể dùng be likely to, tend to, it is possible that để tránh khái quát hóa quá mức.","ex":["Technology may not always improve people's quality of life.","Children who read regularly are likely to perform better at school."]}],"mistakes":[{"wrong":"The economy might grows next year.","right":"The economy might grow next year.","why":"Sau might động từ giữ nguyên mẫu."},{"wrong":"He must went home early because his office was dark.","right":"He must have gone home early because his office was dark.","why":"Suy đoán về quá khứ dùng must have + V3."},{"wrong":"Social media causes depression in all teenagers.","right":"Social media may cause depression in some teenagers.","why":"Trong bài học thuật nên dùng may và tránh từ tuyệt đối như 'all' để không khẳng định quá mạnh."}],"quiz":[{"t":"mcq","q":"Scientists believe the new drug ___ help patients with heart disease, but more tests are needed.","o":["may","must to","mights","is can"],"a":0,"why":"'More tests are needed' cho thấy chưa chắc chắn, nên dùng may + V."},{"t":"fill","q":"The figure ___ (can / not) be correct; it is more than 100%.","a":["can't","cannot"],"why":"Gần như chắc chắn là sai thì dùng can't + V."},{"t":"mcq","q":"Look at all those people with umbrellas. It ___ be raining.","o":["can't","must","should","mustn't"],"a":1,"why":"Có bằng chứng rõ ràng nên suy đoán chắc chắn dùng must."},{"t":"mcq","q":"Robots ___ replace many factory workers in the next twenty years.","o":["must have","should have","can't have","could"],"a":3,"why":"Nói về khả năng trong tương lai dùng could + V; các lựa chọn khác nói về quá khứ."},{"t":"fill","q":"The museum is closed today, so it ___ (might / be) a public holiday.","a":["might be"],"why":"Might + động từ nguyên mẫu diễn tả một khả năng."},{"t":"mcq","q":"The ancient city ___ by an earthquake; archaeologists are still not sure.","o":["must have been destroyed","might have been destroyed","can't have destroyed","should have been destroyed"],"a":1,"why":"'Still not sure' nên dùng might have + bị động (been destroyed)."},{"t":"mcq","q":"I can't find my report. I ___ it on the train.","o":["must left","should leave","may leave","might have left"],"a":3,"why":"Đoán về việc có thể đã xảy ra trong quá khứ: might have + V3."},{"t":"fill","q":"The company lost a lot of money. The managers ___ (should / listen) to the experts' advice.","a":["should have listened"],"why":"Lẽ ra nên làm nhưng đã không làm: should have + V3."},{"t":"mcq","q":"Tom got 9.0 in IELTS Reading. He ___ have practised a lot.","o":["can't","shouldn't","needn't","must"],"a":3,"why":"Kết quả cao là bằng chứng mạnh, nên suy đoán chắc chắn: must have practised."},{"t":"mcq","q":"She ___ have seen the email; she was on holiday with no internet.","o":["must","should","can't","may"],"a":2,"why":"Không có internet nên gần như chắc chắn cô ấy không thể đã thấy: can't have + V3."},{"t":"fill","q":"The bridge collapsed after only five years, so the engineers ___ (must / make) serious mistakes.","a":["must have made"],"why":"Suy đoán chắc chắn về quá khứ: must have + V3."},{"t":"mcq","q":"Which sentence is the most suitable for an academic essay?","o":["Video games make all children violent.","Video games definitely destroy children's minds.","Violent video games may increase aggressive behaviour in some children.","Every expert agrees that video games are dangerous."],"a":2,"why":"Câu dùng may và some là cách nói thận trọng (hedging) phù hợp với văn học thuật."},{"t":"mcq","q":"The government ___ invested in flood defences earlier; now the damage is enormous.","o":["should have","must have","might","should"],"a":0,"why":"Chỉ trích việc đã không làm trong quá khứ: should have + V3."},{"t":"fill","q":"The sharp fall in bee numbers in 2015 ___ (may / cause) by pesticides.","a":["may have been caused"],"why":"Suy đoán về quá khứ ở dạng bị động: may have been + V3."},{"t":"mcq","q":"The results ___ have been accurate because the sample was very small.","o":["must","should","might not","ought to"],"a":2,"why":"Mẫu nhỏ khiến kết quả có thể không chính xác: might not have been."},{"t":"fill","q":"Electric cars ___ (likely / become) cheaper than petrol cars in the next decade.","a":["are likely to become","will likely become"],"why":"Be likely to + V là cách nói thận trọng về tương lai."}]},{"n":14,"en":"Conditionals","vi":"Câu điều kiện","ielts":"Câu điều kiện giúp bạn nêu hậu quả, giải pháp và giả định trong Writing Task 2, và trả lời các câu hỏi giả định trong Speaking Part 3.","points":[{"h":"Loại 0: sự thật chung","body":"If + hiện tại đơn, hiện tại đơn. Dùng cho sự thật khoa học hoặc điều luôn xảy ra khi có điều kiện.","ex":["If water reaches 100°C, it boils.","If people do not sleep enough, their concentration drops."]},{"h":"Loại 1: khả năng có thật ở tương lai","body":"If + hiện tại đơn, will + V. Không dùng will trong mệnh đề if.","ex":["If the government raises fuel taxes, fewer people will drive.","If you practise every day, your writing will improve."]},{"h":"Loại 2: giả định ở hiện tại/tương lai","body":"If + quá khứ đơn, would + V. Dùng cho tình huống không có thật hoặc khó xảy ra; với be, dạng trang trọng là were cho mọi chủ ngữ.","ex":["If public transport were free, more people would use it.","If I had more time, I would learn another language."]},{"h":"Loại 3: giả định về quá khứ","body":"If + had + V3, would have + V3. Nói về điều đã không xảy ra trong quá khứ và kết quả tưởng tượng của nó.","ex":["If the city had built more flood defences, the damage would have been smaller.","If I had studied harder, I would have passed the exam."]},{"h":"Unless và các từ nối điều kiện khác","body":"Unless = if … not (trừ khi), nên không thêm not sau unless. As long as / provided that nghĩa là 'miễn là'.","ex":["Unless we reduce emissions, temperatures will keep rising.","Students can borrow laptops as long as they return them on time."]}],"mistakes":[{"wrong":"If the government will invest more, the economy will grow.","right":"If the government invests more, the economy will grow.","why":"Không dùng will trong mệnh đề if của câu điều kiện loại 1."},{"wrong":"If I would have more money, I would buy a house.","right":"If I had more money, I would buy a house.","why":"Mệnh đề if của loại 2 dùng quá khứ đơn, không dùng would."},{"wrong":"Unless people don't recycle, landfills will be full.","right":"Unless people recycle, landfills will be full.","why":"Unless đã mang nghĩa phủ định nên không thêm don't."}],"quiz":[{"t":"mcq","q":"If you heat ice, it ___.","o":["melts","melted","would melt","will melted"],"a":0,"why":"Sự thật khoa học dùng câu điều kiện loại 0: hiện tại đơn ở cả hai mệnh đề."},{"t":"fill","q":"If it ___ (rain) tomorrow, the outdoor event will be cancelled.","a":["rains"],"why":"Loại 1: mệnh đề if dùng hiện tại đơn, chủ ngữ 'it' nên thêm -s."},{"t":"mcq","q":"If more people cycle to work, there ___ less traffic in the city centre.","o":["is being","would have been","will be","were"],"a":2,"why":"Mệnh đề if ở hiện tại đơn nên mệnh đề chính dùng will + V (loại 1)."},{"t":"fill","q":"If I ___ (be) the Minister of Education, I would make school meals free.","a":["were","was"],"why":"Loại 2 dùng quá khứ đơn; 'were' là dạng trang trọng, 'was' dùng trong văn nói."},{"t":"mcq","q":"If governments ___ more in renewable energy, air pollution would fall.","o":["invest","invested","will invest","had invest"],"a":1,"why":"Mệnh đề chính có would nên mệnh đề if dùng quá khứ đơn (loại 2)."},{"t":"mcq","q":"___ students submit their essays on time, they will lose marks.","o":["If","As long as","Provided","Unless"],"a":3,"why":"Ý là 'nếu không nộp đúng hạn' nên dùng unless."},{"t":"fill","q":"If the company ___ (not / reduce) its prices, it will lose customers.","a":["doesn't reduce","does not reduce"],"why":"Loại 1 phủ định với chủ ngữ số ít: doesn't + V."},{"t":"mcq","q":"If I had known about the scholarship, I ___ for it.","o":["would apply","will apply","would have applied","had applied"],"a":2,"why":"Mệnh đề if là had + V3 nên mệnh đề chính dùng would have + V3 (loại 3)."},{"t":"mcq","q":"What would happen if robots ___ all the jobs in factories?","o":["take","took","will take","would take"],"a":1,"why":"Câu hỏi giả định với would nên mệnh đề if dùng quá khứ đơn."},{"t":"fill","q":"If the factory ___ (follow) safety rules, the accident would not have happened.","a":["had followed"],"why":"Giả định trái với quá khứ: if + had + V3."},{"t":"mcq","q":"You can use the library computers ___ you have a student card.","o":["unless","in case of","even","as long as"],"a":3,"why":"'As long as' nghĩa là 'miễn là', phù hợp với điều kiện có thẻ sinh viên."},{"t":"mcq","q":"If plastic bags were banned, people ___ to bring their own bags.","o":["would have","will have","would have had","had"],"a":0,"why":"Loại 2: would + V (would have to bring)."},{"t":"fill","q":"The river ___ (not / flood) last year if the city had built higher walls.","a":["wouldn't have flooded","would not have flooded"],"why":"Loại 3: would not have + V3."},{"t":"mcq","q":"Which sentence is correct?","o":["If the price of petrol rises, people would drive less.","If the price of petrol rose, people will drive less.","If the price of petrol rises, people will drive less.","If the price of petrol will rise, people drive less."],"a":2,"why":"Loại 1: if + hiện tại đơn, will + V."},{"t":"fill","q":"Unless the government ___ (take) action now, the problem will get worse.","a":["takes"],"why":"Sau unless dùng hiện tại đơn ở thể khẳng định (giống mệnh đề if loại 1)."},{"t":"mcq","q":"If the internet had not been invented, our lives ___ very different today.","o":["will be","are","would have","would be"],"a":3,"why":"Câu điều kiện hỗn hợp: điều kiện ở quá khứ, kết quả ở hiện tại ('today') nên dùng would + V."}]},{"n":15,"en":"Reported speech","vi":"Câu tường thuật","ielts":"Các động từ tường thuật như claim, argue, suggest giúp bạn trình bày quan điểm của người khác trong Task 2 và hiểu cách bài Reading mô tả nghiên cứu.","points":[{"h":"Lùi thì (backshift)","body":"Khi động từ tường thuật ở quá khứ (said, told), động từ trong câu được tường thuật thường lùi một thì: hiện tại → quá khứ, hiện tại hoàn thành → quá khứ hoàn thành, will → would.","ex":["The manager said that sales were falling.","She said that she had finished the report."]},{"h":"Khi nào không cần lùi thì","body":"Không cần lùi thì khi nói về sự thật chung hoặc điều vẫn còn đúng, và khi động từ tường thuật ở hiện tại (says, argue, states).","ex":["The teacher said that the Earth goes around the Sun.","Experts say that too much sugar is harmful to health."]},{"h":"Động từ tường thuật học thuật","body":"Thay vì chỉ dùng say, hãy dùng claim, argue, state, believe, point out + that + mệnh đề. Lưu ý: tell cần tân ngữ (tell someone), còn say thì không.","ex":["Some people argue that university education should be free.","The report states that unemployment has fallen."]},{"h":"suggest và recommend","body":"Dùng suggest/recommend + V-ing, hoặc suggest/recommend that + chủ ngữ + (should) + V nguyên mẫu. Không dùng suggest someone to do something.","ex":["The researchers suggest that schools start later in the morning.","The doctor suggested reducing salt in our diet."]},{"h":"Câu hỏi tường thuật","body":"Câu hỏi tường thuật dùng trật tự câu khẳng định (chủ ngữ + động từ), không đảo trợ động từ. Câu hỏi Yes/No dùng if hoặc whether.","ex":["The interviewer asked me why I wanted the job.","Students asked whether the exam would be online."]}],"mistakes":[{"wrong":"He suggested me to apply for the scholarship.","right":"He suggested that I apply for the scholarship.","why":"Suggest không dùng cấu trúc + tân ngữ + to V."},{"wrong":"She asked me where did I live.","right":"She asked me where I lived.","why":"Câu hỏi tường thuật không đảo trợ động từ."},{"wrong":"He said me that the meeting was cancelled.","right":"He told me that the meeting was cancelled.","why":"Say không đi trực tiếp với tân ngữ chỉ người; dùng tell + người."}],"quiz":[{"t":"mcq","q":"The teacher ___ us that the test would be on Friday.","o":["said","spoke","told","talked"],"a":2,"why":"Có tân ngữ chỉ người (us) ngay sau động từ nên dùng told."},{"t":"fill","q":"'I am tired,' she said. → She said that she ___ (be) tired.","a":["was"],"why":"Động từ tường thuật ở quá khứ nên am lùi thành was."},{"t":"mcq","q":"'We will open a new branch,' the CEO said. → The CEO said that they ___ a new branch.","o":["will open","would open","opened","have opened"],"a":1,"why":"Will lùi thành would."},{"t":"fill","q":"'I have finished my essay,' Minh said. → Minh said that he ___ (finish) his essay.","a":["had finished"],"why":"Hiện tại hoàn thành lùi thành quá khứ hoàn thành."},{"t":"mcq","q":"She asked me ___.","o":["where did I study","where do I study","where studied I","where I studied"],"a":3,"why":"Câu hỏi tường thuật dùng trật tự chủ ngữ + động từ, không đảo."},{"t":"mcq","q":"The interviewer asked ___ I had any experience in marketing.","o":["whether","that","what","do"],"a":0,"why":"Câu hỏi Yes/No khi tường thuật dùng if hoặc whether."},{"t":"fill","q":"The doctor suggested ___ (reduce) the amount of sugar in our diet.","a":["reducing"],"why":"Suggest + V-ing."},{"t":"mcq","q":"The report ___ that the number of tourists increased by 15% in 2023.","o":["tells","says to","states","speaks"],"a":2,"why":"State + that là động từ tường thuật trang trọng, phù hợp với báo cáo."},{"t":"mcq","q":"Many scientists ___ that climate change is caused mainly by human activity.","o":["agree with","tell","suggest to","believe"],"a":3,"why":"Believe + that + mệnh đề; tell cần tân ngữ, 'agree with that' và 'suggest to that' sai cấu trúc."},{"t":"fill","q":"The researchers recommended that the school day ___ (start) later.","a":["start","should start"],"why":"Recommend that + chủ ngữ + (should) + V nguyên mẫu, không thêm -s."},{"t":"mcq","q":"My tutor suggested ___ more academic articles to improve my vocabulary.","o":["me to read","to read","that I read","me reading"],"a":2,"why":"Suggest that + chủ ngữ + V; không dùng suggest me to do hay suggest to do."},{"t":"mcq","q":"Some people ___ that social media brings people together, while others disagree.","o":["tell","argue","ask","explain to"],"a":1,"why":"Argue that dùng để trình bày một quan điểm trong tranh luận."},{"t":"fill","q":"'Can you send me the data?' my manager asked. → My manager asked if I ___ (can) send him the data.","a":["could"],"why":"Can lùi thành could."},{"t":"mcq","q":"The professor said that water ___ at 100°C.","o":["boils","boil","had boiled","was boiled"],"a":0,"why":"Sự thật khoa học vẫn đúng nên có thể giữ hiện tại đơn."},{"t":"fill","q":"The minister ___ (deny) that the government had wasted public money.","a":["denied"],"why":"Câu tường thuật ở quá khứ (had wasted) nên dùng denied; deny that nghĩa là phủ nhận."},{"t":"mcq","q":"'Don't use your phone in class,' the teacher said. → The teacher told us ___ our phones in class.","o":["don't use","not use","to not using","not to use"],"a":3,"why":"Mệnh lệnh phủ định khi tường thuật: tell someone not to + V."}]},{"n":16,"en":"Pronoun use","vi":"Cách dùng đại từ","ielts":"Dùng đại từ (it, this, they, which) đúng cách để tránh lặp từ giúp tăng điểm Coherence and Cohesion trong cả Task 1 và Task 2.","points":[{"h":"it và they thay cho danh từ đã nhắc","body":"It thay cho danh từ số ít hoặc không đếm được; they thay cho danh từ số nhiều. Đại từ phải khớp số với danh từ nó thay thế.","ex":["The government introduced a new tax. It was very unpopular.","Many students work part-time because they need money."]},{"h":"this/these + danh từ tóm tắt","body":"This/these + danh từ (this trend, this problem, these rules) dùng để nhắc lại ý của cả câu trước, giúp các câu liên kết chặt chẽ.","ex":["Car use has doubled in ten years. This trend has led to serious air pollution.","Some schools have banned phones. These rules aim to improve concentration."]},{"h":"which thay cho cả mệnh đề","body":"Sau dấu phẩy, which có thể thay cho toàn bộ ý của mệnh đề phía trước.","ex":["Many young people move to cities, which puts pressure on housing.","Prices rose by 20%, which surprised many analysts."]},{"h":"one/ones và that/those","body":"One/ones thay cho danh từ đếm được để không lặp lại. Khi so sánh số liệu, dùng that of (số ít/không đếm được) và those of (số nhiều).","ex":["Old buildings use more energy than new ones.","The population of Hanoi is larger than that of Da Nang."]},{"h":"it làm chủ ngữ giả","body":"Tiếng Anh luôn cần chủ ngữ, nên dùng It is + tính từ + to V / that … khi không có chủ ngữ cụ thể. Không lặp lại chủ ngữ bằng đại từ.","ex":["It is essential to protect natural habitats.","It is often said that travel broadens the mind."]}],"mistakes":[{"wrong":"Pollution is a serious problem. They affect everyone's health.","right":"Pollution is a serious problem. It affects everyone's health.","why":"Pollution là danh từ không đếm được nên dùng it."},{"wrong":"Is important to learn English for work.","right":"It is important to learn English for work.","why":"Câu tiếng Anh cần chủ ngữ, nên phải thêm chủ ngữ giả it."},{"wrong":"My brother, he works in a hospital.","right":"My brother works in a hospital.","why":"Không lặp lại chủ ngữ bằng một đại từ."}],"quiz":[{"t":"mcq","q":"The library is very popular because ___ opens 24 hours a day.","o":["they","its","this's","it"],"a":3,"why":"Library là danh từ số ít nên dùng it."},{"t":"fill","q":"___ is difficult to find a cheap flat in the city centre.","a":["It","it"],"why":"Cần chủ ngữ giả It trong cấu trúc It is + tính từ + to V."},{"t":"mcq","q":"Each student must bring ___ own laptop to the class.","o":["their","they're","there","its"],"a":0,"why":"Their là tính từ sở hữu, có thể dùng cho 'each student' khi không rõ giới tính."},{"t":"fill","q":"Smartphones are useful, but ___ can also be addictive.","a":["they"],"why":"Smartphones là số nhiều nên dùng they."},{"t":"fill","q":"My old laptop was very slow, so the university gave me a new ___.","a":["one"],"why":"One thay cho danh từ đếm được số ít (laptop) để tránh lặp."},{"t":"mcq","q":"Unemployment rose sharply in 2009. ___ was mainly caused by the global financial crisis.","o":["These rise","They","This rise","Which"],"a":2,"why":"This + danh từ số ít (rise) tóm tắt ý của câu trước."},{"t":"mcq","q":"The new law was introduced in 2015. Since then, ___ has reduced road accidents by 20%.","o":["they","which","one","it"],"a":3,"why":"It thay cho 'the new law' (số ít)."},{"t":"fill","q":"Tuition fees have increased, ___ means that fewer students can afford university.","a":["which"],"why":"Which sau dấu phẩy thay cho cả mệnh đề phía trước."},{"t":"mcq","q":"The salaries of nurses are lower than ___ of doctors.","o":["that","them","ones","those"],"a":3,"why":"Salaries là số nhiều nên dùng those of."},{"t":"mcq","q":"The climate of Sapa is cooler than ___ of Hanoi.","o":["those","it","that","one"],"a":2,"why":"Climate là danh từ số ít nên dùng that of."},{"t":"fill","q":"Some cities have introduced congestion charges. ___ (this) measures have reduced traffic significantly.","a":["These","these"],"why":"Measures là số nhiều nên this đổi thành these."},{"t":"mcq","q":"In the sentence 'The teacher told the student that she had made a mistake', which word is unclear (ambiguous)?","o":["she","teacher","told","mistake"],"a":0,"why":"'She' có thể chỉ giáo viên hoặc học sinh nên không rõ nghĩa."},{"t":"mcq","q":"Many people moved to the suburbs, ___ led to longer commuting times.","o":["this","which","that","it"],"a":1,"why":"Sau dấu phẩy, dùng which để thay cho cả ý trước; that không dùng sau dấu phẩy."},{"t":"fill","q":"Rents in London are higher than ___ in other UK cities.","a":["those"],"why":"Those thay cho 'rents' (số nhiều) để tránh lặp."},{"t":"mcq","q":"Choose the best second sentence: 'Online learning offers great flexibility. ___'","o":["Online learning allows online learners to study online at any time.","This flexibility allows students to study at any time.","They allows students to study at any time.","Which allows students to study at any time."],"a":1,"why":"'This flexibility' nối ý mà không lặp từ; các câu khác lặp từ hoặc sai ngữ pháp."},{"t":"mcq","q":"The government has promised to build ten new hospitals. ___ plan will cost billions of dollars.","o":["This","These","Those","Which"],"a":0,"why":"Plan là danh từ số ít nên dùng This + danh từ để nhắc lại ý câu trước."}]},{"n":17,"en":"Paragraph and text organization","vi":"Tổ chức đoạn văn và bài viết","ielts":"Tổ chức đoạn văn rõ ràng (câu chủ đề, giải thích, ví dụ) là yếu tố chính của tiêu chí Coherence and Cohesion trong Writing Task 2.","points":[{"h":"Câu chủ đề (topic sentence)","body":"Câu đầu tiên của đoạn thân bài nêu ý chính của cả đoạn. Người đọc chỉ cần đọc câu này là biết đoạn văn nói về gì.","ex":["One major advantage of working from home is the time it saves.","However, there are also serious drawbacks to relying on private cars."]},{"h":"Câu hỗ trợ: giải thích và ví dụ","body":"Sau câu chủ đề là câu giải thích (This is because …) rồi đến ví dụ cụ thể (For example …). Mỗi câu phải liên quan trực tiếp đến ý chính.","ex":["This is because employees no longer need to travel to the office.","For example, a worker in Hanoi may save two hours a day."]},{"h":"Từ nối thứ tự và bổ sung ý","body":"Dùng Firstly, Secondly, In addition, Moreover, Finally để sắp xếp và thêm ý. Đặt từ nối ở đầu câu, sau đó là dấu phẩy.","ex":["Firstly, public transport reduces traffic congestion.","In addition, it is cheaper than driving."]},{"h":"Từ nối tương phản và kết quả","body":"However, On the other hand dùng cho ý đối lập; As a result, Therefore, Consequently dùng cho kết quả. Although/While nối hai mệnh đề trong cùng một câu.","ex":["As a result, fewer young people own cars.","On the other hand, some people cannot afford these services."]},{"h":"Mỗi đoạn một ý chính và câu kết đoạn","body":"Mỗi đoạn chỉ phát triển một ý chính. Câu cuối (concluding sentence) có thể nhắc lại ý chính hoặc nêu hệ quả.","ex":["Overall, working from home benefits both employees and employers.","Therefore, governments should invest more in cycling infrastructure."]}],"mistakes":[{"wrong":"Cars are convenient. In addition, they cause serious air pollution.","right":"Cars are convenient. However, they cause serious air pollution.","why":"Ý thứ hai trái ngược với ý thứ nhất nên cần từ nối tương phản, không phải từ nối bổ sung."},{"wrong":"Because public transport is cheap. Many people use it.","right":"Because public transport is cheap, many people use it.","why":"Mệnh đề bắt đầu bằng because không thể đứng một mình thành câu."},{"wrong":"Although cities are crowded, but many people still want to live there.","right":"Although cities are crowded, many people still want to live there.","why":"Không dùng although và but trong cùng một câu."}],"quiz":[{"t":"mcq","q":"Which is the best topic sentence for a paragraph about the benefits of learning a foreign language?","o":["I started learning English when I was ten.","Learning a foreign language brings several important benefits.","For example, I can watch films without subtitles.","English has 26 letters."],"a":1,"why":"Câu chủ đề phải nêu ý chính khái quát của cả đoạn."},{"t":"fill","q":"Public transport is cheap. ___, it helps to reduce air pollution.","a":["In addition","Moreover","Furthermore","Also","Additionally","What is more"],"why":"Câu thứ hai bổ sung thêm một lợi ích nên dùng từ nối bổ sung."},{"t":"mcq","q":"Fast food is convenient. ___, it is often high in fat and salt.","o":["However","For example","As a result","Firstly"],"a":0,"why":"Ý thứ hai là nhược điểm, trái với ý thứ nhất, nên dùng However."},{"t":"mcq","q":"Topic sentence: 'Technology has changed the way students learn.' Which sentence is a supporting EXAMPLE?","o":["Technology is very important.","In conclusion, technology is useful.","However, some teachers dislike change.","For instance, many students now attend lectures online."],"a":3,"why":"Câu ví dụ đưa ra trường hợp cụ thể và thường bắt đầu bằng For instance/For example."},{"t":"fill","q":"Many factories closed in the region. As a ___, unemployment rose sharply.","a":["result","consequence"],"why":"As a result / As a consequence dùng để nêu kết quả."},{"t":"mcq","q":"Put the sentences in the best order: (A) For example, in Singapore, drivers pay to enter the city centre. (B) One effective way to reduce traffic is to charge drivers. (C) As a result, traffic there has fallen significantly. (D) This encourages people to use public transport instead.","o":["B-D-A-C","A-B-C-D","C-B-D-A","B-C-A-D"],"a":0,"why":"Câu chủ đề (B) → giải thích (D) → ví dụ (A) → kết quả của ví dụ (C)."},{"t":"mcq","q":"Which sentence does NOT belong in a paragraph about the health benefits of cycling?","o":["Cycling strengthens the heart and lungs.","Regular cyclists are less likely to be overweight.","Bicycles were invented in the nineteenth century.","Cycling can also reduce stress."],"a":2,"why":"Câu về lịch sử xe đạp không liên quan đến lợi ích sức khỏe, nên làm đoạn văn lạc đề."},{"t":"fill","q":"Firstly, cities offer more jobs. ___, they have better hospitals and schools.","a":["Secondly","Second","In addition","Moreover","Furthermore","Also","Additionally"],"why":"Sau Firstly, dùng Secondly hoặc một từ nối bổ sung."},{"t":"mcq","q":"Which is the best concluding sentence for a paragraph about the advantages of online shopping?","o":["Online shopping started in the 1990s.","For example, I bought a laptop online last week.","Overall, online shopping saves consumers both time and money.","However, some shops are closing."],"a":2,"why":"Câu kết đoạn tóm tắt lại ý chính, thường bắt đầu bằng Overall/In short."},{"t":"mcq","q":"Working from home saves commuting time. ___, employees may feel isolated from their colleagues.","o":["Therefore","On the other hand","For example","In addition"],"a":1,"why":"Ý thứ hai là mặt trái của ý thứ nhất nên dùng On the other hand."},{"t":"mcq","q":"Which linking word introduces a RESULT?","o":["Although","Whereas","Despite","Consequently"],"a":3,"why":"Consequently nghĩa là 'do đó', dùng để nêu kết quả; các từ còn lại chỉ sự tương phản."},{"t":"fill","q":"___ some people believe that exams are necessary, others think they cause too much stress.","a":["While","Although","Whereas","Though"],"why":"Hai mệnh đề trái ngược trong cùng một câu nối bằng While/Although/Whereas."},{"t":"mcq","q":"Topic sentence: 'Governments should spend more on public transport.' Which is the best next sentence?","o":["Governments are elected by the people.","Many people like cars.","In conclusion, public transport is the answer.","This is because good buses and trains reduce traffic congestion."],"a":3,"why":"Câu tiếp theo nên giải thích lý do cho câu chủ đề."},{"t":"mcq","q":"Which paragraph plan is the most logical for a Task 2 body paragraph?","o":["Example → topic sentence → explanation","Topic sentence → explanation → example → concluding sentence","Concluding sentence → example → topic sentence","Explanation → conclusion → topic sentence → example"],"a":1,"why":"Đoạn thân bài chuẩn: câu chủ đề → giải thích → ví dụ → câu kết."},{"t":"mcq","q":"Choose the correct sentence.","o":["Although it was expensive, but the course was worth it.","Despite it was expensive, the course was worth it.","Although it was expensive, the course was worth it.","Despite of the cost, the course was worth it."],"a":2,"why":"Although + mệnh đề, không dùng thêm but; despite + danh từ, không có 'of'."},{"t":"mcq","q":"'Many young people cannot afford housing in big cities.' Which sentence best follows?","o":["Because of this, many continue to live with their parents into their thirties.","For example, housing.","Firstly, young people are young.","In contrast, many continue to live with their parents."],"a":0,"why":"Câu sau là hậu quả của câu trước nên dùng Because of this; 'In contrast' sai quan hệ ý."}]},{"n":18,"en":"The passive","vi":"Câu bị động","ielts":"Câu bị động là công cụ chính để mô tả quy trình (process) trong Writing Task 1 và tạo giọng văn khách quan, trang trọng trong Task 2.","points":[{"h":"Cấu trúc cơ bản","body":"Bị động = be + V3 (past participle). Dùng khi hành động hoặc đối tượng quan trọng hơn người thực hiện.","ex":["English is spoken in many countries.","The bridge was built in 1998."]},{"h":"Bị động ở các thì","body":"Chỉ cần chia be theo thì: is/are done, was/were done, has/have been done, will be done, is/are being done.","ex":["A new hospital is being built in the city centre.","Over 500 trees have been planted since 2020."]},{"h":"Mô tả quy trình (process)","body":"Quy trình trong Task 1 thường dùng hiện tại đơn bị động, kết hợp từ chỉ trình tự như First, Next, After that, Finally.","ex":["First, the tea leaves are picked by hand.","Next, they are dried and packed into boxes."]},{"h":"by + người thực hiện và modal bị động","body":"Chỉ thêm by + tác nhân khi thông tin đó quan trọng. Với động từ khiếm khuyết: can/should/must + be + V3.","ex":["The theory of evolution was developed by Charles Darwin.","Plastic waste should be recycled wherever possible."]},{"h":"Bị động khách quan trong văn học thuật","body":"It is believed/said/thought that … hoặc X is thought to + V / to have + V3 giúp trình bày thông tin một cách khách quan.","ex":["It is believed that regular exercise improves memory.","Coffee is thought to have originated in Ethiopia."]}],"mistakes":[{"wrong":"The bridge was build in 1998.","right":"The bridge was built in 1998.","why":"Bị động cần V3 (built), không dùng động từ nguyên mẫu."},{"wrong":"This problem can solve by the government.","right":"This problem can be solved by the government.","why":"Bị động với động từ khiếm khuyết cần be + V3."},{"wrong":"The accident was happened at night.","right":"The accident happened at night.","why":"Happen là nội động từ (không có tân ngữ) nên không có dạng bị động."}],"quiz":[{"t":"mcq","q":"Rice ___ in many parts of Asia.","o":["is grown","grows by","is grow","growing"],"a":0,"why":"Bị động hiện tại đơn: is + V3 (grown)."},{"t":"fill","q":"The Eiffel Tower ___ (build) in 1889.","a":["was built"],"why":"Sự việc trong quá khứ, chủ ngữ số ít: was + V3."},{"t":"mcq","q":"First, the oranges ___ from the trees.","o":["pick","picked","are picking","are picked"],"a":3,"why":"Quy trình dùng hiện tại đơn bị động; quả cam được hái."},{"t":"fill","q":"After that, the fruit ___ (wash) in cold water.","a":["is washed"],"why":"Fruit là danh từ không đếm được nên dùng is + V3."},{"t":"mcq","q":"The results of the survey ___ next week.","o":["will publish","will published","are publishing","will be published"],"a":3,"why":"Bị động tương lai: will be + V3."},{"t":"mcq","q":"Since 2010, more than 2,000 new homes ___ in the area.","o":["have built","were built","have been built","has been built"],"a":2,"why":"'Since 2010' cần hiện tại hoàn thành; homes số nhiều nên have been built."},{"t":"fill","q":"A new metro line ___ (build) at the moment.","a":["is being built"],"why":"Đang được xây ngay lúc này: bị động tiếp diễn is being + V3."},{"t":"mcq","q":"Which sentence is correct?","o":["The meeting was happened yesterday.","The meeting was happen yesterday.","The meeting happened yesterday.","The meeting is happened yesterday."],"a":2,"why":"Happen là nội động từ nên không dùng bị động."},{"t":"mcq","q":"Old newspapers ___ to make new paper products.","o":["can recycle","can be recycled","can recycled","can be recycle"],"a":1,"why":"Modal bị động: can be + V3."},{"t":"fill","q":"The data ___ (collect) from 500 students last year.","a":["was collected","were collected"],"why":"Bị động quá khứ đơn; data có thể coi là số ít hoặc số nhiều."},{"t":"mcq","q":"The telephone ___ by Alexander Graham Bell.","o":["invented","has invented","is inventing","was invented"],"a":3,"why":"Điện thoại được phát minh trong quá khứ: was + V3."},{"t":"mcq","q":"In the final stage, the bottles ___ and sent to shops.","o":["labelled","are labelled","are labelling","label"],"a":1,"why":"Quy trình dùng hiện tại đơn bị động: are + V3, song song với 'sent'."},{"t":"fill","q":"It ___ (believe) that the first university was founded in the 9th century.","a":["is believed","was believed"],"why":"Cấu trúc khách quan: It is believed that …"},{"t":"mcq","q":"Smoking ___ in all public buildings since 2012.","o":["has been banned","was banned","is banned","has banned"],"a":0,"why":"'Since 2012' cần hiện tại hoàn thành bị động: has been + V3."},{"t":"mcq","q":"The pyramids are thought ___ around 4,500 years ago.","o":["to build","to be built","to have been built","being built"],"a":2,"why":"Việc xây dựng xảy ra trước thời điểm hiện tại nên dùng to have been + V3."},{"t":"fill","q":"Stricter laws on plastic packaging ___ (should / introduce) as soon as possible.","a":["should be introduced"],"why":"Modal bị động: should be + V3."}]},{"n":19,"en":"Relative clauses","vi":"Mệnh đề quan hệ","ielts":"Mệnh đề quan hệ giúp bạn nối ý thành câu phức (complex sentences), từ đó tăng điểm Grammatical Range and Accuracy.","points":[{"h":"who, which, that","body":"Who dùng cho người, which dùng cho vật/sự việc. That có thể thay cho who hoặc which, nhưng chỉ trong mệnh đề xác định (không có dấu phẩy).","ex":["Students who study abroad often become more independent.","The app that I use for vocabulary is free."]},{"h":"whose, where, when","body":"Whose chỉ sự sở hữu (của ai/của cái gì), where chỉ nơi chốn, when chỉ thời gian.","ex":["Parents whose children use phones at night should set limits.","This is the city where I was born."]},{"h":"Mệnh đề xác định và không xác định","body":"Mệnh đề không xác định (non-defining) chỉ bổ sung thông tin, đặt giữa dấu phẩy, và không dùng that. Mệnh đề xác định (defining) cho biết ta đang nói về người/vật nào, không có dấu phẩy.","ex":["Hanoi, which is the capital of Vietnam, has over eight million people.","My sister, who is a nurse, works night shifts."]},{"h":"Lược bỏ đại từ quan hệ","body":"Trong mệnh đề xác định, có thể bỏ who/which/that khi nó là tân ngữ (object) của động từ phía sau.","ex":["The book I bought last week was expensive.","The course she chose was very popular."]},{"h":"Rút gọn mệnh đề quan hệ","body":"Có thể rút gọn bằng V-ing (nghĩa chủ động) hoặc V3 (nghĩa bị động) để câu ngắn gọn và học thuật hơn.","ex":["People living in rural areas have fewer job opportunities.","The data collected in the survey show a clear trend."]}],"mistakes":[{"wrong":"The man which lives next door is a doctor.","right":"The man who lives next door is a doctor.","why":"Với người, dùng who chứ không dùng which."},{"wrong":"Ho Chi Minh City, that is the largest city in Vietnam, is very busy.","right":"Ho Chi Minh City, which is the largest city in Vietnam, is very busy.","why":"Không dùng that trong mệnh đề không xác định (có dấu phẩy)."},{"wrong":"This is the book that I bought it yesterday.","right":"This is the book that I bought yesterday.","why":"That đã thay cho 'the book' nên không lặp lại tân ngữ it."}],"quiz":[{"t":"mcq","q":"A doctor is a person ___ treats sick people.","o":["who","which","whose","where"],"a":0,"why":"Person là người nên dùng who."},{"t":"fill","q":"This is the laptop ___ I bought for my studies.","a":["which","that"],"why":"Laptop là vật, mệnh đề xác định nên dùng which hoặc that."},{"t":"mcq","q":"The library ___ I study every day is open until midnight.","o":["which","who","whose","where"],"a":3,"why":"Chỉ nơi chốn mà mệnh đề sau đã đủ thành phần (I study) nên dùng where."},{"t":"fill","q":"Students ___ parents are teachers often do well at school.","a":["whose"],"why":"Chỉ sở hữu (cha mẹ của học sinh) nên dùng whose."},{"t":"mcq","q":"My hometown, ___ is in the north of Vietnam, has beautiful mountains.","o":["that","which","where","who"],"a":1,"why":"Mệnh đề không xác định về một nơi, làm chủ ngữ của 'is', nên dùng which."},{"t":"mcq","q":"The company ___ makes this phone is based in South Korea.","o":["where","what","whose","that"],"a":3,"why":"Company là tổ chức (vật), mệnh đề xác định nên dùng that (hoặc which)."},{"t":"fill","q":"2020 was the year ___ the pandemic changed the way people work.","a":["when","in which","that"],"why":"Chỉ thời gian nên dùng when."},{"t":"mcq","q":"Which sentence needs commas?","o":["My mother who is 60 still works full-time.","The students who failed the test must take it again.","The book that I borrowed is on the table.","People who exercise live longer."],"a":0,"why":"Chỉ có một người mẹ nên mệnh đề chỉ bổ sung thông tin (không xác định) và cần dấu phẩy."},{"t":"mcq","q":"The report ___ last week shows a rise in unemployment.","o":["publishing","was published","published","which published"],"a":2,"why":"Rút gọn mệnh đề bị động (which was published) thành V3: published."},{"t":"mcq","q":"Which sentence is correct?","o":["The city where I live it is very crowded.","The city which I live is very crowded.","The city where I live in is very crowded.","The city where I live is very crowded."],"a":3,"why":"Where đã chứa nghĩa 'in which' nên không thêm in, và không lặp chủ ngữ it."},{"t":"fill","q":"People ___ (live) near airports often suffer from noise pollution.","a":["living","who live"],"why":"Rút gọn mệnh đề chủ động bằng V-ing: living (= who live)."},{"t":"mcq","q":"The number of tourists rose by 30%, ___ was mainly due to cheaper flights.","o":["which","that","what","who"],"a":0,"why":"Sau dấu phẩy, which thay cho cả mệnh đề trước; that không dùng sau dấu phẩy."},{"t":"fill","q":"The houses ___ (build) after 2010 are more energy-efficient.","a":["built","which were built","that were built"],"why":"Nghĩa bị động (nhà được xây) nên rút gọn bằng V3: built."},{"t":"mcq","q":"In which sentence can the relative pronoun be left out?","o":["The woman who called you is my manager.","The course that she chose was very popular.","Hanoi, which I visited last year, is beautiful.","The dog that bit him was taken away."],"a":1,"why":"That là tân ngữ của 'chose' trong mệnh đề xác định nên có thể bỏ."},{"t":"fill","q":"There are many reasons ___ young people leave the countryside.","a":["why","that","for which"],"why":"Sau 'reason(s)' dùng why để nói lý do."},{"t":"mcq","q":"Over 60% of the students, most of ___ were international, chose online classes.","o":["them","who","whom","which"],"a":2,"why":"Sau giới từ (of) chỉ người phải dùng whom; 'them' biến câu thành hai mệnh đề độc lập sai ngữ pháp."}]},{"n":20,"en":"Noun phrases","vi":"Cụm danh từ","ielts":"Cụm danh từ và danh từ hóa (nominalisation) giúp câu văn học thuật và ngắn gọn hơn, nâng điểm Lexical Resource và Grammatical Range.","points":[{"h":"Danh từ hóa (nominalisation)","body":"Biến động từ hoặc tính từ thành danh từ (increase → an increase, develop → development, fail → failure) để câu mang tính học thuật hơn.","ex":["There was a rapid increase in house prices.","The development of technology has changed education."]},{"h":"Bổ nghĩa đứng trước (pre-modification)","body":"Tính từ hoặc danh từ có thể đứng trước danh từ chính. Danh từ đứng trước thường ở dạng số ít, kể cả khi có số đếm (a two-year course).","ex":["She completed a two-year course in nursing.","Household energy consumption rises in winter."]},{"h":"Bổ nghĩa đứng sau (post-modification)","body":"Thông tin thêm có thể đứng sau danh từ chính bằng cụm giới từ, mệnh đề quan hệ, hoặc V-ing / V3.","ex":["The number of students in rural areas has increased.","Students living far from the campus need better transport."]},{"h":"Danh từ đi với giới từ cố định","body":"Nhiều danh từ đi với giới từ cố định: increase/rise/fall in, effect/impact on, reason for, demand for, cause of. Lưu ý: an increase of + con số (an increase of 5%).","ex":["There was a sharp rise in unemployment.","Social media has a strong impact on young people."]},{"h":"Hòa hợp chủ ngữ với danh từ chính","body":"Khi chủ ngữ là cụm danh từ dài, động từ chia theo danh từ chính (head noun), không chia theo danh từ đứng gần nó nhất.","ex":["The number of cars on the roads is increasing.","The effects of climate change on agriculture are serious."]}],"mistakes":[{"wrong":"There was an increase of unemployment in 2020.","right":"There was an increase in unemployment in 2020.","why":"Increase in + thứ tăng lên; increase of chỉ dùng với con số."},{"wrong":"The number of students are increasing.","right":"The number of students is increasing.","why":"Danh từ chính là 'number' (số ít) nên dùng is."},{"wrong":"She did a two-years course in marketing.","right":"She did a two-year course in marketing.","why":"Danh từ làm bổ nghĩa đứng trước không thêm -s."}],"quiz":[{"t":"mcq","q":"There was a sharp ___ in house prices in 2021.","o":["rise","rose","rising up","risen"],"a":0,"why":"Sau 'a sharp' cần danh từ: a rise."},{"t":"fill","q":"The ___ (develop) of new technology has changed the way we work.","a":["development"],"why":"Sau 'The' và trước 'of' cần danh từ: development."},{"t":"mcq","q":"Smoking has a negative effect ___ health.","o":["to","in","for","on"],"a":3,"why":"Cụm cố định: an effect on."},{"t":"fill","q":"There has been a significant ___ (reduce) in the number of smokers.","a":["reduction"],"why":"Danh từ của reduce là reduction."},{"t":"mcq","q":"The number of international students ___ grown steadily since 2015.","o":["have","are","were","has"],"a":3,"why":"Danh từ chính là 'number' (số ít) nên dùng has."},{"t":"mcq","q":"She works for a ___ company in Ho Chi Minh City.","o":["software","softwares","software's","softwared"],"a":0,"why":"Danh từ bổ nghĩa đứng trước giữ dạng số ít, không có 's."},{"t":"fill","q":"There is a growing demand ___ renewable energy.","a":["for"],"why":"Cụm cố định: demand for."},{"t":"mcq","q":"Which is the best academic version of 'Unemployment went up a lot in 2009'?","o":["Unemployment goes up very much in 2009.","There was a dramatic increase in unemployment in 2009.","The unemployment was increasing a lot in 2009.","In 2009 unemployment it went up a lot."],"a":1,"why":"Dùng danh từ hóa (a dramatic increase in) là cách viết học thuật và chính xác."},{"t":"mcq","q":"The ___ of the new airport took five years.","o":["construct","constructive","construction","constructed"],"a":2,"why":"Sau 'The' và trước 'of' cần danh từ: construction."},{"t":"fill","q":"The government introduced a ___ (ten / year) plan to reduce poverty.","a":["ten-year","ten year"],"why":"Số + danh từ làm bổ nghĩa đứng trước, danh từ giữ số ít: a ten-year plan."},{"t":"mcq","q":"The effects of air pollution on children's health ___ serious.","o":["is","has","being","are"],"a":3,"why":"Danh từ chính là 'effects' (số nhiều) nên dùng are."},{"t":"mcq","q":"Which noun phrase is correct?","o":["the impact on the environment of tourism","the tourism's impact for the environment","the impact of tourism on the environment","the environment impact tourism"],"a":2,"why":"Trật tự tự nhiên: the impact of X on Y."},{"t":"fill","q":"The ___ (fail) of the project was due to poor planning.","a":["failure"],"why":"Danh từ của fail là failure."},{"t":"mcq","q":"Which sentence uses nominalisation?","o":["People consumed more meat.","The consumption of meat increased.","People ate more meat than before.","Meat is eaten more."],"a":1,"why":"Động từ consume được biến thành danh từ consumption."},{"t":"mcq","q":"The rapid ___ of cities in developing countries has caused housing shortages.","o":["grow","growing up","growth","grown"],"a":2,"why":"Sau tính từ 'rapid' cần danh từ: growth."},{"t":"fill","q":"Teenagers ___ (spend) more than five hours a day online are more likely to sleep badly.","a":["spending","who spend"],"why":"Bổ nghĩa đứng sau bằng V-ing (= who spend) cho danh từ teenagers."}]}];
const RTIPS=[{"id":"tfng","en":"True / False / Not Given","vi":"Đúng / Sai / Không có thông tin","what":"So từng nhận định với THÔNG TIN trong bài: TRUE nếu bài nói cùng ý (thường bằng từ khác), FALSE nếu bài nói ngược lại, NOT GIVEN nếu bài không có thông tin để xác nhận hay phủ nhận.","steps":["Đọc nhận định, gạch chân từ khóa dễ tìm (tên riêng, số, năm) và từ giới hạn như all, some, only, always, usually.","Dò bài tìm vị trí: đáp án đi theo thứ tự bài đọc, nên thông tin câu sau thường nằm sau câu trước.","Đọc kỹ 2–3 câu quanh vị trí đó, tìm từ đồng nghĩa/paraphrase chứ không chỉ tìm từ y hệt.","So từng phần: chủ thể, hành động, mức độ, thời gian, so sánh. Khớp hết ý → TRUE.","Bài nói điều mâu thuẫn trực tiếp (ngược nghĩa, sai số liệu, sai mức độ như some ↔ all) → FALSE.","Bài không nói gì đủ để kết luận đúng hay sai → NOT GIVEN. Không suy diễn, không thêm kiến thức ngoài.","Không bỏ trống: câu không tìm được, dùng vị trí câu trước và câu sau để khoanh vùng rồi đoán."],"traps":["Nhầm FALSE với NOT GIVEN: FALSE = bài nói NGƯỢC lại; NOT GIVEN = bài KHÔNG CÓ thông tin để kiểm tra.","Dùng kiến thức bên ngoài: nhận định đúng ngoài đời nhưng bài không nhắc tới thì vẫn là NOT GIVEN.","Bỏ qua từ giới hạn: bài viết 'some/usually', nhận định viết 'all/always/only' → thường là FALSE.","Thấy nhiều từ trùng với bài liền chọn TRUE, trong khi chỉ một chi tiết (nguyên nhân, so sánh) bị đổi."],"example":{"text":"Most of the volunteers in the study were university students, although a few office workers also took part.","q":"All of the volunteers in the study were students.","a":"FALSE","why":"Bài nói 'most' và có 'a few office workers', tức không phải tất cả là sinh viên → mâu thuẫn trực tiếp. Nếu nhận định là 'The volunteers were paid' thì bài không đề cập → NOT GIVEN."},"time":"Khoảng 1 phút/câu, làm theo thứ tự; cả bài Reading 60 phút/3 passage, không có thêm giờ chép đáp án."},{"id":"ynng","en":"Yes / No / Not Given","vi":"Có / Không / Không có thông tin (quan điểm tác giả)","
