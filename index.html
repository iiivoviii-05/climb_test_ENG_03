const hasExpl=()=>RD&&RD.p.expl&&Object.keys(RD.p.expl).length>0;

/* ---------- chấm ---------- */
function gradeReading(){
  const p=RD.p,nums=rNums(),map={},bytype={};
  RD.gsel.forEach(gi=>{const g=p.groups[gi];
    if(g.multi&&g.to-g.from+1<rMultiCorrect(g).length){const chosen=(RD.multi&&RD.multi[gi]||[]).map(normAns),corr=rMultiCorrect(g),all=chosen.length===corr.length&&corr.every(c=>chosen.includes(c));for(let n=g.from;n<=g.to;n++){if(nums.includes(n))map[n]={ok:all,given:(RD.multi&&RD.multi[gi]||[]).join(",")}}}
    else if(g.multi){const chosen=(RD.multi&&RD.multi[gi]||[]).map(normAns),corr=rMultiCorrect(g),hits=chosen.filter(c=>corr.includes(c));let k=0;
      for(let n=g.from;n<=g.to;n++){if(!nums.includes(n))continue;const ok=k<hits.length;k++;map[n]={ok,given:(RD.multi&&RD.multi[gi]||[]).join(",")};}
    }else for(let n=g.from;n<=g.to;n++){if(!nums.includes(n))continue;const given=RD.answers[n]||"";map[n]={ok:ansMatch(given,p.answers[n]||[]),given}}
    for(let n=g.from;n<=g.to;n++){if(!map[n])continue;const t=g.type==="custom"?"custom":(isL()?"L-":"")+g.type;bytype[t]=bytype[t]||[0,0];bytype[t][1]++;if(map[n].ok)bytype[t][0]++}
  });
  const score=Object.values(map).filter(x=>x.ok).length,total=Object.keys(map).length,pct=Math.round(score/Math.max(1,total)*100);
  const minutes=String(Math.max(1,Math.round((Date.now()-RD.start)/60000)));
  RD.result={map,score,total,pct,bytype};RD.pane="q";
  const wrong=Object.entries(map).filter(([,v])=>!v.ok).map(([n])=>+n);
  // cập nhật ngay trên máy
  Object.entries(bytype).forEach(([t,[c,n]])=>{if(t==="custom"||t.startsWith("L-"))return;const v=rstats.byType[t]||[0,0];rstats.byType[t]=[v[0]+c,v[1]+n]});
  RD.gsel.forEach(gi=>{const g=p.groups[gi];rstats.groupsDone.push(p.id+":"+g.from+"-"+g.to)});
  if(RD.mode==="full")rstats.latest[p.id]={date:todayISO,wrong,score,total};
  if(RD.mode==="retry"&&rstats.latest[p.id])rstats.latest[p.id]={...rstats.latest[p.id],date:todayISO,wrong};
  if(RD.mode==="full"&&!p.custom){const pr=progress["r:"+p.id];progress["r:"+p.id]={status:"tried",best:Math.max(pct,pr?pr.best:0),attempts:(pr?pr.attempts:0)+1,wrong,updated:todayISO}}
  drawReading();$("study").scrollTop=0;const sd=document.querySelector(".rd-side");if(sd)sd.scrollTop=0;
  {const mk=document.querySelector(".rd-res .mark b");if(mk)FX.countUp(mk,score,800,v=>Math.round(v)+"/"+total);
   document.querySelectorAll(".rd-q .ares .chip").forEach((c,i)=>{c.style.animationDelay=Math.min(i*40,1200)+"ms";c.classList.add("fx-in")});
   if(total>=5&&pct>=80)FX.celebrate(pct===100?1.3:1,pct===100?`<span class="fl">💯</span>Không sai câu nào`:`<span class="fl">🎯</span>${pct}% — rất tốt`);else if(pct>=60)FX.sound("ok");else FX.sound("soft")}
  const detail={mode:RD.mode,exam:!!RD.exam,kind:isL()?"listening":"reading",answers:RD.answers,wrong,bytype,groups:RD.gsel.map(gi=>p.groups[gi].from+"-"+p.groups[gi].to)};
  if(RD.mode==="full"&&typeof planAutoTick==="function")planAutoTick(p.id);
  if(LP&&RD.exam){const A=LP.el.querySelector("audio");if(A)A.pause();LP.el.innerHTML="";lpDraw()} // mở khoá tua sau khi nộp
  const me=RD;
  save("saveReadingAttempt",{eid:RD.eid,rid:p.id,score,total,minutes,detail}).then(r=>{applyR(r);me.attemptId=r.id;me.earn=earnTxt(r);renderShell();if(RD===me)drawReading(true);if(r.earned)FX.float($("rd-time")||document.body,"+"+r.earned+" m",true)}).catch(()=>{me.earn="chưa lưu, sẽ tự gửi lại";if(RD===me)drawReading(true)});
}
function locateQ(n){
  RD.hl=+n;RD.showLoc=false;
  if(innerWidth<980){RD.pane="pass"}
  drawReading(true);
  const el=$("qhl-"+n);if(el){el.scrollIntoView({behavior:"smooth",block:"center"})}
  else toast("Không tìm thấy đoạn trích trong bài.",true);
}

/* ---------- sự kiện màn làm bài ---------- */
document.addEventListener("click",e=>{
  if(!RD)return;const T=e.target;
  if(T.closest("#rd-quit")){if(!RD.result&&Object.keys(RD.answers).length&&!confirm("Thoát? Đáp án đang điền sẽ không được lưu."))return;return closeReading()}
  const p=T.closest("[data-rpane]");if(p){RD.pane=p.dataset.rpane;RD.hl=RD.pane==="pass"?RD.hl:null;document.querySelector(".rd").dataset.pane=RD.pane;document.querySelectorAll("[data-rpane]").forEach(b=>b.setAttribute("aria-pressed",b===p));$("study").scrollTop=0;return}
  const a=T.closest("[data-ans]");if(a&&!RD.result){FX.buzz(6);RD.answers[a.dataset.ans]=a.dataset.val;a.parentElement.querySelectorAll(".aopt,.mopt").forEach(b=>b.classList.toggle("on",b===a));return}
  const m=T.closest("[data-multi]");if(m&&!RD.result){const gi=+m.dataset.multi,g=RD.p.groups[gi],k=Math.max(g.to-g.from+1,rMultiCorrect(g).length);RD.multi=RD.multi||{};let c=RD.multi[gi]||[];const v=m.dataset.val;
    c=c.includes(v)?c.filter(x=>x!==v):[...c,v];if(c.length>k)c=c.slice(c.length-k);RD.multi[gi]=c;
    m.parentElement.querySelectorAll(".mopt").forEach(b=>b.classList.toggle("on",c.includes(b.dataset.val)));return}
  if(T.closest("#rd-submit")&&!Object.keys(RD.p.answers||{}).length)return toast("Đề này chưa có đáp án nên chưa chấm được.",true);
  if(T.closest("#rd-submit")){const nums=rNums();const miss=nums.filter(n=>{const g=gOf(n);if(g&&g.multi)return false;return !String(RD.answers[n]||"").trim()}).length;if(miss&&!confirm(`Còn ${miss} câu bỏ trống. Thi thật không bị trừ điểm khi sai, nên điền hết. Vẫn nộp?`))return;return gradeReading()}
  const x=T.closest("[data-rexp]");if(x){const n=x.dataset.rexp;RD.open[n]=!RD.open[n];return drawReading(true)}
  const l=T.closest("[data-rloc]");if(l)return locateQ(l.dataset.rloc);
  const bq=T.closest("[data-rbackq]");if(bq){const n=bq.dataset.rbackq;RD.pane="q";RD.hl=null;drawReading();const el=document.querySelector(`[data-rexp="${n}"]`);if(el)el.scrollIntoView({block:"center"});return}
  if(T.closest("[data-rshowloc]")){RD.showLoc=!RD.showLoc;RD.hl=null;if(innerWidth<980&&RD.showLoc)RD.pane="pass";return drawReading(true)}
  if(T.closest("[data-rvi]")){RD.vi=!RD.vi;return drawReading(true)}
  if(T.closest("[data-rexam]")){
    if(!RD.exam&&(Object.keys(RD.answers).length||Date.now()-RD.start>90000))return toast("Chế độ Thi phải bật ngay khi mở bài, trước khi trả lời. Bấm Làm lại để thi từ đầu.",true);
    RD.exam=!RD.exam;ls.set("ielts-exam",RD.exam?"1":"0");RD.start=Date.now();RD.vi=false;
    if(LP){const A=LP.el.querySelector("audio");if(A)A.pause();LP.el.innerHTML="";lpDraw()}
    toast(RD.exam?"Chế độ Thi: bấm giờ, không mẹo, không tua.":"Chế độ Học: có mẹo, tua lại thoải mái.");return drawReading(true)}
  if(T.closest("[data-rnointro]")){RD.intro=false;return drawReading(true)}
  if(T.closest("[data-rredo]")){const pk=RD.p,mode=RD.mode==="retry"?"full":RD.mode,g=RD.mode==="type"?`${pk.groups[RD.gsel[0]].from}-${pk.groups[RD.gsel[0]].to}`:null;return showReading(pk,{mode,g})}
  if(T.closest("[data-redit]"))return readingForm(RD.p.r);
  if(T.closest("[data-raiexpl]")){const b=T.closest("[data-raiexpl]");b.disabled=true;b.textContent="AI đang giải, khoảng 30–60 giây…";const r=RD.p.r;
    call("explainReading",{passage:r.passage,questions:r.questions,key:r.key}).then(out=>{if(!RD)return;RD.p.expl=out.expl||{};RD.p.vocab=out.vocab||[];
      const packStr=JSON.stringify({expl:RD.p.expl,vocab:RD.p.vocab});r.pack=packStr;call("saveReading",{...r,pack:packStr}).then(x=>{readings=x.readings}).catch(()=>{});drawReading(true);toast("Đã có lời giải")}).catch(()=>{if(b){b.disabled=false;b.textContent="✦ Giải thích bằng AI"}});return}
  if(T.closest("[data-saveana]")){if(!RD.attemptId)return toast("Đang lưu lần làm bài, thử lại sau vài giây.",true);call("saveAttemptDetail",RD.attemptId,{mode:RD.mode,answers:RD.answers,analysis:RD.analysis,wrong:Object.entries(RD.result.map).filter(([,v])=>!v.ok).map(([n])=>+n),bytype:RD.result.bytype,groups:RD.gsel.map(gi=>RD.p.groups[gi].from+"-"+RD.p.groups[gi].to)}).then(()=>toast("Đã lưu phân tích")).catch(()=>{});return}
  const va=T.closest("[data-vadd]");if(va){const v=RD.p.vocab[+va.dataset.vadd];addPackWords([v]);return}
  if(T.closest("[data-vaddall]")){const have=new Set(vocab.map(v=>v.word.toLowerCase()));addPackWords(RD.p.vocab.filter(v=>!have.has(v.w.toLowerCase())));return}
  if(T.closest("[data-synadd]")){const s=readSyn();s.push({q:"",p:""});$("rd-syn").innerHTML=s.map((x,i)=>synRow(x,i)).join("");return}

    call("addWords",s.map(x=>({word:x.p,meaning:"= "+x.q,example:sentenceOf(x.p),source:rSrc(RD.p)}))).then(l=>{vocab=l;toast(`Đã thêm ${s.length} cặp vào sổ từ`);if(RD)drawReading(true)}).catch(()=>{})}
});
function saveNotes(msg){
  RD.note={notes:$("rd-notes").value,syn:readSyn()};
  if(RD.p.custom){RD.p.r.notes=RD.note.notes;RD.p.r.syn=RD.note.syn}else rnotes[RD.p.id]=RD.note;
  call("saveReadingNotes",RD.p.id,RD.note.notes,RD.note.syn).then(()=>{if(msg)toast("Đã lưu ghi chú")}).catch(()=>{});

/* ---------- v9.4: in đậm từ khóa trong câu hỏi ----------
   Chạm một từ (hoặc kéo chọn một cụm) ở chế độ Bold để in đậm; chế độ Tẩy để bỏ; "Xóa hết" bỏ toàn bộ.

let kwMode=ls.get("ielts-kwmode","");
const kwKey=()=>"kw:"+RD.p.id;
function kwSet(){if(!RD.kw)RD.kw=new Set((hlMap[kwKey()]||[]).filter(x=>typeof x==="string"));return RD.kw}
function kwText(key,text,ctr){
  ctr=ctr||{i:0};const set=kwSet();
  return String(text==null?"":text).split(/(\s+)/).map(t=>{if(!t)return "";if(/^\s+$/.test(t))return t;if(!/[\p{L}\p{N}]/u.test(t))return esc(t);const id=key+":"+(ctr.i++);
    return `<span class="kww${set.has(id)?" kw":""}" data-kw="${id}">${esc(t)}</span>`}).join("");
}
function kwBar(){
  const n=kwSet().size,tip=kwMode==="bold"?"Chạm từ hoặc kéo chọn để in đậm":kwMode==="erase"?"Chạm hoặc kéo chọn để bỏ đậm":"Bật Bold rồi chạm vào từ";
  return `<div class="kwbar" id="kwbar"><button type="button" class="btn" data-kwmode="bold" aria-pressed="${kwMode==="bold"}"><b>B</b>&nbsp;Bold</button><button type="button" class="btn" data-kwmode="erase" aria-pressed="${kwMode==="erase"}">⌫&nbsp;Tẩy</button><button type="button" class="btn" data-kwclear ${n?"":"disabled"}>Xóa${n?" ("+n+")":""}</button><span class="kwtip">${tip}</span></div>`;
}
let kwT=null;
function kwApply(ids,on){
  const set=kwSet(),nx=new Set(set);ids.forEach(i=>on?nx.add(i):nx.delete(i));
  if(nx.size===set.size&&[...nx].every(x=>set.has(x)))return;
  if(nx.size>200)return toast("Tối đa 200 từ khóa mỗi bài.",true);
  RD.kw=nx;const rid=kwKey(),list=[...nx];
  if(list.length)hlMap[rid]=list.slice();else delete hlMap[rid];
  clearTimeout(kwT);kwT=setTimeout(()=>call("saveHighlights",rid,list).catch(()=>{}),800);
  drawReading(true);

  const w=e.target.closest(".kww");

document.addEventListener("selectionchange",()=>{

function startCustomStudy(rows,title){
  const words=rows.filter(v=>v.meaning).slice(0,12).map(toW),pool=vocab.filter(v=>v.meaning).map(toW);
  if(!words.length)return toast("Chưa có từ nào có nghĩa để ôn.",true);

  if(RD)closeReading(true);closeDlg();

/* ---------- trình phát: tải audio từ Drive theo từng mảnh, giữ trong IndexedDB để lần sau mở ngay ---------- */
const AUD={};   // fileId -> {url, pct, err, loading}
let LP=null;    // {p, i (audio đang chọn), el}
function audDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open("climb-audio",1);r.onupgradeneeded=()=>r.result.createObjectStore("a");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function audGet(id){return audDB().then(db=>new Promise(res=>{try{const q=db.transaction("a").objectStore("a").get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})).catch(()=>null)}
function audPut(id,blob){return audDB().then(db=>{try{db.transaction("a","readwrite").objectStore("a").put(blob,id)}catch(e){}}).catch(()=>{})}
function b64ToBytes(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function loadAudio(a){
  const st=AUD[a.id]||(AUD[a.id]={pct:0});
  if(st.url||st.loading)return;
  st.loading=true;st.err=null;lpDraw();
  audGet(a.id).then(blob=>{
    if(blob){st.url=URL.createObjectURL(blob);st.loading=false;st.pct=100;return lpDraw()}
    return call("getAudioInfo",a.id).then(info=>{
      const parts=new Array(info.parts);let next=0,done=0;
      const worker=()=>{if(next>=info.parts)return Promise.resolve();const k=next++;
        const get=(tries)=>call("getAudioPart",a.id,k).catch(e=>{if(tries>0)return get(tries-1);throw e});
        return get(2).then(b=>{parts[k]=b64ToBytes(b);done++;st.pct=Math.round(done/info.parts*100);lpProgress(a.id)}).then(worker)};
      return Promise.all([worker(),worker(),worker()]).then(()=>{
        const blob=new Blob(parts,{type:a.mime||info.mime||"audio/mpeg"});
        st.url=URL.createObjectURL(blob);st.loading=false;audPut(a.id,blob);lpDraw();
      });
    });
  }).catch(e=>{st.loading=false;st.err=String(e&&e.message||e);lpDraw()});
}
function lPlayerMount(p){
  lPlayerUnmount();
  if(!(p.audio||[]).length)return;
  document.body.classList.add("lmode");
  const el=document.createElement("div");el.id="lplayer";el.className="lplayer";document.body.appendChild(el);
  LP={p,i:0,el,rate:+ls.get("ielts-lrate","1")||1};
  lpDraw();
}
const examLock=()=>!!(RD&&RD.exam&&!RD.result&&isL());
function lPlayerUnmount(){const el=$("lplayer");if(el){const au=el.querySelector("audio");if(au)au.pause();el.remove()}LP=null;document.body.classList.remove("lmode")}
function lpProgress(id){const b=document.querySelector(`#lplayer [data-lpbar="${id}"]`);if(b)b.style.width=(AUD[id]||{}).pct+"%";const t=document.querySelector(`#lplayer [data-lppct="${id}"]`);if(t)t.textContent=(AUD[id]||{}).pct+"%"}
function lpDraw(){
  if(!LP||!$("lplayer"))return;
  const a=LP.p.audio[LP.i],st=AUD[a.id]||{},au=LP.el.querySelector("audio"),keep=au&&au.dataset.id===a.id;
  const sel=LP.p.audio.length>1?`<select class="lp-sel" data-lpsel aria-label="Chọn đoạn audio">${LP.p.audio.map((x,i)=>`<option value="${i}" ${i===LP.i?"selected":""}>${esc(x.label||"Audio "+(i+1))}</option>`).join("")}</select>`:`<span class="lp-lbl">${esc(a.label||"Audio")}</span>`;
  if(keep){const s=LP.el.querySelector(".lp-sel");if(s)s.value=LP.i;return}
  let body;
  const lock=examLock();
  if(st.url&&lock)body=`<audio data-id="${a.id}" src="${st.url}" preload="auto"></audio>
     <button class="lp-play" data-lpplay aria-label="Phát / dừng">▶</button><span class="lp-time num" id="lp-time">0:00</span><span class="tiny muted">Chế độ Thi: không tua, tốc độ 1×</span>`;
  else if(st.url)body=`<audio data-id="${a.id}" src="${st.url}" preload="auto"></audio>
     <button class="lp-btn" data-lpback aria-label="Lùi 5 giây">−5s</button><button class="lp-play" data-lpplay aria-label="Phát / dừng">▶</button><button class="lp-btn" data-lpfwd aria-label="Tới 5 giây">+5s</button>
     <input type="range" class="lp-seek" data-lpseek min="0" max="1000" value="0" aria-label="Vị trí"><span class="lp-time num" id="lp-time">0:00</span>
     <button class="lp-btn" data-lprate aria-label="Tốc độ">${LP.rate}×</button>`;
  else if(st.loading)body=`<span class="lp-load"><span class="lp-bar"><i data-lpbar="${a.id}" style="width:${st.pct||0}%"></i></span><span class="tiny" data-lppct="${a.id}">${st.pct||0}%</span></span><span class="tiny muted">Đang tải âm thanh từ Drive…</span>`;
  else body=`<button class="btn sm primary" data-lpload>Tải âm thanh${a.size?" ("+(a.size/1048576).toFixed(1)+" MB)":""}</button>${st.err?`<span class="tiny" style="color:var(--bad)">Lỗi: ${esc(st.err.slice(0,80))}</span>`:`<span class="tiny muted">Lần sau mở lại không phải tải.</span>`}`;
  LP.el.innerHTML=`<div class="lp-in">${sel}<div class="lp-ctl">${body}</div></div>`;
  const A=LP.el.querySelector("audio");
  if(A){A.playbackRate=lock?1:LP.rate;
    A.addEventListener("timeupdate",()=>{const t=$("lp-time");if(t)t.textContent=mmss(Math.floor(A.currentTime))+(isFinite(A.duration)?" / "+mmss(Math.floor(A.duration)):"");const s=LP&&LP.el.querySelector("[data-lpseek]");if(s&&!s.matches(":active")&&isFinite(A.duration))s.value=Math.round(A.currentTime/A.duration*1000)});
    A.addEventListener("play",()=>{const b=LP&&LP.el.querySelector("[data-lpplay]");if(b)b.textContent="❚❚"});
    A.addEventListener("pause",()=>{const b=LP&&LP.el.querySelector("[data-lpplay]");if(b)b.textContent="▶"});}
}
document.addEventListener("click",e=>{
  if(!LP)return;const A=LP.el.querySelector("audio");
  if(e.target.closest("[data-lpload]"))return loadAudio(LP.p.audio[LP.i]);
  if(!A)return;
  if(e.target.closest("[data-lpplay]")){A.paused?A.play().catch(()=>{}):A.pause()}
  if(examLock()&&!e.target.closest("[data-lpplay]"))return;
  if(e.target.closest("[data-lpback]"))A.currentTime=Math.max(0,A.currentTime-5);
  if(e.target.closest("[data-lpfwd]"))A.currentTime=Math.min(A.duration||1e9,A.currentTime+5);
  const r=e.target.closest("[data-lprate]");if(r){const R=[0.75,0.9,1,1.1,1.25],i=(R.indexOf(LP.rate)+1)%R.length;LP.rate=R[i];A.playbackRate=LP.rate;r.textContent=LP.rate+"×";ls.set("ielts-lrate",String(LP.rate))}
});
document.addEventListener("input",e=>{
  if(!LP)return;
  if(e.target.matches("[data-lpseek]")){const A=LP.el.querySelector("audio");if(A&&isFinite(A.duration))A.currentTime=e.target.value/1000*A.duration}
});
document.addEventListener("change",e=>{if(LP&&e.target.matches("[data-lpsel]")){const A=LP.el.querySelector("audio");if(A)A.pause();LP.i=+e.target.value;LP.el.innerHTML="";lpDraw()}});

/* ---------- Nghe chép chính tả: nghe từng câu, gõ lại, so từng từ với bản gốc ---------- */
let DT=null;
const dKey=id=>"dict-"+id;
const dBest=id=>{const p=progress[dKey(id)];return p?p.best:null};
function showDictation(p){
  DT={p,given:{},res:{},shown:{},start:Date.now()};
  $("study").hidden=false;document.body.style.overflow="hidden";drawDictation();FX.reset();
}
function dictStats(){const L=DT.p.lines;let hit=0,tot=0,done=0;L.forEach((x,i)=>{if(!DT.res[i])return;const n=words_(x.t).length;tot+=n;hit+=Math.round(DT.res[i].pct/100*n);done++});return {hit,tot,done,pct:tot?Math.round(hit/tot*100):0}}

function dictCheck(i){
  const ta=document.querySelector(`[data-dtin="${i}"]`);if(!ta)return;DT.given[i]=ta.value;
  if(!ta.value.trim())return toast("Gõ câu nghe được trước đã.",true);
  const r=lcsHits(DT.p.lines[i].t,ta.value);DT.res[i]=r;drawDictation(true);
  const box=$("dl-"+i);if(r.pct>=90)FX.ok(box,"✓");else if(r.pct<60)FX.bad(box);else FX.soft(box);
  const nx=document.querySelector(`[data-dtin="${i+1}"]`);if(nx&&r.pct>=60)nx.focus({preventScroll:false});
}
// Phân loại lỗi chép chính tả: sót từ nhỏ (a, the, of… thường do nối âm), sót từ nội dung, gần đúng (sai chính tả), thừa từ
function dictAnalysis(){
  let fn=0,ct=0,near=0,extra=0;const missed=[],seen=new Set();
  DT.p.lines.forEach((x,i)=>{const r=DT.res[i];if(!r)return;const ref=words_(x.t),got=words_(DT.given[i]||"");let nearL=0;
    ref.forEach((w,k)=>{if(r.hit[k])return;
      const close=got.some(g=>g!==w&&w.length>=4&&lev(g,w)<=Math.max(1,Math.floor(w.length/4)));
      if(close){near++;nearL++}else if(STOP.has(w))fn++;else{ct++;if(!seen.has(w)){seen.add(w);missed.push({w,i,sent:x.t})}}});
    extra+=Math.max(0,got.length-r.hit.filter(Boolean).length-nearL)});
  return {fn,ct,near,extra,missed};
}
function dictFinish(){
  const p=DT.p,st=dictStats();
  const pr=progress[dKey(p.id)];progress[dKey(p.id)]={status:st.pct>=80?"passed":"tried",best:Math.max(st.pct,pr?pr.best:0),attempts:(pr?pr.attempts:0)+1,wrong:[],updated:todayISO};
  DT.eid=DT.eid||newEid();
  save("saveLessonResult",{eid:DT.eid,key:dKey(p.id),pass:st.pct>=80,score:st.pct,correct:st.hit,answered:st.tot,wrong:[],words:[]}).then(r=>{applyR(r);showEarned(r)}).catch(earnFail);
  // câu dưới 70% vào sổ lỗi (nghe lại sau 3 ngày bằng giọng máy)
  const bad=p.lines.map((x,i)=>({x,r:DT.res[i]})).filter(o=>o.r&&o.r.pct<70).map(o=>({text:o.x.t,why:"Lần đầu nghe ra "+o.r.pct+"%"}));
  if(bad.length)call("addListenErrors",{src:p.id,ref:p.title,items:bad.slice(0,20)}).then(l=>{errLog=l}).catch(()=>{});
  if(st.pct>=80)FX.celebrate(1,`<span class="fl">🎧</span>Chép đúng ${st.pct}%`);
  DT.done=true;DT.ana=dictAnalysis();drawDictSummary(bad.length);
}

function dictFromPack(p){
  const lines=[];
  p.paras.forEach(pa=>{if(pa.h)return;let t=pa.t.trim(),s="";const m=t.match(/^([A-Z][A-Z .'’-]{1,24}):\s*/);if(m){s=m[1];t=t.slice(m[0].length)}
    const sents=t.match(/[^.!?]+[.!?]+["”’)]*|[^.!?]+$/g)||[t];let buf="";
    sents.forEach(x=>{x=x.trim();if(!x)return;const nb=(buf?buf+" ":"")+x;if(words_(nb).length>24&&buf){lines.push({s:s||(pa.l||""),t:buf});buf=x}else buf=nb});
    if(buf)lines.push({s:s||(pa.l||""),t:buf})});
  return {v:1,kind:"dictation",id:p.id+"-d",title:p.title,audio:p.audio,lines,note:"Bài này có "+lines.length+" câu. Không cần làm hết một lần: làm vài câu, lần sau làm tiếp."};
}

function p3Prompt(c){
  return `You are a strict but friendly IELTS Speaking examiner. Run Part 3 with me on the topic "${c.topic}" (Part 2 cue card: ${c.card}).
Rules:
- Ask ONE question at a time, under 25 words, then wait for my answer.
- After each answer, ask a follow-up that pushes me, rotating these moves: (1) "Why do you think so?" / explain the reason, (2) ask for a concrete example, (3) give the opposite view and ask me to respond, (4) compare past, present and future, (5) ask who should be responsible or what should change.
- If my answer is under 3 sentences, ask me to develop it before moving on.
- Do not correct me during the conversation.
Start with these questions and invent natural follow-ups: ${(c.part3||[]).join(" | ")}
After 8 questions, stop and give feedback in Vietnamese: the 3 biggest problems (fluency & coherence, vocabulary, grammar), 3 of my sentences rewritten at band 6.5–7 keeping my ideas, and an ESTIMATED band for FC, LR, GRA (say clearly it is an estimate; pronunciation cannot be judged reliably from a transcript).`;
}

function startSpeaking(mode,opt){
  opt=opt||{};

  let c2=SPEAK.part2.find(t=>t.id===($("sp-p2")||{}).value)||pick(SPEAK.part2);
  if(opt.topic){const T=opt.topic;
    if(T.cue){c2={id:T.id,topic:T.title,card:T.cue.card,bullets:T.cue.bullets||[],last:T.cue.last||"",part3:(T.p3&&T.p3.length?T.p3:T.qs||[]).slice(0,4)};mode="p2"}
    else{t1={id:T.id,topic:T.title,qs:(T.qs||[]).slice()};mode=T.part==="p3"?"p3":"p1"}}
  const steps=[];
  if(mode==="p1"||mode==="full"){const n=mode==="p1"?5:4;t1.qs.slice(0,n).forEach(q=>steps.push({part:1,q,topic:t1.topic}))}
  if(mode==="p3")t1.qs.slice(0,5).forEach(q=>steps.push({part:3,q,topic:t1.topic}));

function localTip(text,part){
  const w=(text.match(/\S+/g)||[]).length,tips=[];
  const need=part===2?150:part===3?50:25;
  if(w<need)tips.push(part===2?`Mới ${w} từ. Phần 2 nên nói đủ 2 phút, khoảng 180–250 từ: kể thêm chi tiết cho từng gạch đầu dòng.`:`Câu trả lời hơi ngắn (${w} từ). Thêm lý do (because…) và một ví dụ cụ thể (for example…).`);
  if(!/\b(because|since|so|that's why|the reason)\b/i.test(text))tips.push("Chưa có lý do. Thêm \"because…\" hoặc \"The main reason is…\".");
  if(part===3&&!/\b(for example|for instance|such as|like when)\b/i.test(text))tips.push("Part 3 nên có ví dụ: \"For example, in Korea…\".");
  if(/\b(yes|no)\b\.?$/i.test(text.trim())&&w<6)tips.push("Đừng chỉ trả lời Yes/No, hãy nói tiếp vì sao.");
  return tips.length?tips.join(" "):"Ổn: có ý chính và có phát triển. Thử thêm một cụm từ ít phổ biến hơn để tăng điểm từ vựng.";
}

function sampleGroups(t){
  const groups=[];t.samples.forEach((s,i)=>{const k=(s.q||"").trim();let g=groups.find(x=>x.q===k);if(!g){g={q:k,items:[]};groups.push(g)}g.items.push([s,i])});
  const one=([s,i])=>`<div class="sample ${s.band&&+s.band<7?"low":""}">${s.band?`<span class="tchip ${+s.band>=7?"ok":""}" style="align-self:flex-start">Band ${esc(s.band)}</span>`:""}<p>${esc(s.text)}</p>${s.note?`<p class="hint">${esc(s.note)}</p>`:""}${s.why?`<details class="fold why"><summary>Vì sao bài này hay</summary><div class="small" style="white-space:pre-line">${esc(s.why)}</div></details>`:""}${s.src?`<span class="tiny muted">Nguồn: ${esc(s.src)}</span>`:""}
      <span class="row" style="gap:6px"><button class="btn sm ghost" data-say="${esc(s.text)}">${I.sound.replace('viewBox','width="15" height="15" viewBox')} Nghe</button><button class="btn sm" data-shadow="${esc(t.id)}" data-si="${i}">Nhại theo</button><button class="btn sm ghost" data-bsave="${esc(s.q||t.title)}" data-btext="${esc(s.text)}">Lưu</button></span></div>`;
  return groups.map(g=>`<div class="sgroup">${g.q?`<b class="sq">${esc(g.q)}</b>`:""}<div class="${g.items.length>1&&g.items.some(([s])=>s.band)?"cmp":""}">${g.items.map(one).join("")}</div></div>`).join("");
}

function addTopicWords(t,list){
  if(!list.length)return toast("Các từ này đã có trong sổ.");
  call("addWords",list.map(v=>({word:v.w,meaning:v.vi||"",example:v.ex||"",source:"Speaking: "+t.title}))).then(l=>{vocab=l;toast(list.length>1?`Đã thêm ${list.length} từ`:`Đã thêm "${list[0].w}"`);topicDialog(t.id)}).catch(()=>{});
}

/* ---------- Nhại theo bài mẫu (shadowing) ---------- */
let SH=null;
const words_=s=>String(s||"").toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean);
function lcsHits(ref,got){
  const a=words_(ref),b=words_(got),n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){hit[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  return {pct:n?Math.round(dp[0][0]/n*100):0,hit};
}
function refMarkHTML(ref,hit){let k=0;return String(ref).split(/(\s+)/).map(tok=>{if(/^\s+$/.test(tok))return tok;const ws=words_(tok);if(!ws.length)return esc(tok);const ok=ws.every(()=>hit[k++]);return `<span class="${ok?"sh-ok":"sh-miss"}">${esc(tok)}</span>`}).join("")}
function startShadow(t,si){
  const s=t.samples[si];if(!s)return;
  const sents=String(s.text).replace(/\s+/g," ").split(/(?<=[.!?])\s+(?=[A-Z“"])/).map(x=>x.trim()).filter(x=>x.split(" ").length>=3);
  SH={t,s,sents,i:0,scores:[],res:null};
  $("study").hidden=false;document.body.style.overflow="hidden";drawShadow();
}
function drawShadow(){
  const x=SH.sents[SH.i],res=SH.res;
  $("study").innerHTML=`<div class="study-top"><div class="in wide-r"><button class="quit" id="sh-quit">${I.x.replace('viewBox','width="14" height="14" viewBox')} Thoát</button>
    <div style="text-align:center;min-width:0"><div class="tiny muted" style="font-weight:700">Nhại theo bài mẫu</div><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(SH.t.title)}</b></div><span class="tiny muted num">${SH.i+1}/${SH.sents.length}</span></div></div>
   <div class="study-body">
    <div class="card shcard"><div class="hint">Nghe câu mẫu 1–2 lần, rồi bấm micro trên bàn phím và nói lại y như vậy. Web so chữ máy nghe được với câu gốc: chữ đỏ là chỗ máy nghe chưa ra, thường do phát âm chưa rõ hoặc nuốt âm. % là mức máy nghe ra, không phải điểm phát âm.</div>
     <div class="shtext ${res?"":"blurred"}" id="sh-text">${res?res.html:esc(x)}</div>
     <div class="row" style="gap:8px"><button class="btn primary" data-say="${esc(x)}">${I.sound} Nghe</button><button class="btn" id="sh-slow">Nghe chậm</button>${res?"":`<button class="btn ghost" id="sh-peek">Hiện câu</button>`}</div>
     <textarea id="sh-in" rows="3" placeholder="Bấm micro trên bàn phím và nói lại câu…" ${res?"disabled":""}>${esc(res?res.got:"")}</textarea>
     ${res?`<div class="shscore"><b class="num">${res.pct}%</b><span>máy nghe ra. ${res.pct>=90?"Máy nhận gần hết.":res.pct>=70?"Xem các chữ đỏ: máy chưa nghe ra.":"Máy nghe sót nhiều: nói chậm, rõ từng âm cuối."} Đây là tín hiệu tham khảo, không phải điểm phát âm.</span></div>
       <div class="row" style="gap:8px"><button class="btn" id="sh-retry">Nói lại câu này</button><button class="btn primary" id="sh-next">${SH.i+1<SH.sents.length?"Câu tiếp →":"Xem tổng kết →"}</button></div>`
      :`<button class="btn primary wide" id="sh-check">Kiểm tra</button>`}
    </div></div>`;
  if(!res)setTimeout(()=>speak(x),300);
}
document.addEventListener("click",e=>{
  if(!SH)return;const T=e.target;
  if(T.closest("#sh-quit")){SH=null;$("study").hidden=true;$("study").innerHTML="";document.body.style.overflow="";return render()}
  if(T.closest("#sh-slow")){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(SH.sents[SH.i]);u.lang="en-GB";u.rate=.7;if(enVoice)u.voice=enVoice;speechSynthesis.speak(u)}catch(err){}return}
  if(T.closest("#sh-peek")){$("sh-text").classList.remove("blurred");return}
  if(T.closest("#sh-check")){const got=$("sh-in").value.trim();if(!got)return toast("Nói hoặc gõ lại câu trước đã.",true);const ref=SH.sents[SH.i],r=lcsHits(ref,got);SH.res={pct:r.pct,got,html:refMarkHTML(ref,r.hit)};SH.scores[SH.i]=r.pct;return drawShadow()}
  if(T.closest("#sh-retry")){SH.res=null;return drawShadow()}
  if(T.closest("#sh-next")){SH.res=null;if(SH.i+1<SH.sents.length){SH.i++;return drawShadow()}
    const sc=SH.scores.filter(x=>x!=null),avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):0;
    ls.set("ielts-shadow-day",todayISO);save("saveLesson",{kind:"shadow",results:[],avg,correct:0,answered:0}).then(r=>{applyR(r);showEarned(r)}).catch(earnFail);
    $("study").querySelector(".study-body").innerHTML=`<div class="result"><div class="h1">${avg}% máy nghe ra</div><p class="lead">${sc.length} câu · ${earnedHTML()} · mét chỉ tính lượt nhại đầu tiên mỗi ngày</p><p class="hint">Tỉ lệ chữ mà nhận dạng giọng nói của điện thoại bắt được, không phải điểm phát âm của giám khảo.</p><div class="wrongs">${SH.sents.map((s,i)=>`<div><span class="num" style="color:${(SH.scores[i]||0)>=80?"var(--ok)":"var(--bad)"}">${SH.scores[i]==null?"–":SH.scores[i]+"%"}</span><span>${esc(s)}</span></div>`).join("")}</div><button class="btn primary" id="sh-quit">Xong</button>${fricBtn("shadow")}</div>`;}
});

  const ans=bank.filter(b=>b.kind==="answer"),st=bank.filter(b=>b.kind==="story");
  return `<div class="card"><div class="hd"><h3 class="h3">Bộ chuyện Part 2</h3><button class="btn sm primary" data-story="">+ Thêm chuyện</button></div>
     <p class="hint">Chuẩn bị 6–8 câu chuyện thật của mày (một người, một nơi, một đồ vật, một sự kiện, một trải nghiệm…). Mỗi chuyện dùng được cho nhiều thẻ đề. Bấm "Thẻ nào dùng được?" để AI ghép chuyện với các thẻ đề trong cẩm nang.</p>

function loadWLPack(name){
  if(WL.pk[name])return Promise.resolve(WL.pk[name]);
  if(!WL.pkLoading[name])WL.pkLoading[name]=call("getPack",`words/${name}.json`,packVer).then(s=>{WL.pk[name]=JSON.parse(s);return WL.pk[name]}).catch(e=>{delete WL.pkLoading[name];throw e});
  return WL.pkLoading[name];
}
function loadNB(force){
  if((WL.nb&&!force)||WL.nbLoading)return;

  call("getNotebook").then(l=>{WL.nb=l;WL.nbLoading=false;if(tab==="path"&&pathMode==="words")renderPath()}).catch(()=>{WL.nbLoading=false;if(!WL.nb)WL.nb=[]});

function loadLab(){
  if(WL.lab||WL.labLoading)return;

/* ---- ngân hàng câu hỏi của từng chế độ (định dạng chung với bài kiểm tra) ---- */
const gapHTML=s=>esc(s).replace("___",'<span class="gap"></span>');
function mcq(id,html,opts,a,why,time,extra){const o=shuffle(opts.slice());return Object.assign({id,type:"mcq",sent:true,html,opts:o,ans:o.indexOf(a),why,time},extra||{})}
function wlItems(mode){
  const m=WL_MODES.find(x=>x.k===mode);
  if(mode==="nb")return (WL.nb||[]).filter(n=>n.card&&n.card.q&&n.card.q.s).map(n=>({id:"n:"+n.id,mk:()=>{const q=n.card.q;return mcq("n:"+n.id,gapHTML(q.s),q.opts,q.a,`${q.why||""} · ${n.w}: ${n.vi}`,25)}}));
  const P=WL.pk[m.pk];if(!P)return [];
  if(mode==="rt")return P.items.flatMap(x=>rtItems(x));
  if(mode==="mat")return P.items.map(x=>{const id="m:"+x.id,t=m.t;let mk;
    if(x.k==="def")mk=()=>mcq(id,`<span class="tiny muted">Thuật ngữ nào khớp với định nghĩa?</span><br><i>${esc(x.d)}</i>`,x.opts,x.a,x.why,t);
    else if(x.k==="para")mk=()=>mcq(id,`<span class="tiny muted">Trong bài báo khoa học, ý sau thường được viết thành cụm nào?</span><br><b>“${esc(x.q)}”</b>`,x.opts,x.a,`“${x.q}” ≈ “${x.a}”${x.why?" · "+x.why:""}`,t);
    else if(x.k==="con")mk=()=>{const o=["TRUE","FALSE","NOT GIVEN"];return {id,type:"mcq",sent:true,html:`<div class="wl-pass"><span class="tiny">Bài đọc</span>${esc(x.p)}</div><div class="wl-st"><span class="tiny">Câu hỏi</span>${esc(x.st)}</div>`,opts:o,ans:o.indexOf(x.a),why:x.why,time:45}};
    else mk=()=>mcq(id,gapHTML(x.s),x.opts,x.a,x.why,t);
    return {id,k:x.k,mk}});
  if(mode==="fam")return P.items.flatMap(x=>x.q.map((q,k)=>({id:`f:${x.id}:${k}`,mk:()=>mcq(`f:${x.id}:${k}`,gapHTML(q.s),q.opts,q.a,q.why+(x.trap?" ⚠ "+x.trap:""),m.t)})));
  if(mode==="col")return P.items.map(x=>({id:"c:"+x.id,mk:()=>mcq("c:"+x.id,gapHTML(x.s),x.opts,x.a,`${x.why} ✓ ${x.right}${x.wrong?" · ✗ "+x.wrong:""}`,m.t)}));
  if(mode==="up")return P.items.map(x=>({id:"u:"+x.id,mk:()=>mcq("u:"+x.id,`<span class="tiny muted">Viết/nói câu này hay hơn mà vẫn tự nhiên:</span><br>${esc(x.s)}`,x.opts,x.a,x.why+(x.warn?" ⚠ "+x.warn:""),m.t)}));
  if(mode==="con")return P.items.map(x=>({id:"t:"+x.id,mk:()=>{const o=["TRUE","FALSE","NOT GIVEN"];return {id:"t:"+x.id,type:"mcq",sent:true,html:`<div class="wl-pass"><span class="tiny">Bài đọc</span>${esc(x.p)}</div><div class="wl-st"><span class="tiny">Câu hỏi</span>${esc(x.st)}</div>`,opts:o,ans:o.indexOf(x.a),why:x.why,time:m.t}}}));
  if(mode==="para"){const all=P.items;return all.map((x,i)=>({id:"p:"+x.id,mk:()=>{
    const len=x.p.split(/\s+/).length,pool=shuffle(all.filter(y=>y.p!==x.p&&y.q!==x.q&&Math.abs(y.p.split(/\s+/).length-len)<=2)).slice(0,3).map(y=>y.p);
    return mcq("p:"+x.id,`<span class="tiny muted">Câu hỏi viết:</span><br><b>“${esc(x.q)}”</b><br><span class="tiny muted">Trong bài đọc, ý này được diễn đạt bằng cụm nào?</span>`,[x.p,...pool],x.p,`“${x.q}” = “${x.p}”${x.opp?" (ngược nghĩa → thường là FALSE/NO)":""} · đề ${x.src}`,m.t)}}))}
  return [];
}
// ưu tiên: đến hạn ôn → chưa làm → còn lại (bỏ qua mục đã thuộc chưa tới hạn nếu đủ câu)
function wlPick(items,n){
  const L=WL.lab||{},due=[],fresh=[],rest=[];
  items.forEach(it=>{const r=L[it.id];if(!r)fresh.push(it);else if(r.due<=todayISO)due.push(it);else if(r.box<5)rest.push(it)});
  let out=[...shuffle(due),...shuffle(fresh)].slice(0,n);
  if(out.length<n)out=out.concat(shuffle(rest).slice(0,n-out.length));
  return out;
}
function wlStats(mode){
  const items=wlItems(mode),L=WL.lab||{};let seen=0,known=0,due=0;
  items.forEach(it=>{const r=L[it.id];if(r){seen++;if(r.box>=3)known++;if(r.due<=todayISO)due++}});
  return {n:items.length,seen,known,due};
}
function startWL(qs,title,mode){
  if(!qs.length)return toast("Chưa có câu nào để luyện ở mục này.",true);
  FX.reset();
  S={L:{key:"wl",kind:"vocab",checkpoint:true},review:"wl",wlTitle:title,wlMode:mode||"",phase:"quiz",xp:0,qs};
  $("study").hidden=false;document.body.style.overflow="hidden";
  S.qi=0;S.answers=[];S.firstOk={};showQ();
}
function wlNeed(mode){const m=WL_MODES.find(x=>x.k===mode);return mode==="nb"?Promise.resolve():loadWLPack(m.pk)}
function practiceMode(mode,n){
  wlNeed(mode).then(()=>{const items=wlPick(wlItems(mode),n||10);startWL(items.map(it=>it.mk()),WL_MODES.find(x=>x.k===mode).n,mode)}).catch(()=>toast("Chưa tải được bài luyện. Kiểm tra mạng rồi thử lại.",true));
}
// lượt trộn mỗi ngày: 3 dạng từ, 3 kết hợp từ, 2 nâng cấp, 2 paraphrase, 2 T/F/NG + từ trong sổ đến hạn
function practiceMix(){
  Promise.all(WL_MODES.filter(m=>m.pk&&m.k!=="mat").map(m=>loadWLPack(m.pk))).then(()=>{
    const plan={rt:3,fam:3,col:2,up:2,para:2,con:2,nb:3};
    const qs=shuffle(Object.keys(plan).flatMap(k=>wlPick(wlItems(k),plan[k]).map(it=>it.mk())));
    startWL(qs,"Lượt trộn hôm nay");
  }).catch(()=>toast("Chưa tải được bài luyện. Kiểm tra mạng rồi thử lại.",true));
}
function finishWL(correct,total){
  const results=Object.keys(S.firstOk).map(id=>({id,ok:S.firstOk[id]}));
  const L=WL.lab||(WL.lab={});results.forEach(r=>{const p=L[r.id]||{box:0,ok:0,bad:0};const box=r.ok?Math.min(6,p.box+1):1;L[r.id]={box,ok:p.ok+(r.ok?1:0),bad:p.bad+(r.ok?0:1),due:addISO(todayISO,[0,1,3,7,14,30,60][box]||1)}});
  return save("saveWordLab",{results,correct,answered:total});
}

/* ================= Gắn sách lộ trình (Collins Listening / Reading) vào lịch học =================
   Ca học có "Listening U3" → mở lcol-03; "Reading U3: chiến lược và bài 1" → bài kỹ năng rcolp-03; "Reading U3: bài 2" → exam practice rcol-03.
   Làm xong (nộp cả bài) thì tự tick đúng ca đó: hôm nay nếu trùng, nếu không thì ngày còn nợ sớm nhất có cùng nhiệm vụ. */
function planPackFor(task){
  const t=String(task||"");const cb=t.match(/^Cambridge (\d+) Test (\d): (Listening, làm trọn|Reading Passage (\d))/);
  if(cb)return cb[4]?`cam${cb[1]}-${pad(3*(+cb[2]-1)+(+cb[4]))}`:`lcam${cb[1]}-${pad(+cb[2])}`;
  let m=t.match(/Listening U(\d+)/);
  if(m)return "lcol-"+pad(+m[1]);
  m=t.match(/Reading U(\d+)/);if(!m)return null;const n=+m[1];
  if(n===12)return /bài 2/.test(t)?"rcol-13":"rcol-12";
  return /bài 2/.test(t)?"rcol-"+pad(n):"rcolp-"+pad(n);
}
function planPackBtn(task){
  const id=planPackFor(task);if(!id)return "";
  const L=/^l/.test(id);
  if(L){if(!LIDX)loadLIndex();if(!lItem(id))return ""}
  else{if(!RIDX)loadRIndex();if(!rItem(id))return ""}
  const done=(rstats.latest||{})[id];
  return `<button class="btn sm ${done?"":"primary"} plan-open" ${L?`data-lopen="${id}"`:`data-ropen="${id}"`}>${done?"Làm lại":"Mở bài"}</button>`;
}

function rescueStudy(msg){
  const st=$("study");if(!st||st.hidden)return;
  if(st.querySelector(".quit")&&st.querySelector(".study-body,.rd,.dict"))return; // màn vẫn còn nút thoát
  try{clearInterval(qTimer);if(S)clearInterval(S.tick);if(RD)clearInterval(RD.tk)}catch(e){}
  st.innerHTML=`<div class="study-top"><div class="in"><button class="quit" data-rescue>${I.x.replace('viewBox','width="14" height="14" viewBox')} Thoát</button><span></span><span></span></div></div><div class="study-body"><div class="card"><b>Không mở được màn này</b><p class="hint">${esc(msg||"Có lỗi khi hiển thị.")}</p><button class="btn primary" data-rescue>Về trang chính</button></div></div>`;
}
document.addEventListener("click",e=>{if(!e.target.closest("[data-rescue]"))return;S=null;RD=null;DT=null;SP=null;SH=null;ER=null;try{lPlayerUnmount()}catch(err){}$("study").hidden=true;$("study").innerHTML="";document.body.style.overflow="";hideSelBar();render()});

  subs=s.subs||[];vocab=s.vocab||[];xpLog=s.xp||[];progress=s.progress||{};aiEnabled=!!s.aiEnabled;readings=s.readings||[];rstats=s.rstats||{byType:{},latest:{},groupsDone:[]};rnotes=s.rnotes||{};bank=s.bank||[];if(s.packVer&&s.packVer!==packVer){packVer=s.packVer;RIDX=null}
  errLog=s.errors||[];evLog=s.events||[];chals=s.challenges||[];
  me=s.me||{name:"",key:""};buddies=s.buddies||[];hlMap=s.highlights||{};

/* ================= Vật liệu · ODS: học chuyên ngành, ưu tiên ngang lộ trình IELTS =================
   Nội dung nằm trên Drive (climb-data): vocab/_index-mat.json + vocab/mat/*, reading/_index-mat.json + reading/mat/*,
   writing/mat.json (Task 1 có hình, Task 2, đoạn văn khoa học, bài mẫu), words/mat.json (bài tập câu học thuật).
   Thiếu file nào thì phần đó báo "chưa nạp", phần còn lại vẫn chạy. */
const MAT="mat";
let MATW=null,matwLoading=false,matwFail=0,matV=ls.get("ielts-matv","today"),matWT=ls.get("ielts-matwt","task1");
function loadMatW(force){
  if(MATW||matwLoading||(!force&&Date.now()-matwFail<20000))return;
  matwLoading=true;
  call("getPack","writing/mat.json",packVer).then(s=>{MATW=JSON.parse(s);matwLoading=false;matRerender()}).catch(()=>{matwLoading=false;matwFail=Date.now();matRerender()});
}
function matRerender(){if(S||RD||DT||SP)return;if(tab==="skills"&&skill==="mat")renderMat();else if(tab==="skills"&&skill==="write"&&typeof updateWriteForm==="function")updateWriteForm();else if(tab==="home")render()}
const matUnits=()=>extTopics(MAT);
const matSet=()=>vSets().find(s=>s.id===MAT);

function matNext(){
  const us=matUnits();if(!us.length)return null;
  const cu=ls.get("ielts-vunit-mat",""),order=[us.find(t=>t.id===cu),...us].filter(Boolean);
  for(const t of order){const L=topicLessons(t).find(l=>!passed(l.key)&&lessonUnlocked(l));if(L)return L}
  return typeof matgNext==="function"?matgNext():null;
}
function matUnitStat(t){const ls_=topicLessons(t),d=ls_.filter(l=>passed(l.key)).length;return {d,n:ls_.length,next:ls_.find(l=>!passed(l.key)&&lessonUnlocked(l))||null}}
const matTitles=()=>new Set([...matUnits(),...extTopics("matg")].map(t=>t.en));
function matDue(){const T=[...matTitles()];return dueWords().filter(v=>v.source.startsWith("R:mat-")||T.some(t=>v.source.startsWith(t+" ")))}
const matReadToday=()=>Object.entries(rstats.latest||{}).some(([id,v])=>id.startsWith("mat-")&&v.date===todayISO);
function matNextReading(){const s=matRSet();if(!s)return null;const it=s.items.find(i=>rBest(i.id)==null);return it?it.id:null}
function matRetry(){return retryList().filter(x=>x.rid.startsWith("mat-"))}
// bài viết Vật liệu nhận ra qua ô "Bài nào": "Vật liệu mw1-03 · …"
const MAT_REF=/Vật liệu (mw[12p]-\d+)/;
const matWroteIds=()=>new Set(subs.map(s=>(String(s.ref||"").match(MAT_REF)||[])[1]).filter(Boolean));
const matWroteToday=()=>subs.some(s=>String(s.created||"").startsWith(todayISO)&&MAT_REF.test(String(s.ref||"")));
const matList=k=>MATW?(k==="t1"||k==="task1"?MATW.task1:k==="t2"||k==="task2"?MATW.task2:MATW.para)||[]:[];
function matNextWrite(k){const l=matList(k),done=matWroteIds();return l.find(t=>!done.has(t.id))||l[0]||null}
const matFind=id=>MATW?[...MATW.task1,...MATW.task2,...MATW.para].find(t=>t.id===id):null;
function matByPrompt(p){const q=String(p||"").trim();if(!q)return null;if(!MATW){loadMatW();return null}return [...MATW.task1,...MATW.task2,...MATW.para].find(t=>t.prompt.trim()===q)||null}
const matKindOf=t=>MATW&&MATW.task1.includes(t)?"task1":MATW&&MATW.task2.includes(t)?"task2":"paragraph";
const MAT_T1K={process:"Quy trình",process2:"Hai quy trình",line:"Biểu đồ đường",bar:"Biểu đồ cột",table:"Bảng",mixed:"Kết hợp"};

/* ---- nhiệm vụ Vật liệu mỗi ngày (cùng kế hoạch với IELTS) ---- */
function matPlan(){
  loadMatW();
  const sec="Vật liệu · ODS",dow=fromISO(todayISO).getDay(),weekend=dow===0||dow===6,items=[];
  const nl=matNext(),nt=newToday(true);

    else if(VIDX&&!matSet())items.push({sec,time:"Vật liệu · Từ vựng",min:15,title:"Chưa nạp bộ từ Vật liệu",how:"Đưa file climb-content-vatlieu.zip vào thư mục climb-data rồi chạy napNoiDung (xem hướng dẫn).",done:false,btn:'data-goskill="mat"',label:"Xem"});
    else if(VIDX)items.push({sec,time:"Vật liệu · Từ vựng",min:15,title:"Đã học hết 12 unit thuật ngữ",how:"Ôn lại trong phần Ôn tập hoặc tab Vật liệu.",done:true});
  }
  items.push({sec,time:"Vật liệu · Câu học thuật",min:7,title:"10 câu: thuật ngữ, giới từ, dạng từ, paraphrase, T/F/NG",how:"Câu sai quay lại hôm sau, câu đúng giãn dần 1 → 3 → 7 → 14 ngày",done:ls.get("ielts-matdrill-day","")===todayISO,btn:'data-matdrill="mix"',label:"Luyện"});
  const rot={0:"retry",1:"read",2:"t1",3:"read",4:"para",5:"read",6:"t2"}[dow];

    else items.push({sec,time:"Vật liệu · Reading",min:20,title:it?`Bài: ${it.title}`:RIDX&&!matRSet()?"Chưa nạp bài đọc Vật liệu":"Đọc lại một bài chuyên ngành",how:"13 câu kiểu IELTS, có lời giải tiếng Việt, bản dịch và từ đáng học",done:matReadToday(),btn:nx?`data-ropen="${nx}"`:'data-goskill="mat" data-matgo="read"',label:"Làm"});
  }else{
    const t=matNextWrite(rot),lab={t1:"Writing Task 1",t2:"Writing Task 2",para:"Đoạn văn khoa học"}[rot];
    items.push({sec,time:"Vật liệu · "+lab,min:rot==="t2"?40:20,title:t?(t.title||t.prompt.split("\n")[0]).slice(0,110):MATW?"Đã viết hết đề, viết lại đề cũ":"Đang tải đề…",how:rot==="t1"?"Đề có hình (quy trình, biểu đồ, bảng) về vật liệu. Viết xong nhắn Claude “chấm bài”, rồi so với bài mẫu.":rot==="t2"?"Đề Task 2 chủ đề khoa học, năng lượng, nghiên cứu. Có gợi ý ý và bài mẫu.":"Đoạn 150 từ cho luận văn/bài báo của mày: mô tả hình, phương pháp, tổng quan.",done:matWroteToday(),btn:t?`data-matwrite="${t.id}"`:'data-goskill="mat"',label:"Viết"});
  }

/* ---- vẽ hình Task 1 từ dữ liệu (SVG/HTML, theo màu giao diện sáng/tối) ---- */
const MATC=["var(--link)","var(--ok)","var(--sun)","var(--ink)"],MATD=["","6 4","2 3",""];
const fnum=v=>Math.abs(v)>=100?String(Math.round(v)):String(+v.toFixed(2));
function figHTML(f){
  if(!f)return "";
  if(f.type==="multi")return f.parts.map(figHTML).join("");
  const cap=f.title?`<figcaption>${esc(f.title)}</figcaption>`:"",note=f.note?`<div class="mfig-note">${esc(f.note)}</div>`:"";
  if(f.type==="process"){
    return `<figure class="mfig">${cap}<ol class="mflow">${f.steps.map((s,i)=>`<li><span class="mn">${i+1}</span><span><b>${esc(s.t)}</b>${s.d?`<small>${esc(s.d)}</small>`:""}</span></li>`).join("")}</ol>${f.loop?`<div class="mfig-note">↺ ${esc(f.loop.label)}: quay lại bước “${esc(f.loop.to)}”</div>`:""}${note}</figure>`;
  }
  if(f.type==="process2"){
    return `<figure class="mfig">${cap}<div class="mflow2">${f.routes.map(r=>`<div><div class="mroute">${esc(r.name)}</div><ol class="mflow">${r.steps.map((s,i)=>`<li><span class="mn">${i+1}</span><span><b>${esc(s.t)}</b>${s.d?`<small>${esc(s.d)}</small>`:""}</span></li>`).join("")}</ol></div>`).join("")}</div>${note}</figure>`;
  }
  if(f.type==="table"){
    return `<figure class="mfig">${cap}<div class="mtwrap"><table class="mtable"><thead><tr>${f.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${f.rows.map(r=>`<tr>${r.map((c,i)=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join("")}</tr>`).join("")}</tbody></table></div>${note}</figure>`;
  }
  const legend=f.series.length>1?`<div class="mleg">${f.series.map((s,i)=>`<span><i style="background:${MATC[i%4]}${f.type==="line"&&MATD[i%4]?";background:repeating-linear-gradient(90deg,"+MATC[i%4]+" 0 6px,transparent 6px 9px)":""}"></i>${esc(s.name)}</span>`).join("")}</div>`:"";
  const W=640,H=400,L=84,R=24,T=28,B=f.type==="hbar"?52:76,pw=W-L-R,ph=H-T-B;
  const y=f.y||{},ymin=y.min!=null?y.min:0,ymax=y.max!=null?y.max:Math.max(...f.series.flatMap(s=>s.v.map(p=>Array.isArray(p)?p[1]:p))),step=y.step||(ymax-ymin)/5;
  let svg="";
  if(f.type==="hbar"){
    // thanh ngang, giá trị âm: vẽ từ 0 (mép phải) sang trái
    const n=f.cats.length,bh=ph/n,sx=v=>L+80+(v-ymin)/(ymax-ymin)*(pw-80);
    for(let v=ymin;v<=ymax+1e-9;v+=step){const x=sx(v);svg+=`<line x1="${x}" y1="${T}" x2="${x}" y2="${T+ph}" class="mg"/><text x="${x}" y="${T+ph+26}" class="mt" text-anchor="middle">${fnum(v)}</text>`}
    f.cats.forEach((c,i)=>{const v=f.series[0].v[i],x0=sx(Math.min(0,v)),x1=sx(Math.max(0,v)),yy=T+i*bh+bh*.18;
      svg+=`<text x="${L+72}" y="${yy+bh*.42}" class="mt" text-anchor="end">${esc(c)}</text><rect x="${x0}" y="${yy}" width="${Math.max(1,x1-x0)}" height="${bh*.64}" rx="3" fill="${MATC[0]}"/><text x="${x0+6}" y="${yy+bh*.42}" class="mv mvi">${fnum(v)}</text>`});
    svg+=`<text x="${L+80+(pw-80)/2}" y="${H-4}" class="ml" text-anchor="middle">${esc(y.label||"")}</text>`;
    return `<figure class="mfig">${cap}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(f.title||"")}">${svg}</svg>${note}</figure>`;
  }

      const words=String(c).split(" ");let l1="",l2="";words.forEach(w=>{if((l1+" "+w).trim().length<=12&&!l2)l1=(l1+" "+w).trim();else l2=(l2+" "+w).trim()});

  }
  svg+=`<line x1="${L}" y1="${T+ph}" x2="${L+pw}" y2="${T+ph}" class="ma"/><line x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}" class="ma"/>`;

function gRank(n){
  const p1=progress["g"+n],p2=progress[`g${n}-2`],p3=progress[`g${n}-3`];
  if(p3&&p3.status==="passed")return 5;
  if(p2&&p2.status==="passed")return p2.best>=90?4:3;
  if(p1&&p1.status==="passed")return p1.best>=90?2:1;
  return 0;
}
function gOverall(){
  const rs=GUNITS.map(u=>gRank(u.n)),c5=rs.filter(r=>r>=5).length;
  if(c5>=GUNITS.length)return 7;
  if(c5>=10)return 6;
  if(!rs.some(r=>r>=1))return 0;
  let o=1;for(let r=2;r<=5;r++)if(rs.filter(x=>x>=r).length>=4)o=r;
  return o;
}

  const wings=r>=6?`<path d="M10 20C-2 20-4 38 6 48 4 38 8 32 11 30Z" fill="url(#${id})"/><path d="M54 20C66 20 68 38 58 48 60 38 56 32 53 30Z" fill="url(#${id})"/>`:"";
  const crown=r>=7?`<path d="M20 11L23 1 32 8 41 1 44 11Z" fill="url(#${id})"/>`:"";
  return `<svg class="rke" width="${sz}" height="${sz}" viewBox="-8 -2 80 68" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${R.c}"/><stop offset="1" stop-color="${R.c2}"/></linearGradient></defs>${wings}${crown}<path d="M32 4 54 12V32C54 46 44 56 32 60 20 56 10 46 10 32V12Z" fill="url(#${id})" stroke="rgba(255,255,255,.55)" stroke-width="1.6"/>${inner}</svg>`;
}

/* ================= Luyện dùng từ: gõ, điền câu, nghe chép, viết/nói ================= */
function puPool(){
  const seen=new Set(),out=[];
  const add=w=>{if(!w||!w.w||!w.vi)return;const k=String(w.w).toLowerCase();if(seen.has(k))return;seen.add(k);out.push({w:String(w.w),vi:String(w.vi),pos:w.pos||"",ex:(w.ex||[]).filter(Boolean)})};
  TOPICS.forEach(t=>topicLessons(t).filter(l=>!l.checkpoint&&passed(l.key)).forEach(l=>(l.words||[]).forEach(add)));
  (vocab||[]).forEach(v=>add({w:v.word,vi:String(v.meaning||"").replace(/\s*\([^)]*\)\s*$/,""),ex:v.example?[v.example]:[]}));
  if(out.length<5)TOPICS[0].words.forEach(add);
  return out;
}
const puId=w=>"pw:"+w.w.toLowerCase();
const puTok=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^\p{L}\p{N}'\s-]/gu," ").split(/\s+/).filter(Boolean);
function puLcs(a,b){
  const m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);
  const hits=Array(m).fill(false);let i=m,j=n;
  while(i>0&&j>0){if(a[i-1]===b[j-1]){hits[i-1]=true;i--;j--}else if(d[i-1][j]>=d[i][j-1])i--;else j--}
  return hits;
}
function puUsed(word,text){
  const t=String(text).toLowerCase();
  return word.toLowerCase().split(/\s+/).every(tok=>{const c=tok.replace(/[^a-z'-]/g,"");if(!c)return true;const st=c.length>=6?c.slice(0,-2):c.length>=4?c.slice(0,-1):c;return new RegExp("\\b"+reEsc(st)+"[a-z']*").test(t)});
}

   <div class="row" style="gap:10px;flex-wrap:wrap"><button class="btn" data-pustart="5">5 từ</button><button class="btn primary" data-pustart="8">8 từ</button><button class="btn" data-pustart="10">10 từ</button></div>
   <p class="hint">Từ lấy từ các bài từ vựng mày đã qua và sổ ôn tập. Ở việc viết/nói câu, trên iPhone mày bấm micro của bàn phím để nói thay vì gõ.</p></div>`;

function puStart(n,theme,fresh){
  fresh=fresh||[];
  const items=(theme&&theme.length?theme:puPool()).map(w=>({id:puId(w),w}));
  const fk=new Set(fresh.map(x=>x.w));
  const words=[...fresh,...wlPick(items.filter(x=>!fk.has(x.w.w)),Math.max(0,n-fresh.length)).map(x=>x.w)];
  if(words.length<3)return toast("Chưa đủ từ để luyện. Học vài bài từ vựng trước.",true);
  FX.reset();
  const info=words.map(w=>({w,c:clozeOf(w.w,w.ex),sent:w.ex.find(x=>puTok(x).length>=4)||""}));
  const tasks=[];
  info.filter(x=>fk.has(x.w.w)).forEach(x=>tasks.push({k:"see",x}));
  info.forEach(x=>tasks.push({k:"type",x}));
  info.forEach(x=>{if(x.c)tasks.push({k:"cloze",x})});
  info.forEach((x,i)=>tasks.push({k:x.sent&&i%2===0&&canSpeak()?"dict":"own",x}));
  S={L:{key:"pu",kind:"vocab",checkpoint:true},review:"pu",pu:true,pute:!!(theme&&theme.length),mission:fresh.length>0,pud:theme&&theme.length?Math.max(...theme.map(x=>x.li)):NaN,phase:"pu",xp:0,tasks,ti:0,res:{},answered:false,nWords:words.length};
  $("study").hidden=false;document.body.style.overflow="hidden";puShow();
}

   <form class="pu-form" id="pu-form" autocomplete="off">${area?`<textarea class="inp" id="pu-in" rows="3" autocapitalize="sentences" placeholder="${t.k==="dict"?"Gõ câu mày nghe được":"Viết câu của mày"}"></textarea>`:`<input class="inp" id="pu-in" autocapitalize="off" spellcheck="false" placeholder="Gõ đáp án" aria-label="Đáp án">`}<button class="btn primary" id="pu-sub" disabled>Kiểm tra</button></form><div id="pu-fb"></div>`);
  const inp=$("pu-in");if(inp)inp.focus();

}
function puCheck(){
  if(!S||!S.pu||S.answered)return;
  const t=S.tasks[S.ti],w=t.x.w,inp=$("pu-in"),val=inp.value.trim();if(!val)return;
  S.answered=true;inp.disabled=true;$("pu-sub").disabled=true;
  let ok=false,msg="",extra="";
  if(t.k==="type"||t.k==="cloze"){
    const alts=(t.k==="cloze"?[t.x.c.ans,w.w]:[w.w,w.w.replace(/^to\s+/i,"")]),g=norm(val);let near=false;
    ok=alts.some(a=>norm(a)===g);
    if(!ok&&alts.some(a=>norm(a).length>=6&&lev(norm(a),g)<=1)){ok=true;near=true}
    msg=ok?(near?"Gần đúng, chú ý chính tả: "+alts[0]:"Chính xác."):"Chưa đúng. Đáp án: "+alts[0];
    extra=`<span>${esc(w.w)} = ${esc(w.vi)}${w.ex[0]?" · "+esc(w.ex[0]):""}</span>`;
  }else if(t.k==="dict"){
    const ref=puTok(t.x.sent),hits=puLcs(ref,puTok(val)),ratio=hits.filter(Boolean).length/ref.length;
    ok=ratio>=.85;msg=ok?"Chép đúng"+(ratio<1?" (sai nhẹ).":"."):`Chưa đúng hết (${Math.round(ratio*100)}%).`;
    extra=`<span>${ref.map((x,i)=>hits[i]?esc(x):`<mark>${esc(x)}</mark>`).join(" ")}</span><span class="muted">Câu gốc: ${esc(t.x.sent)}</span>`;
  }else{
    const used=puUsed(w.w,val),len=puTok(val).length;ok=used&&len>=4;

    extra=t.x.sent||w.ex[0]?`<span><b>Câu mẫu:</b> ${esc(t.x.sent||w.ex[0])}</span>`:"";
  }

const wtRx=w=>WT_RX[w-1]||/$^/;
function wtCur(){const c=PLAN.findIndex(w=>w.n>0&&w.days.some(d=>d.k>=todayISO));return c<0?12:Math.min(12,c)}
function wtLoad(w){
  const id="rcol-"+pad(w);
  if(PACKS[id]||WT.loading[id])return;
  WT.loading[id]=1;
  loadPack(id).then(()=>{delete WT.loading[id];if(tab==="path"&&pathMode==="week")renderPath();else if(tab==="home"&&!S)render()}).catch(()=>{setTimeout(()=>delete WT.loading[id],20000)});
}
function weekTheme(w){
  const id="rcol-"+pad(w),p=PACKS[id],rb=BOOKS.find(b=>b.key==="reading");
  const name=p?String(p.title).replace(/^.*?[–-]\s*/,""):(rb?rb.units[w-1]:"");
  const raw=(p&&p.vocab)||[],per=Math.max(1,Math.ceil(raw.length/5));
  const words=raw.map((x,i)=>({w:x.w,vi:x.vi,pos:x.pos||"",syn:x.syn||"",ex:x.ex?[x.ex]:[],li:Math.min(4,Math.floor(i/per)),src:"bài đọc"}));
  /* thêm từ/cụm cùng chủ đề từ kho từ vựng theo chủ đề (ưu tiên cụm nhiều từ), 2 từ mỗi ngày */
  if(p){const have=new Set(words.map(x=>x.w.toLowerCase()));
    const ex=[];TOPICS.filter(t=>wtRx(w).test(t.en+" "+t.vi)).forEach(t=>(t.words||[]).forEach(x=>{const k=String(x.w).toLowerCase();if(x.vi&&Array.isArray(x.ex)&&x.ex.length&&!have.has(k)){have.add(k);ex.push({w:x.w,vi:x.vi,pos:x.pos||"",syn:x.syn||"",ex:x.ex})}}));
    ex.sort((m,n)=>(/\s/.test(n.w)?1:0)-(/\s/.test(m.w)?1:0));
    ex.slice(0,10).forEach((x,i)=>words.push({...x,li:Math.min(4,Math.floor(i/2)),src:"chủ đề"}))}
  return {w,id,name,words,loaded:!!p,rx:wtRx(w)};
}
function wtWords(d){const th=weekTheme(WT.w||wtCur());return isNaN(d)?th.words:th.words.filter(x=>x.li<=d)}
function wtPrompts(th){
  if(th.w===12)return [{type:"task1",text:""}];
  const l=(PROMPTS.task2||[]).filter(x=>th.rx.test(x[1])).slice(0,3).map(x=>({type:"task2",text:x[1]}));
  return l.length?l:(PROMPTS.paragraph||[]).slice(0,2).map(x=>({type:"paragraph",text:x}));
}
function wtSpeak(th){return (typeof SG!=="undefined"&&SG&&SG.topics?SG.topics:[]).filter(x=>th.rx.test((x.title||"")+" "+(x.vi||""))).slice(0,5)}
function wtReads(th){
  if(!RIDX&&typeof loadRIndex==="function")loadRIndex();
  const out=[];
  if(RIDX)rSets().forEach(s=>{if(/^rcol/.test(s.id))return;s.items.forEach(it=>{if(th.rx.test(it.title||""))out.push(it)})});
  return out.slice(0,3);
}
function wtUsed(th){
  const mon=PLAN[th.w].days[0].k,sun=addISO(mon,6);
  const txt=subs.filter(s=>{const c=String(s.created||"").slice(0,10);return c>=mon&&c<=sun}).map(s=>s.answer||"").join(" \n ");
  return {has:!!txt.trim(),used:th.words.filter(x=>puUsed(x.w,txt))};
}
function wtStartDay(i){

  const fresh=th.words.filter(x=>x.li===i);
  if(!fresh.length)return toast("Hôm nay không có từ mới, luyện cả bộ từ của tuần.");
  puStart(Math.min(10,fresh.length+3),th.words.filter(x=>x.li<=i),fresh);
  if(S&&S.pu&&S.mission){const pw=PLAN[w];if(pw&&pw.days&&pw.days[0])S.mday=addISO(pw.days[0].k,i)}
}

/* nhiệm vụ nhỏ của chủ đề tuần hiện trên Trang chủ */
function wtHomeItems(){
  const wi=PLAN.findIndex(w=>w.n>0&&todayISO>=w.days[0].k&&todayISO<=addISO(w.days[0].k,6));
  if(wi<1||wi>12)return [];
  const th=weekTheme(wi);wtLoad(wi);

  const lastSeen=id=>(rstats.latest||{})[id]&&(rstats.latest||{})[id].date===todayISO;
  const label=`Tuần ${wi} · ${th.name}`;
  if(i>=0){const nw=th.words.filter(x=>x.li===i);
    out.push({time:"Chủ đề tuần",min:15,title:th.loaded?`${label}: ${nw.length} từ mới`:`${label}: đang tải từ…`,how:th.loaded?nw.map(x=>x.w).join(", ")+" · học rồi luyện gõ, điền câu, nghe chép":"",done:!!ls.get("ielts-wt-"+todayISO,""),btn:th.loaded?`data-wtday="${i}"`:"",label:"Học",primary:true})}

    out.push({time:"Chủ đề tuần",min:30,title:rd?`Reading cùng chủ đề: ${rd.title}`:`${label}: làm lại bài đọc Collins`,how:"Ôn các từ mục tiêu của tuần qua một bài đọc như thi thật",done:!!(rd&&lastSeen(rd.id)),btn:`data-ropen="${rd?rd.id:"rcol-"+pad(wi)}"`,label:"Làm"});
    out.push({time:"Chủ đề tuần",min:30,title:`Viết về chủ đề: ${th.name}`,how:"Viết từng câu theo khung, có gợi ý, bảng kiểm và bộ từ mục tiêu",done:subs.some(s=>String(s.created).slice(0,10)===todayISO&&s.type!=="speaking"),btn:'data-gbw="0"',label:"Viết"})}

    out.push({time:"Chủ đề tuần",min:20,title:`Nói về chủ đề: ${th.name}`,how:"Nói từng câu theo khung (gõ hoặc micro bàn phím), rồi đối chiếu bài mẫu",done:subs.some(s=>String(s.created).slice(0,10)===todayISO&&s.type==="speaking"),btn:'data-gbs="1"',label:"Nói"});

/* ================= Nhiệm vụ tuần bắt buộc trên Trang chủ ================= */
function wtMust(){
  const wi=PLAN.findIndex(w=>w.n>0&&todayISO>=w.days[0].k&&todayISO<=addISO(w.days[0].k,6));
  if(wi<1||wi>12)return null;
  const th=weekTheme(wi);wtLoad(wi);const mon=PLAN[wi].days[0].k;
  const seen=(id,d)=>{const x=(rstats.latest||{})[id];return !!(x&&x.date===d)};
  const subOn=(d,sp)=>subs.some(s=>String(s.created).slice(0,10)===d&&(sp?s.type==="speaking":s.type!=="speaking"));
  const rd=wtReads(th)[0],rids=[rd&&rd.id,"rcol-"+pad(wi)].filter(Boolean);
  const days=[];
  for(let i=0;i<7;i++){
    const d=addISO(mon,i),t=[];
    if(i<5){const nw=th.words.filter(x=>x.li===i);
      t.push({done:!!ls.get("ielts-wt-"+d,""),title:th.loaded?`Học ${nw.length} từ mới và luyện dùng`:"Đang tải từ của tuần…",sub:nw.map(x=>x.w).join(", "),btn:th.loaded?`data-wtday="${i}"`:"",label:"Học"})}
    else if(i===5){
      t.push({done:rids.some(id=>seen(id,d)),title:rd?`Reading cùng chủ đề: ${rd.title}`:"Làm lại bài đọc Collins của tuần",sub:"Ôn từ mục tiêu qua bài đọc",btn:`data-ropen="${rids[0]}"`,label:"Làm"});
      t.push({done:subOn(d,false),title:`Viết về chủ đề: ${th.name}`,sub:"Viết từng câu theo khung, có bảng kiểm",btn:'data-gbw="0"',label:"Viết"})}
    else t.push({done:subOn(d,true),title:`Nói về chủ đề: ${th.name}`,sub:"Nói từng câu theo khung, rồi đối chiếu bài mẫu",btn:'data-gbs="1"',label:"Nói"});
    days.push({i,d,t,ok:t.every(x=>x.done)});
  }
  return {wi,th,days};
}
function wtPending(){const m=wtMust();if(!m)return false;return m.days.some(x=>x.d<=todayISO&&!x.ok)}

/* ================= Luyện có kèm cặp: Viết và Nói theo từng câu ================= */
const GB_ST={
  rel:{n:"mệnh đề quan hệ (which, who, where…)",rx:/\b(which|who|whom|whose|where)\b/i},

  const L=mgMatchRef(sec),drill=`<button class="btn sm primary" data-matdrill="${sec}">Luyện 10 câu</button>`;
  if(sec==="abbr")return `<div class="mg-bar"><span class="hint">${L.length} từ viết tắt thường gặp trong bài báo vật liệu</span>${drill}</div><div class="mg-grid">${L.map(x=>`<div class="mg-abbr"><b>${esc(x.abbr)}</b><span>${esc(x.full)}</span></div>`).join("")||`<p class="hint">Không khớp.</p>`}</div>`;
  if(sec==="poly")return `<div class="mg-bar"><span class="hint">${L.length} từ nghĩa đời thường khác hẳn nghĩa chuyên ngành: dễ dịch sai khi đọc paper</span>${drill}</div><div class="mg-grid">${L.map(x=>`<div class="mgcard"><b>${esc(x.w)} ${mgSay(x.w)}</b><div class="mg-vs"><div><span>Nghĩa thường</span>${esc(x.plain)}</div><div><span>Trong vật liệu</span><b style="font-size:14px">${esc(x.tech)}</b></div></div><div class="mg-warn">⚠ ${esc(x.warn)}</div></div>`).join("")||`<p class="hint">Không khớp.</p>`}</div>`;
  if(sec==="dist")return `<div class="mg-bar"><span class="hint">${L.length} cặp khái niệm hay bị nhầm khi đọc và viết bài báo</span>${drill}</div><div class="mg-grid">${L.map(x=>`<div class="mgcard"><b>${esc(x.pair)}</b><div class="mg-warn">${esc(x.note)}</div></div>`).join("")||`<p class="hint">Không khớp.</p>`}</div>`;
  return `<div class="mg-bar"><span class="hint">${L.length} công thức ở mức ghi nhớ; luôn kiểm tra định nghĩa, đơn vị và giả thiết của bài báo</span>${drill}</div><div class="mg-grid">${L.map(x=>`<div class="mgcard"><b>${esc(x.name)}</b><div class="mg-eq">${esc(x.expr)}</div><div class="mg-warn">${esc(x.cond)}</div></div>`).join("")||`<p class="hint">Không khớp.</p>`}</div>`;
}
function matgMissing(){return `<div class="card"><p class="hint">Chưa thấy từ điển Vật liệu & ODS trên Drive. Đưa file <b>climb-content-tudien-vatlieu.zip</b> vào thư mục climb-data, mở Apps Script và chạy hàm <b>napNoiDung</b>, rồi bấm thử lại.</p><button class="btn sm" data-matreload>Thử lại</button></div>`}
function matDict(){
  if(!VIDX)return vIdxFail?matMissing("bộ từ"):skelHTML();
  if(!matgUnits().length)return matgMissing();
  loadMatRef();loadMatAll();
  return `<input id="mg-q" class="inp mg-q" type="search" placeholder="Tra thuật ngữ, viết tắt, công thức… (vd: burgers, kéo, KAM)" value="${esc(MG.q)}" autocomplete="off" aria-label="Tra từ điển Vật liệu">
   <div class="mg-secs" id="mg-secs">${mgSecsHTML()}</div><div id="mg-body">${mgBody()}</div>`;
}
document.addEventListener("input",e=>{
  if(e.target.id!=="mg-q")return;
  MG.q=e.target.value;MG.show=30;
  if(MG.q.trim()&&MG.sec==="learn"){MG.sec="term";ls.set("ielts-mgsec","term")}
  const b=$("mg-body");if(b)b.innerHTML=mgBody();const c=$("mg-secs");if(c)c.innerHTML=mgSecsHTML();
});
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-mgsec]");if(s){MG.sec=s.dataset.mgsec;MG.show=30;ls.set("ielts-mgsec",MG.sec);const b=$("mg-body");if(b)b.innerHTML=mgBody();const c=$("mg-secs");if(c)c.innerHTML=mgSecsHTML();return}
  const ch=e.target.closest("[data-mgch]");if(ch){MG.ch=ch.dataset.mgch;MG.show=30;const b=$("mg-body");if(b)b.innerHTML=mgBody();return}
  if(e.target.closest("[data-mgmore]")){MG.show+=30;const b=$("mg-body");if(b)b.innerHTML=mgBody();return}
  const u=e.target.closest("[data-mgunit]");if(u){ls.set("ielts-vunit-matg",u.dataset.mgunit);return openLessonDialog(u.dataset.key)}
  const a=e.target.closest("[data-mgadd]");if(a){
    const w=MG.all&&MG.all[+a.dataset.mgadd];if(!w)return;a.disabled=true;
    call("addWords",[{word:w.w,meaning:w.vi+(w.pos?` (${w.pos})`:""),example:(w.ex&&w.ex[0])||"",source:`${w.ch.en} +`}]).then(l=>{vocab=l;toast(`Đã thêm “${w.w}” vào sổ ôn tập`);const b=$("mg-body");if(b)b.innerHTML=mgBody()}).catch(()=>{a.disabled=false});return}
});

/* ---- câu luyện từ phụ lục: viết tắt, từ đa nghĩa, cặp dễ nhầm, công thức (dùng chung kho ôn cách quãng của "Bài tập") ---- */
MAT_DK.push(["abbr","Viết tắt","ODS, EBSD, KAM, HIP… → tên đầy đủ"],["poly","Từ đa nghĩa","strength, matrix, yield… hiểu đúng trong vật liệu"],["dist","Phân biệt dễ nhầm","Orowan vs Zener, KAM vs GOS, UTS vs YS…"],["form","Công thức","Hall–Petch, Taylor, Arrhenius, Bragg…"]);
const mgUniq=a=>[...new Set(a)];
const mgPick=(arr,n,not)=>shuffle(mgUniq(arr).filter(x=>x!==not)).slice(0,n);
function mgRefItems(){
  const R=MG.ref;if(!R)return [];const out=[];
  R.abbr.forEach(x=>{const id="g:ab:"+x.abbr;out.push({id,k:"abbr",mk:()=>mcq(id,`<span class="tiny muted">Viết tắt trong bài báo vật liệu</span><br><b>${esc(x.abbr)}</b> là gì?`,[x.full,...mgPick(R.abbr.map(y=>y.full),3,x.full)],x.full,`${x.abbr} = ${x.full}`,25)})});
  R.poly.forEach(x=>{const id="g:po:"+x.w;out.push({id,k:"poly",mk:()=>mcq(id,`<span class="tiny muted">Trong khoa học vật liệu</span><br><b>“${esc(x.w)}”</b> thường nghĩa là gì?`,mgUniq([x.tech,x.plain,...mgPick(R.poly.map(y=>y.tech),2,x.tech)]),x.tech,`${x.w} = ${x.tech}. Nghĩa đời thường (${x.plain}) dễ làm dịch sai. ⚠ ${x.warn}`,25)})});
  R.distinct.forEach((x,i)=>{
    const a="g:di:"+i,b="g:dj:"+i;
    out.push({id:a,k:"dist",mk:()=>mcq(a,`<span class="tiny muted">Phân biệt</span><br><b>${esc(x.pair)}</b><br>Ý nào đúng?`,[x.note,...mgPick(R.distinct.map(y=>y.note),3,x.note)],x.note,`${x.pair}: ${x.note}`,40)});
    out.push({id:b,k:"dist",mk:()=>mcq(b,`<span class="tiny muted">Ý này nói về cặp nào?</span><br><i>${esc(x.note)}</i>`,[x.pair,...mgPick(R.distinct.map(y=>y.pair),3,x.pair)],x.pair,`${x.pair}: ${x.note}`,40)});
  });
  R.formulas.forEach((x,i)=>{const id="g:fo:"+i;out.push({id,k:"form",mk:()=>mcq(id,`<span class="tiny muted">Công thức</span><br>Biểu thức nào là <b>${esc(x.name)}</b>?`,[x.expr,...mgPick(R.formulas.map(y=>y.expr),3,x.expr)],x.expr,`${x.name}: ${x.expr}. ${x.cond}`,30)})});
  return out;
}
(function(){
  const _wi=wlItems;wlItems=function(mode){const b=_wi(mode);return mode==="mat"?b.concat(mgRefItems()):b};
  const _pm=practiceMat,NEW=["abbr","poly","dist","form"];
  practiceMat=function(kind){
    if(NEW.includes(kind)){loadMatRef(true).then(r=>{if(!r)return toast("Chưa tải được phụ lục từ điển Vật liệu. Nạp climb-content-tudien-vatlieu.zip rồi thử lại.",true);_pm(kind)});return}
    _pm(kind);
  };
})();
</script>
